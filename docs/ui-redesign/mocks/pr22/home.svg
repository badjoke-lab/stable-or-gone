<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" role="img"><title>Home</title><rect width="1440" height="1000" fill="#071018"/><g font-family="Arial" fill="#EAF3F6"><text x="40" y="38">STABLE OR GONE</text><text x="48" y="132" font-size="40">Stablecoin history, without the scoreboard.</text><text x="48" y="166" fill="#9AB0BA">A public registry of assets, organizations, events, evidence, and what remains unknown.</text><rect x="48" y="212" width="740" height="48" rx="8" fill="#0A151F" stroke="#284555"/><text x="68" y="242" fill="#9AB0BA">Global search: assets, organizations, events, aliases, contracts</text><rect x="808" y="212" width="180" height="48" rx="8" fill="#172C3B" stroke="#F4C96B"/><text x="898" y="242" text-anchor="middle">Search registry</text><rect x="1014" y="104" width="378" height="190" rx="14" fill="#112332" stroke="#284555"/><text x="1040" y="140" fill="#9AB0BA">REGISTRY SNAPSHOT</text><text x="1040" y="190" font-size="34">92 stable assets</text><text x="1040" y="226">86 organizations · 150 events</text><text x="1040" y="258" fill="#75D5FF">410 public source identities</text><text x="48" y="348" fill="#9AB0BA">RECORD FAMILIES</text><rect x="48" y="374" width="416" height="176" rx="12" fill="#0D1924" stroke="#284555"/><text x="72" y="414" font-size="22">Stablecoins</text><text x="72" y="448" fill="#75D5FF">92 records</text><text x="72" y="486" fill="#9AB0BA">State · mechanics · history · evidence</text><rect x="488" y="374" width="416" height="176" rx="12" fill="#0D1924" stroke="#284555"/><text x="512" y="414" font-size="22">Organizations</text><text x="512" y="448" fill="#75D5FF">86 records</text><text x="512" y="486" fill="#9AB0BA">Roles · relationships · jurisdictions</text><rect x="928" y="374" width="416" height="176" rx="12" fill="#0D1924" stroke="#284555"/><text x="952" y="414" font-size="22">Events</text><text x="952" y="448" fill="#75D5FF">150 records</text><text x="952" y="486" fill="#9AB0BA">Typed history · effects · recovery</text><rect x="48" y="590" width="860" height="300" rx="10" fill="#0D1924" stroke="#284555"/><text x="72" y="632" font-size="22">Meaningful recent changes</text><text x="72" y="686" fill="#E9C96F">Status change</text><text x="250" y="686">Lifecycle updated with evidence</text><text x="72" y="742" fill="#75D5FF">Evidence added</text><text x="250" y="742">New source identity linked to claims</text><text x="72" y="798" fill="#B7A9DD">Known unknown resolved</text><text x="250" y="798">Prior question retained and resolution cited</text><rect x="936" y="590" width="456" height="300" rx="10" fill="#0D1924" stroke="#284555"/><text x="960" y="632" font-size="22">Methodology and data access</text><text x="960" y="686">Taxonomy · evidence · value states</text><text x="960" y="728" fill="#75D5FF">Machine-readable registry files</text><text x="960" y="770">Corrections remain a primary utility</text><text x="960" y="836" fill="#F4C96B">Support is secondary</text></g></svg>
