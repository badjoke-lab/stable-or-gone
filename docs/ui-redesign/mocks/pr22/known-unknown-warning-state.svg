<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" role="img"><title>Known unknown warning state</title><rect width="1280" height="900" fill="#071018"/><g font-family="Arial" fill="#EAF3F6"><text x="40" y="38">STABLE OR GONE</text><text x="48" y="120" font-size="34">Known unknown</text><text x="48" y="154" fill="#9AB0BA">Unresolved questions are documented instead of hidden as blanks.</text><rect x="48" y="190" width="1184" height="590" rx="12" fill="#0D1924" stroke="#B7A9DD"/><text x="76" y="230" fill="#B7A9DD">KNOWN UNKNOWN LABEL</text><text x="76" y="274" font-size="26">Deployment verification state is not recorded</text><text x="928" y="230" fill="#B7A9DD">VALUE STATE</text><text x="928" y="260">Not recorded</text><line x1="76" y1="304" x2="1204" y2="304" stroke="#284555"/><text x="76" y="350" fill="#9AB0BA">TOPIC</text><text x="76" y="380">Canonicality and contract verification</text><text x="650" y="350" fill="#9AB0BA">PRIORITY</text><text x="650" y="380" fill="#E9C96F">High</text><text x="76" y="444" fill="#9AB0BA">WHAT REMAINS UNCLEAR</text><text x="76" y="480">The public record identifies the deployment and contract, but available sources do not</text><text x="76" y="508">establish a complete independent verification state for this network context.</text><rect x="76" y="548" width="520" height="108" rx="8" fill="#112332" stroke="#284555"/><text x="98" y="582" fill="#9AB0BA">LAST CHECKED</text><text x="98" y="616">2026-06-26</text><text x="314" y="582" fill="#9AB0BA">RELATED SECTION</text><text x="314" y="616">Deployments and legal context</text><rect x="618" y="548" width="586" height="108" rx="8" fill="#112332" stroke="#284555"/><text x="640" y="582" fill="#9AB0BA">RESOLUTION RULE</text><text x="640" y="616">Requires new evidence and a linked resolution entry.</text><text x="76" y="710" fill="#75D5FF">View related evidence</text><text x="300" y="710" fill="#75D5FF">Submit correction</text><text x="1204" y="710" fill="#9AB0BA" text-anchor="end">Not a ranking or recommendation.</text></g></svg>
