name: Missing stablecoin
about: Suggest a stablecoin that should be reviewed for SOG
title: "Missing stablecoin: "
labels: [missing-record]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a stablecoin for review. Inclusion is not automatic.
  - type: input
    id: name
    attributes:
      label: Stablecoin name / symbol
    validations:
      required: true
  - type: input
    id: issuer
    attributes:
      label: Issuer or protocol
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Why should this be added?
      description: Mention depeg history, issuer history, reserve disclosure, wind-down, migration, or other registry relevance.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source URL(s)
    validations:
      required: true
