name: StaX noncanonical monitoring

on:
  pull_request:
    paths:
      - 'scripts/monitoring/sources/stax-noncanonical-watch.mjs'
      - 'scripts/monitoring/run-stax-noncanonical-watch.mjs'
      - 'scripts/validate-stax-noncanonical-monitoring.mjs'
      - '.github/workflows/stax-noncanonical-monitoring.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/monitoring/sources/stax-noncanonical-watch.mjs'
      - 'scripts/monitoring/run-stax-noncanonical-watch.mjs'
      - 'scripts/validate-stax-noncanonical-monitoring.mjs'
      - '.github/workflows/stax-noncanonical-monitoring.yml'
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate StaX noncanonical monitoring boundary
        run: node scripts/validate-stax-noncanonical-monitoring.mjs
      - name: Syntax-check StaX monitoring runner
        run: node --check scripts/monitoring/run-stax-noncanonical-watch.mjs

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Observe StaX first-party sources read-only
        id: monitoring
        shell: bash
        run: |
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-stax-${GITHUB_SHA::8}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          SOG_MONITORING_RUN_ID="$RUN_ID" \
          SOG_MONITORING_COMMIT="$GITHUB_SHA" \
          SOG_MONITORING_BRANCH="$GITHUB_REF_NAME" \
          node scripts/monitoring/run-stax-noncanonical-watch.mjs
      - name: Upload private StaX monitoring artifact
        uses: actions/upload-artifact@v4
        with:
          name: sog-stax-monitoring-${{ steps.monitoring.outputs.run_id }}
          path: data-staging/monitoring/${{ steps.monitoring.outputs.run_id }}
          if-no-files-found: error
          retention-days: 30
