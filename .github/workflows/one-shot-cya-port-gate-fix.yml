name: One-shot CYA port gate repair

on:
  push:
    branches:
      - fix/cya-structure-dark-port

permissions:
  contents: write

concurrency:
  group: one-shot-cya-port-gate-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cya-structure-dark-port
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Apply bounded fixes
        run: node scripts/apply-cya-port-gate-fixes.mjs
      - name: Remove one-shot machinery
        run: git rm scripts/apply-cya-port-gate-fixes.mjs .github/workflows/one-shot-cya-port-gate-fix.yml
      - name: Commit repaired branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/index.astro src/styles/public-ui.css scripts/validate-ui-v3-cleanup.mjs scripts/audit-public-typography-enums-direct.mjs scripts/audit-representative-text-contrast.mjs
          git commit -m "Fix CYA port responsive and audit contracts"
          git push origin HEAD:fix/cya-structure-dark-port
