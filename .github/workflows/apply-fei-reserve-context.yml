name: Apply FEI reserve context

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'resolve-fei-reserve-context'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply FEI reserve context
        run: node scripts/apply-fei-reserve-context.mjs
      - name: Install dependencies
        run: npm install
      - name: Regenerate registry stats
        run: node scripts/generate-registry-stats.mjs
      - name: Regenerate integrity outputs
        run: npm run audit:integrity
      - name: Validate complete repository
        run: npm run build
      - name: Remove temporary automation
        run: |
          rm -f scripts/apply-fei-reserve-context.mjs
          rm -f .github/workflows/apply-fei-reserve-context.yml
      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Resolve FEI reserve context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
