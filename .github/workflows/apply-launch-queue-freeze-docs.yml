name: Apply launch queue freeze documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-launch-queue-freeze-docs
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-launch-date-queue-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply documentation updates
        run: node scripts/apply-launch-queue-freeze-docs.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate unresolved launch-date queue
        run: npm run validate:launch-queue
      - name: Run full repository build
        run: npm run build
      - name: Remove one-time machinery
        run: |
          rm scripts/apply-launch-queue-freeze-docs.mjs
          rm .github/workflows/apply-launch-queue-freeze-docs.yml
      - name: Commit finalized launch queue freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze unresolved launch-date queue"
          git push origin HEAD:freeze-launch-date-queue-clean
