name: Immutable statistics history

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Immutable statistics history maintenance is advisory and does not block publication.'
      - name: Checkout full history
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund
      - name: Validate deterministic statistics
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/validate-stats.mjs
      - name: Generate current checkpoint snapshot candidate
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/stats/build-history-snapshot.mjs > artifacts/stats-history-current-snapshot.json
      - name: Validate immutable statistics history
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          BASE_REF="origin/${GITHUB_BASE_REF:-main}"
          SOG_STATS_HISTORY_BASE_REF="$BASE_REF" node scripts/validate-stats-history.mjs
      - name: Upload history validation artifacts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: immutable-statistics-history-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/stats-history-current-snapshot.json
            artifacts/stats-history-validation.json
