name: Correct JPYR immutable stats snapshot hash
on:
  push:
    branches: [agent/jpyr-material-concerns]
    paths: [.github/workflows/fix-jpyr-stats-hash.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jpyr-material-concerns
      - name: Correct snapshot hash and remove helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'data/stats-history.json';
          const h = JSON.parse(fs.readFileSync(p,'utf8'));
          const row = h.snapshots.find(x => x.checkpoint_id === 'sog_stats_jpyr_canonical_120_2026_08_23');
          if (!row) throw new Error('JPYR history checkpoint missing');
          row.snapshot_sha256 = 'b9525d7cac86e506a69f4c8e655f628bdca2d58bbe57e6162f07f3722141bfda';
          fs.writeFileSync(p, JSON.stringify(h,null,2)+'\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-jpyr-stats-hash.yml
          git add data/stats-history.json
          git commit -m "Correct JPYR immutable stats snapshot hash"
          git push origin HEAD:agent/jpyr-material-concerns
