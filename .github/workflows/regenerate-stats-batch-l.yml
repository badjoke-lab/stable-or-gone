name: Regenerate stats for launch dates batch L

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-stats-batch-l.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-dates-batch-l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node scripts/generate-registry-stats.mjs
      - run: npm run audit:integrity
      - name: Commit regenerated outputs
        run: |
          rm .github/workflows/regenerate-stats-batch-l.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Regenerate stats after launch date updates"
          git push origin HEAD:launch-dates-batch-l
