name: One-time stablecoin organizations section repair

on:
  push:
    branches: [ui/stablecoin-dossier-pr28]
    paths:
      - .github/workflows/repair-stablecoin-organizations-section.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stablecoin-dossier-pr28
      - name: Consolidate organizations and control section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/components/StablecoinDetailView.astro')
          text = path.read_text()
          import_anchor = "import ValueStateText from './ValueStateText.astro';\n"
          component_import = "import StablecoinOrganizationsControl from './StablecoinOrganizationsControl.astro';\n"
          if component_import not in text:
              text = text.replace(import_anchor, import_anchor + component_import, 1)
          preview_pattern = re.compile(r'''\n    <section class="panel stablecoin-preview-section" id="organizations-control">.*?</section>\n''', re.S)
          replacement = '''
    <StablecoinOrganizationsControl
      coin={coin}
      relationships={relationships}
      primaryResolution={primaryResolution}
      primaryRelationship={primaryRelationship}
      primaryOrganization={primaryOrganization}
      organizations={organizations}
      deployments={deployments}
      issuerControlEvents={issuerControlEvents}
    />
'''
          text, preview_count = preview_pattern.subn(replacement, text, count=1)
          old_table_pattern = re.compile(r'''\n    <section class="panel registry"><div class="bar">Organizations and roles</div>.*?</section>\n''', re.S)
          text, table_count = old_table_pattern.subn('\n', text, count=1)
          if preview_count != 1 or table_count != 1:
              raise SystemExit(f'Expected one preview and one legacy table replacement, got {preview_count}/{table_count}')
          if text.count('data-table-kind="stablecoin-organizations"') != 0:
              raise SystemExit('Legacy stablecoin organization table remains in detail view')
          path.write_text(text)
          PY
      - name: Remove workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-stablecoin-organizations-section.yml
          git add src/components/StablecoinDetailView.astro
          git commit -m 'Consolidate stablecoin organizations and control'
          git push origin HEAD:ui/stablecoin-dossier-pr28
