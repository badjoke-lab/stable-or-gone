name: Evidence integrity audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 3'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Full-corpus evidence integrity audit is advisory and does not block publication.'
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run evidence integrity maintenance audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/audit-registry-evidence-integrity.mjs
      - name: Upload evidence integrity audit
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-integrity-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/generated/registry-evidence-integrity-audit.json
            docs/audits/registry-501-evidence-integrity-audit.md
