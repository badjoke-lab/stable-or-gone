name: PR 364 Evidence Duplicate Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Evidence audit and compact finding
        shell: bash
        run: |
          set +e
          node scripts/audit-registry-evidence-integrity.mjs
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('data/generated/registry-evidence-integrity-audit.json','utf8'));
          const compact={
            critical:report.findings?.critical??[],
            exact_duplicate_url_groups:report.identity?.exact_duplicate_url_groups??[],
            normalized_only_duplicate_url_groups:report.identity?.normalized_only_duplicate_url_groups??[]
          };
          fs.mkdirSync('artifacts/pr364-evidence-duplicate',{recursive:true});
          fs.writeFileSync('artifacts/pr364-evidence-duplicate/report.json',`${JSON.stringify(compact,null,2)}\n`);
          NODE

      - name: Upload compact finding
        uses: actions/upload-artifact@v4
        with:
          name: pr364-evidence-duplicate-report-${{ github.run_id }}
          path: artifacts/pr364-evidence-duplicate/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact duplicate findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-evidence-duplicate-diagnostic -->';
            let report=null;
            try{report=JSON.parse(fs.readFileSync('artifacts/pr364-evidence-duplicate/report.json','utf8'));}catch{}
            const exact=report?.exact_duplicate_url_groups??[];
            const normalized=report?.normalized_only_duplicate_url_groups??[];
            const critical=report?.critical??[];
            const body=`${marker}\n## PR #364 exact Evidence duplicate diagnostic\n\n- Critical findings: **${critical.length}**\n- Exact duplicate URL groups: **${exact.length}**\n- Normalized-only duplicate groups: **${normalized.length}**\n- Artifact: \`pr364-evidence-duplicate-report-${context.runId}\`\n\n\`\`\`json\n${JSON.stringify({critical,exact,normalized},null,2)}\n\`\`\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
