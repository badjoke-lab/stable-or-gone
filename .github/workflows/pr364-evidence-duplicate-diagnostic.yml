name: PR 364 Evidence Duplicate Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Evidence audit
        shell: bash
        run: |
          set +e
          node scripts/audit-registry-evidence-integrity.mjs
          exit 0

      - name: Publish exact duplicate findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-evidence-duplicate-diagnostic -->';
            let report=null;
            try{report=JSON.parse(fs.readFileSync('data/generated/registry-evidence-integrity-audit.json','utf8'));}catch{}
            const exact=report?.identity?.exact_duplicate_url_groups??[];
            const normalized=report?.identity?.normalized_only_duplicate_url_groups??[];
            const critical=report?.findings?.critical??[];
            const body=`${marker}\n## PR #364 exact Evidence duplicate diagnostic\n\n- Critical findings: **${critical.length}**\n- Exact duplicate URL groups: **${exact.length}**\n- Normalized-only duplicate groups: **${normalized.length}**\n\n### Critical findings\n\n\`\`\`json\n${JSON.stringify(critical,null,2)}\n\`\`\`\n\n### Exact duplicate URL groups\n\n\`\`\`json\n${JSON.stringify(exact,null,2)}\n\`\`\`\n\n### Normalized-only duplicate groups\n\n\`\`\`json\n${JSON.stringify(normalized,null,2)}\n\`\`\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
