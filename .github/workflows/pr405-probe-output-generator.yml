name: PR 405 Probe Output Generator

on:
  push:
    branches:
      - pr405-evidence-archive-maintenance-batch-8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr405-probe-output-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe selected sources
        run: node scripts/probe-evidence-archive-maintenance-batch-8-pr405.mjs
      - name: Commit probe output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/evidence-archive-maintenance-batch-8-pr405-review-queue.json
          if git diff --cached --quiet; then
            echo 'Probe output already committed'
            exit 0
          fi
          git commit -m 'Record PR 405 Batch 8 source probes'
          git pull --rebase origin pr405-evidence-archive-maintenance-batch-8
          git push origin HEAD:pr405-evidence-archive-maintenance-batch-8
