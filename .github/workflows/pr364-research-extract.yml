name: PR 364 Existing Record Extract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  TARGET_BRANCH: pr364-tier-a-dossier-batch-4

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Extract selected asset records
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const targetIds = new Set(['sog_st_husd','sog_st_1gbp','sog_st_rlusd','sog_st_usdg','sog_st_usds']);
          const targetSlugs = new Set(['husd','poundtoken','rlusd','usdg','usds']);
          const targetTerms = ['HUSD','poundtoken','1GBP','Ripple USD','RLUSD','Global Dollar','USDG','USDS'];
          const roots = ['data','docs/migration'];
          const output = { generated_at: new Date().toISOString(), targets: [...targetIds], matches: [] };

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap((entry)=>{
              const full=path.join(dir,entry.name);
              return entry.isDirectory()?walk(full):[full];
            });
          }
          function containsTarget(value) {
            const text = JSON.stringify(value);
            return [...targetIds].some((id)=>text.includes(id)) || [...targetSlugs].some((slug)=>text.includes(`\"${slug}\"`)) || targetTerms.some((term)=>text.includes(term));
          }
          function collect(value, file, pointer='$') {
            if (Array.isArray(value)) {
              value.forEach((row,index)=>{
                if (containsTarget(row)) output.matches.push({file,pointer:`${pointer}[${index}]`,row});
              });
              return;
            }
            if (value && typeof value === 'object') {
              for (const [key,row] of Object.entries(value)) {
                if (Array.isArray(row)) collect(row,file,`${pointer}.${key}`);
                else if (row && typeof row === 'object' && containsTarget(row)) output.matches.push({file,pointer:`${pointer}.${key}`,row});
              }
            }
          }
          for (const file of roots.flatMap(walk).filter((file)=>file.endsWith('.json'))) {
            try { collect(JSON.parse(fs.readFileSync(file,'utf8')),file); } catch {}
          }
          output.matches.sort((a,b)=>a.file.localeCompare(b.file)||a.pointer.localeCompare(b.pointer));
          fs.writeFileSync('artifacts/pr364-existing-records.json',JSON.stringify(output,null,2)+'\n');
          console.log(JSON.stringify({match_count:output.matches.length,files:[...new Set(output.matches.map((row)=>row.file))]},null,2));
          NODE

      - name: Upload extract
        uses: actions/upload-artifact@v4
        with:
          name: pr364-existing-records-${{ github.run_id }}
          path: artifacts/pr364-existing-records.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish extract location
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr364-existing-record-extract -->';
            const body=`${marker}\n## PR #364 existing record extract\n\n- Status: **${{ job.status }}**\n- Run ID: **${context.runId}**\n- Artifact: \`pr364-existing-records-${context.runId}\`\n- Head: \`${context.sha}\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
