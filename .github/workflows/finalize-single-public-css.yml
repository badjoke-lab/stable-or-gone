name: Finalize single public CSS

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/styles/**'
      - 'scripts/finalize-single-public-css.mjs'
      - '.github/workflows/finalize-single-public-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Remove every obsolete CSS path
        run: node scripts/finalize-single-public-css.mjs

      - name: Commit physical single-CSS state
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Repository already contains exactly one CSS file.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Delete obsolete CSS and keep one public UI authority'
          git push origin HEAD:agent/full-ui-contract-remediation
