name: Finalize protocol mechanics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resolve-protocol-income-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update roadmap
        run: node scripts/update-protocol-batch-roadmap.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate profiles
        run: npm run validate:income-v3
      - name: Regenerate registry stats
        run: node scripts/generate-registry-stats.mjs
      - name: Validate registry stats
        run: node scripts/validate-registry-stats.mjs
      - name: Remove temporary files
        run: |
          rm scripts/update-protocol-batch-roadmap.mjs
          rm .github/workflows/finalize-protocol-mechanics.yml
      - name: Commit finalized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve protocol mechanics profiles"
          git push origin HEAD:resolve-protocol-income-profiles
