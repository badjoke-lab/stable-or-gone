name: Finalize PR506 archive payload implementation
run-name: Finalize PR506 · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - agent/evidence-archive-payload-verification-batch-1-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr506-archive-payload
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/evidence-archive-payload-verification-batch-1-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/evidence-archive-payload-verification-batch-1-implementation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build reviewed PR506 outputs
        run: node scripts/finalize-pr506-evidence-archive-payload.mjs

      - name: Remove temporary probe and finalizer files
        run: |
          rm .github/workflows/pr506-wayback-payload-probe.yml
          rm scripts/probe-evidence-archive-payloads-pr506.py
          rm scripts/retry-pr506-wayback-gaps.py
          rm scripts/finalize-pr506-evidence-archive-payload.mjs

      - name: Validate reviewed PR506 state
        run: |
          node scripts/validate-evidence-archive-payload-verification-pr506.mjs
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity

      - name: Commit reviewed implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add seven reviewed Evidence archive payloads'
          git push origin HEAD:agent/evidence-archive-payload-verification-batch-1-implementation
