name: PR506 Wayback gap retry
run-name: PR506 gap retry · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - agent/evidence-archive-payload-verification-batch-1-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr506-wayback-gap-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/evidence-archive-payload-verification-batch-1-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retry unresolved exact-source payloads
        run: python scripts/retry-pr506-wayback-gaps.py

      - name: Summarize retry
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('data/editorial-research/evidence-archive-payload-verification-batch-1-pr506-gap-retry.json')
          print('## PR #506 targeted Wayback retry')
          if not path.exists():
              print('\nRetry output was not generated.')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          for row in data['results']:
              fetched = sum(1 for capture in row['capture_reviews'] if capture['fetch_status'] == 200 and capture['payload_bytes'] > 0)
              hitful = sum(1 for capture in row['capture_reviews'] if capture['keyword_hits'])
              print(f"- `{row['evidence_id']}`: CDX {row['cdx_status']}/{row['cdx_capture_count']}, fetched {fetched}, keyword-bearing {hitful}")
          PY

      - name: Upload retry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr506-wayback-gap-retry
          path: |
            data/editorial-research/evidence-archive-payload-verification-batch-1-pr506-gap-retry.json
            .tmp/pr506-wayback-gap-retry
          if-no-files-found: warn
          retention-days: 14
