name: Apply inline style consolidation

on:
  push:
    branches:
      - agent/full-ui-contract-remediation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Apply inline style consolidation
        run: node scripts/apply-inline-style-consolidation.mjs

      - name: Commit bounded consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Inline style consolidation already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src artifacts/.trigger-runtime-audit-role-fixes
          git commit -m 'Move remaining public styles into the single UI authority'
          git push origin HEAD:agent/full-ui-contract-remediation
