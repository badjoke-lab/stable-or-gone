name: Index interaction contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect current and target index behavior
        run: node scripts/collect-index-interaction-audit.mjs
      - name: Validate index interaction contract
        run: node scripts/validate-index-interaction-contract.mjs
      - name: Upload interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-interaction-contract-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/index-interaction-audit.json
            data/generated/index-interaction-validation.json
