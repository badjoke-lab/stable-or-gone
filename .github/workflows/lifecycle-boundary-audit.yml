name: Lifecycle and boundary audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lifecycle and relationship boundary audit
        run: node scripts/audit-registry-lifecycle-boundaries.mjs
      - name: Upload lifecycle boundary audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-boundary-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/registry-lifecycle-boundary-audit.json
            docs/audits/registry-100-lifecycle-boundary-audit.md
