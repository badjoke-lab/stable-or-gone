name: Deployment and chain identity audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 3'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Full-corpus deployment/chain identity audit is advisory and does not block publication.'
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deployment and chain identity maintenance audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/audit-registry-deployment-chain-identity-current.mjs
      - name: Upload deployment identity audit
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-chain-identity-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/generated/registry-deployment-chain-identity-audit.json
            docs/audits/registry-100-deployment-chain-identity-audit.md
