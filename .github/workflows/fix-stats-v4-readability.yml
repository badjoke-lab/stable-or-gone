name: Fix Statistics v4 readability

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [docs/statistics-redesign-review.md]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rebuild-stats-information-architecture
          fetch-depth: 0
      - name: Apply audited Statistics typography
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          replacements = [
            ('.stats-v4-section-heading>p{max-width:52ch;justify-self:end;font-size:16px;line-height:1.55}', '.stats-v4-section-heading>p{max-width:52ch;justify-self:end;font-size:17px;line-height:1.55}'),
            ('.stats-v4-kpis p{font-size:15px;line-height:1.45}', '.stats-v4-kpis p{font-size:17px;line-height:1.55}'),
            ('.stats-v4-lifecycle-card p{font-size:15px}', '.stats-v4-lifecycle-card p{font-size:17px;line-height:1.55}'),
            ('.stats-v4-kpis dd,.stats-v4-growth-kpis dd{margin:0;color:var(--ui-text);font:600 clamp(2rem,4vw,3.2rem)/1 var(--ui-serif)}', '.stats-v4-kpis dd,.stats-v4-growth-kpis dd{margin:0;color:var(--ui-text);font:800 clamp(2rem,4vw,3.2rem)/1.35 var(--ui-sans)}'),
            ('.stats-v4-mini-kpis dd{margin:0;color:var(--ui-text);font:600 2rem/1 var(--ui-serif)}', '.stats-v4-mini-kpis dd{margin:0;color:var(--ui-text);font:800 2rem/1.35 var(--ui-sans)}')
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {before}')
              source = source.replace(before, after)
          path.write_text(source)
          PY
          git rm .github/workflows/fix-stats-v4-readability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Meet Statistics readability and typography floors"
          git pull --rebase origin fix/rebuild-stats-information-architecture
          git push origin HEAD:fix/rebuild-stats-information-architecture
