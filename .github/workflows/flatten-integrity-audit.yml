name: Flatten integrity audit

on:
  push:
    branches:
      - flatten-integrity-audit
    paths:
      - .github/workflows/flatten-integrity-audit.yml

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flatten-integrity-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Flatten audit source
        run: node scripts/flatten-integrity-audit.mjs
      - name: Remove migration-only files
        run: |
          rm scripts/audit-registry-integrity-base.mjs
          rm scripts/flatten-integrity-audit.mjs
          rm .github/workflows/flatten-integrity-audit.yml
      - name: Verify flattened implementation
        run: npm run validate:integrity
      - name: Commit flattened audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Flatten registry integrity audit implementation"
          git push origin HEAD:flatten-integrity-audit
