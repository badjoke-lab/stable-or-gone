name: PR 391 Post-PR 390 Review Gate

on:
  push:
    branches:
      - pr391-post-pr390-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr391-post-pr390-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic review gate
        run: |
          node scripts/build-post-pr390-review-gate-pr391.mjs 2>&1 | tee /tmp/pr391-build.txt
          node scripts/build-post-pr390-review-gate-pr391.mjs --check
      - name: Commit generated review report
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/post-pr390-review-gate-pr391.json
          if git diff --cached --quiet; then
            echo 'PR #391 review report already committed'
          else
            git commit -m 'Generate PR 391 post-PR 390 review gate report'
            git pull --rebase origin pr391-post-pr390-review-gate
            git push origin HEAD:pr391-post-pr390-review-gate
          fi
      - name: Validate review gate authority
        run: |
          node scripts/validate-post-pr390-review-gate-pr391.mjs 2>&1 | tee /tmp/pr391-validation.txt
          npm run validate:active-workstream
      - name: Validate canonical and release contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
          node scripts/validate-non-ui-release-material-current.mjs
      - name: Verify internal-review-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          git diff --exit-code origin/main...HEAD -- docs/migration/current-canonical-checkpoint.json docs/migration/current-stats-history-checkpoint.json docs/migration/registry-release-integrity-baseline.json
          test ! -e public/data/post-pr390-review-gate-pr391.json
          test ! -e src/pages/post-pr390-review-gate-pr391.astro
      - name: Verify generated output is committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
      - name: Astro check and build
        run: |
          npm run check
          npm run build
          npm run verify:public
      - name: Publish PR 391 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr391-post-pr390-review-gate-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/post-pr390-review-gate-pr391.json','utf8'));}catch{}
            let diagnostics='';
            for(const file of ['/tmp/pr391-build.txt','/tmp/pr391-validation.txt']){
              try{diagnostics+=`${fs.readFileSync(file,'utf8').trim()}\n`;}catch{}
            }
            const sequence=report?.approved_next_sequence?.map((row)=>`PR #${row.pr} ${row.work_item}`).join(' → ')||'n/a';
            const v4=report?.expected_history_v4||{};
            const body=`${marker}
            ## PR #391 Post-PR #390 Review Gate

            - Workflow: **${{ job.status }}**
            - Archive recorded / not recorded: **${report?.source_checkpoint?.archive_recorded??'n/a'} / ${report?.source_checkpoint?.archive_not_recorded??'n/a'}**
            - PR #390 reviewed / changed: **${report?.completed_pr390?.selected??'n/a'} / ${report?.completed_pr390?.changed??'n/a'}**
            - PR #390 archives / replacements / no-safe: **${report?.completed_pr390?.dated_archives_added??'n/a'} / ${report?.completed_pr390?.reviewed_source_replacements??'n/a'} / ${report?.completed_pr390?.reviewed_no_safe_change??'n/a'}**
            - History v4 sources / events / identities: **${v4.sources??'n/a'} / ${v4.events??'n/a'} / ${v4.identities??'n/a'}**
            - History v4 archive / invalid / no-safe / replacement: **${v4.effective_archive_present??'n/a'} / ${v4.effective_invalid_removed??'n/a'} / ${v4.effective_no_safe_change??'n/a'} / ${v4.effective_source_replacement??'n/a'}**
            - Suppressed / reactivated eligible: **${v4.reviewed_suppressed??'n/a'} / ${v4.reviewed_reactivated_eligible??'n/a'}**
            - Approved sequence: **${sequence}**
            - Review gate after sequence: **${report?.review_gate_after_sequence??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics</summary>

            \`\`\`text
            ${diagnostics.trim().slice(-12000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
