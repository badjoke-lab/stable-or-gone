name: Apply white background and mobile density fix

on:
  push:
    branches:
      - fix/white-background-mobile-density
    paths:
      - '.github/workflows/apply-white-mobile-fix.yml'
      - 'scripts/apply_white_mobile_fix_once.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-white-mobile-fix.yml'
      - 'scripts/apply_white_mobile_fix_once.py'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event_name == 'push' || github.head_ref == 'fix/white-background-mobile-density'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/white-background-mobile-density

      - name: Apply bounded UI transformation
        run: python3 scripts/apply_white_mobile_fix_once.py

      - name: Remove one-shot files and commit
        run: |
          rm .github/workflows/apply-white-mobile-fix.yml
          rm scripts/apply_white_mobile_fix_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore white UI and compact mobile registries"
          git push origin HEAD:fix/white-background-mobile-density
