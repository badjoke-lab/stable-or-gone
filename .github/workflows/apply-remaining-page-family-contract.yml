name: Apply remaining page-family UI contract

on:
  push:
    branches:
      - agent/full-ui-contract-remediation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Apply remaining page-family contract
        run: node scripts/apply-remaining-page-family-contract.mjs

      - name: Commit bounded migration
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo 'Remaining page-family contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Move remaining page families into the single UI authority'
          git push origin HEAD:agent/full-ui-contract-remediation
