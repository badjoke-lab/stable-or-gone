name: Batch K PR merge diagnostics

on:
  push:
    branches: [batch-k-historical-failures]
    paths:
      - .github/workflows/batch-k-pr-merge-diagnostics.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/42/merge
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node scripts/validate-batch-finalization.mjs > finalization.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: batch-k-pr-merge-finalization
          path: finalization.log
