name: Temporary fix Compare view jump

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-fix-compare-view-jump.yml'
      - 'scripts/tmp-fix-compare-view-jump.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Apply direct Compare jump
        run: node scripts/tmp-fix-compare-view-jump.mjs
      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/tmp-fix-compare-view-jump.yml
          rm -f scripts/tmp-fix-compare-view-jump.mjs
      - name: Commit direct jump fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make View comparison an immediate jump"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
