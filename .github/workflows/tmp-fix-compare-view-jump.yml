name: Temporary fix Compare view jump

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-fix-compare-view-jump.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Use direct explicit jump to comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scripts/stablecoin-index.ts')
          s = p.read_text()
          old = """    comparePanel.scrollIntoView({ block: 'start', behavior: 'smooth' });
    window.setTimeout(() => comparePanel.focus({ preventScroll: true }), 250);
"""
          new = """    comparePanel.scrollIntoView({ block: 'start', behavior: 'auto' });
    comparePanel.focus({ preventScroll: true });
"""
          if old not in s:
              raise SystemExit('expected View comparison block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-fix-compare-view-jump.yml
      - name: Commit direct jump fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make View comparison an immediate jump"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
