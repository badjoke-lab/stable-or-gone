name: Apply V3 access regulation contract fix

on:
  push:
    branches:
      - 'ui/v3-cya-dark-redesign'
    paths:
      - '.github/workflows/v3-access-regulation-contract-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v3-cya-dark-redesign
      - name: Replace stale fixed-count contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('src/scripts/access-regulation-explorer.ts')
          source = script_path.read_text()
          old_contract = """      if (index.asset_count !== 110 || index.single_composite_score !== false || index.risk_ranking !== false) {
                throw new Error('access/regulation index contract mismatch');
              }"""
          new_contract = """      if (
                !Array.isArray(index.rows)
                || !Array.isArray(index.filters)
                || !Number.isInteger(index.asset_count)
                || index.asset_count !== index.rows.length
                || index.single_composite_score !== false
                || index.risk_ranking !== false
              ) {
                throw new Error('access/regulation index contract mismatch');
              }"""
          if old_contract not in source:
              raise SystemExit('stale access/regulation contract block not found')
          source = source.replace(old_contract, new_contract, 1)

          old_catch = """    } catch (error) {
                if (loading) loading.hidden = true;
                if (alert) alert.textContent = `Explorer index failed to load: ${error instanceof Error ? error.message : String(error)}`;
                if (resultRange) resultRange.textContent = 'index unavailable';
              }"""
          new_catch = """    } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                if (loading) loading.hidden = true;
                if (results) {
                  results.hidden = true;
                  results.replaceChildren();
                }
                if (empty) {
                  empty.hidden = false;
                  const heading = empty.querySelector('strong');
                  const copy = empty.querySelector('p');
                  if (heading) heading.textContent = 'Explorer index unavailable';
                  if (copy) copy.textContent = 'The canonical index could not be loaded. No legal, regulatory, or availability conclusion should be inferred from this unavailable state.';
                }
                if (showMoreRow) showMoreRow.hidden = true;
                if (resultCount) resultCount.textContent = '0';
                if (alert) alert.textContent = `Explorer index failed to load: ${message}`;
                if (resultRange) resultRange.textContent = 'index unavailable';
              }"""
          if old_catch not in source:
              raise SystemExit('access/regulation error-state block not found')
          source = source.replace(old_catch, new_catch, 1)
          script_path.write_text(source)

          page_path = Path('src/pages/access-regulation/index.astro')
          page = page_path.read_text()
          page = page.replace(
              "import explorerConfig from '../../../config/access-regulation-explorer-v1.json';\n",
              "import explorerConfig from '../../../config/access-regulation-explorer-v1.json';\nimport { getStablecoins } from '../../lib/data/registry';\n",
              1,
          )
          page = page.replace(
              "const configJson = JSON.stringify(explorerConfig).replace(/</g, '\\u003c');\n",
              "const configJson = JSON.stringify(explorerConfig).replace(/</g, '\\u003c');\nconst assetCount = getStablecoins().length;\n",
              1,
          )
          page = page.replace(
              'across 110 stable assets.',
              'across the canonical stable-asset registry.',
              1,
          )
          page = page.replace('<div><dt>Assets</dt><dd>110</dd></div>', '<div><dt>Assets</dt><dd>{assetCount}</dd></div>', 1)
          page = page.replace('placeholder="Search 110 assets"', 'placeholder={`Search ${assetCount} assets`}', 1)
          page_path.write_text(page)
          PY
      - name: Verify and commit fix
        run: |
          set -euo pipefail
          grep -q "index.asset_count !== index.rows.length" src/scripts/access-regulation-explorer.ts
          grep -q "const assetCount = getStablecoins().length" src/pages/access-regulation/index.astro
          rm .github/workflows/v3-access-regulation-contract-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scripts/access-regulation-explorer.ts src/pages/access-regulation/index.astro .github/workflows/v3-access-regulation-contract-fix.yml
          git commit -m "Fix Access and Regulation index count contract"
          git push origin HEAD:ui/v3-cya-dark-redesign
