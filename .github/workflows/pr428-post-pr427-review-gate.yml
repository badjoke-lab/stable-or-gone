name: PR 428 Post-PR 427 Review Gate
run-name: PR 428 review gate · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - pr428-post-pr427-review-gate
  pull_request:
    branches:
      - pr427-data-growth-planning-reset
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr428-post-pr427-review-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr428-post-pr427-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'pr427-data-growth-planning-reset' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate review-gate decision
        run: node scripts/validate-post-pr427-review-gate-pr428.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Validate canonical and release contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity

      - name: Verify governance-only boundary
        run: git diff --exit-code "origin/${BASE_BRANCH}...HEAD" -- data/ src/ public/

      - name: Astro check and build
        run: |
          npm run check
          npm run build

      - name: Commit successful validation receipt
        if: github.event_name == 'push'
        run: |
          cat > docs/migration/post-pr427-review-gate-pr428-validation.json <<'JSON'
          {
            "schema_version": "1.0",
            "status": "success",
            "validated_work_item": "post_pr427_review_gate_pr428",
            "source_pr": 427,
            "next_pr": 429,
            "selected_symbols": ["CHFAU", "SEKAU"],
            "maximum_new_canonical_assets": 2,
            "canonical_changes_in_pr428": 0,
            "public_changes_in_pr428": 0,
            "review_gate_after_pr429": true
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/post-pr427-review-gate-pr428-validation.json
          if git diff --cached --quiet; then
            echo 'Validation receipt already current.'
          else
            git commit -m 'Record successful PR 428 review-gate validation'
            git push origin HEAD:pr428-post-pr427-review-gate
          fi

      - name: Publish PR 428 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr428-post-pr427-review-gate-status -->';
            const fs=require('fs');
            let config=null;
            try { config=JSON.parse(fs.readFileSync('config/post-pr427-review-gate-pr428.json','utf8')); } catch {}
            const symbols=config?.decision?.selected_symbols?.join(', ')||'n/a';
            const body=`${marker}
            ## PR #428 Post-PR #427 Review Gate

            - Workflow: **${{ job.status }}**
            - Source audit validation: **${config?.source_validation?.status ?? 'n/a'}**
            - Authorized next PR: **#${config?.decision?.authorize_next_pr ?? 'n/a'}**
            - Selected context: **${config?.decision?.selected_context_id ?? 'n/a'}**
            - Selected assets: **${symbols}**
            - Maximum new assets: **${config?.decision?.maximum_new_canonical_assets ?? 'n/a'}**
            - Canonical changes in PR #428: **0**
            - Public changes in PR #428: **0**
            - Next boundary after PR #429: **REVIEW GATE**
            - Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
