name: AAA PR356 Stats Snapshot

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  snapshot:
    if: github.head_ref == 'pr356-market-access-pilot-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr356-market-access-pilot-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic snapshot candidate
        run: node scripts/stats/build-history-snapshot.mjs > docs/migration/pr356-stats-snapshot-candidate.json
      - name: Commit snapshot candidate
        run: |
          if git diff --quiet; then
            echo 'Snapshot candidate already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migration/pr356-stats-snapshot-candidate.json
          git commit -m 'Generate PR 356 statistics snapshot candidate'
          git push origin HEAD:pr356-market-access-pilot-1
      - name: Publish snapshot status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr356-stats-snapshot -->';
            let snapshot = null;
            let error = null;
            try { snapshot = JSON.parse(fs.readFileSync('docs/migration/pr356-stats-snapshot-candidate.json', 'utf8')); }
            catch (err) { error = String(err); }
            const body = `${marker}
            ## PR #356 deterministic stats snapshot

            - Workflow status: **${{ job.status }}**
            - Checkpoint: \`${snapshot?.checkpoint_id ?? 'not-generated'}\`
            - Evidence total: **${snapshot?.totals?.evidence ?? 'not-generated'}**
            - Stats model SHA-256: \`${snapshot?.stats_model_sha256 ?? 'not-generated'}\`
            - Snapshot SHA-256: \`${snapshot?.snapshot_sha256 ?? 'not-generated'}\`
            - Error: ${error ? `\`${error}\`` : 'none'}
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
