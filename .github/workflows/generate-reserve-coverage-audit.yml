name: Generate clarified reserve coverage audit

on:
  push:
    branches:
      - clarify-reserve-report-coverage
    paths:
      - .github/workflows/generate-reserve-coverage-audit.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clarify-reserve-report-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate integrity audit
        run: npm run audit:integrity
      - name: Commit generated outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/registry-integrity-audit.json docs/audits/registry-70-final-audit.md
          git commit -m "Regenerate clarified reserve coverage audit"
          git push origin HEAD:clarify-reserve-report-coverage
