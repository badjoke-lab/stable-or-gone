name: PR 413 UI v3 Home Register

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr413-ui-v3-home-register-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr413-ui-v3-home-stablecoin-register'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate PR 413 bounded implementation
        run: node scripts/validate-ui-v3-home-register-pr413.mjs && npm run validate:active-workstream
      - name: Validate legacy home and register contracts
        run: npm run validate:ui-v3-home && npm run validate:ui-v3-stablecoin-index
      - name: Verify authorized templates only
        run: |
          test "$(git diff --name-only origin/main...HEAD -- src/pages/ | sort)" = $'src/pages/index.astro\nsrc/pages/stablecoins/index.astro'
          test "$(git diff --name-only origin/main...HEAD -- src/styles/ | sort)" = $'src/styles/home-v3.css\nsrc/styles/stablecoin-index.css'
          test -z "$(git diff --name-only origin/main...HEAD -- data/ public/)"
          git diff --exit-code origin/main...HEAD -- \
            config/site-architecture.mjs \
            docs/migration/ui-v3-visual-approval-register.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-release-integrity-baseline.json
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate interaction contract
        run: npm run prepare:index-interaction-contract
      - name: Validate responsive accessibility
        run: npm run prepare:responsive-accessibility-contract
      - name: Validate compatibility and final state
        run: npm run validate:compat && npm run validate:final
      - name: Validate release and reproducible build
        run: npm run validate:release-integrity && npm run validate:reproducible-build
      - name: Astro check and build
        run: npm run check && npm run build && npm run verify:public
      - name: Verify built home and register markers
        run: |
          test -f dist/index.html
          test -f dist/stablecoins/index.html
          grep -q 'data-home-registry="pr413"' dist/index.html
          grep -q 'Questions the registry has not resolved' dist/index.html
          grep -q 'Publication history' dist/index.html
          grep -q 'data-register-version="pr413"' dist/stablecoins/index.html
          grep -q 'Comparison workspace' dist/stablecoins/index.html

  visual-audit:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr413-ui-v3-home-stablecoin-register'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static site
        run: npm run build
      - name: Start local static server
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/pr413-server.log 2>&1 &
          echo $! > /tmp/pr413-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr413-server.log
          exit 1
      - name: Capture all required home and register states
        env:
          SOG_SCREENSHOT_BASE_URL: http://127.0.0.1:4321
        run: node scripts/capture-home-register-pr413.mjs
      - name: Build home and register contact sheet
        run: node scripts/build-home-register-contact-sheet-pr413.mjs
      - name: Verify mandatory visual states
        run: |
          test -f artifacts/pr413-home-register/manifest.json
          test -f artifacts/pr413-home-register/contact-sheet.html
          test -f artifacts/pr413-home-register/contact-sheet.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('artifacts/pr413-home-register/manifest.json','utf8'));
          const contact=JSON.parse(fs.readFileSync('artifacts/pr413-home-register/contact-sheet.json','utf8'));
          if(manifest.failure_count!==0 || manifest.capture_count!==10)throw new Error('required visual state matrix failed');
          if(manifest.owner_approval!==false || contact.owner_approval!==false)throw new Error('automated artifact may not record owner approval');
          NODE
      - name: Upload mandatory PR 413 visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr413-home-register-visual-review-${{ github.run_id }}
          path: artifacts/pr413-home-register/
          if-no-files-found: error
          retention-days: 30
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/pr413-server.pid; then kill "$(cat /tmp/pr413-server.pid)" || true; fi

  report:
    if: always()
    needs: [validate, visual-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Publish PR 413 status
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr413-home-register-status -->';
            const validate='${{ needs.validate.result }}';
            const visual='${{ needs.visual-audit.result }}';
            const overall=validate==='success' && visual==='success' ? 'success' : 'failure';
            const issueNumber=context.issue?.number || 413;
            const body=`${marker}
            ## PR #413 Home and Stablecoin Register

            - Overall: **${overall}**
            - Contract and build validation: **${validate}**
            - Required ten-state desktop/mobile visual audit: **${visual}**
            - Visual review run ID: **${context.runId}**
            - Authorized routes: **\`/\` and \`/stablecoins/\`**
            - Register page size: **20**
            - Canonical changes: **0**
            - Owner approvals changed: **0**
            - Automated capture counts as approval: **false**
            - Next authority: **REVIEW GATE**
            - Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
