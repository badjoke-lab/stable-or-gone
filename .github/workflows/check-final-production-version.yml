name: Check final production version

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/check-final-production-version.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public version
        run: |
          mkdir -p artifacts
          node <<'NODE'
          import fs from 'node:fs';
          const response = await fetch('https://sog.badjoke-lab.com/version.json', {
            headers: { accept: 'application/json', 'cache-control': 'no-cache', 'user-agent': 'sog-final-version-check/1.0' }
          });
          const version = await response.json();
          const result = {
            status: response.status,
            fetched_at: new Date().toISOString(),
            expected_commit: '681172b08e2f901450a369f7b141b7a9ebd53b42',
            production_commit: version?.build?.commit ?? null,
            production_branch: version?.build?.branch ?? null,
            canonical_data_hash: version?.build?.canonical_data_hash ?? null,
            primary_records: version?.data?.record_counts?.primary_records ?? null,
            matches: version?.build?.commit === '681172b08e2f901450a369f7b141b7a9ebd53b42'
          };
          fs.writeFileSync('artifacts/final-production-version.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: final-production-version-${{ github.run_id }}
          path: artifacts/final-production-version.json
