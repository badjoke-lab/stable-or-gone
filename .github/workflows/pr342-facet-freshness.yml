name: PR 342 Facet freshness derivation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr342-facet-freshness-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Build facet freshness audit
        run: node scripts/comparison/build-facet-freshness-pr342.mjs artifacts/facet-freshness-pr342.json

      - name: Validate facet freshness contract
        run: node scripts/validate-facet-freshness-contract-pr342.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Verify PR 342 output boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('artifacts/facet-freshness-pr342.json', 'utf8'));
          if (audit.asset_count !== 110) throw new Error(`asset_count must be 110, found ${audit.asset_count}`);
          if (audit.dimension_count !== 19) throw new Error(`dimension_count must be 19, found ${audit.dimension_count}`);
          if (audit.cell_count !== 2090) throw new Error(`cell_count must be 2090, found ${audit.cell_count}`);
          if (audit.public_output !== false) throw new Error('PR #342 output must remain internal');
          if (audit.single_composite_score !== false) throw new Error('PR #342 must not emit a composite freshness score');
          const marketAccess = audit.assets.flatMap((asset) => asset.facets).filter((facet) => facet.dimension_id === 'market_access_applicability');
          if (marketAccess.length !== 110) throw new Error(`Market Access freshness cells must be 110, found ${marketAccess.length}`);
          if (!marketAccess.every((facet) => facet.freshness_state === 'no_canonical_record')) throw new Error('empty canonical Market Access entrypoint must derive no_canonical_record for all assets');
          console.log('PR #342 boundary valid: 110 assets x 19 dimensions, internal canonical-only output, no composite score, Market Access no_canonical_record=110.');
          NODE

      - name: Upload facet freshness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr342-facet-freshness-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/facet-freshness-pr342.json
