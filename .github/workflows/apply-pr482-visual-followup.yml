name: Apply PR 482 visual follow-up

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/apply-pr482-visual-followup.mjs'
      - '.github/workflows/apply-pr482-visual-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Apply visual follow-up
        run: node scripts/apply-pr482-visual-followup.mjs

      - name: Commit final visual follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/public-ui.css scripts/apply-pr482-visual-followup.mjs .github/workflows/apply-pr482-visual-followup.yml
          git commit -m 'Raise mobile fact labels and space related links'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
