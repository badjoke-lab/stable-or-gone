name: PR 361 Post-PR 360 Review Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr361-post-pr360-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deterministic review gate
        run: node scripts/validate-post-pr360-review-gate-pr361.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Verify canonical and public source trees are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/
          echo 'PR #361 changes no canonical data or public application source.'

      - name: Verify historical planning checkpoints are immutable
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/migration/record-depth-baseline-pr353-summary.json \
            docs/migration/tier-a-candidate-queue-pr353.json \
            docs/migration/tier-a-batch-1-pr354-reviewed-handoff.json \
            docs/migration/tier-a-batch-2-pr355-reviewed-handoff.json
          echo 'Historical Record Depth and reviewed handoff checkpoints preserved.'

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Verify review-gate decisions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('docs/migration/post-pr360-review-gate-pr361.json','utf8'));
          if (report.public_output !== false) throw new Error('Review gate must remain internal');
          if (report.current_counts?.assets !== 112 || report.current_counts?.evidence !== 557 || report.current_counts?.market_access_records !== 8) throw new Error('Review gate current count boundary changed');
          if (JSON.stringify(report.approved_next_sequence?.map((row) => row.pr)) !== JSON.stringify([363,364,365])) throw new Error('Approved next sequence changed');
          if (report.decisions?.market_access_pilot_3?.decision !== 'not_approved') throw new Error('Market Access Pilot 3 was incorrectly approved');
          if (report.decisions?.record_growth_batch_2?.decision !== 'not_approved_in_next_sequence') throw new Error('Record Growth Batch 2 was incorrectly approved');
          if (report.decisions?.new_public_surface?.decision !== 'not_approved') throw new Error('New public surface was incorrectly approved');
          console.log('PR #361 review-gate decisions preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify review-gate artifacts remain non-public
        run: |
          test ! -e dist/data/post-pr360-review-gate-pr361.json
          test ! -e dist/data/pr360-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json','utf8'));
          for (const key of ['post_pr360_review_gate_pr361','pr360_reviewed_handoff']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal review-gate material leaked: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #361 review-gate material remains non-public.');
          NODE

      - name: Publish PR 361 review summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr361-review-gate-status -->';
            let report = null;
            try { report = JSON.parse(fs.readFileSync('docs/migration/post-pr360-review-gate-pr361.json','utf8')); } catch {}
            const sparsity = report?.evaluation_axes?.record_family_sparsity;
            const timeline = report?.evaluation_axes?.timeline_historical_density;
            const access = report?.evaluation_axes?.canonical_market_access_utility;
            const correction = report?.evaluation_axes?.correction_and_source_maintenance_burden;
            const body = `${marker}
            ## PR #361 post-PR #360 review gate

            - Workflow status: **${{ job.status }}**
            - Canonical assets: **${report?.current_counts?.assets ?? 'not-generated'}**
            - Current Tier A candidates: **${sparsity?.current_tier_a_candidate_count ?? 'not-generated'}**
            - Timeline events per asset: **${timeline?.events_per_asset ?? 'not-generated'}**
            - Assets without events: **${timeline?.assets_without_events ?? 'not-generated'}**
            - Market Access breadth: **${access?.asset_count ?? 'not-generated'} assets / ${access?.platform_count ?? 'not-generated'} platform / ${access?.jurisdiction_count ?? 'not-generated'} jurisdiction**
            - Archive not recorded: **${correction?.archive_not_recorded ?? 'not-generated'}**
            - Approved sequence: **PR #363 → #364 → #365 → review gate**
            - Market Access Pilot 3: **not approved**
            - Record Growth Batch 2: **not approved in this sequence**
            - New public surface: **not approved**
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
