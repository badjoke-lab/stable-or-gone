name: PR 402 Evidence Archive Review-History v6

on:
  push:
    branches:
      - pr402-evidence-archive-review-history-v6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr402-evidence-archive-review-history-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic History v6 outputs
        run: |
          set -o pipefail
          { node scripts/build-evidence-archive-review-history-v6-pr402.mjs; node scripts/build-evidence-archive-review-history-v6-pr402.mjs --check; } 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Commit generated History v6 outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/evidence-archive-review-history-manifest-v6-pr402.json \
            docs/migration/evidence-archive-review-history-audit-v6-pr402.json
          if git diff --cached --quiet; then
            echo 'PR #402 History v6 outputs already committed'
          else
            git commit -m 'Generate PR 402 Evidence archive review History v6 outputs'
            git pull --rebase origin pr402-evidence-archive-review-history-v6
            git push origin HEAD:pr402-evidence-archive-review-history-v6
          fi
      - name: Validate History v6 contract
        run: |
          set -o pipefail
          { node scripts/validate-evidence-archive-review-history-v6-pr402.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Validate canonical and release contracts
        run: |
          set -o pipefail
          { npm run validate:data; npm run validate:compat; npm run validate:final; npm run validate:release-integrity; node scripts/validate-non-ui-release-material-current.mjs; } 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Verify internal-history-only boundary
        run: |
          set -o pipefail
          {
            git diff --exit-code origin/main...HEAD -- data/ src/ public/
            git diff --exit-code origin/main...HEAD -- \
              config/evidence-archive-review-history-v5-pr397.json \
              docs/migration/evidence-archive-review-history-manifest-v5-pr397.json \
              docs/migration/evidence-archive-review-history-audit-v5-pr397.json \
              docs/migration/evidence-archive-maintenance-outcomes-pr400.json \
              docs/migration/post-pr400-review-gate-pr401.json \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
            test ! -e public/data/evidence-archive-review-history-manifest-v6-pr402.json
            test ! -e public/data/evidence-archive-review-history-audit-v6-pr402.json
            test ! -e src/pages/evidence-archive-review-history-v6.astro
          } 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Verify generated outputs are deterministic
        if: github.event_name == 'pull_request'
        run: node scripts/build-evidence-archive-review-history-v6-pr402.mjs --check 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr402-all.txt
      - name: Publish PR 402 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr402-evidence-archive-review-history-v6-status -->';
            const fs=require('fs');
            let manifest=null;
            let audit=null;
            try{manifest=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-review-history-manifest-v6-pr402.json','utf8'));}catch{}
            try{audit=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-review-history-audit-v6-pr402.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr402-all.txt','utf8').trim();}catch{}
            const counts=manifest?.counts||{};
            const body=`${marker}
            ## PR #402 Evidence Archive Review-History v6

            - Workflow: **${{ job.status }}**
            - History sources / events / identities: **${counts.history_source_count??'n/a'} / ${counts.history_event_count??'n/a'} / ${counts.reviewed_evidence_identity_count??'n/a'}**
            - Archive present / invalid / no-safe / replacement: **${counts.effective_archive_present_count??'n/a'} / ${counts.effective_archive_removed_invalid_count??'n/a'} / ${counts.effective_no_safe_change_count??'n/a'} / ${counts.effective_source_replacement_count??'n/a'}**
            - Archive recorded / not recorded: **${audit?.source_checkpoint?.archive_recorded??'n/a'} / ${audit?.source_checkpoint?.archive_not_recorded??'n/a'}**
            - Unresolved / suppressed / reactivated: **${audit?.reviewed_unresolved?.total_count??'n/a'} / ${audit?.reviewed_unresolved?.suppressed_count??'n/a'} / ${audit?.reviewed_unresolved?.reactivated_eligible_count??'n/a'}**
            - Next work item: **${audit?.decision?.next_work_item??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics (tail)</summary>

            \`\`\`text
            ${diagnostics.slice(-16000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
