name: Apply Batch E

on:
  push:
    branches:
      - batch-e-work
    paths:
      - scripts/apply-batch-e-bootstrap.mjs
      - .github/workflows/apply-batch-e.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[batch-e-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Batch E branch
        uses: actions/checkout@v4
        with:
          ref: batch-e-work
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Batch E files
        run: node scripts/apply-batch-e-bootstrap.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build
        run: npm run build

      - name: Commit clean Batch E implementation
        run: |
          rm -f package-lock.json
          rm -f data/stablecoins-batch-e-eurs.json
          rm -f data/stablecoins-batch-e-eurt.json
          rm -f data/stablecoins-batch-e-usdm.json
          rm -f data/stablecoins-batch-e-alusd.json
          rm -f scripts/apply-batch-e-bootstrap.mjs
          rm -rf scripts/batch-e-source
          rm -f .github/workflows/apply-batch-e.yml
          rm -f .github/workflows/batch-e-bootstrap-artifact.yml
          rm -f .github/workflows/batch-e-preview.yml
          rm -f .github/workflows/batch-e-source-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Batch E stable assets [batch-e-generated]"
          git push origin HEAD:batch-e-work
