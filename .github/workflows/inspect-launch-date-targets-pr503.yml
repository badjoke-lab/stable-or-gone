name: Inspect launch-date targets PR503

on:
  push:
    branches:
      - agent/launch-date-boundary-review-batch-1-implementation
    paths:
      - scripts/inspect-launch-date-targets-pr503.mjs
      - .github/workflows/inspect-launch-date-targets-pr503.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-date-boundary-review-batch-1-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Inspect canonical target records
        run: node scripts/inspect-launch-date-targets-pr503.mjs
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/launch-date-target-inspection-pr503.json
          git diff --cached --quiet && exit 0
          git commit -m "Capture PR503 launch-date target records"
          git push origin HEAD:agent/launch-date-boundary-review-batch-1-implementation
