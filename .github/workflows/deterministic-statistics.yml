name: Deterministic statistics

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Deterministic statistics maintenance is advisory and does not block publication.'
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run validate:data
      - name: Validate Registry v3 foundation
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run validate:v3
      - name: Validate Registry v3 deployment view
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run validate:deployments-v3
      - name: Validate Registry v3 income profiles
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run validate:income-v3
      - name: Generate statistics
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/build-stats.mjs
      - name: Validate statistics
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
      - name: Validate Phase 3 lifecycle quality statistics
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/validate-phase3-stats-lifecycle.mjs
      - name: Upload generated statistics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-statistics-${{ github.run_id }}
          path: artifacts/stats-current.json
          if-no-files-found: warn
