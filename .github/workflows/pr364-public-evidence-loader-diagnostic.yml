name: PR 364 Public Evidence Loader Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Collect loader sources
        shell: bash
        run: |
          mkdir -p artifacts/pr364-public-loader
          {
            echo '## matching files'
            grep -RIl --exclude-dir=node_modules --exclude-dir=.git -E 'getEvidenceSourceIdentities|deduplicateEvidenceRecords' src scripts config data 2>/dev/null || true
            echo
            echo '## matching lines'
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'getEvidenceSourceIdentities|deduplicateEvidenceRecords|evidence-pr36[0-9]|evidence-pr35[0-9]' src scripts config 2>/dev/null || true
          } > artifacts/pr364-public-loader/report.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            safe=$(echo "$file" | tr '/' '_')
            cp "$file" "artifacts/pr364-public-loader/${safe}"
          done < <(grep -RIl --exclude-dir=node_modules --exclude-dir=.git -E 'getEvidenceSourceIdentities|deduplicateEvidenceRecords' src scripts config 2>/dev/null || true)

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr364-public-evidence-loader-${{ github.run_id }}
          path: artifacts/pr364-public-loader/
          if-no-files-found: error
          retention-days: 7
