name: Apply home UI correction

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-home-ui-correction.mjs'
      - '.github/workflows/apply-home-ui-correction.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded source correction
        run: node scripts/apply-home-ui-correction.mjs
      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git commit -m "Prioritize recent records and fix mobile badges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
