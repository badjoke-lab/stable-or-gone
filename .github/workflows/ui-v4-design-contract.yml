name: UI v4 design contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'DESIGN.md'
      - 'docs/roadmap.md'
      - 'docs/ui-redesign/**'
      - 'config/ui-v4-visual-acceptance.json'
      - 'scripts/validate-ui-v4-visual-acceptance.mjs'
      - '.github/workflows/ui-v4-design-contract.yml'
  push:
    branches: [main]
    paths:
      - 'DESIGN.md'
      - 'docs/roadmap.md'
      - 'docs/ui-redesign/**'
      - 'config/ui-v4-visual-acceptance.json'
      - 'scripts/validate-ui-v4-visual-acceptance.mjs'
      - '.github/workflows/ui-v4-design-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate visual acceptance contract
        run: node scripts/validate-ui-v4-visual-acceptance.mjs
