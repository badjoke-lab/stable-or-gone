name: PR 364 Finalize Checkpoints

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Activate PR 364 authority
        run: node scripts/activate-pr364-tier-a-batch-4.mjs

      - name: Normalize finalizer manifest contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/finalize-tier-a-dossier-batch-4-pr364.mjs';
          const before=fs.readFileSync(file,'utf8');
          const from='const incomeProfiles = incomeManifest.data_groups.income_profiles.flatMap(readRows);';
          const to='const incomeProfiles = incomeManifest.data_files.flatMap(readRows);';
          if (!before.includes(from) && !before.includes(to)) throw new Error('PR #364 finalizer income manifest marker missing');
          fs.writeFileSync(file,before.replace(from,to));
          NODE

      - name: Generate PR 364 checkpoints
        id: generate
        shell: bash
        run: |
          set +e
          node scripts/finalize-tier-a-dossier-batch-4-pr364.mjs > artifacts-pr364-finalizer.txt 2>&1
          status=$?
          cat artifacts-pr364-finalizer.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Synchronize current release validators and provenance
        if: steps.generate.outputs.status == '0'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const validatorFile='scripts/validate-non-ui-release-material.mjs';
          let validator=fs.readFileSync(validatorFile,'utf8');
          validator=validator
            .replaceAll('sog_release_integrity_pr360_112_assets_2026_07_14','sog_release_integrity_pr364_112_assets_2026_07_14')
            .replaceAll('sog_evidence_correction_batch_canonical_112_checkpoint_pr360_2026_07_14','sog_tier_a_dossier_batch_4_canonical_112_checkpoint_pr364_2026_07_14')
            .replaceAll('current release-integrity baseline must remain the PR #360 canonical baseline','current release-integrity baseline must remain the PR #364 canonical baseline')
            .replaceAll('current canonical checkpoint must remain the PR #360 correction checkpoint','current canonical checkpoint must remain the PR #364 dossier checkpoint')
            .replace('currentCheckpoint.evidence_quality?.archive_not_recorded_count === 170','currentCheckpoint.evidence_quality?.archive_not_recorded_count === 172')
            .replace('current canonical checkpoint must bind 170 no-archive rows','current canonical checkpoint must bind 172 no-archive rows')
            .replace("releaseBaseline.evidence_quality?.archive_index_count === correctionOutcome.archive_index_count_after", "releaseBaseline.evidence_quality?.archive_index_count === currentCheckpoint.evidence_quality?.archive_index_count")
            .replace("releaseBaseline.evidence_quality?.archive_not_recorded_count === correctionOutcome.archive_not_recorded_count_after", "releaseBaseline.evidence_quality?.archive_not_recorded_count === currentCheckpoint.evidence_quality?.archive_not_recorded_count")
            .replace('latestSnapshot?.totals?.evidence === 557','latestSnapshot?.totals?.evidence === 559')
            .replace('stats history latest snapshot must contain 557 Evidence records','stats history latest snapshot must contain 559 Evidence records');
          fs.writeFileSync(validatorFile,validator);

          const release=JSON.parse(fs.readFileSync('docs/migration/registry-release-integrity-baseline.json','utf8'));
          const provenanceFile='data/generated/build-provenance.json';
          const provenance=JSON.parse(fs.readFileSync(provenanceFile,'utf8'));
          provenance.canonical_record_counts={
            ...release.expected_v2_counts,
            legal_profiles: release.expected_v3_counts.legal_profiles,
            stable_asset_relationships: release.expected_v3_counts.stable_asset_relationships,
            reserve_components: release.expected_v3_counts.reserve_components,
            income_profiles: release.expected_v3_counts.income_profiles
          };
          provenance.route_counts=release.expected_route_counts;
          fs.writeFileSync(provenanceFile,`${JSON.stringify(provenance,null,2)}\n`);
          NODE

      - name: Validate generated checkpoint set
        if: steps.generate.outputs.status == '0'
        id: validate
        shell: bash
        run: |
          mkdir -p artifacts/pr364-finalizer-diagnostics
          : > artifacts/pr364-finalizer-diagnostics/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            log="artifacts/pr364-finalizer-diagnostics/${name}.log"
            if "$@" >"$log" 2>&1; then
              echo "${name}: success" >> artifacts/pr364-finalizer-diagnostics/summary.txt
            else
              echo "${name}: failure" >> artifacts/pr364-finalizer-diagnostics/summary.txt
              failed=1
            fi
          }
          run_check pr364 node scripts/validate-tier-a-dossier-batch-4-pr364.mjs
          run_check active-workstream npm run validate:active-workstream
          run_check non-ui node scripts/validate-non-ui-release-material.mjs
          run_check data npm run validate:data
          run_check profiles npm run validate:profiles
          run_check evidence-relations npm run validate:evidence-relations-v2
          run_check v3 npm run validate:v3
          run_check deployments-v3 npm run validate:deployments-v3
          run_check income-v3 npm run validate:income-v3
          run_check parity npm run validate:parity
          run_check release npm run validate:release-integrity
          run_check build-stats node scripts/build-stats.mjs
          run_check validate-stats env SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
          run_check stats-history env SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Commit generated authority and checkpoints
        if: steps.generate.outputs.status == '0' && steps.validate.outputs.failed == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            AGENTS.md \
            docs/spec-governance.md \
            docs/roadmap.md \
            docs/post-351-data-growth-operating-spec.md \
            scripts/check-workstream-123.mjs \
            scripts/validate-active-workstream.mjs \
            scripts/validate-non-ui-release-material.mjs \
            scripts/finalize-tier-a-dossier-batch-4-pr364.mjs \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-v3-parity-baseline.json \
            docs/migration/registry-release-integrity-baseline.json \
            docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json \
            data/generated/build-provenance.json \
            data/stats-history.json
          if git diff --cached --quiet; then
            echo 'PR #364 authority and checkpoints are already synchronized.'
            exit 0
          fi
          git commit -m 'Finalize PR 364 dossier checkpoints and authority'
          git pull --rebase origin pr364-tier-a-dossier-batch-4
          git push origin HEAD:pr364-tier-a-dossier-batch-4

      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr364-finalizer-diagnostics-${{ github.run_id }}
          path: |
            artifacts-pr364-finalizer.txt
            artifacts/pr364-finalizer-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish finalizer status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-finalizer-status -->';
            const report=fs.existsSync('artifacts-pr364-finalizer.txt')?fs.readFileSync('artifacts-pr364-finalizer.txt','utf8').slice(-6000):'not generated';
            const dir='artifacts/pr364-finalizer-diagnostics';
            const summary=fs.existsSync(`${dir}/summary.txt`)?fs.readFileSync(`${dir}/summary.txt`,'utf8').trim():'not generated';
            const failures=[];
            if(fs.existsSync(dir)) for(const name of fs.readdirSync(dir).filter((name)=>name.endsWith('.log')).sort()) {
              const text=fs.readFileSync(`${dir}/${name}`,'utf8');
              if(text.match(/error|failed|invalid|mismatch|missing|must|expected/i)) failures.push(`### ${name}\n\n\`\`\`text\n${text.split('\n').slice(-30).join('\n').slice(-5000)}\n\`\`\``);
            }
            const body=`${marker}\n## PR #364 checkpoint finalizer\n\n- Job status: **${{ job.status }}**\n- Generator status: **${{ steps.generate.outputs.status }}**\n- Validator failure flag: **${{ steps.validate.outputs.failed }}**\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\`\n\n### Generator\n\n\`\`\`text\n${report}\n\`\`\`\n\n### Validators\n\n\`\`\`text\n${summary}\n\`\`\`\n\n${failures.join('\n\n')}`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Fail when generation or validation failed
        if: steps.generate.outputs.status != '0' || steps.validate.outputs.failed == '1'
        run: exit 1
