name: Diagnose Pages build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Cloudflare Pages build command
        run: npm run build
      - name: Verify pagination output
        run: |
          test -f dist/stablecoins/page/2/index.html
          test -f dist/events/page/2/index.html
          test -f dist/issuers/page/2/index.html
          grep -F '/stablecoins/page/2/' dist/sitemap-index.xml
          grep -F 'https://badjoke-lab.com/' dist/index.html
