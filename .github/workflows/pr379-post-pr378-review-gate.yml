name: PR 379 Post-PR 378 Review Gate

on:
  push:
    branches:
      - pr379-post-pr378-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr379-post-pr378-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Recover deterministic PR 378 outputs
        run: |
          node scripts/build-evidence-archive-maintenance-queue-v2-pr378.mjs 2>&1 | tee /tmp/pr378-recovery.txt
          node scripts/build-evidence-archive-maintenance-queue-v2-pr378.mjs --check
      - name: Generate deterministic review gate
        run: |
          node scripts/build-post-pr378-review-gate-pr379.mjs 2>&1 | tee /tmp/pr379-generation.txt
          node scripts/build-post-pr378-review-gate-pr379.mjs --check
      - name: Validate review gate authority
        run: |
          node scripts/validate-post-pr378-review-gate-pr379.mjs 2>&1 | tee /tmp/pr379-validation.txt
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify internal-review-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/evidence-archive-maintenance-queue-v2-pr378.json
          test ! -e public/data/evidence-archive-maintenance-queue-v2-pr378-delta.json
          test ! -e public/data/post-pr378-review-gate-pr379.json
          test ! -e dist/data/post-pr378-review-gate-pr379.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit recovered and generated internal outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/evidence-archive-maintenance-queue-v2-pr378.json \
            docs/migration/evidence-archive-maintenance-queue-v2-pr378-delta.json \
            docs/migration/post-pr378-review-gate-pr379.json
          if git diff --cached --quiet; then
            echo 'Internal outputs already committed'
          else
            git commit -m 'Recover PR 378 outputs and generate PR 379 review gate'
            git push origin HEAD:pr379-post-pr378-review-gate
          fi
      - name: Publish PR 379 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr379-post-pr378-review-gate-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/post-pr378-review-gate-pr379.json','utf8'));}catch{}
            let diagnostics='';
            for(const file of ['/tmp/pr378-recovery.txt','/tmp/pr379-generation.txt','/tmp/pr379-validation.txt']){
              try{diagnostics+=`${fs.readFileSync(file,'utf8').trim()}\n`;}catch{}
            }
            const sequence=report?.approved_next_sequence?.map((row)=>`PR #${row.pr} ${row.work_item}`).join(' → ')||'n/a';
            const body=`${marker}
            ## PR #379 Post-PR #378 Review Gate

            - Workflow: **${{ job.status }}**
            - Recovered missing PR #378 outputs: **2**
            - Canonical Evidence / archive recorded / not recorded: **${report?.source_checkpoint?.evidence??'n/a'} / ${report?.source_checkpoint?.archive_recorded??'n/a'} / ${report?.source_checkpoint?.archive_not_recorded??'n/a'}**
            - Fresh selected / reviewed suppressed / reactivated: **${report?.evaluation?.queue_integrity?.selected_count??'n/a'} / ${report?.evaluation?.queue_integrity?.reviewed_unresolved_suppressed_count??'n/a'} / ${report?.evaluation?.queue_integrity?.reactivated_reviewed_identity_count??'n/a'}**
            - Batch 3 decision: **${report?.decisions?.evidence_archive_maintenance_batch_3?.decision??'n/a'}**
            - Approved sequence: **${sequence}**
            - Next sequence ends at review gate: **${report?.review_gate_after_sequence??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics</summary>

            \`\`\`text
            ${diagnostics.trim().slice(0,12000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
