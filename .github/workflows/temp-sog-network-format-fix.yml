name: Temporary SOG network format fix

on:
  push:
    branches:
      - agent/sog-network-completeness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sog-network-completeness
          fetch-depth: 0

      - name: Separate current-project label
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/layouts/BaseLayout.astro')
          text = path.read_text()
          old = '<small>Current project</small>'
          new = '<small> · Current project</small>'
          if old not in text:
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit format fix
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/layouts/BaseLayout.astro
          git commit -m 'navigation: separate current project label'
          git push origin HEAD:agent/sog-network-completeness
