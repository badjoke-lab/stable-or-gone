name: Registry integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate current canonical registry integrity
        run: node scripts/validate-current-registry-integrity.mjs
      - name: Upload integrity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-integrity
          path: |
            data/generated/registry-integrity-audit.json
            docs/audits/registry-70-final-audit.md
