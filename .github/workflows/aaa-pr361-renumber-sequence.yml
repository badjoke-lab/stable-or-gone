name: AAA PR361 Renumber Sequence

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renumber:
    if: github.head_ref == 'pr361-post-pr360-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pr361-post-pr360-review-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Renumber approved sequence and rebuild report
        run: node scripts/renumber-pr361-sequence-after-duplicate.mjs

      - name: Validate review gate
        run: |
          node scripts/validate-post-pr360-review-gate-pr361.mjs
          npm run validate:active-workstream

      - name: Commit non-workflow sequence files
        run: |
          git restore .github/workflows/pr361-post-pr360-review-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/spec-governance.md docs/roadmap.md docs/quality/post-pr360-review-gate-pr361-spec.md docs/migration/post-pr360-review-gate-pr361.json scripts/validate-post-pr360-review-gate-pr361.mjs
          git commit -m 'Align post-review-gate sequence with available PR numbers'
          git pull --rebase origin pr361-post-pr360-review-gate
          git push origin HEAD:pr361-post-pr360-review-gate

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr361-renumber-artifact -->';
            const body = `${marker}
            ## PR #361 sequence repair

            - Workflow status: **${{ job.status }}**
            - Run ID: **${context.runId}**
            - Corrected non-workflow files: **PR #363 → #364 → #365 → review gate**
            - Dedicated workflow is updated separately through the GitHub connector.
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
