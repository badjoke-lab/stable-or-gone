name: AAA PR361 Renumber Sequence

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renumber:
    if: github.head_ref == 'pr361-post-pr360-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pr361-post-pr360-review-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Renumber approved sequence and rebuild report
        run: node scripts/renumber-pr361-sequence-after-duplicate.mjs

      - name: Validate review gate
        run: |
          node scripts/validate-post-pr360-review-gate-pr361.mjs
          npm run validate:active-workstream

      - name: Diagnose and apply corrected sequence
        run: |
          set +e
          LOG="$RUNNER_TEMP/pr361-git-debug.log"
          : > "$LOG"
          git config user.name 'github-actions[bot]' 2>&1 | tee -a "$LOG"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' 2>&1 | tee -a "$LOG"
          echo '--- status before add ---' | tee -a "$LOG"
          git status --short 2>&1 | tee -a "$LOG"
          git add README.md AGENTS.md docs/spec-governance.md docs/roadmap.md docs/quality/post-pr360-review-gate-pr361-spec.md docs/migration/post-pr360-review-gate-pr361.json scripts/validate-post-pr360-review-gate-pr361.mjs .github/workflows/pr361-post-pr360-review-gate.yml 2>&1 | tee -a "$LOG"
          echo "add_exit=${PIPESTATUS[0]}" | tee -a "$LOG"
          echo '--- cached diff ---' | tee -a "$LOG"
          git diff --cached --stat 2>&1 | tee -a "$LOG"
          git commit -m 'Align post-review-gate sequence with available PR numbers' 2>&1 | tee -a "$LOG"
          COMMIT_EXIT=${PIPESTATUS[0]}
          echo "commit_exit=$COMMIT_EXIT" | tee -a "$LOG"
          if [ "$COMMIT_EXIT" -eq 0 ]; then
            git pull --rebase origin pr361-post-pr360-review-gate 2>&1 | tee -a "$LOG"
            PULL_EXIT=${PIPESTATUS[0]}
            echo "pull_exit=$PULL_EXIT" | tee -a "$LOG"
            if [ "$PULL_EXIT" -eq 0 ]; then
              git push origin HEAD:pr361-post-pr360-review-gate 2>&1 | tee -a "$LOG"
              PUSH_EXIT=${PIPESTATUS[0]}
              echo "push_exit=$PUSH_EXIT" | tee -a "$LOG"
            fi
          fi
          cp "$LOG" artifacts-pr361-git-debug.log
          exit 0

      - name: Publish repair status and git diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr361-renumber-artifact -->';
            let log = 'diagnostic log unavailable';
            try { log = fs.readFileSync('artifacts-pr361-git-debug.log','utf8'); } catch {}
            if (log.length > 12000) log = log.slice(-12000);
            const body = `${marker}
            ## PR #361 sequence repair

            - Workflow status: **${{ job.status }}**
            - Run ID: **${context.runId}**
            - Corrected sequence: **PR #363 → #364 → #365 → review gate**

            \`\`\`text
            ${log}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
