name: PR 357 Tier A Dossier Batch 3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr357-tier-a-dossier-batch-3'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deterministic Batch 3 selection
        run: node scripts/validate-tier-a-dossier-batch-3-selection-pr357.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Build deterministic dossier audit
        run: node scripts/growth/build-tier-a-batch-3-current-audit-pr357.mjs artifacts/pr357/tier-a-batch-3-current-audit.json

      - name: Build deterministic dossier impact
        run: node scripts/growth/build-tier-a-batch-3-impact-pr357.mjs artifacts/pr357/tier-a-batch-3-impact.json

      - name: Validate dossier impact
        run: node scripts/validate-tier-a-dossier-batch-3-impact-pr357.mjs

      - name: Verify immutable prior outputs
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/migration/record-depth-baseline-pr353-summary.json \
            docs/migration/tier-a-candidate-queue-pr353.json \
            docs/migration/tier-a-batch-1-pr354-reviewed-handoff.json \
            docs/migration/tier-a-batch-2-pr355-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const handoff = JSON.parse(fs.readFileSync('docs/migration/market-access-pilot-1-pr356-reviewed-handoff.json', 'utf8'));
          if (handoff.source_merge_commit !== 'ff48267a54333bd05c2fae1606c7744c3d5e200d') throw new Error('PR #356 handoff merge commit mismatch');
          if (handoff.canonical_counts?.assets !== 110) throw new Error('PR #356 handoff asset count mismatch');
          if (handoff.canonical_counts?.evidence !== 551) throw new Error('PR #356 handoff Evidence count mismatch');
          if (handoff.canonical_counts?.market_access_records !== 4) throw new Error('PR #356 handoff Market Access count mismatch');
          console.log('Historical PR #353 snapshots and reviewed PR #354-#356 handoffs preserved.');
          NODE

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate profiles
        run: npm run validate:profiles

      - name: Validate Batch 3 legal profile boundaries
        run: node scripts/validate-tier-a-dossier-batch-3-legal-pr357.mjs

      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Verify PR 357 boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('config/tier-a-dossier-batch-3-pr357.json', 'utf8'));
          const checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json', 'utf8'));
          const marketAccess = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8'));
          const selected = config.selected_assets.map((row) => row.asset_slug);
          if (JSON.stringify(selected) !== JSON.stringify(['audd','fei','husd','mim','nzds'])) throw new Error('PR #357 selected set changed');
          if (checkpoint.asset_count !== 110) throw new Error('PR #357 must preserve 110 canonical assets');
          if (marketAccess.length !== 4) throw new Error('PR #357 must preserve exactly four Market Access records');
          if (config.new_canonical_assets_allowed !== false) throw new Error('New canonical assets must remain forbidden');
          if (config.market_access_records_allowed !== false) throw new Error('Market Access changes must remain forbidden');
          if (config.new_public_surface_allowed !== false) throw new Error('New public surface must remain forbidden');
          if (config.asset_rank !== false || config.single_composite_score !== false) throw new Error('Rank/score boundary changed');
          console.log('PR #357 selection and canonical/public boundaries preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify planning, outcome, and handoff files remain non-public
        run: |
          test ! -e dist/data/tier-a-batch-3-selection.json
          test ! -e dist/data/pr356-reviewed-handoff.json
          test ! -e dist/data/tier-a-batch-3-current-audit.json
          test ! -e dist/data/tier-a-batch-3-impact.json
          test ! -e dist/data/tier-a-batch-3-review-outcomes.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          for (const key of ['tier_a_batch_3_selection','pr356_reviewed_handoff','tier_a_batch_3_current_audit','tier_a_batch_3_impact','tier_a_batch_3_review_outcomes']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal PR #357 material leaked into public manifest: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #357 internal planning and review material remains outside public output.');
          NODE

      - name: Publish PR 357 validation summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr357-tier-a-batch-3-status -->';
            let impact = null;
            let stats = null;
            try { impact = JSON.parse(fs.readFileSync('artifacts/pr357/tier-a-batch-3-impact.json', 'utf8')); } catch {}
            try { stats = JSON.parse(fs.readFileSync('artifacts/stats-current.json', 'utf8')); } catch {}
            const improved = impact?.selected_assets?.filter((row) => row.changed_dimensions?.length).map((row) => row.asset_slug) ?? [];
            const unchanged = impact?.selected_assets?.filter((row) => !row.changed_dimensions?.length).map((row) => row.asset_slug) ?? [];
            const body = `${marker}
            ## PR #357 Tier A Batch 3 status

            - Workflow status: **${{ job.status }}**
            - Selected assets: **${impact?.selected_asset_count ?? 0}**
            - Canonical improvements: ${improved.length ? improved.map((slug) => `\`${slug}\``).join(', ') : 'none'}
            - Reviewed with no safe change: ${unchanged.length ? unchanged.map((slug) => `\`${slug}\``).join(', ') : 'none'}
            - Canonical assets: **${impact?.constraints?.canonical_asset_count_actual ?? 'not-generated'}**
            - Evidence: **${impact?.constraints?.canonical_evidence_count_actual ?? 'not-generated'}**
            - Market Access records: **${impact?.constraints?.market_access_record_count_actual ?? 'not-generated'}**
            - Stats model SHA-256: \`${stats?.stats_model_sha256 ?? 'not-generated'}\`
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }

      - name: Upload PR 357 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr357-tier-a-batch-3-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/pr357/
            artifacts/stats-current.json
