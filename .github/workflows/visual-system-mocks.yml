name: Visual system and mocks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate supplemental deterministic SVG package
        run: node scripts/generate-ui-mock-svgs.mjs
      - name: Validate committed visual system and mocks
        run: node scripts/validate-visual-system-mocks.mjs
      - name: Upload visual mock package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-ui-mocks-${{ github.run_id }}
          if-no-files-found: error
          path: |
            docs/ui-redesign/mocks/pr22/*.svg
            docs/ui-redesign/mocks/pr22/review.json
            data/generated/ui-mocks/*
            data/generated/visual-system-mocks-validation.json
