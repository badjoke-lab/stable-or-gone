name: Apply launch dates batch L from PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-launch-dates-batch-l-pr.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-dates-batch-l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Extract and run existing migration body
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-launch-dates-batch-l.yml').read_text()
          body = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          Path('/tmp/apply-launch-dates.py').write_text(body + '\n')
          PY
          python /tmp/apply-launch-dates.py
      - name: Regenerate audit for inspection
        run: npm run audit:integrity || true
      - name: Remove one-off files and commit
        run: |
          rm .github/workflows/apply-launch-dates-batch-l.yml
          rm .github/workflows/apply-launch-dates-batch-l-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add official RLUSD and EURC launch dates"
          git push origin HEAD:launch-dates-batch-l
