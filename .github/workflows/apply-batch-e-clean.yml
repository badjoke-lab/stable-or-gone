name: Apply clean Batch E

on:
  push:
    branches:
      - record-growth-batch-e-clean
    paths:
      - .github/workflows/apply-batch-e-clean.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'record-growth-batch-e-clean' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Batch E branch
        uses: actions/checkout@v4
        with:
          ref: record-growth-batch-e-clean
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct reviewed Batch E generator
        run: |
          set -euo pipefail
          mkdir -p scripts
          : > scripts/apply-batch-e-clean.mjs
          for file in \
            chunk-00.txt chunk-01.txt chunk-02a.txt chunk-03.txt chunk-04.txt \
            chunk-05.txt chunk-06.txt chunk-07.txt chunk-08.txt chunk-09.txt \
            chunk-10.txt chunk-11.txt chunk-12.txt chunk-13.txt chunk-14.txt \
            chunk-15.txt chunk-16.txt chunk-17.txt chunk-18.txt chunk-19.txt \
            chunk-20.txt chunk-21.txt chunk-22.txt chunk-23.txt chunk-24.txt
          do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/badjoke-lab/stable-or-gone/6858d0c2bced76cf20d190e48ddeff0db29b1389/scripts/batch-e-source/${file}" \
              >> scripts/apply-batch-e-clean.mjs
          done
          node --check scripts/apply-batch-e-clean.mjs

      - name: Generate canonical Batch E files
        run: node scripts/apply-batch-e-clean.mjs

      - name: Normalize clean branch provenance
        run: |
          sed -i 's/record-growth-batch-e/record-growth-batch-e-clean/g' docs/migration/registry-v2-baseline.json
          sed -i 's/record-growth-batch-e/record-growth-batch-e-clean/g' docs/batch-e-review.md

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate baseline
        run: npm run validate:baseline
      - name: Validate candidates
        run: npm run validate:candidates
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate classifications
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate events
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate final state
        run: npm run validate:final
      - name: Astro check
        run: npm run check
      - name: Build site
        run: npm run build:site
      - name: Verify deployment
        run: npm run verify:deployment
      - name: Verify public layer
        run: npm run verify:public

      - name: Commit clean generated implementation
        run: |
          set -euo pipefail
          rm scripts/apply-batch-e-clean.mjs
          rm .github/workflows/apply-batch-e-clean.yml
          rm -f docs/__branch_probe__.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Batch E stable assets"
          git push origin HEAD:record-growth-batch-e-clean
