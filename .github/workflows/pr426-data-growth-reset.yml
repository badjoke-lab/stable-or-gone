name: PR 426 Data Growth Reset

on:
  push:
    branches:
      - pr426-data-growth-reset
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr426-data-growth-reset-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr426-data-growth-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply reviewed authority state
        run: node scripts/apply-post-ui-v3-data-growth-reset-pr426.mjs
      - name: Validate PR 426 contract
        run: node scripts/validate-post-ui-v3-data-growth-reset-pr426.mjs
      - name: Validate active workstream and repository contracts
        run: |
          npm run validate:active-workstream
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify governance-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated authority files
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs/roadmap.md
          if git diff --cached --quiet; then
            echo 'Authority files already committed.'
          else
            git commit -m 'Apply PR 426 post-UI v3 authority state'
            git push origin HEAD:pr426-data-growth-reset
          fi
      - name: Publish PR 426 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr426-data-growth-reset-status -->';
            const fs=require('fs');
            let config=null;
            try { config=JSON.parse(fs.readFileSync('config/post-ui-v3-data-growth-reset-pr426.json','utf8')); } catch {}
            const body=`${marker}
            ## PR #426 Post-UI v3 Data-Growth Reset

            - Workflow: **${{ job.status }}**
            - Canonical assets: **${config?.source_state?.canonical_assets ?? 'n/a'}**
            - Evidence: **${config?.source_state?.evidence ?? 'n/a'}**
            - Archive recorded / not recorded: **${config?.source_state?.archive_recorded ?? 'n/a'} / ${config?.source_state?.archive_not_recorded ?? 'n/a'}**
            - UI v3 complete: **${config?.source_state?.ui_v3_complete ?? 'n/a'}**
            - Authorized next PR: **#${config?.approved_next_sequence?.[0]?.pr ?? 'n/a'}**
            - Candidate limit: **${config?.pr427_scope?.maximum_candidates ?? 'n/a'}**
            - Canonical changes authorized: **false**
            - Next boundary: **REVIEW GATE**
            - Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
