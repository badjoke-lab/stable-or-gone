name: PR 336 Comparison Readiness contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr336-comparison-readiness-contract'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity
      - name: Validate release integrity
        run: npm run validate:release-integrity
      - name: Validate Comparison Readiness contract
        run: node scripts/validate-comparison-readiness-contract-pr336.mjs
      - name: Validate active workstream
        run: npm run validate:active-workstream
      - name: Verify canonical count preservation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json','utf8'));
          if (checkpoint.asset_count !== 110) throw new Error(`Expected 110 assets, found ${checkpoint.asset_count}`);
          if (checkpoint.checkpoint_id !== 'sog_controlled_growth_110_checkpoint_pr335_2026_07_09') throw new Error('Unexpected checkpoint');
          console.log('Canonical 110-asset checkpoint preserved.');
          NODE
