name: Manual Production Smoke Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-production-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Check deliberately deployed production
        run: npm run check:production
