name: Apply Phase D reviewed logo decisions

on:
  pull_request:
    paths:
      - '.github/workflows/phase-d-logo-source-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ledger:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace only the three reviewed decision objects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'config/stablecoin-logo-decisions.json';
          let text = fs.readFileSync(path, 'utf8');

          const replacements = {
            mnee: {
              slug: 'mnee',
              name: 'MNEE',
              symbol: 'MNEE',
              decision: 'accepted_local_mark',
              mark_type: 'official_product_mark',
              asset_path: '/stablecoin-logos/mnee.svg',
              source_page: 'https://www.mnee.io/',
              source_asset_url: 'https://www.mnee.io/mnee.svg',
              source_class: 'official_product_page_asset',
              identity_basis: "The official MNEE stablecoin homepage directly labels the linked asset as 'MNEE Logo'.",
              evidence: 'Phase D revalidated the first-party MNEE product mark and vendored the exact SVG. The prior PR #498 issuer-level fallback is no longer used for display.',
              transformation: 'vendored without artwork changes'
            },
            usdgo: {
              slug: 'usdgo',
              name: 'USDGO',
              symbol: 'USDGO',
              decision: 'accepted_local_mark',
              mark_type: 'official_product_mark',
              asset_path: '/stablecoin-logos/usdgo.svg',
              source_page: 'https://www.usdgo.com/',
              source_asset_url: 'https://www.usdgo.com/',
              source_class: 'official_product_homepage_inline_svg',
              identity_basis: "The first-party USDGO homepage renders this compact SVG as its header logo; the same mark appears in OSL's official USDGO listing artwork.",
              evidence: "Phase D direct inspection rejected the Phase-B Anchorage 'USDGO' illustration as unsuitable for a compact mark and substituted the current first-party USDGO homepage inline logo for the same already-approved slug.",
              transformation: 'extracted inline SVG without artwork changes'
            },
            usr: {
              slug: 'usr',
              name: 'Resolv USD',
              symbol: 'USR',
              decision: 'accepted_local_mark',
              mark_type: 'token_logo',
              asset_path: '/stablecoin-logos/usr.png',
              source_page: 'https://resolv.xyz/brand-kit',
              source_asset_url: 'https://framerusercontent.com/images/jr6pCURt19DV9uNMz7A80qtO8c.png?height=256&width=256',
              source_class: 'official_brand_kit_token_asset',
              identity_basis: "Resolv's official Brand Kit separates RLP, USR, stUSR, wstUSR, RESOLV and stRESOLV and provides this image directly under USR.",
              evidence: 'Phase D replaces the previously retained generic Resolv project mark with the dedicated USR token asset reviewed in the official Brand Kit.',
              transformation: 'vendored without artwork changes'
            }
          };

          function renderRecord(record, trailingComma) {
            const json = JSON.stringify(record, null, 2)
              .split('\n')
              .map((line) => `    ${line}`)
              .join('\n');
            return trailingComma ? `${json},` : json;
          }

          function replaceSlugRecord(input, slug, record) {
            const marker = `"slug": "${slug}"`;
            const markerIndex = input.indexOf(marker);
            if (markerIndex < 0) throw new Error(`Missing decision record for ${slug}`);
            const start = input.lastIndexOf('    {', markerIndex);
            if (start < 0) throw new Error(`Cannot find object start for ${slug}`);

            const commaEnd = input.indexOf('\n    },', markerIndex);
            const arrayEnd = input.indexOf('\n    }\n  ]', markerIndex);
            const useComma = commaEnd >= 0 && (arrayEnd < 0 || commaEnd < arrayEnd);
            const end = useComma ? commaEnd + '\n    },'.length : arrayEnd + '\n    }'.length;
            if (end <= start) throw new Error(`Cannot find object end for ${slug}`);

            const existing = input.slice(start, end);
            const parsed = JSON.parse(existing.replace(/,$/, '').trim());
            if (parsed.slug !== slug) throw new Error(`Boundary mismatch for ${slug}`);
            return input.slice(0, start) + renderRecord(record, useComma) + input.slice(end);
          }

          for (const [slug, record] of Object.entries(replacements)) {
            text = replaceSlugRecord(text, slug, record);
          }

          JSON.parse(text);
          fs.writeFileSync(path, text);
          NODE

          git diff --check
          git diff -- config/stablecoin-logo-decisions.json

      - name: Commit targeted decision update when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/stablecoin-logo-decisions.json; then
            echo 'Decision ledger already matches Phase D.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/stablecoin-logo-decisions.json
          git commit -m 'Record Phase D reviewed Stablecoin marks'
          git push origin HEAD:${{ github.head_ref }}
