name: UI production visual closure

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full deployed main commit SHA
        required: true
        type: string
      expected_primary_records:
        description: Expected canonical stablecoin count
        required: true
        default: '100'
        type: string
      visual_approval_ref:
        description: Owner-approved screenshot artifact run or review reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ui-production-visual-closure
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOG_BASE_URL: https://sog.badjoke-lab.com
      SOG_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      SOG_EXPECTED_PRIMARY_RECORDS: ${{ inputs.expected_primary_records }}
      SOG_VISUAL_APPROVAL_REF: ${{ inputs.visual_approval_ref }}
      SOG_OWNER_APPROVAL_REF: ${{ inputs.visual_approval_ref }}
    steps:
      - name: Checkout exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate closure contract
        run: node scripts/validate-ui-v3-production-closure.mjs

      - name: Verify exact production parity
        env:
          SOG_SMOKE_ATTEMPTS: '40'
          SOG_SMOKE_DELAY_MS: '15000'
          SOG_PARITY_CONCURRENCY: '12'
        run: npm run check:production

      - name: Capture production desktop representatives
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode representative --base-url "$SOG_BASE_URL"

      - name: Capture production mobile representatives
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode representative --base-url "$SOG_BASE_URL"

      - name: Audit production representatives
        run: node scripts/audit-representative-visuals.mjs

      - name: Require rendered audit output
        run: test -f artifacts/screenshots/representative-visual-audit.json

      - name: Write owner-approved production closure report
        run: node scripts/write-ui-v3-production-closure-report.mjs

      - name: Upload production closure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-production-visual-closure-${{ inputs.expected_commit }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/ui-v3-production-closure-validation.json
            artifacts/ui-v3-production-closure.json
            artifacts/ui-v3-production-closure.md
            artifacts/screenshots/**
            artifacts/screenshots-desktop.zip
            artifacts/screenshots-mobile.zip
