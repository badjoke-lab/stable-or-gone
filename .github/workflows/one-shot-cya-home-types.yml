name: One-shot CYA home type repair

on:
  push:
    branches:
      - fix/cya-structure-dark-port

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cya-structure-dark-port
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: node scripts/apply-cya-home-script-types.mjs
      - run: git rm scripts/apply-cya-home-script-types.mjs .github/workflows/one-shot-cya-home-types.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/index.astro
          git commit -m "Type CYA homepage registry controls"
          git push origin HEAD:fix/cya-structure-dark-port
