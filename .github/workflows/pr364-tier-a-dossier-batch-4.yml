name: PR 364 Tier A Dossier Batch 4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate PR 364 dossier findings and boundaries
        run: node scripts/validate-tier-a-dossier-batch-4-pr364.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Validate non-UI release material
        run: node scripts/validate-non-ui-release-material.mjs

      - name: Verify immutable planning and prior handoff outputs
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/migration/record-depth-baseline-pr353-summary.json \
            docs/migration/tier-a-candidate-queue-pr353.json \
            docs/migration/record-depth-baseline-pr363-summary.json \
            docs/migration/record-depth-baseline-pr363-delta.json \
            docs/migration/tier-a-candidate-queue-pr363.json \
            docs/migration/tier-a-batch-1-pr354-reviewed-handoff.json \
            docs/migration/tier-a-batch-2-pr355-reviewed-handoff.json \
            docs/migration/tier-a-batch-3-pr357-reviewed-handoff.json
          echo 'Historical planning checkpoints and prior dossier handoffs preserved.'

      - name: Verify prohibited canonical and public families are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- \
            data/stablecoins*.json \
            data/market-access-records-v1.json \
            data/deployments*.json \
            data/reserve-reports*.json \
            data/reserve-components*.json \
            data/income-profiles*.json \
            src/
          echo 'PR #364 adds no asset, Market Access record, deployment, reserve report/component, income profile, or public application source.'

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate profiles
        run: npm run validate:profiles

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Evidence integrity
        run: node scripts/validate-registry-evidence-integrity-audit.mjs

      - name: Validate organization and relationship integrity
        run: node scripts/validate-registry-organization-relationship-audit.mjs

      - name: Validate lifecycle boundary
        run: node scripts/run-registry-lifecycle-boundary-audit.mjs

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Verify PR 364 current checkpoints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const canonical=JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json','utf8'));
          const historyCheckpoint=JSON.parse(fs.readFileSync('docs/migration/current-stats-history-checkpoint.json','utf8'));
          const handoff=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json','utf8'));
          const history=JSON.parse(fs.readFileSync('data/stats-history.json','utf8'));
          if(canonical.checkpoint_id!=='sog_tier_a_dossier_batch_4_canonical_112_checkpoint_pr364_2026_07_14') throw new Error('PR #364 canonical checkpoint ID mismatch');
          if(historyCheckpoint.checkpoint_id!=='sog_tier_a_dossier_batch_4_112_checkpoint_pr364_2026_07_14') throw new Error('PR #364 history checkpoint ID mismatch');
          if(canonical.expected_counts?.assets!==112 || canonical.expected_counts?.evidence!==559) throw new Error('PR #364 canonical checkpoint count mismatch');
          if(canonical.evidence_quality?.archive_index_count!==387 || canonical.evidence_quality?.archive_not_recorded_count!==172) throw new Error('PR #364 archive boundary mismatch');
          if(JSON.stringify(handoff.canonical_improvement_asset_slugs)!==JSON.stringify(['usdg','usds'])) throw new Error('PR #364 improvement set mismatch');
          if(JSON.stringify(handoff.reviewed_no_safe_change_asset_slugs)!==JSON.stringify(['husd','poundtoken','rlusd'])) throw new Error('PR #364 no-safe-change set mismatch');
          const latest=history.snapshots.at(-1);
          if(latest?.checkpoint_id!==historyCheckpoint.checkpoint_id || latest?.canonical_checkpoint_id!==canonical.checkpoint_id) throw new Error('PR #364 stats history binding mismatch');
          if(latest?.totals?.organizations!==107 || latest?.totals?.relationships!==124 || latest?.totals?.evidence!==559) throw new Error('PR #364 stats history totals mismatch');
          console.log('PR #364 current checkpoints and handoff preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify PR 364 internal files remain non-public
        run: |
          test ! -e dist/data/tier-a-dossier-batch-4-pr364-review-queue.json
          test ! -e dist/data/tier-a-dossier-batch-4-pr364-findings.json
          test ! -e dist/data/tier-a-batch-4-pr364-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('dist/data/manifest.json','utf8'));
          for(const key of ['tier_a_dossier_batch_4_pr364_review_queue','tier_a_dossier_batch_4_pr364_findings','tier_a_batch_4_pr364_reviewed_handoff']) {
            if(manifest.public_files?.[key]) throw new Error(`Internal PR #364 material leaked: ${key}`);
          }
          if(manifest.data_safety?.canonical_only!==true) throw new Error('canonical-only boundary changed');
          if(manifest.data_safety?.includes_unreviewed_candidates!==false) throw new Error('candidate publication boundary changed');
          if(manifest.data_safety?.includes_internal_monitoring!==false) throw new Error('monitoring publication boundary changed');
          console.log('PR #364 planning and review material remains non-public.');
          NODE

      - name: Publish PR 364 validation summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-tier-a-batch-4-status -->';
            let findings=null,handoff=null,stats=null;
            try{findings=JSON.parse(fs.readFileSync('docs/migration/tier-a-dossier-batch-4-pr364-findings.json','utf8'));}catch{}
            try{handoff=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json','utf8'));}catch{}
            try{stats=JSON.parse(fs.readFileSync('artifacts/stats-current.json','utf8'));}catch{}
            const changed=findings?.findings?.filter((row)=>row.decision==='canonical_change_applied').map((row)=>row.asset_slug)??[];
            const unchanged=findings?.findings?.filter((row)=>row.decision==='reviewed_no_safe_change').map((row)=>row.asset_slug)??[];
            const body=`${marker}\n## PR #364 Tier A Batch 4 status\n\n- Workflow status: **${{ job.status }}**\n- Selected assets: **${findings?.selected_asset_count??0}**\n- Canonical improvements: **${changed.join(', ')||'none'}**\n- Reviewed no-safe-change: **${unchanged.join(', ')||'none'}**\n- Canonical assets: **${handoff?.canonical_counts?.assets??'not-generated'}**\n- Organizations: **${handoff?.canonical_counts?.organizations??'not-generated'}**\n- Relationships: **${handoff?.canonical_counts?.relationships??'not-generated'}**\n- Evidence: **${handoff?.canonical_counts?.evidence??'not-generated'}**\n- Archive recorded / not recorded: **${handoff?.evidence_quality?.archive_recorded??'not-generated'} / ${handoff?.evidence_quality?.archive_not_recorded??'not-generated'}**\n- Stats model SHA-256: \`${stats?.stats_model_sha256??handoff?.stats_model_sha256??'not-generated'}\`\n- Stats snapshot SHA-256: \`${handoff?.stats_snapshot_sha256??'not-generated'}\`\n- Next work item: **PR #365 Evidence and Archive Maintenance Batch 2**\n- Head: \`${context.sha}\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
