name: Monitoring lifecycle regulatory market access expansion

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate historical PR 321 synchronization checkpoint
        run: node scripts/validate-monitoring-baseline-sync-100-assets.mjs
      - name: Validate historical PR 322 expansion checkpoint
        run: node scripts/validate-monitoring-reserve-redemption-expansion-100-assets.mjs
      - name: Validate scoped source schema
        run: node scripts/validate-monitoring-scoped-source-schema-pr323.mjs
      - name: Validate current monitoring configuration
        run: node scripts/validate-current-monitoring-configuration.mjs
      - name: Validate current monitoring coverage
        run: node scripts/validate-current-coverage.mjs
      - name: Validate PR 323 scoped expansion snapshot
        run: node scripts/validate-monitoring-lifecycle-regulatory-market-access-expansion-100-assets.mjs
      - name: Validate full monitoring chain
        run: npm run validate:monitoring
