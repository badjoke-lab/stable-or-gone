name: AAA PR360 Apply Corrections

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: github.head_ref == 'pr360-evidence-correction-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr360-evidence-correction-batch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply reviewed Evidence corrections
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-evidence-corrections-pr360.mjs 2>&1 | tee pr360-apply.log
      - name: Validate canonical data after correction
        run: npm run validate:data
      - name: Commit reviewed corrections
        run: |
          if git diff --quiet; then
            echo 'PR #360 corrections already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs/migration/evidence-correction-outcomes-pr360.json
          git commit -m 'Apply reviewed PR 360 Evidence archive corrections'
          git push origin HEAD:pr360-evidence-correction-batch
      - name: Publish apply result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr360-apply-corrections -->';
            let log = '';
            let outcomes = null;
            try { log = fs.readFileSync('pr360-apply.log','utf8'); } catch {}
            try { outcomes = JSON.parse(fs.readFileSync('docs/migration/evidence-correction-outcomes-pr360.json','utf8')); } catch {}
            const tail = log.split('\n').slice(-40).join('\n');
            const body = `${marker}
            ## PR #360 correction application

            - Workflow status: **${{ job.status }}**
            - Corrected Evidence: **${outcomes?.changed_count ?? 0}**
            - Reviewed with no safe change: **${outcomes?.reviewed_no_change_count ?? 0}**
            - Archive indexes after: **${outcomes?.archive_index_count_after ?? 'not-generated'}**
            - Archive not recorded after: **${outcomes?.archive_not_recorded_count_after ?? 'not-generated'}**

            \`\`\`text
            ${tail || '(no apply log)'}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr360-apply-corrections-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            pr360-apply.log
            docs/migration/evidence-correction-outcomes-pr360.json
