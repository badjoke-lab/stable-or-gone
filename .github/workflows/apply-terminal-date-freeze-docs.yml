name: Finalize terminal date docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-historical-terminal-dates
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-terminal-date-freeze-docs.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate terminal queue
        run: |
          set -o pipefail
          npm run validate:terminal-queue 2>&1 | tee terminal-queue-validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-queue-validation
          path: terminal-queue-validation.log
          retention-days: 1
      - run: npm run build
      - run: |
          rm scripts/apply-terminal-date-freeze-docs.mjs
          rm .github/workflows/apply-terminal-date-freeze-docs.yml
          rm -f terminal-queue-validation.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize historical terminal date freeze"
          git push origin HEAD:freeze-historical-terminal-dates
