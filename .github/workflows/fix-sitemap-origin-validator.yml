name: Fix sitemap origin validator

on:
  push:
    branches:
      - agent/official-domain-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sog-sitemap-origin-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/official-domain-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-domain-migration
          fetch-depth: 0

      - name: Replace escaped legacy sitemap hosts
        shell: python
        run: |
          from pathlib import Path

          old = ''.join(['sog', r'\.', 'badjoke-lab', r'\.', 'com'])
          new = ''.join(['www', r'\.', 'stableorgone', r'\.', 'com'])
          files = [
              Path('scripts/verify-public-consistency.mjs'),
              Path('scripts/verify-full-output-parity.mjs'),
          ]
          changed = 0
          for path in files:
              text = path.read_text()
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed += 1
          if changed != len(files):
              raise SystemExit(f'expected to update {len(files)} files, updated {changed}')

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate official origin
        run: npm run validate:public-origin

      - name: Build and verify public consistency
        run: |
          npm run build:site
          npm run verify:consistency
          npm run verify:full-parity
          npm run verify:deployment
          npm run verify:public

      - name: Commit sitemap validator fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/verify-public-consistency.mjs \
            scripts/verify-full-output-parity.mjs
          git commit -m "Fix official-domain sitemap consistency checks"
          git push origin HEAD:agent/official-domain-migration
