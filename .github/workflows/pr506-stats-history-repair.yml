name: Repair PR506 immutable stats snapshot
run-name: Repair PR506 stats history · ${{ github.sha }}

on:
  push:
    branches:
      - agent/evidence-archive-payload-verification-batch-1-implementation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr506-stats-history
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/evidence-archive-payload-verification-batch-1-implementation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate current immutable snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { generateCurrentHistorySnapshot } from './scripts/stats/build-history-snapshot.mjs';
          const path = 'data/stats-history.json';
          const history = JSON.parse(fs.readFileSync(path, 'utf8'));
          const snapshot = generateCurrentHistorySnapshot({ root: process.cwd() });
          history.snapshots = [
            ...(history.snapshots ?? []).filter((row) => row.checkpoint_id !== snapshot.checkpoint_id),
            snapshot
          ];
          fs.writeFileSync(path, `${JSON.stringify(history, null, 2)}\n`);
          console.log(JSON.stringify({
            checkpoint_id: snapshot.checkpoint_id,
            checkpoint_kind: snapshot.checkpoint_kind,
            source_checkpoint_id: snapshot.source_checkpoint_id,
            snapshot_sha256: snapshot.snapshot_sha256
          }, null, 2));
          NODE

      - name: Validate immutable history
        run: node scripts/validate-stats-history.mjs

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr506-stats-history-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats-history.json .github/workflows/pr506-stats-history-repair.yml
          git commit -m 'Regenerate PR506 immutable statistics snapshot'
          git push origin HEAD:agent/evidence-archive-payload-verification-batch-1-implementation
