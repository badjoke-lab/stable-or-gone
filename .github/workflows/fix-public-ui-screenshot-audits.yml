name: Fix public UI screenshot audits

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/styles/public-ui.css'
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/validate-exhaustive-screenshot-audit.mjs'
      - 'scripts/apply-pr470-width-fix.mjs'
      - '.github/workflows/fix-public-ui-screenshot-audits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Apply screenshot-width and containment migration
        run: node scripts/apply-pr470-width-fix.mjs

      - name: Commit bounded UI audit and containment migration
        shell: bash
        run: |
          TARGETS=(
            src/styles/public-ui.css
            scripts/capture-site-screenshots.mjs
            scripts/validate-exhaustive-screenshot-audit.mjs
          )
          if git diff --quiet -- "${TARGETS[@]}"; then
            echo 'Screenshot-width and containment contracts already match the public UI authority.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGETS[@]}"
          git commit -m 'Block full-page width overflow and contain public tables'
          git push origin HEAD:agent/full-ui-contract-remediation
