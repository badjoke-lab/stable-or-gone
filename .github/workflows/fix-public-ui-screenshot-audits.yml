name: Fix public UI screenshot audits

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/fix-public-ui-screenshot-audits.mjs'
      - '.github/workflows/fix-public-ui-screenshot-audits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Update screenshot audit contracts
        run: node scripts/fix-public-ui-screenshot-audits.mjs

      - name: Commit bounded audit migration
        shell: bash
        run: |
          if git diff --quiet -- scripts/audit-ui-readability.mjs scripts/audit-ui-color-system.mjs; then
            echo 'Screenshot audits already match the public UI authority.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-ui-readability.mjs scripts/audit-ui-color-system.mjs
          git commit -m 'Align screenshot audits with the single public UI authority'
          git push origin HEAD:agent/full-ui-contract-remediation
