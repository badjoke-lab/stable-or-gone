name: One-time dossier hero ownership repair

on:
  push:
    branches: [ui/stablecoin-dossier-pr27]
    paths:
      - .github/workflows/repair-dossier-hero-ownership.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stablecoin-dossier-pr27
      - name: Assign hero definition terms
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('config/stablecoin-dossier-hierarchy.mjs')
          text = path.read_text()
          anchor = "export const fieldSectionOverrides = Object.freeze({\n"
          addition = """  'src/components/StablecoinDetailView.astro|embedded|Lifecycle': 'identity_current_state',
            'src/components/StablecoinDetailView.astro|embedded|Issuance': 'identity_current_state',
            'src/components/StablecoinDetailView.astro|embedded|Events': 'history',
            'src/components/StablecoinDetailView.astro|embedded|Sources': 'evidence',
          """
          if addition.strip() in text:
              raise SystemExit('Hero ownership assignments already exist')
          if anchor not in text:
              raise SystemExit('fieldSectionOverrides anchor not found')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY
      - name: Remove workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-dossier-hero-ownership.yml
          git add config/stablecoin-dossier-hierarchy.mjs
          git commit -m 'Assign dossier hero field ownership'
          git push origin HEAD:ui/stablecoin-dossier-pr27
