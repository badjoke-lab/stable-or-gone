name: Apply SOG legacy hostname 301

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-legacy-domain-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sog-legacy-host-redirect
  cancel-in-progress: false

env:
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_ZONE_NAME: badjoke-lab.com
  LEGACY_HOST: sog.badjoke-lab.com
  CANONICAL_ORIGIN: https://www.stableorgone.com
  RULE_REF: sog_legacy_host_to_stableorgone
  RULE_PHASE: http_request_dynamic_redirect

jobs:
  apply-and-verify:
    name: Apply exact legacy-host 301 and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout migration audit
        uses: actions/checkout@v4

      - name: Resolve Cloudflare zone
        id: zone
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is unavailable.' >&2; exit 1; }

          curl -sS \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${CF_API_BASE}/zones?name=${CF_ZONE_NAME}&status=active&per_page=50" \
            -o /tmp/cf-zone.json

          jq -e '.success == true' /tmp/cf-zone.json >/dev/null || {
            jq '{success, errors, messages}' /tmp/cf-zone.json >&2
            exit 1
          }

          ZONE_ID="$(jq -r --arg zone "$CF_ZONE_NAME" '[.result[] | select(.name == $zone)] | if length == 1 then .[0].id else empty end' /tmp/cf-zone.json)"
          test -n "$ZONE_ID" || { echo "Could not resolve exactly one active zone for ${CF_ZONE_NAME}." >&2; exit 1; }
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare zone ${CF_ZONE_NAME}."

      - name: Add idempotent redirect rule
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail

          MATCH_EXPR='(http.host eq "sog.badjoke-lab.com")'
          TARGET_EXPR='concat("https://www.stableorgone.com", http.request.uri.path)'

          jq -n \
            --arg ref "$RULE_REF" \
            --arg expr "$MATCH_EXPR" \
            --arg target "$TARGET_EXPR" \
            '{
              action: "redirect",
              action_parameters: {
                from_value: {
                  target_url: {expression: $target},
                  status_code: 301,
                  preserve_query_string: true
                }
              },
              expression: $expr,
              description: "Permanent SOG migration: legacy host to canonical stableorgone.com with path and query preserved",
              enabled: true,
              ref: $ref
            }' > /tmp/sog-rule.json

          ENTRYPOINT_URL="${CF_API_BASE}/zones/${ZONE_ID}/rulesets/phases/${RULE_PHASE}/entrypoint"
          HTTP_CODE="$(curl -sS \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --output /tmp/cf-entrypoint.json \
            --write-out '%{http_code}' \
            "$ENTRYPOINT_URL")"

          if [ "$HTTP_CODE" = '200' ]; then
            jq -e '.success == true' /tmp/cf-entrypoint.json >/dev/null || {
              jq '{success, errors, messages}' /tmp/cf-entrypoint.json >&2
              exit 1
            }

            RULESET_ID="$(jq -r '.result.id' /tmp/cf-entrypoint.json)"
            EXISTING_COUNT="$(jq -r --arg ref "$RULE_REF" '[.result.rules[]? | select(.ref == $ref)] | length' /tmp/cf-entrypoint.json)"

            if [ "$EXISTING_COUNT" -gt 1 ]; then
              echo "More than one ${RULE_REF} rule exists; refusing to mutate." >&2
              exit 1
            fi

            if [ "$EXISTING_COUNT" -eq 1 ]; then
              jq -e \
                --arg ref "$RULE_REF" \
                --arg expr "$MATCH_EXPR" \
                --arg target "$TARGET_EXPR" '
                  [.result.rules[] | select(.ref == $ref)][0] as $r |
                  $r.action == "redirect" and
                  $r.expression == $expr and
                  $r.action_parameters.from_value.target_url.expression == $target and
                  $r.action_parameters.from_value.status_code == 301 and
                  $r.action_parameters.from_value.preserve_query_string == true and
                  ($r.enabled != false)
                ' /tmp/cf-entrypoint.json >/dev/null || {
                  echo "An existing ${RULE_REF} rule differs from the required migration contract; refusing to overwrite it." >&2
                  jq --arg ref "$RULE_REF" '.result.rules[] | select(.ref == $ref)' /tmp/cf-entrypoint.json >&2
                  exit 1
                }
              echo 'Exact redirect rule already exists; no Cloudflare mutation required.'
            else
              curl -sS \
                --request POST \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data-binary @/tmp/sog-rule.json \
                "${CF_API_BASE}/zones/${ZONE_ID}/rulesets/${RULESET_ID}/rules" \
                -o /tmp/cf-mutation.json
              jq -e '.success == true' /tmp/cf-mutation.json >/dev/null || {
                jq '{success, errors, messages}' /tmp/cf-mutation.json >&2
                exit 1
              }
              echo 'Added SOG redirect rule to the existing dynamic-redirect entry point.'
            fi

          elif [ "$HTTP_CODE" = '404' ]; then
            jq -n \
              --slurpfile rule /tmp/sog-rule.json \
              '{
                name: "Redirect rules ruleset",
                kind: "zone",
                phase: "http_request_dynamic_redirect",
                description: "Zone-level URL redirects",
                rules: $rule
              }' > /tmp/sog-ruleset.json

            curl -sS \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/sog-ruleset.json \
              "${CF_API_BASE}/zones/${ZONE_ID}/rulesets" \
              -o /tmp/cf-mutation.json
            jq -e '.success == true' /tmp/cf-mutation.json >/dev/null || {
              jq '{success, errors, messages}' /tmp/cf-mutation.json >&2
              exit 1
            }
            echo 'Created the dynamic-redirect entry point with the SOG migration rule.'

          else
            echo "Unexpected Cloudflare entrypoint response: HTTP ${HTTP_CODE}" >&2
            jq '{success, errors, messages}' /tmp/cf-entrypoint.json >&2 || cat /tmp/cf-entrypoint.json >&2
            exit 1
          fi

      - name: Verify Cloudflare rule definition
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          MATCH_EXPR='(http.host eq "sog.badjoke-lab.com")'
          TARGET_EXPR='concat("https://www.stableorgone.com", http.request.uri.path)'

          curl -sS \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${CF_API_BASE}/zones/${ZONE_ID}/rulesets/phases/${RULE_PHASE}/entrypoint" \
            -o /tmp/cf-final.json

          jq -e \
            --arg ref "$RULE_REF" \
            --arg expr "$MATCH_EXPR" \
            --arg target "$TARGET_EXPR" '
              .success == true and
              ([.result.rules[]? | select(
                .ref == $ref and
                .action == "redirect" and
                .expression == $expr and
                .action_parameters.from_value.target_url.expression == $target and
                .action_parameters.from_value.status_code == 301 and
                .action_parameters.from_value.preserve_query_string == true and
                (.enabled != false)
              )] | length) == 1
            ' /tmp/cf-final.json >/dev/null

          jq --arg ref "$RULE_REF" '{ruleset_id: .result.id, phase: .result.phase, rule: ([.result.rules[] | select(.ref == $ref)][0] | {id, ref, action, expression, action_parameters, enabled, description})}' /tmp/cf-final.json > cloudflare-sog-redirect-result.json
          echo 'Cloudflare rule definition matches the exact migration contract.'

      - name: Verify all legacy probes as exact 301 redirects
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Strict legacy-host verification attempt ${attempt}/12"
            if node scripts/audit-domain-migration.mjs --strict; then
              exit 0
            fi
            sleep 5
          done
          echo 'Legacy-host redirects did not converge to the strict 301 contract.' >&2
          exit 1

      - name: Write completion summary
        if: success()
        shell: bash
        run: |
          {
            echo '## SOG legacy-domain migration complete'
            echo
            echo '- Legacy host: `sog.badjoke-lab.com`'
            echo '- Canonical origin: `https://www.stableorgone.com`'
            echo '- Status: `301`'
            echo '- Path preservation: enabled'
            echo '- Query-string preservation: enabled'
            echo '- Strict repository audit: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-cloudflare-legacy-301-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cloudflare-sog-redirect-result.json
            artifacts/domain-migration-audit/**
