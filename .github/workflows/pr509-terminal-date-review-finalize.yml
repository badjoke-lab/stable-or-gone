name: Finalize PR509 terminal-date review

on:
  push:
    branches:
      - agent/terminal-date-boundary-review-batch-1-implementation
    paths:
      - scripts/extract-pr509-terminal-review-source.py
      - .github/workflows/pr509-terminal-date-review-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/terminal-date-boundary-review-batch-1-implementation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate reviewed PR509 implementation
        run: python scripts/extract-pr509-terminal-review-source.py

      - name: Validate reviewed implementation
        run: node scripts/validate-active-workstream.mjs

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalized changes to commit"
            exit 0
          fi
          git commit -m "Review terminal date boundaries for FEI NEAR USN and ESD"
          git push origin HEAD:agent/terminal-date-boundary-review-batch-1-implementation
