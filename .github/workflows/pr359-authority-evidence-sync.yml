name: PR 359 Authority and Evidence Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'pr359-market-access-pilot-2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 359 branch
        uses: actions/checkout@v4
        with:
          ref: pr359-market-access-pilot-2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Synchronize authority and Evidence scope
        run: node scripts/activate-pr359-authority-and-evidence.mjs

      - name: Commit synchronized authority and Evidence
        run: |
          if git diff --quiet; then
            echo 'PR #359 authority and Evidence already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/evidence-batch-n.json \
            data/evidence-pr356-market-access-pilot-1.json \
            README.md \
            AGENTS.md \
            docs/spec-governance.md \
            docs/roadmap.md
          git commit -m 'Activate PR 359 authority and Evidence scope'
          git push origin HEAD:pr359-market-access-pilot-2
