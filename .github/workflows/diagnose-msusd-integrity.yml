name: Diagnose msUSD integrity

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'add-mainstreet-msusd-impaired-incident'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Wire Batch N and baselines locally
        run: node scripts/finalize-msusd-emergency.mjs
      - name: Install dependencies
        run: npm install
      - name: Run integrity audit
        continue-on-error: true
        run: npm run audit:integrity
      - name: Collect reports
        if: always()
        run: |
          mkdir -p /tmp/msusd-diagnostics
          cp data/generated/registry-integrity-audit.json /tmp/msusd-diagnostics/
          cp docs/audits/registry-70-final-audit.md /tmp/msusd-diagnostics/
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msusd-integrity-full-report
          path: /tmp/msusd-diagnostics
