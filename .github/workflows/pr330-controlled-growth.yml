name: PR 330 controlled growth

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate candidate controls
        run: npm run validate:candidates
      - name: Validate Registry v3 parity suite
        run: npm run validate:parity-suite
      - name: Validate PR 330 growth contract
        run: node scripts/validate-batch22-growth-e.mjs
      - name: Validate deterministic statistics
        run: node scripts/validate-stats.mjs
      - name: Generate reviewed 102-asset snapshot candidate
        run: |
          mkdir -p artifacts
          node scripts/stats/build-history-snapshot.mjs > artifacts/pr330-102-snapshot.json
          cat artifacts/pr330-102-snapshot.json
      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs
      - name: Validate active workstream
        run: npm run validate:active-workstream
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build:site
      - name: Upload growth validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr330-controlled-growth-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/pr330-102-snapshot.json
            artifacts/stats-history-validation.json
