name: PR 334 controlled growth

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr334-growth-cadc-zarp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate candidate controls
        run: npm run validate:candidates
      - name: Validate Registry v3 foundation
        run: npm run validate:v3
      - name: Validate Registry v3 deployments
        run: npm run validate:deployments-v3
      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3
      - name: Validate Registry v3 migration audit
        run: npm run validate:migration-v3
      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity
      - name: Validate release integrity
        run: npm run validate:release-integrity
      - name: Validate reproducible build contract
        run: npm run validate:reproducible-build
      - name: Validate PR 334 growth contract
        run: node scripts/validate-batch25-growth-h.mjs
      - name: Validate deterministic statistics
        run: node scripts/validate-stats.mjs
      - name: Generate reviewed 108-asset snapshot candidate
        run: |
          mkdir -p artifacts
          node scripts/stats/build-history-snapshot.mjs > artifacts/pr334-108-snapshot.json
          cat artifacts/pr334-108-snapshot.json
      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs
      - name: Validate active workstream
        run: npm run validate:active-workstream
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build:site
      - name: Upload growth validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr334-controlled-growth-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/pr334-108-snapshot.json
            artifacts/stats-history-validation.json
