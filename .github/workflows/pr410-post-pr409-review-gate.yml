name: PR 410 Post PR 409 Review Gate

on:
  push:
    branches:
      - pr410-post-pr409-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr410-post-pr409-review-gate
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr410-post-pr409-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate PR 410 review authority
        run: |
          set -o pipefail
          { node scripts/validate-post-pr409-review-gate-pr410.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr410-all.txt
      - name: Verify governance-only boundary
        run: |
          set -o pipefail
          {
            test -z "$(git diff --name-only origin/main...HEAD -- src/ public/ data/ config/ scripts/monitoring/)"
            git diff --exit-code origin/main...HEAD -- \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
          } 2>&1 | tee -a /tmp/pr410-all.txt
      - name: Validate repository contracts
        run: |
          set -o pipefail
          {
            npm run validate:data
            npm run validate:evidence-relations-v2
            npm run validate:compat
            npm run validate:final
            npm run validate:release-integrity
            npm run validate:reproducible-build
          } 2>&1 | tee -a /tmp/pr410-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr410-all.txt
