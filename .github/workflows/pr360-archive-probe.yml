name: PR 360 Archive Probe

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.head_ref == 'pr360-evidence-correction-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Probe Wayback snapshots for the bounded queue
        run: node scripts/probe-pr360-archives.mjs

      - name: Publish archive probe summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr360-archive-probe -->';
            let report = null;
            try { report = JSON.parse(fs.readFileSync('artifacts/pr360/archive-probe.json', 'utf8')); } catch {}
            const rows = report?.results ?? [];
            const found = rows.filter((row) => row.status === 'snapshot_found');
            const body = `${marker}
            ## PR #360 archive probe

            - Workflow status: **${{ job.status }}**
            - Queue candidates: **${report?.selected_count ?? 'not-generated'}**
            - Snapshots found: **${report?.snapshot_found_count ?? 'not-generated'}**
            - No snapshot found: **${report?.no_snapshot_found_count ?? 'not-generated'}**
            - Probe errors: **${report?.probe_error_count ?? 'not-generated'}**

            ${found.map((row) => `- \`${row.evidence_id}\` → \`${row.selected_snapshot?.timestamp}\``).join('\n') || 'No reviewed snapshot candidates were produced.'}

            This is review input only and performs no canonical write.
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }

      - name: Upload archive probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr360-archive-probe-${{ github.run_id }}
          path: artifacts/pr360/archive-probe.json
          if-no-files-found: error
          retention-days: 30
