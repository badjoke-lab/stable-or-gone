name: PR 415 Dossier Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'pr415-ui-v3-stablecoin-dossier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run dossier validators
        id: diagnostic
        shell: bash
        run: |
          set +e
          npm run validate:ui-v3-stablecoin-detail > /tmp/pr415-detail-validator.log 2>&1
          detail=$?
          npm run prepare:stablecoin-dossier-hierarchy > /tmp/pr415-hierarchy-validator.log 2>&1
          hierarchy=$?
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "hierarchy=$hierarchy" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish dossier diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr415-dossier-contract-diagnostics -->';
            const detail=fs.readFileSync('/tmp/pr415-detail-validator.log','utf8');
            const hierarchy=fs.readFileSync('/tmp/pr415-hierarchy-validator.log','utf8');
            const body=`${marker}
            ## PR #415 Dossier Contract Diagnostics

            - Detail validator exit: **${{ steps.diagnostic.outputs.detail }}**
            - Hierarchy validator exit: **${{ steps.diagnostic.outputs.hierarchy }}**

            \`\`\`text
            DETAIL
            ${detail.slice(-12000)}

            HIERARCHY
            ${hierarchy.slice(-12000)}
            \`\`\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Preserve failure state
        if: steps.diagnostic.outputs.detail != '0' || steps.diagnostic.outputs.hierarchy != '0'
        run: exit 1
