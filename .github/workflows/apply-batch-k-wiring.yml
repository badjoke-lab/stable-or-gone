name: Apply Batch K wiring

on:
  push:
    branches: [batch-k-historical-failures]
    paths:
      - scripts/apply-batch-k-wiring.mjs
      - .github/workflows/apply-batch-k-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-k-historical-failures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore stable loader and validator structure
        run: |
          git fetch origin main
          git checkout origin/main -- src/lib/data/registry.ts src/lib/data/stablecoinProfiles.ts src/lib/data/registryV3.ts src/lib/data/incomeProfilesV3.ts scripts/validate-data.mjs scripts/validate-registry-v2-compat.mjs scripts/validate-candidate-stable-assets.mjs scripts/validate-batch-finalization.mjs
      - name: Apply Batch K additions
        run: node scripts/apply-batch-k-wiring.mjs
      - name: Commit normalized wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts
          git commit -m "Normalize Batch K loader and validator wiring"
          git push origin HEAD:batch-k-historical-failures
