name: PR 429 Record Growth Batch 2
run-name: PR 429 CHFAU SEKAU · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - pr429-record-growth-batch-2
  pull_request:
    branches:
      - pr428-post-pr427-review-gate
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr429-record-growth-batch-2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr429-record-growth-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply deterministic loader and manifest wiring
        run: node scripts/apply-record-growth-batch-2-pr429.mjs

      - name: Generate deterministic checkpoints and statistics history
        run: node scripts/build-record-growth-batch-2-pr429.mjs

      - name: Validate complete CHFAU and SEKAU records
        run: node scripts/validate-record-growth-batch-2-pr429.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate classifications
        run: npm run validate:classification

      - name: Validate reserve and redemption profiles
        run: npm run validate:profiles

      - name: Validate event details
        run: npm run validate:events-v2

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployments
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate final registry contracts
        run: npm run validate:final

      - name: Validate deterministic statistics and immutable history
        env:
          SOG_STATS_HISTORY_BASE_REF: origin/pr428-post-pr427-review-gate
        run: |
          npm run generate:deployment-taxonomy
          npm run generate:provenance
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
          node scripts/validate-stats-history.mjs

      - name: Astro check and build
        run: |
          npm run check
          npm run build
          npm run verify:public

      - name: Verify exact growth boundary
        run: |
          test "$(node -e "console.log(require('./data/stablecoins-batch-aa.json').length)")" = "2"
          test "$(node -e "console.log(require('./data/candidate-promotions-batch-28.json').length)")" = "2"
          test ! -e data/organizations-batch-aa.json
          git diff --exit-code origin/pr428-post-pr427-review-gate...HEAD -- public/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('config/record-growth-batch-2-pr429.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('dist/data/manifest.json','utf8'));
          if(config.selected_candidates.length!==2) throw new Error('selected candidate count changed');
          if(manifest.record_counts?.primary_records!==114) throw new Error('public primary record count mismatch');
          if(manifest.data_safety?.canonical_only!==true) throw new Error('canonical-only boundary changed');
          if(manifest.data_safety?.includes_unreviewed_candidates!==false) throw new Error('candidate publication boundary changed');
          const serialized=JSON.stringify(manifest);
          for(const marker of ['record-growth-candidate-audit-v2-pr427','post-pr427-review-gate-pr428']) {
            if(serialized.includes(marker)) throw new Error(`private planning output leaked: ${marker}`);
          }
          NODE

      - name: Commit generated loaders and checkpoints
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lib/data/registry.ts \
            src/lib/data/currentProfiles.ts \
            src/lib/data/registryV3.ts \
            src/lib/data/incomeProfilesV3.ts \
            docs/migration/registry-v3-foundation.json \
            docs/migration/registry-v3-income-profiles.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-v3-parity-baseline.json \
            docs/migration/registry-release-integrity-baseline.json \
            docs/migration/record-growth-batch-2-pr429-handoff.json \
            data/stats-history.json
          if git diff --cached --quiet; then
            echo 'Generated PR #429 files already current.'
          else
            git commit -m 'Generate PR 429 loaders and canonical checkpoints'
            git push origin HEAD:pr429-record-growth-batch-2
          fi

      - name: Publish PR 429 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr429-record-growth-batch-2-status -->';
            const fs=require('fs');
            let config=null;
            try { config=JSON.parse(fs.readFileSync('config/record-growth-batch-2-pr429.json','utf8')); } catch {}
            const body=`${marker}
            ## PR #429 Record Growth Batch 2

            - Workflow: **${{ job.status }}**
            - Promoted assets: **CHFAU, SEKAU**
            - Canonical assets: **${config?.expected_post_promotion_counts?.stablecoins ?? 'n/a'}**
            - Evidence: **${config?.expected_post_promotion_counts?.evidence ?? 'n/a'}**
            - Deployments: **${config?.expected_post_promotion_counts?.deployments ?? 'n/a'}**
            - Archive recorded / not recorded: **${config?.expected_post_promotion_counts?.archive_recorded ?? 'n/a'} / ${config?.expected_post_promotion_counts?.archive_not_recorded ?? 'n/a'}**
            - Market Access Records: **${config?.expected_post_promotion_counts?.market_access_records ?? 'n/a'}**
            - Third asset: **forbidden**
            - Automatic promotion: **disabled**
            - Next boundary: **REVIEW GATE**
            - Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
