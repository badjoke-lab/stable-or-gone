name: Finalize launch date batch N

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'launch-date-batch-n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-date-batch-n
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: python scripts/tmp-finalize-usde.py
      - run: python scripts/tmp-usde-evidence.py
      - run: node scripts/generate-registry-stats.mjs
      - run: npm run audit:integrity
      - name: Commit final batch
        run: |
          rm -f scripts/tmp-finalize-usde.py
          rm -f scripts/tmp-usde-evidence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add official USDe launch date"
          git push origin HEAD:launch-date-batch-n
