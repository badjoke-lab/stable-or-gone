name: Restore main package lockfile

on:
  push:
    branches:
      - flatten-integrity-audit
    paths:
      - .github/workflows/restore-main-lockfile.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flatten-integrity-audit
          fetch-depth: 0
      - name: Restore package-lock from main
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          rm .github/workflows/restore-main-lockfile.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore package lockfile after audit migration"
          git push origin HEAD:flatten-integrity-audit
