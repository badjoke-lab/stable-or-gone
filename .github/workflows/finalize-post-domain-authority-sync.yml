name: Finalize post-domain authority sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sog-post-domain-authority-sync-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'chore/post-domain-authority-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@v4
        with:
          ref: chore/post-domain-authority-sync
          fetch-depth: 1

      - name: Finalize authority wording and validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checkpoint = 'bd0e63ac36b1824bf705e8c80d1fb0a1cd79d221'

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              'README.md',
              f'Current main and production commit after the official-domain migration:\n\n```text\n{checkpoint}\n```',
              f'Official-domain migration production checkpoint:\n\n```text\n{checkpoint}\n```\n\nCurrent main/production equality is verified dynamically by the deployment workflow and Issue #479; this checkpoint is not an immutable pointer to the latest `main`.'
          )
          replace_exact(
              'docs/roadmap.md',
              f'Current main and production commit: {checkpoint}',
              f'Official-domain migration production checkpoint: {checkpoint}'
          )
          replace_exact(
              'docs/roadmap.md',
              f'Main and deployed commit: {checkpoint}',
              f'Migration merge and deployed checkpoint: {checkpoint}'
          )
          replace_exact(
              'docs/spec-governance.md',
              f'Current main and production commit: {checkpoint}',
              f'Official-domain migration production checkpoint: {checkpoint}'
          )
          replace_exact(
              'docs/deployment-policy.md',
              f'Current production commit: {checkpoint}',
              f'Official-domain migration production checkpoint: {checkpoint}'
          )
          replace_exact(
              'docs/roadmap-amendments/2026-07-31-post-domain-authority-sync.md',
              f'Main and production commit: {checkpoint}',
              f'Official-domain migration production checkpoint: {checkpoint}'
          )
          replace_exact(
              'docs/roadmap-amendments/2026-07-31-post-domain-authority-sync.md',
              '4. the current main and production commit is recorded consistently;',
              '4. the official-domain migration production checkpoint is recorded consistently without claiming it is the immutable current `main`;'
          )

          validator = r'''import fs from 'node:fs';
import path from 'node:path';
import './validate-record-growth-batch-3-pr467.mjs';

const root = process.cwd();
const failures = [];
const check = (condition, message) => { if (!condition) failures.push(message); };
const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');

const files = {
  agents: 'AGENTS.md',
  readme: 'README.md',
  roadmap: 'docs/roadmap.md',
  governance: 'docs/spec-governance.md',
  deployment: 'docs/deployment-policy.md',
  amendment: 'docs/roadmap-amendments/2026-07-31-post-domain-authority-sync.md'
};
const docs = Object.fromEntries(Object.entries(files).map(([key, file]) => [key, read(file)]));
const checkpoint = 'bd0e63ac36b1824bf705e8c80d1fb0a1cd79d221';
const officialOrigin = 'https://www.stableorgone.com';

for (const [name, text] of Object.entries(docs)) {
  check(text.includes('116'), `${name}: reviewed 116-asset checkpoint missing`);
  check(text.includes(officialOrigin), `${name}: official origin missing`);
}

for (const name of ['agents', 'readme', 'roadmap', 'governance', 'amendment']) {
  check(docs[name].includes('PR #492'), `${name}: PR #492 acceptance point missing`);
  check(docs[name].includes('PR #493'), `${name}: PR #493 acceptance point missing`);
}

check(docs.readme.includes(`Official-domain migration production checkpoint:\n\n\`\`\`text\n${checkpoint}`), 'README: migration checkpoint wording mismatch');
check(docs.roadmap.includes(`Official-domain migration production checkpoint: ${checkpoint}`), 'roadmap: migration checkpoint missing');
check(docs.governance.includes(`Official-domain migration production checkpoint: ${checkpoint}`), 'governance: migration checkpoint missing');
check(docs.deployment.includes(`Official-domain migration production checkpoint: ${checkpoint}`), 'deployment policy: migration checkpoint missing');
check(docs.amendment.includes(`Official-domain migration production checkpoint: ${checkpoint}`), 'amendment: migration checkpoint missing');

const staleCurrentCommitClaims = [
  'Current main and production commit:',
  'Current production commit:',
  'Main and production commit:'
];
for (const [name, text] of Object.entries(docs)) {
  for (const phrase of staleCurrentCommitClaims) {
    check(!text.includes(phrase), `${name}: stale immutable current-commit claim remains: ${phrase}`);
  }
}

for (const name of ['agents', 'readme', 'roadmap', 'governance', 'deployment', 'amendment']) {
  const text = docs[name].toLowerCase();
  check(text.includes('legacy') && text.includes('redirect'), `${name}: legacy redirect boundary missing`);
}
check(docs.roadmap.includes('externally blocked'), 'roadmap: external redirect blocker missing');
check(docs.amendment.includes('No candidate and no canonical promotion PR is authorized'), 'amendment: promotion prohibition missing');
check(docs.governance.includes('No candidate and no later growth batch is pre-authorized'), 'governance: bounded continuation missing');
check(read('scripts/validate-active-workstream.mjs').trim() === "import './validate-post-domain-authority-sync-pr495.mjs';", 'active-workstream validator is not wired to PR #495 authority validation');

if (failures.length) {
  console.error('PR #495 post-domain authority synchronization validation failed:');
  failures.forEach((failure) => console.error(`- ${failure}`));
  process.exit(1);
}

console.log(JSON.stringify({
  ok: true,
  validation_id: 'sog_pr495_post_domain_authority_sync',
  canonical_assets: 116,
  official_origin: officialOrigin,
  migration_checkpoint: checkpoint,
  completed_acceptance_points: [467, 492, 493],
  legacy_redirect: 'externally_blocked',
  next_work_item: 'ISSUE_RECONCILIATION_THEN_RECORD_GROWTH_BATCH_4_CANDIDATE_AUDIT_REVIEW_GATE'
}, null, 2));
'''
          Path('scripts/validate-post-domain-authority-sync-pr495.mjs').write_text(validator)
          Path('scripts/validate-active-workstream.mjs').write_text("import './validate-post-domain-authority-sync-pr495.mjs';\n")
          Path('.github/workflows/finalize-post-domain-authority-sync.yml').unlink()
          PY

      - name: Commit finalized authority sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md README.md docs/deployment-policy.md docs/roadmap.md docs/spec-governance.md docs/roadmap-amendments/2026-07-31-post-domain-authority-sync.md scripts/validate-active-workstream.mjs scripts/validate-post-domain-authority-sync-pr495.mjs .github/workflows/finalize-post-domain-authority-sync.yml
          git diff --cached --check
          git commit -m "Finalize post-domain authority sync"
          git push origin HEAD:chore/post-domain-authority-sync
