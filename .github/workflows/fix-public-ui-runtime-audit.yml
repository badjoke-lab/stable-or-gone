name: Fix public UI runtime audit tokens

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/audit-public-typography-enums-direct.mjs'
      - 'scripts/fix-public-ui-runtime-audit.mjs'
      - '.github/workflows/fix-public-ui-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Update runtime audit tokens
        run: node scripts/fix-public-ui-runtime-audit.mjs

      - name: Commit bounded audit fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/audit-public-typography-enums-direct.mjs; then
            echo 'Runtime audit tokens already match the public UI authority.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-public-typography-enums-direct.mjs
          git commit -m 'Align runtime audit with public UI tokens and badges'
          git push origin HEAD:agent/full-ui-contract-remediation
