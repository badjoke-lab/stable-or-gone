name: PR 353 Record Depth Coverage Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr353-record-depth-coverage-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Build deterministic reviewed Record Depth baseline
        run: |
          mkdir -p artifacts/record-depth
          node scripts/growth/build-reviewed-record-depth-baseline-pr353.mjs artifacts/record-depth/record-depth-baseline-pr353.json

      - name: Extract reviewed Tier A candidate queue artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const baseline = JSON.parse(fs.readFileSync('artifacts/record-depth/record-depth-baseline-pr353.json', 'utf8'));
          const queue = {
            schema_version: baseline.schema_version,
            baseline_id: baseline.baseline_id,
            status: 'internal_reviewed_planning_queue',
            public_output: false,
            asset_rank: false,
            queue_order: baseline.queue_order,
            candidate_count: baseline.tier_a_candidate_queue.length,
            input_digest_sha256: baseline.input_digest_sha256,
            source_contracts: baseline.source_contracts,
            candidates: baseline.tier_a_candidate_queue
          };
          fs.writeFileSync('artifacts/record-depth/tier-a-candidate-queue-pr353.json', `${JSON.stringify(queue, null, 2)}\n`);
          console.log(`Reviewed Tier A candidate queue: ${queue.candidate_count} assets`);
          NODE

      - name: Validate Record Depth dimension contract
        run: node scripts/validate-record-depth-baseline-pr353.mjs

      - name: Validate reviewed Tier A queue contract
        run: node scripts/validate-reviewed-tier-a-queue-pr353.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Verify internal-only and non-ranking boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const baseline = JSON.parse(fs.readFileSync('artifacts/record-depth/record-depth-baseline-pr353.json', 'utf8'));
          if (baseline.asset_count !== 110) throw new Error(`expected 110 assets, found ${baseline.asset_count}`);
          if (baseline.dimension_count !== 16) throw new Error(`expected 16 dimensions, found ${baseline.dimension_count}`);
          if (baseline.cell_count !== 1760) throw new Error(`expected 1760 cells, found ${baseline.cell_count}`);
          if (baseline.public_output !== false) throw new Error('Record Depth baseline must remain internal');
          if (baseline.single_composite_score !== false) throw new Error('Record Depth baseline must not emit composite score');
          if (baseline.asset_rank !== false) throw new Error('Record Depth baseline must not rank assets');
          if (baseline.queue_order !== 'asset_slug_ascending_non_ranking') throw new Error('Tier A queue must use non-ranking slug order');
          if (baseline.summary.tier_a_candidate_count > 30) throw new Error(`reviewed Tier A queue too broad: ${baseline.summary.tier_a_candidate_count}`);
          console.log(JSON.stringify({
            asset_count: baseline.asset_count,
            dimension_count: baseline.dimension_count,
            cell_count: baseline.cell_count,
            state_counts: baseline.summary.state_counts,
            tier_a_candidate_count: baseline.summary.tier_a_candidate_count,
            candidate_slugs: baseline.tier_a_candidate_queue.map((row) => row.asset_slug),
            queue_order: baseline.queue_order
          }, null, 2));
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public product boundary unchanged
        run: |
          test -f dist/data/manifest.json
          test -f dist/compare/index.html
          test -f dist/access-regulation/index.html
          test -f dist/timeline/index.html
          test -f dist/updates/index.html
          test -f dist/maintenance/index.html
          test ! -e dist/data/record-depth-baseline.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.public_files?.record_depth_baseline) throw new Error('internal Record Depth baseline leaked into public_files');
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only public safety boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #353 public product boundary unchanged.');
          NODE

      - name: Upload Record Depth planning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr353-record-depth-baseline-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/record-depth/record-depth-baseline-pr353.json
            artifacts/record-depth/tier-a-candidate-queue-pr353.json
