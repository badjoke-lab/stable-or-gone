name: PR 364 Canonical Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate data
        run: npm run validate:data
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate Registry v3
        run: npm run validate:v3
      - name: Validate v2/v3 parity
        run: npm run validate:parity
      - name: Build current stats
        run: node scripts/build-stats.mjs artifacts/pr364-stats-current.json
      - name: Publish status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr364-canonical-diagnostic -->';
            const body=`${marker}\n## PR #364 canonical diagnostic\n\n- Status: **${{ job.status }}**\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
