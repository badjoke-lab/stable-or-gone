name: PR 364 Canonical Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run validators and capture errors
        id: diagnostic
        shell: bash
        run: |
          mkdir -p artifacts/pr364-diagnostic
          : > artifacts/pr364-diagnostic/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            log="artifacts/pr364-diagnostic/${name}.log"
            if "$@" >"$log" 2>&1; then
              echo "${name}: success" >> artifacts/pr364-diagnostic/summary.txt
            else
              echo "${name}: failure" >> artifacts/pr364-diagnostic/summary.txt
              failed=1
            fi
          }
          run_check validate-data npm run validate:data
          run_check validate-profiles npm run validate:profiles
          run_check validate-evidence-relations npm run validate:evidence-relations-v2
          run_check validate-v3 npm run validate:v3
          run_check validate-parity npm run validate:parity
          run_check build-stats node scripts/build-stats.mjs artifacts/pr364-stats-current.json
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr364-canonical-diagnostic-${{ github.run_id }}
          path: artifacts/pr364-diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: Publish status and error tails
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-canonical-diagnostic -->';
            const dir='artifacts/pr364-diagnostic';
            const summary=fs.existsSync(`${dir}/summary.txt`)?fs.readFileSync(`${dir}/summary.txt`,'utf8').trim():'not generated';
            const failed=[];
            if(fs.existsSync(dir)) for(const name of fs.readdirSync(dir).filter((name)=>name.endsWith('.log')).sort()) {
              const text=fs.readFileSync(`${dir}/${name}`,'utf8');
              if(!text.includes('success') || text.match(/error|failed|invalid|mismatch/i)) failed.push(`### ${name}\n\n\`\`\`text\n${text.split('\n').slice(-24).join('\n').slice(-5000)}\n\`\`\``);
            }
            const body=`${marker}\n## PR #364 canonical diagnostic\n\n- Job status: **${{ job.status }}**\n- Validator failure flag: **${{ steps.diagnostic.outputs.failed }}**\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\`\n\n\`\`\`text\n${summary}\n\`\`\`\n\n${failed.join('\n\n')}`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Fail when any validator failed
        if: steps.diagnostic.outputs.failed == '1'
        run: exit 1
