name: Event index implementation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate event index implementation
        run: node scripts/validate-event-index-implementation.mjs
      - name: Build and verify generated output
        run: npm run build
      - name: Upload event index diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-index-implementation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/event-index-implementation-validation.json
            data/generated/index-interaction-audit.json
            data/generated/index-interaction-validation.json
            data/generated/responsive-accessibility-audit.json
            data/generated/responsive-accessibility-validation.json
