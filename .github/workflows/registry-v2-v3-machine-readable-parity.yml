name: Registry v2 v3 machine-readable parity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Registry v3 parity suite
        run: npm run validate:parity-suite
      - name: Upload parity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-v2-v3-machine-readable-parity-${{ github.run_id }}
          if-no-files-found: error
          path: data/generated/registry-v2-v3-machine-readable-parity-audit.json
