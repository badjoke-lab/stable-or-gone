name: Finalize launch-date queue freeze

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-launch-date-queue-freeze
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-launch-date-unresolved-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize documentation
        run: node scripts/finalize-launch-date-queue-freeze.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate queue
        run: npm run validate:launch-queue
      - name: Run full build
        run: npm run build
      - name: Remove one-time machinery and placeholders
        run: |
          rm scripts/finalize-launch-date-queue-freeze.mjs
          rm .github/workflows/finalize-launch-date-queue-freeze.yml
          rm -f data/quality/.gitkeep
          rm -f docs/audits/.launch-queue-freeze-placeholder
      - name: Commit finalized queue freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze unresolved launch-date queue"
          git push origin HEAD:freeze-launch-date-unresolved-queue
