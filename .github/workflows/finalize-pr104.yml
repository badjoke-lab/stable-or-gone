name: Finalize PR104

on:
  push:
    branches:
      - record-susd-depeg-sip423

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-susd-depeg-sip423
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync migration minimum
        run: node --input-type=module -e "import fs from 'node:fs'; const file='docs/migration/registry-v3-migration-audit.json'; const value=JSON.parse(fs.readFileSync(file,'utf8')); value.minimum_counts.deployments=113; fs.writeFileSync(file, JSON.stringify(value,null,2)+'\n');"
      - name: Validate finalization
        run: npm run validate:finalization
      - name: Commit result
        run: |
          rm .github/workflows/finalize-pr104.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync sUSD deployment migration minimum"
          git push origin HEAD:record-susd-depeg-sip423
