name: Finalize terminal registry stats

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'resolve-terminal-dates-usdm-usdn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate registry stats
        run: node scripts/generate-registry-stats.mjs
      - name: Validate registry stats
        run: node scripts/validate-registry-stats.mjs
      - name: Validate full repository
        run: npm install && npm run build
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-terminal-registry-stats.yml
      - name: Commit generated stats
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Regenerate terminal-date registry stats"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
