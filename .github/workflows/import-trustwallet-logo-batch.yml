name: Import exact-address stablecoin logos

on:
  push:
    branches:
      - audit/logo-coverage-batch-2
    paths:
      - 'scripts/import-trustwallet-logo-batch.mjs'
      - '.github/workflows/import-trustwallet-logo-batch.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: audit/logo-coverage-batch-2
          fetch-depth: 0

      - name: Fetch pinned Trust Wallet Assets commit
        run: |
          set -euo pipefail
          rm -rf /tmp/trustwallet-assets
          git init /tmp/trustwallet-assets
          git -C /tmp/trustwallet-assets remote add origin https://github.com/trustwallet/assets.git
          git -C /tmp/trustwallet-assets fetch --depth 1 origin 34d808acb2a71e55c41505cd8f15c827db21b0fc
          git -C /tmp/trustwallet-assets checkout --detach FETCH_HEAD
          test "$(git -C /tmp/trustwallet-assets rev-parse HEAD)" = "34d808acb2a71e55c41505cd8f15c827db21b0fc"

      - name: Import exact-address assets and update contracts
        run: node scripts/import-trustwallet-logo-batch.mjs

      - name: Validate logo coverage
        run: node scripts/audit-stablecoin-logo-coverage.mjs

      - name: Validate Stablecoin index contract
        run: node scripts/validate-ui-v3-stablecoin-index.mjs

      - name: Build site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit imported assets and coverage updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/stablecoin-logos \
            src/utils/stablecoinLogo.ts \
            scripts/audit-stablecoin-logo-coverage.mjs \
            scripts/validate-ui-v3-stablecoin-index.mjs
          git diff --cached --check
          git commit -m 'Add 11 address-verified Stablecoin logos'
          git push origin HEAD:audit/logo-coverage-batch-2
