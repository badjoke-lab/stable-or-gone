name: Temporary force Compare scroll position

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-force-compare-scroll-position.yml'
      - 'scripts/tmp-force-compare-scroll-position.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Apply exact Compare scroll position
        run: node scripts/tmp-force-compare-scroll-position.mjs
      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/tmp-force-compare-scroll-position.yml
          rm -f scripts/tmp-force-compare-scroll-position.mjs
      - name: Commit exact scroll fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Compare navigation immediate"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
