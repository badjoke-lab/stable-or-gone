name: Finalize msUSD emergency record

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'add-mainstreet-msusd-impaired-incident'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire Batch N and baselines
        run: node scripts/finalize-msusd-emergency.mjs
      - name: Install dependencies
        run: npm ci
      - name: Regenerate integrity outputs
        run: npm run audit:integrity
      - name: Validate repository
        run: npm run build
      - name: Remove temporary finalization files
        run: |
          rm -f scripts/finalize-msusd-emergency.mjs
          rm -f .github/workflows/apply-msusd-emergency.yml
          rm -f .github/workflows/validate-msusd-emergency-on-pr.yml
          rm -f .github/workflows/export-msusd-transform.yml
          rm -f .github/workflows/finalize-msusd-emergency.yml
      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize MainStreet msUSD impaired incident"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
