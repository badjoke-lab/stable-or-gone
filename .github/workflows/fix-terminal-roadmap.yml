name: Fix terminal roadmap
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-historical-terminal-dates
      - name: Correct maintained queue counts
        run: |
          sed -i 's/Historical records missing terminal date:   4/Historical records missing terminal date:   6/' docs/roadmap.md
          sed -i 's/Historical null terminal dates: 4/Historical null terminal dates: 6/' docs/roadmap.md
          sed -i 's/Machine-readable explanations:  4 \/ 4/Machine-readable explanations:  6 \/ 6/' docs/roadmap.md
          sed -i 's/All four reviewed records remain/All six canonical terminal-status records remain/' docs/roadmap.md
      - name: Commit correction
        run: |
          rm .github/workflows/fix-terminal-roadmap.yml
          git config user.name github-actions-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m 'Correct terminal queue count'
          git push origin HEAD:freeze-historical-terminal-dates
