name: PR324 validator diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'pr324-bounded-scheduled-read-only-monitoring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run validator and save output
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/validate-bounded-scheduled-monitoring-pr324.mjs > artifacts/pr324-validator.log 2>&1 || echo validator_failed >> artifacts/pr324-validator.log
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr324-validator-diagnostic
          path: artifacts/pr324-validator.log
          if-no-files-found: error
