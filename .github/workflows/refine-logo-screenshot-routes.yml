name: Refine representative logo routes

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/refine-logo-screenshot-routes.mjs'
      - '.github/workflows/refine-logo-screenshot-routes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Refine representative logo routes
        run: node scripts/refine-logo-screenshot-routes.mjs

      - name: Commit bounded representative routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/capture-site-screenshots.mjs scripts/refine-logo-screenshot-routes.mjs .github/workflows/refine-logo-screenshot-routes.yml
          git commit -m 'Bound stablecoin logo screenshots to three dossiers'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
