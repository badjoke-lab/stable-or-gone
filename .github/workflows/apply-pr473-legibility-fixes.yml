name: Apply PR 473 common interaction repair

on:
  push:
    branches:
      - fix/public-ui-legibility-contract
    paths:
      - '.github/workflows/apply-pr473-legibility-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr473-legibility-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-ui-legibility-contract
          fetch-depth: 0

      - name: Apply bounded single-authority repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'badjoke-lab'
          git config user.email '227710934+badjoke-lab@users.noreply.github.com'

          node <<'NODE'
          const fs = require('node:fs');

          const replaceRequired = (text, oldValue, newValue, label) => {
            const count = text.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one match, found ${count}`);
            return text.replace(oldValue, newValue);
          };

          const cssPath = 'src/styles/public-ui.css';
          let css = fs.readFileSync(cssPath, 'utf8');

          css = replaceRequired(
            css,
            '.panel, .surface, .card, .stat, .fact, [class*="-card"] { border: 1px solid var(--ui-line-soft); border-radius: var(--ui-radius); background: var(--ui-surface); box-shadow: none; }',
            '.panel, .surface, .card, .stat, .fact, :where([class$="-card"], [class*="-card "]) { border: 1px solid var(--ui-line-soft); border-radius: var(--ui-radius); background: var(--ui-surface); box-shadow: none; }',
            'precise card token selector'
          );
          css = replaceRequired(
            css,
            'input::placeholder, textarea::placeholder { color: var(--ui-quiet); opacity: 1; }',
            'input::placeholder, textarea::placeholder { color: var(--ui-quiet); opacity: 1; }\ninput[type="checkbox"], input[type="radio"] { width: 1.05rem; min-height: 1.05rem; accent-color: var(--ui-link); }\nlabel:has(input[type="checkbox"], input[type="radio"]) { min-height: 40px; display: flex; align-items: center; gap: .65rem; }',
            'compact choice controls'
          );
          css = replaceRequired(
            css,
            '.home-register-strip a { min-height: 124px; padding: 1.25rem; display: grid; align-content: space-between; background: var(--ui-bg-soft); color: var(--ui-copy); font-size: 1rem; text-decoration: none; }',
            '.home-register-strip a { min-height: 124px; padding: 1.25rem; display: grid; align-content: space-between; background: var(--ui-bg-soft); color: var(--ui-muted); font-size: 1rem; text-decoration: none; }',
            'home register link role'
          );
          css = replaceRequired(css, '.home-search__heading p { font-size: .98rem; }', '.home-search__heading p { font-size: 1rem; }', 'home search supporting copy');
          css = replaceRequired(css, '.home-search__popular button { min-height: 36px; padding: .35rem .65rem; }', '.home-search__popular button { min-height: 44px; padding: .45rem .7rem; }', 'home direct-term targets');
          css = replaceRequired(css, '.home-registry-state__note { margin-top: 1rem; font-size: .95rem; }', '.home-registry-state__note { margin-top: 1rem; font-size: 1rem; }', 'home lifecycle note');
          css = replaceRequired(
            css,
            ':where(.event-index-overline, .organization-index-overline) { min-height: 46px; padding: .6rem 0; display: flex; justify-content: space-between; border-bottom: 1px solid var(--ui-line-soft); }',
            ':where(.event-index-overline, .organization-index-overline) { min-height: 46px; padding: .6rem 0; display: flex; justify-content: space-between; border-bottom: 1px solid var(--ui-line-soft); }\n:where(.event-index-overline, .organization-index-overline, .guide-article-overline) a { min-height: 44px; display: inline-flex; align-items: center; font-family: var(--ui-sans); font-size: .95rem; text-transform: none; }',
            'overline navigation targets'
          );
          css = replaceRequired(
            css,
            '.update-feed-paths a { min-height: 42px; padding: .35rem .6rem; display: inline-flex; align-items: center; border: 1px solid var(--ui-line-soft); border-radius: var(--ui-radius); font-family: var(--ui-mono); font-size: .92rem; }',
            '.update-feed-paths a { min-height: 44px; padding: .4rem .65rem; display: inline-flex; align-items: center; border: 1px solid var(--ui-line-soft); border-radius: var(--ui-radius); font-family: var(--ui-mono); font-size: .95rem; }',
            'update path targets'
          );
          css = replaceRequired(
            css,
            '@media (max-width: 980px) {\n  .site-main { padding-top: 2rem; }',
            '@media (max-width: 980px) {\n  .site-main { padding-top: 2rem; }\n  main details > summary { min-height: 44px; padding-block: .45rem; }\n  main :where(nav, [class*="-actions"]) > a { min-height: 44px; display: inline-flex; align-items: center; }',
            'mobile common target contract'
          );

          if (css.includes('!important')) throw new Error('!important is forbidden');
          const cssLines = css.split(/\r?\n/).length;
          if (cssLines >= 553) throw new Error(`CSS grew beyond bounded baseline: ${cssLines}`);
          fs.writeFileSync(cssPath, css);

          const auditPath = 'scripts/audit-ui-readability.mjs';
          let audit = fs.readFileSync(auditPath, 'utf8');
          audit = replaceRequired(
            audit,
            '? { ordinary: 16, compact: 15, interactive: 15, metadata: 12, h1: 68, h1Home: 84, h2: 48 }\n        : { ordinary: 16, compact: 14, interactive: 14, metadata: 12, h1: 88, h1Home: 142, h2: 52 };',
            '? { ordinary: 16, compact: 15, interactive: 15, metadata: 13, h1: 60, h1Home: 72, h2: 44 }\n        : { ordinary: 17, compact: 15, interactive: 15, metadata: 13, h1: 80, h1Home: 96, h2: 48 };',
            'strengthened readability thresholds'
          );
          fs.writeFileSync(auditPath, audit);

          const validatePath = 'scripts/validate-ui-readability.mjs';
          let validate = fs.readFileSync(validatePath, 'utf8');
          validate = replaceRequired(validate, "ordinary_copy: '>=16px desktop and mobile'", "ordinary_copy: '>=17px desktop and >=16px mobile'", 'ordinary policy');
          validate = replaceRequired(validate, "compact_values: '>=14px desktop and >=15px mobile'", "compact_values: '>=15px desktop and mobile'", 'compact policy');
          validate = replaceRequired(validate, "interactive_text: '>=14px desktop and >=15px mobile'", "interactive_text: '>=15px desktop and mobile'", 'interactive policy');
          validate = replaceRequired(validate, "metadata: '>=12px'", "metadata: '>=13px'", 'metadata policy');
          validate = replaceRequired(validate, "mobile_controls: '>=40px high'", "mobile_controls: '>=40px high, with the public UI contract targeting 44px'", 'mobile target policy');
          fs.writeFileSync(validatePath, validate);
          NODE

          git rm .github/workflows/apply-pr473-legibility-fixes.yml
          git add src/styles/public-ui.css scripts/audit-ui-readability.mjs scripts/validate-ui-readability.mjs
          git diff --cached --check
          git commit -m 'Repair common mobile targets and strengthen legibility gates'
          git push origin HEAD:fix/public-ui-legibility-contract
