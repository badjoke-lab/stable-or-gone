name: PR 358 Record Growth Batch 1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr358-record-growth-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate reviewed selection and promotion
        run: node scripts/validate-record-growth-batch-1-selection-pr358.mjs

      - name: Validate complete XUSD and USDB records
        run: node scripts/validate-record-growth-batch-1-full-records-pr358.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Verify reviewed PR 357 handoff
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const handoff = JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-3-pr357-reviewed-handoff.json', 'utf8'));
          if (handoff.source_merge_commit !== 'b849bfd582209aad217dd1af2198c755ff0760ab') throw new Error('PR #357 merge commit mismatch');
          if (handoff.canonical_counts?.assets !== 110) throw new Error('PR #357 asset count mismatch');
          if (handoff.canonical_counts?.evidence !== 551) throw new Error('PR #357 Evidence count mismatch');
          if (handoff.canonical_counts?.market_access_records !== 4) throw new Error('PR #357 Market Access count mismatch');
          console.log('Reviewed PR #357 handoff valid.');
          NODE

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate classifications
        run: npm run validate:classification

      - name: Validate reserve and redemption profiles
        run: npm run validate:profiles

      - name: Validate event overlays
        run: npm run validate:events-v2

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify internal research remains non-public
        run: |
          test ! -e dist/data/record-growth-batch-1-pr358-candidates.json
          test ! -e dist/data/pr357-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          for (const key of ['record_growth_batch_1_candidates','pr357_reviewed_handoff']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal PR #358 material leaked into public manifest: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('Internal PR #358 research remains outside public output.');
          NODE

      - name: Publish PR 358 full-record summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr358-record-growth-status -->';
            const config = JSON.parse(fs.readFileSync('config/record-growth-batch-1-pr358.json', 'utf8'));
            const body = `${marker}
            ## PR #358 Record Growth Batch 1 status

            - Workflow status: **${{ job.status }}**
            - Stage: \`${config.status}\`
            - Promoted assets: \`XUSD\`, \`USDB\`
            - Canonical assets: **${config.expected_post_promotion_counts.assets}**
            - Evidence: **${config.expected_post_promotion_counts.evidence}**
            - Deployments: **${config.expected_post_promotion_counts.deployments}**
            - Market Access records: **${config.expected_post_promotion_counts.market_access_records}**
            - Automatic promotion: **disabled**
            - Thin records: **forbidden**
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
