name: PR 371 Planning Input Coverage Audit

on:
  push:
    branches:
      - pr371-planning-input-coverage-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr371-planning-input-coverage-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic planning input audit
        run: |
          node scripts/build-planning-input-coverage-audit-pr371.mjs
          node scripts/build-planning-input-coverage-audit-pr371.mjs --check
      - name: Validate manifest and coverage findings
        run: |
          node scripts/validate-planning-input-coverage-audit-pr371.mjs
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify internal-audit-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/planning-input-manifest-pr371.json
          test ! -e public/data/planning-input-coverage-audit-pr371.json
          test ! -e dist/data/planning-input-manifest-pr371.json
          test ! -e dist/data/planning-input-coverage-audit-pr371.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated audit outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/planning-input-manifest-pr371.json \
            docs/migration/planning-input-coverage-audit-pr371.json
          if git diff --cached --quiet; then
            echo 'Audit outputs already committed'
          else
            git commit -m 'Generate PR 371 planning input audit outputs'
            git push origin HEAD:pr371-planning-input-coverage-audit
          fi
      - name: Publish PR 371 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr371-planning-input-coverage-audit-status -->';
            const fs=require('fs');
            let manifest=null,audit=null;
            try{manifest=JSON.parse(fs.readFileSync('docs/migration/planning-input-manifest-pr371.json','utf8'));}catch{}
            try{audit=JSON.parse(fs.readFileSync('docs/migration/planning-input-coverage-audit-pr371.json','utf8'));}catch{}
            const body=`${marker}
            ## PR #371 Planning Input Coverage Audit

            - Workflow: **${{ job.status }}**
            - Public / legacy / omitted profile files: **${audit?.public_loader?.file_count??'n/a'} / ${audit?.legacy_planning_input?.file_count??'n/a'} / ${audit?.coverage_gap?.missing_profile_file_count??'n/a'}**
            - Public / legacy unique asset IDs: **${audit?.public_loader?.unique_asset_ids??'n/a'} / ${audit?.legacy_planning_input?.unique_asset_ids??'n/a'}**
            - Duplicate asset IDs / duplicate row occurrences: **${manifest?.counts?.duplicate_asset_ids??'n/a'} / ${manifest?.counts?.duplicate_row_occurrences??'n/a'}**
            - Affected asset IDs: **${audit?.coverage_gap?.affected_asset_id_count??'n/a'}**
            - Next work item: **${audit?.decision?.next_work_item??'n/a'}**
            - Head: \`${context.sha}\`
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
