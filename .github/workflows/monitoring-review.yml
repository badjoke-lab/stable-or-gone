name: SOG Review-only Monitoring

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monitoring mode
        required: true
        default: health-only
        type: choice
        options:
          - health-only

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run review-only monitoring
        id: monitoring
        shell: bash
        run: |
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::8}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          SOG_MONITORING_RUN_ID="$RUN_ID" \
          SOG_MONITORING_MODE="${{ inputs.mode }}" \
          SOG_MONITORING_COMMIT="$GITHUB_SHA" \
          SOG_MONITORING_BRANCH="$GITHUB_REF_NAME" \
          npm run monitor:review

      - name: Validate monitoring contract
        run: npm run validate:monitoring

      - name: Upload private monitoring artifact
        uses: actions/upload-artifact@v4
        with:
          name: sog-monitoring-${{ steps.monitoring.outputs.run_id }}
          path: data-staging/monitoring/${{ steps.monitoring.outputs.run_id }}
          if-no-files-found: error
          retention-days: 30
