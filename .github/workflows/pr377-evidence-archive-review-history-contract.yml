name: PR 377 Evidence Archive Review-History Contract

on:
  push:
    branches:
      - pr377-evidence-archive-review-history-contract
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr377-evidence-archive-review-history-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic archive review-history outputs
        run: |
          node scripts/build-evidence-archive-review-history-pr377.mjs 2>&1 | tee /tmp/pr377-generation.txt
          node scripts/build-evidence-archive-review-history-pr377.mjs --check
      - name: Validate archive review-history contract
        run: |
          node scripts/validate-evidence-archive-review-history-pr377.mjs 2>&1 | tee /tmp/pr377-validation.txt
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify internal-planning-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/evidence-archive-review-history-manifest-pr377.json
          test ! -e public/data/evidence-archive-review-history-audit-pr377.json
          test ! -e dist/data/evidence-archive-review-history-manifest-pr377.json
          test ! -e dist/data/evidence-archive-review-history-audit-pr377.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated archive review-history outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/evidence-archive-review-history-manifest-pr377.json \
            docs/migration/evidence-archive-review-history-audit-pr377.json
          if git diff --cached --quiet; then
            echo 'Archive review-history outputs already committed'
          else
            git commit -m 'Generate PR 377 Evidence archive review-history outputs'
            git push origin HEAD:pr377-evidence-archive-review-history-contract
          fi
      - name: Publish PR 377 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr377-evidence-archive-review-history-status -->';
            const fs=require('fs');
            let manifest=null,audit=null;
            try{manifest=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-review-history-manifest-pr377.json','utf8'));}catch{}
            try{audit=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-review-history-audit-pr377.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr377-validation.txt','utf8').trim();}catch{}
            const body=`${marker}
            ## PR #377 Evidence Archive Review-History Contract

            - Workflow: **${{ job.status }}**
            - Sources / events / reviewed identities: **${manifest?.counts?.history_source_count??'n/a'} / ${manifest?.counts?.history_event_count??'n/a'} / ${manifest?.counts?.reviewed_evidence_identity_count??'n/a'}**
            - Archive present / invalid removed / no-safe-change: **${manifest?.counts?.effective_archive_present_count??'n/a'} / ${manifest?.counts?.effective_archive_removed_invalid_count??'n/a'} / ${manifest?.counts?.effective_no_safe_change_count??'n/a'}**
            - Reviewed unresolved archive gaps: **${audit?.reviewed_unresolved_archive_gaps?.count??'n/a'}**
            - Next work item: **${audit?.decision?.next_work_item??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics</summary>

            \`\`\`text
            ${diagnostics.slice(0,12000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
