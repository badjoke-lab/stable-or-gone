name: One-time organization status repair

on:
  push:
    branches: [ui/organization-index-repair]
    paths:
      - .github/workflows/repair-organization-status.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/organization-index-repair
      - name: Replace legacy relationship state comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/issuer/[slug].astro')
          text = path.read_text()
          updated = text.replace("status === 'historical'", "status === 'ended'")
          updated = updated.replace("status !== 'historical'", "status !== 'ended'")
          if updated == text:
              raise SystemExit('No relationship-state replacements were made')
          path.write_text(updated)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-organization-status.yml
          git add 'src/pages/issuer/[slug].astro'
          git commit -m 'Use canonical ended relationship state'
          git push origin HEAD:ui/organization-index-repair
