name: AAA PR358 Full Record Generation

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate:
    if: github.head_ref == 'pr358-record-growth-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR 358 branch
        uses: actions/checkout@v4
        with:
          ref: pr358-record-growth-batch-1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate XUSD and USDB full records
        run: node scripts/apply-pr358-full-records.mjs

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate classifications
        run: npm run validate:classification

      - name: Validate reserve and redemption profiles
        run: npm run validate:profiles

      - name: Validate events
        run: npm run validate:events-v2

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 income
        run: npm run validate:income-v3

      - name: Astro check
        run: npm run check

      - name: Commit generated full records
        run: |
          if git diff --quiet; then
            echo 'Full-record output already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/stablecoins-batch-z.json \
            data/organizations-batch-z.json \
            data/relationships-batch-z.json \
            data/stablecoin-classification-batch-z.json \
            data/batch-z-reserve-redemption.json \
            data/events-batch-z.json \
            data/event-details-batch-z.json \
            data/evidence-batch-z.json \
            data/batch-z-context.json \
            data/batch-z-review-gaps.json \
            data/batch-z-deployments.json \
            data/z-legal.json \
            data/stable-asset-relationships-v3-pr358.json \
            data/batch-z-components.json \
            data/batch-z-income.json \
            docs/migration/registry-v2-baseline-batch-za.json \
            docs/migration/registry-v3-foundation.json \
            docs/migration/registry-v3-income-profiles.json \
            src/lib/data/currentProfiles.ts \
            src/lib/data/incomeProfilesV3.ts \
            src/lib/data/registryV3.ts \
            src/lib/data/registry.ts
          git commit -m 'Add complete XUSD and USDB registry records'
          git push origin HEAD:pr358-record-growth-batch-1

      - name: Publish generation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr358-full-record-generation -->';
            const body = `${marker}
            ## PR #358 full-record generation

            - Status: **${{ job.status }}**
            - Assets: \`sog_st_xusd\`, \`sog_st_usdb\`
            - Planned canonical count: **112**
            - Planned Evidence count: **557**
            - Planned deployment count: **174**
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
