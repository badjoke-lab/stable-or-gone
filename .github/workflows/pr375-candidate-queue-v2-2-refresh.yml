name: PR 375 Candidate Queue v2.2 Refresh

on:
  push:
    branches:
      - pr375-candidate-queue-v2-2-refresh
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr375-candidate-queue-v2-2-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic queue v2.2 outputs
        run: |
          node scripts/build-candidate-queue-v2-2-refresh-pr375.mjs 2>&1 | tee /tmp/pr375-generation.txt
          node scripts/build-candidate-queue-v2-2-refresh-pr375.mjs --check
      - name: Validate history-aware queue refresh
        run: |
          node scripts/validate-candidate-queue-v2-2-refresh-pr375.mjs 2>&1 | tee /tmp/pr375-validation.txt
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify internal-planning-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/tier-a-candidate-queue-v2-2-pr375.json
          test ! -e public/data/tier-a-candidate-queue-v2-2-pr375-delta.json
          test ! -e dist/data/tier-a-candidate-queue-v2-2-pr375.json
          test ! -e dist/data/tier-a-candidate-queue-v2-2-pr375-delta.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated queue v2.2 outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/tier-a-candidate-queue-v2-2-pr375.json \
            docs/migration/tier-a-candidate-queue-v2-2-pr375-delta.json
          if git diff --cached --quiet; then
            echo 'Queue v2.2 outputs already committed'
          else
            git commit -m 'Generate PR 375 candidate queue v2.2 outputs'
            git push origin HEAD:pr375-candidate-queue-v2-2-refresh
          fi
      - name: Publish PR 375 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr375-candidate-queue-v2-2-status -->';
            const fs=require('fs');
            let queue=null,delta=null;
            try{queue=JSON.parse(fs.readFileSync('docs/migration/tier-a-candidate-queue-v2-2-pr375.json','utf8'));}catch{}
            try{delta=JSON.parse(fs.readFileSync('docs/migration/tier-a-candidate-queue-v2-2-pr375-delta.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr375-validation.txt','utf8').trim();}catch{}
            const removed=delta?.removed_asset_slugs?.join(', ')||'n/a';
            const body=`${marker}
            ## PR #375 Candidate Queue v2.2 Refresh

            - Workflow: **${{ job.status }}**
            - Source / suppressed / current candidates: **${delta?.source_candidate_count??'n/a'} / ${queue?.suppressed_candidate_count??'n/a'} / ${queue?.candidate_count??'n/a'}**
            - Reactivated candidates: **${queue?.reactivated_candidate_count??'n/a'}**
            - Removed asset slugs: **${removed}**
            - Next work item: **${queue?.next_work_item??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics</summary>

            \`\`\`text
            ${diagnostics.slice(0,12000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
