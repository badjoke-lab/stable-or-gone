name: Preflight Pages legacy-host transfer

on:
  push:
    branches:
      - agent/sog-account-bulk-301
    paths:
      - '.github/workflows/preflight-account-bulk-redirect.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Pages project and custom domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }

          api_get() {
            local url="$1" out="$2"
            local status
            status="$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' "$url")"
            echo "HTTP ${status}: ${url%%\?*}"
            if [ "$status" != '200' ] || ! jq -e '.success == true' "$out" >/dev/null; then
              jq '{success, errors, messages}' "$out" || true
              return 1
            fi
          }

          api_get "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stable-or-gone" /tmp/project.json
          jq '{name: .result.name, subdomain: .result.subdomain, domains: .result.domains, production_branch: .result.production_branch}' /tmp/project.json

          api_get "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/stable-or-gone/domains" /tmp/domains.json
          jq '{domains: [.result[] | {name, status, validation_data}]}' /tmp/domains.json

          echo 'Pages project/domain access is available.'
