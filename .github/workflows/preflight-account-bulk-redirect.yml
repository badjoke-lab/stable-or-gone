name: Preflight account bulk redirect access

on:
  push:
    branches:
      - agent/sog-account-bulk-301
    paths:
      - '.github/workflows/preflight-account-bulk-redirect.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check account-level Bulk Redirect access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }

          request() {
            local label="$1" url="$2" out="$3"
            local status
            status="$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' "$url")"
            echo "${label}: HTTP ${status}"
            jq '{success, errors, messages, result_count: (if (.result|type)=="array" then (.result|length) else null end)}' "$out" || true
            [ "$status" = '200' ] && jq -e '.success == true' "$out" >/dev/null
          }

          request 'Account redirect lists' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/rules/lists" \
            /tmp/lists.json
          request 'Account rulesets' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/rulesets" \
            /tmp/rulesets.json

          echo 'Account-level Bulk Redirect read access is available.'
