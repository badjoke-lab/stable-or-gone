name: Apply runtime audit role fixes

on:
  push:
    branches:
      - agent/full-ui-contract-remediation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Apply runtime audit role fixes
        run: node scripts/apply-runtime-audit-role-fixes.mjs

      - name: Commit bounded fixes
        shell: bash
        run: |
          if git diff --quiet -- src/styles/site-ui.css src/pages/updates/visa-stablecoin-platform-open-usd/index.astro scripts/audit-public-typography-enums-direct.mjs; then
            echo 'Runtime audit role fixes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/site-ui.css src/pages/updates/visa-stablecoin-platform-open-usd/index.astro scripts/audit-public-typography-enums-direct.mjs
          git commit -m 'Align runtime UI audit and update article with the single authority'
          git push origin HEAD:agent/full-ui-contract-remediation
