name: Synchronize JPYSC checkpoint

on:
  push:
    branches:
      - add-jpysc-and-japan-stablecoin-events

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-jpysc-and-japan-stablecoin-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize checkpoint files
        run: python3 scripts/sync-jpysc-checkpoint.py
      - name: Install dependencies
        run: npm install
      - name: Regenerate registry statistics
        run: node scripts/generate-registry-stats.mjs
      - name: Regenerate integrity outputs
        run: npm run audit:integrity
      - name: Commit synchronized checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize JPYSC registry checkpoint"
          git push origin HEAD:add-jpysc-and-japan-stablecoin-events
