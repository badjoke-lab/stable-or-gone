name: Monitoring reserve redemption expansion

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate historical source observer contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/monitoring-regression
          node scripts/validate-monitoring-pipeline-pr231.mjs 2>&1 | tee artifacts/monitoring-regression/pr231.log
      - name: Validate historical source fetch contract
        if: always()
        run: node scripts/validate-monitoring-pipeline-pr232.mjs
      - name: Validate historical baseline contract
        if: always()
        run: node scripts/validate-monitoring-baseline-pr234.mjs
      - name: Validate historical change detection contract
        if: always()
        run: node scripts/validate-monitoring-change-detection-pr235.mjs
      - name: Validate historical baseline proposal contract
        if: always()
        run: node scripts/validate-monitoring-baseline-update-pr236.mjs
      - name: Validate historical observation classification contract
        if: always()
        run: node scripts/validate-monitoring-observation-classification-pr237.mjs
      - name: Validate historical normalization contract
        if: always()
        run: node scripts/validate-monitoring-normalization-pr238.mjs
      - name: Validate historical Phase A contract
        if: always()
        run: node scripts/validate-monitoring-phase-a-pr239.mjs
      - name: Validate historical PR 321 synchronization snapshot
        if: always()
        run: node scripts/validate-monitoring-baseline-sync-100-assets.mjs
      - name: Validate current monitoring configuration
        if: always()
        run: node scripts/validate-current-monitoring-configuration.mjs
      - name: Validate current monitoring coverage
        if: always()
        run: node scripts/validate-current-coverage.mjs
      - name: Validate reserve and redemption source expansion
        if: always()
        run: node scripts/validate-monitoring-reserve-redemption-expansion-100-assets.mjs
      - name: Validate full monitoring chain
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run validate:monitoring 2>&1 | tee artifacts/monitoring-regression/full-chain.log
      - name: Upload monitoring regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/monitoring-regression/
