name: PR 329 next-growth candidate audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.head_ref == 'pr329-next-candidate-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate candidate controls
        run: npm run validate:candidates
      - name: Validate audited 100-asset checkpoint
        run: node scripts/validate-audited-100-checkpoint.mjs
      - name: Validate PR 329 candidate audit
        run: node scripts/validate-next-growth-candidate-audit-pr329.mjs
      - name: Validate active workstream
        run: npm run validate:active-workstream
