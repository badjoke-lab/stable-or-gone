name: PR 413 Astro Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr413-astro-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'pr413-ui-v3-home-stablecoin-register'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run Astro check and extract errors
        id: check
        shell: bash
        run: |
          set +e
          npm run check > /tmp/pr413-check-raw.log 2>&1
          code=$?
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/pr413-check-raw.log').read_text(errors='replace')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          lines=text.splitlines()
          selected=[]
          indexes=set()
          for i,line in enumerate(lines):
              low=line.lower()
              if 'error' in low or 'src/pages/index.astro' in line or 'src/pages/stablecoins/index.astro' in line:
                  indexes.update(range(max(0,i-3),min(len(lines),i+8)))
          for i in sorted(indexes):
              selected.append(f'{i+1}: {lines[i]}')
          Path('/tmp/pr413-check-errors.txt').write_text('\n'.join(selected) or 'No error context extracted.')
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish concise diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr413-astro-concise-diagnostics -->';
            const diagnostics=fs.readFileSync('/tmp/pr413-check-errors.txt','utf8').trim();
            const exitCode='${{ steps.check.outputs.exit_code }}';
            const body=`${marker}
            ## PR #413 Concise Astro Diagnostics

            - Exit code: **${exitCode}**
            - Head: \`${context.payload.pull_request.head.sha}\`

            \`\`\`text
            ${diagnostics.slice(-28000)}
            \`\`\``;
            const issueNumber=context.issue.number;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: pr413-astro-diagnostics-${{ github.run_id }}
          path: |
            /tmp/pr413-check-raw.log
            /tmp/pr413-check-errors.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure state
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
