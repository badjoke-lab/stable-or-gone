name: PR 429 Generated Output Repair
run-name: PR 429 generated outputs · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - agent/pr429-generated-output-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr429-generated-output-repair
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/pr429-generated-output-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply PR 429 loader and manifest wiring
        run: node scripts/apply-record-growth-batch-2-pr429.mjs

      - name: Generate PR 429 checkpoints and statistics history
        run: node scripts/build-record-growth-batch-2-pr429.mjs

      - name: Validate PR 429 complete records
        run: node scripts/validate-record-growth-batch-2-pr429.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate classifications
        run: npm run validate:classification

      - name: Validate profiles
        run: npm run validate:profiles

      - name: Validate event details
        run: npm run validate:events-v2

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployments
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate final Registry v2 contracts
        run: npm run validate:final

      - name: Generate deployment taxonomy
        run: npm run generate:deployment-taxonomy

      - name: Generate provenance
        run: npm run generate:provenance

      - name: Generate current statistics
        run: SOG_STATS_OUTPUT=artifacts/stats-current.json node scripts/build-stats.mjs

      - name: Validate current statistics
        run: SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate statistics history
        env:
          SOG_STATS_HISTORY_BASE_REF: origin/main
        run: node scripts/validate-stats-history.mjs

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify exact 114-asset output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.record_counts?.primary_records !== 114) throw new Error('public primary record count is not 114');
          if (manifest.record_count_breakdown?.stablecoins !== 114) throw new Error('public stablecoin count is not 114');
          if (manifest.record_count_breakdown?.events !== 189) throw new Error('public event count is not 189');
          if (manifest.record_count_breakdown?.evidence !== 565) throw new Error('public evidence count is not 565');
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('unreviewed candidate boundary changed');
          NODE
          grep -q "stablecoinsBatchAAData" src/lib/data/registry.ts
          grep -q "profileBatchAAData" src/lib/data/currentProfiles.ts
          grep -q "legalProfilesGrowthAA" src/lib/data/registryV3.ts
          grep -q "batchAA" src/lib/data/incomeProfilesV3.ts

      - name: Commit generated outputs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lib/data/registry.ts \
            src/lib/data/currentProfiles.ts \
            src/lib/data/registryV3.ts \
            src/lib/data/incomeProfilesV3.ts \
            docs/migration/registry-v3-foundation.json \
            docs/migration/registry-v3-income-profiles.json \
            docs/migration/registry-v3-view-67.json \
            docs/migration/registry-v3-migration-audit.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-v3-parity-baseline.json \
            docs/migration/registry-release-integrity-baseline.json \
            docs/migration/record-growth-batch-2-pr429-handoff.json \
            data/generated/build-provenance.json \
            data/stats-history.json
          if git diff --cached --quiet; then
            echo 'Generated PR 429 outputs already current.'
          else
            git commit -m 'Generate PR 429 loaders and canonical checkpoints'
            git push origin HEAD:agent/pr429-generated-output-repair
          fi

      - name: Publish repair status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr429-generated-output-repair-status -->';
            const body=`${marker}
            ## Generated-output repair

            - Workflow: **${{ job.status }}**
            - Run ID: **${{ github.run_id }}**
            - Head: \`${context.sha}\`
            - Expected public assets: **114**
            - Expected events: **189**
            - Expected Evidence: **565**`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
