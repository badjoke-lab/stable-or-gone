name: PR 363 Record Depth Baseline Refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr363-record-depth-baseline-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deterministic PR 363 outputs
        run: node scripts/validate-record-depth-baseline-refresh-pr363.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Validate non-UI release material
        run: node scripts/validate-non-ui-release-material.mjs

      - name: Verify canonical and public source trees are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/
          echo 'PR #363 changes no canonical data or public application source.'

      - name: Verify historical PR 353 files are immutable
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/migration/record-depth-baseline-pr353-summary.json \
            docs/migration/tier-a-candidate-queue-pr353.json
          echo 'PR #353 Record Depth files are byte-preserved.'

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify PR 363 planning outputs remain non-public
        run: |
          test ! -e dist/data/record-depth-baseline-pr363-summary.json
          test ! -e dist/data/record-depth-baseline-pr363-delta.json
          test ! -e dist/data/tier-a-candidate-queue-pr363.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json','utf8'));
          for (const key of ['record_depth_baseline_pr363_summary','record_depth_baseline_pr363_delta','tier_a_candidate_queue_pr363']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal PR #363 material leaked: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #363 planning outputs remain non-public.');
          NODE

      - name: Publish PR 363 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr363-record-depth-status -->';
            let summary = null;
            let delta = null;
            let queue = null;
            try { summary = JSON.parse(fs.readFileSync('docs/migration/record-depth-baseline-pr363-summary.json','utf8')); } catch {}
            try { delta = JSON.parse(fs.readFileSync('docs/migration/record-depth-baseline-pr363-delta.json','utf8')); } catch {}
            try { queue = JSON.parse(fs.readFileSync('docs/migration/tier-a-candidate-queue-pr363.json','utf8')); } catch {}
            const body = `${marker}
            ## PR #363 Record Depth baseline refresh

            - Workflow status: **${{ job.status }}**
            - Assets: **${summary?.asset_count ?? 'not-generated'}**
            - Dimensions: **${summary?.dimension_count ?? 'not-generated'}**
            - Planning cells: **${summary?.cell_count ?? 'not-generated'}**
            - State counts: **${summary ? JSON.stringify(summary.summary?.state_counts) : 'not-generated'}**
            - Candidate count: **${queue?.candidate_count ?? 'not-generated'}**
            - Candidate delta: **${delta?.candidate_queue?.before_count ?? 'not-generated'} → ${delta?.candidate_queue?.after_count ?? 'not-generated'}**
            - Next work item: **PR #364 Tier A Dossier Deepening Batch 4**
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
