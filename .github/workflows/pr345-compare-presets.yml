name: PR 345 Compare presets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr345-compare-presets'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate Compare preset contract
        run: node scripts/validate-compare-presets-pr345.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-compare-presets-server.log 2>&1 &
          echo $! > /tmp/sog-compare-presets-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/compare/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-compare-presets-server.log
          exit 1

      - name: Audit Compare preset interactions
        run: node scripts/audit-compare-presets-pr345.mjs

      - name: Verify projection boundary unchanged
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const projection = JSON.parse(fs.readFileSync('dist/data/comparison.json', 'utf8'));
          if (projection.asset_count !== 110) throw new Error(`asset_count must remain 110, found ${projection.asset_count}`);
          if (projection.dimension_count !== 19) throw new Error(`dimension_count must remain 19, found ${projection.dimension_count}`);
          if (projection.cell_count !== 2090) throw new Error(`cell_count must remain 2090, found ${projection.cell_count}`);
          if (projection.single_composite_score !== false) throw new Error('Compare presets must not create a composite score');
          console.log('Projection boundary unchanged: 110 assets, 19 dimensions, 2090 cells, no composite score.');
          NODE

      - name: Upload Compare preset audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr345-compare-presets-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/compare-presets/audit.json
            artifacts/compare-presets/desktop-protocol-preset.png
            artifacts/compare-presets/mobile-lifecycle-preset.png
