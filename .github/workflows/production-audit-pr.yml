name: Production audit after redeploy

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify redeployed production
        env:
          SOG_EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha }}
          SOG_SMOKE_ATTEMPTS: '3'
          SOG_SMOKE_DELAY_MS: '5000'
        run: |
          set -o pipefail
          npm run check:production 2>&1 | tee production-audit.log
      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit
          path: production-audit.log
          retention-days: 1
