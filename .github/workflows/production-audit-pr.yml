name: Production audit PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Reproduce Cloudflare build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee cloudflare-build.log
      - name: Verify current production against PR base
        env:
          SOG_EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha }}
          SOG_SMOKE_ATTEMPTS: '3'
          SOG_SMOKE_DELAY_MS: '5000'
        run: |
          set -o pipefail
          npm run check:production 2>&1 | tee production-audit.log
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit
          path: |
            cloudflare-build.log
            production-audit.log
          if-no-files-found: ignore
          retention-days: 1
