name: Production audit PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify current production against PR base
        env:
          SOG_EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha }}
          SOG_SMOKE_ATTEMPTS: '3'
          SOG_SMOKE_DELAY_MS: '5000'
        run: npm run check:production
