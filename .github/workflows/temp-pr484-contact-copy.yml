name: Temporary PR 484 Contact copy fix

on:
  pull_request:
    paths:
      - '.github/workflows/temp-pr484-contact-copy.yml'

permissions:
  contents: write

jobs:
  fix-contact-copy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Raise Contact card copy to ordinary-text size
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          text = path.read_text()
          old = 'main .contact-actions p { margin: 0; font-size: 15px; line-height: 1.5; }'
          new = 'main .contact-actions p { margin: 0; font-size: 17px; line-height: 1.5; }'
          if old not in text:
              raise SystemExit('Contact card copy rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm run validate:ui-v3-cleanup
          git diff --check

      - name: Commit Contact copy correction
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/public-ui.css
          git commit -m "Raise Contact card copy to readable size"
          git push origin "HEAD:${HEAD_BRANCH}"
