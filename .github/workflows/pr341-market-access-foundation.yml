name: PR 341 Market Access foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr341-market-access-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Build migration review
        run: node scripts/build-market-access-migration-review-pr341.mjs

      - name: Validate Market Access foundation
        run: node scripts/validate-market-access-foundation-pr341.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Verify PR 341 canonical boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const records = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8'));
          const research = JSON.parse(fs.readFileSync('data/editorial-research/japan-stablecoin-market-access-2026.json', 'utf8'));
          const foundation = JSON.parse(fs.readFileSync('docs/migration/market-access-record-foundation-pr341.json', 'utf8'));
          if (!Array.isArray(records) || records.length !== 0) throw new Error(`canonical Market Access count must be 0, found ${records.length}`);
          if (research.canonical_boundary?.canonical_action !== 'none') throw new Error('PR #339 research canonical boundary changed');
          if (research.canonical_boundary?.included_in_public_canonical_counts !== false) throw new Error('PR #339 research entered canonical counts');
          if (foundation.public_canonical_count_change !== 0) throw new Error('PR #341 public canonical count change must remain zero');
          console.log('PR #341 boundary valid: schema/governance foundation only, canonical count 0, PR #339 research remains noncanonical.');
          NODE

      - name: Upload migration review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr341-market-access-migration-review-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/market-access-migration-review-pr341.json
