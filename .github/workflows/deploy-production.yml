name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deployment_classification:
        description: Why this production deployment is required
        required: true
        type: choice
        options:
          - publication-checkpoint
          - emergency
      project_name:
        description: Cloudflare Pages project name
        required: true
        default: stable-or-gone
        type: string
      confirm:
        description: Type DEPLOY to confirm production publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sog-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Enforce main and explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Production deployment must be dispatched from main." >&2
            exit 1
          fi
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Production deployment requires confirm=DEPLOY." >&2
            exit 1
          fi

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run full repository build
        run: npm run build

      - name: Upload prebuilt site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name ${{ inputs.project_name }}
            --branch main
            --commit-hash ${{ steps.source.outputs.sha }}
            --commit-message "Manual ${{ inputs.deployment_classification }} deployment"

      - name: Verify deployed production
        env:
          SOG_EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
          SOG_SMOKE_ATTEMPTS: '20'
          SOG_SMOKE_DELAY_MS: '15000'
        run: npm run check:production

      - name: Write deployment summary
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DEPLOYMENT_CLASSIFICATION: ${{ inputs.deployment_classification }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.project_name }}
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: $DEPLOYMENT_CLASSIFICATION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages project: $CLOUDFLARE_PAGES_PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public origin: https://sog.badjoke-lab.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production consistency: passed" >> "$GITHUB_STEP_SUMMARY"
