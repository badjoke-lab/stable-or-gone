name: Audited 100-asset checkpoint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      SOG_SMOKE_ATTEMPTS: "8"
      SOG_SMOKE_DELAY_MS: "15000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate active workstream
        run: npm run validate:active-workstream
      - name: Validate Registry v2/v3 parity suite
        run: npm run validate:parity-suite
      - name: Validate final state
        run: npm run validate:final
      - name: Rebuild current registry integrity audit
        run: node scripts/audit-registry-integrity-batch-t.mjs
      - name: Validate current registry integrity audit
        run: node scripts/audit-registry-integrity-batch-t.mjs --check
      - name: Validate audited 100-asset checkpoint
        run: node scripts/validate-audited-100-checkpoint.mjs
      - name: Verify current production public outputs
        run: env -u SOG_EXPECTED_COMMIT -u GITHUB_SHA npm run check:production
      - name: Verify production canonical checkpoint parity
        run: node scripts/check-production-audited-checkpoint.mjs
      - name: Upload checkpoint validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-100-checkpoint-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/audited-100-checkpoint-current.json
            artifacts/audited-100-checkpoint-validation.json
