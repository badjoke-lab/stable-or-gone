name: PR 360 Evidence and Correction Batch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr360-evidence-correction-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Validate bounded Evidence corrections
        run: node scripts/validate-evidence-correction-batch-pr360.mjs

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Evidence integrity
        run: node scripts/validate-registry-evidence-integrity-audit.mjs

      - name: Validate Evidence deduplication
        run: npm run validate:evidence-deduplication

      - name: Validate organization and relationship integrity
        run: node scripts/validate-registry-organization-relationship-audit.mjs

      - name: Validate lifecycle and date boundaries
        run: node scripts/validate-registry-lifecycle-boundary-audit.mjs

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Verify PR 360 canonical boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('config/evidence-correction-batch-pr360.json','utf8'));
          const checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json','utf8'));
          const marketAccess = JSON.parse(fs.readFileSync('data/market-access-records-v1.json','utf8'));
          if (checkpoint.asset_count !== 112) throw new Error(`PR #360 must preserve 112 assets, found ${checkpoint.asset_count}`);
          if (checkpoint.expected_counts?.evidence !== 557) throw new Error(`PR #360 must preserve 557 Evidence rows, found ${checkpoint.expected_counts?.evidence}`);
          if (checkpoint.expected_counts?.market_access_records !== 8 || marketAccess.length !== 8) throw new Error('PR #360 must preserve eight Market Access records');
          for (const key of ['new_canonical_assets_allowed','market_access_record_changes_allowed','new_public_surface_allowed','comparison_readiness_semantics_change_allowed','facet_freshness_semantics_change_allowed','monitoring_auto_promotion_allowed','editorial_research_auto_promotion_allowed','asset_rank','single_composite_score']) {
            if (config.boundaries?.[key] !== false) throw new Error(`PR #360 boundary changed: ${key}`);
          }
          console.log('PR #360 canonical and product-surface boundaries preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify internal review material remains non-public
        run: |
          test ! -e dist/data/evidence-correction-queue-pr360.json
          test ! -e dist/data/evidence-correction-outcomes-pr360.json
          test ! -e dist/data/pr359-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json','utf8'));
          for (const key of ['evidence_correction_queue_pr360','evidence_correction_outcomes_pr360','pr359_reviewed_handoff']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal PR #360 material leaked: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #360 internal review material remains non-public.');
          NODE

      - name: Publish PR 360 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr360-evidence-correction-status -->';
            let queue = null;
            let outcomes = null;
            let checkpoint = null;
            try { queue = JSON.parse(fs.readFileSync('docs/migration/evidence-correction-queue-pr360.json','utf8')); } catch {}
            try { outcomes = JSON.parse(fs.readFileSync('docs/migration/evidence-correction-outcomes-pr360.json','utf8')); } catch {}
            try { checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json','utf8')); } catch {}
            const body = `${marker}
            ## PR #360 Evidence and Correction status

            - Workflow status: **${{ job.status }}**
            - Selected Evidence records: **${queue?.selected_count ?? 0}**
            - Corrected Evidence records: **${outcomes?.changed_count ?? 0}**
            - Dated archives added or replaced: **${outcomes?.dated_archive_added_or_replaced_count ?? 0}**
            - Invalid wildcard archives removed: **${outcomes?.invalid_wildcard_removed_count ?? 0}**
            - Reviewed with no safe change: **${outcomes?.reviewed_no_change_count ?? 0}**
            - Archive indexes: **${outcomes?.archive_index_count_after ?? queue?.archive_index_count ?? 'not-generated'}**
            - Archive not recorded: **${outcomes?.archive_not_recorded_count_after ?? queue?.archive_not_recorded_count ?? 'not-generated'}**
            - Canonical assets: **${checkpoint?.asset_count ?? 'not-generated'}**
            - Canonical Evidence: **${checkpoint?.expected_counts?.evidence ?? 'not-generated'}**
            - Market Access records: **${checkpoint?.expected_counts?.market_access_records ?? 'not-generated'}**
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
