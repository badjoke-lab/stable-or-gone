name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture batch finalization output
        shell: bash
        run: |
          set +e
          npm run validate:finalization > finalization-output.txt 2>&1
          status=$?
          cat finalization-output.txt
          echo "exit_status=$status" >> finalization-output.txt
          exit 0
      - name: Upload batch finalization output
        uses: actions/upload-artifact@v4
        with:
          name: finalization-output
          path: finalization-output.txt
