name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate official public origin
        run: npm run validate:public-origin
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate classifications
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate events
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate Registry v3 foundation
        run: npm run validate:v3
      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3
      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3
      - name: Validate Registry v2/v3 machine-readable parity
        run: npm run validate:parity
      - name: Validate reproducible build contract
        run: npm run validate:reproducible-build
      - name: Astro check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
      - name: Upload Astro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: astro-check.log
      - name: Build site
        shell: bash
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee build-site.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-site-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: build-site.log
      - name: Verify deployment output
        run: npm run verify:deployment
      - name: Verify public layer
        shell: bash
        run: |
          set -o pipefail
          npm run verify:public 2>&1 | tee public-layer-verification.log
      - name: Upload public layer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-layer-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            public-layer-verification.log
            data/generated/deployment-taxonomy-migration.json
            dist/version.json
            dist/data/manifest.json

      # Gate 7 branch checks are tied to release defects, not outgoing visual fidelity.
      - name: Check Gate 7 built internal links
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        run: node scripts/check-built-internal-links.mjs
      - name: Install Gate 7 Chromium
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        run: npx playwright install --with-deps chromium
      - name: Start Gate 7 local preview
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > ui-redesign-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ui-redesign-preview.log
          exit 1
      - name: Check Gate 7 accessibility and UI data contract
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        run: node scripts/check-gate7-ui-contract.mjs --base-url http://127.0.0.1:4321
      - name: Capture Gate 7 desktop representatives
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode representative --base-url http://127.0.0.1:4321
      - name: Capture Gate 7 mobile representatives
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode representative --base-url http://127.0.0.1:4321
      - name: Upload Gate 7 browser artifacts
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'ui/sog-redesign-v4'
        uses: actions/upload-artifact@v4
        with:
          name: ui-redesign-v4-gate7-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ui-redesign-preview.log
            artifacts/screenshots/manifest.desktop.json
            artifacts/screenshots/manifest.mobile.json
            artifacts/screenshots/desktop/**
            artifacts/screenshots/mobile/**
            artifacts/screenshots-desktop.zip
            artifacts/screenshots-mobile.zip
