name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Synchronize Batch L manifests
        if: github.event_name == 'pull_request' && github.head_ref == 'batch-l-current-stable-assets'
        run: |
          node scripts/prepare-batch-l-pre.mjs
          node scripts/generate-registry-stats.mjs
          npm run audit:integrity
          node scripts/prepare-batch-l-post.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data scripts
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Batch L manifests and generated outputs"
            git push origin HEAD:batch-l-current-stable-assets
          fi
      - name: Validate deployment policy
        run: npm run validate:deployment-policy
      - name: Validate baseline
        run: npm run validate:baseline
      - name: Validate unresolved launch-date queue
        run: npm run validate:launch-queue
      - name: Validate unresolved terminal-date queue
        run: npm run validate:terminal-queue
      - name: Validate candidates
        run: npm run validate:candidates
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate classifications
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate events
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate Registry v3 foundation
        run: npm run validate:v3
      - name: Validate final state
        run: npm run validate:final
      - name: Validate batch finalization
        run: npm run validate:finalization
      - name: Astro check
        run: npm run check
      - name: Build and verify
        run: npm run build:site && npm run verify:deployment && npm run verify:public
