name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate data
        run: npm run validate:data

      - name: Astro check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log

      - name: Upload Astro check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-log
          path: astro-check.log

      - name: Build
        run: npm run build
