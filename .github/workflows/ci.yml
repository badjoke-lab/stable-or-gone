name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate current evidence integrity audit
        run: node scripts/validate-registry-evidence-integrity-audit.mjs
      - name: Validate guides
        run: npm run validate:guides
      - name: Validate baseline
        run: npm run validate:baseline
      - name: Validate active workstream
        run: npm run validate:active-workstream
      - name: Validate organization and relationship integrity audit
        run: node scripts/validate-registry-organization-relationship-audit.mjs
      - name: Validate reserve redemption backing audit
        run: node scripts/validate-registry-reserve-redemption-backing-audit.mjs
      - name: Validate deployment and chain identity audit
        run: node scripts/validate-registry-deployment-chain-identity-audit.mjs
      - name: Validate known-unknown and placeholder integrity audit
        run: node scripts/validate-registry-known-unknown-placeholder-integrity-audit.mjs
      - name: Validate current canonical registry integrity
        run: node scripts/validate-current-registry-integrity.mjs
      - name: Validate monitoring coverage recalculation
        run: node scripts/validate-monitoring-coverage-recalculation-100-assets.mjs
      - name: Validate unresolved launch-date queue
        run: npm run validate:launch-queue
      - name: Validate unresolved terminal-date queue
        run: npm run validate:terminal-queue
      - name: Validate candidates
        run: npm run validate:candidates
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: node scripts/validate-registry-v2-compat-batch-t.mjs
      - name: Validate classifications
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate events
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate Registry v3 foundation
        run: npm run validate:v3
      - name: Validate Registry v3 deployment view
        run: npm run validate:deployments-v3
      - name: Validate Registry v3 income profiles
        run: npm run validate:income-v3
      - name: Validate Registry v3 migration audit
        run: npm run validate:migration-v3
      - name: Validate Registry v2/v3 machine-readable parity
        run: npm run validate:parity
      - name: Generate deterministic statistics
        run: node scripts/build-stats.mjs
      - name: Validate deterministic statistics
        run: SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs
      - name: Upload deterministic statistics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-current-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/stats-current.json
            artifacts/stats-history-validation.json
      - name: Validate counts, manifest, version, and provenance integrity
        run: npm run validate:release-integrity
      - name: Validate reproducible build contract
        run: npm run validate:reproducible-build
      - name: Validate non-UI release material
        run: node scripts/validate-non-ui-release-material.mjs
      - name: Validate final state
        run: npm run validate:final
      - name: Validate UI v3 cleanup
        run: npm run validate:ui-v3-cleanup
      - name: Astro check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
      - name: Upload Astro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: astro-check.log
      - name: Build site
        shell: bash
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee build-site.log
      - name: Audit UI v3 cleanup and performance
        run: npm run audit:ui-v3-cleanup
      - name: Upload cleanup and performance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v3-cleanup-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/ui-v3-cleanup-validation.json
            artifacts/ui-v3-cleanup-audit.json
            artifacts/ui-v3-cleanup-audit.md
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-site-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: build-site.log
      - name: Verify deployment output
        run: npm run verify:deployment
      - name: Verify public layer
        shell: bash
        run: |
          set -o pipefail
          npm run verify:public 2>&1 | tee public-layer-verification.log
      - name: Upload public layer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-layer-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            public-layer-verification.log
            data/generated/deployment-taxonomy-migration.json
            dist/version.json
            dist/data/manifest.json
