name: Capture all public page screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  capture-all-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-screenshot-server.log 2>&1 &
          echo $! > /tmp/sog-screenshot-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-screenshot-server.log
          exit 1

      - name: Capture every desktop route
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode exhaustive --base-url "$CAPTURE_BASE_URL"

      - name: Capture every mobile route
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode exhaustive --base-url "$CAPTURE_BASE_URL"

      - name: Upload complete screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-all-public-page-screenshots-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/screenshots/**
            artifacts/screenshots-desktop.zip
            artifacts/screenshots-mobile.zip

      - name: Write capture summary
        if: always()
        run: |
          echo "## SOG exhaustive screenshot capture" >> "$GITHUB_STEP_SUMMARY"
          for DEVICE in desktop mobile; do
            MANIFEST="artifacts/screenshots/manifest.$DEVICE.json"
            if [ -f "$MANIFEST" ]; then
              DISCOVERED=$(node -e "const x=require('./$MANIFEST'); console.log(x.discovered_route_count)")
              CAPTURED=$(node -e "const x=require('./$MANIFEST'); console.log(x.captured_count)")
              FAILED=$(node -e "const x=require('./$MANIFEST'); console.log(x.failed_count)")
              echo "- $DEVICE: $DISCOVERED discovered / $CAPTURED captured / $FAILED failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
