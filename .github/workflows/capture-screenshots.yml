name: Capture focused pre-v2 screenshots

on:
  push:
    branches:
      - 'audit/pre-v2-restoration-pass-4'
    paths:
      - 'src/.pre-v2-pass4-focused-audit'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sog-pre-v2-pass4-focused
  cancel-in-progress: true

jobs:
  capture-focused-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-pass4-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-pass4-server.log
          exit 1

      - name: Capture guide and Stats on desktop and mobile
        run: |
          mkdir -p artifacts/pass4
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const pages = [
            ['guide-eu-mica', '/guides/eu-stablecoin-access-after-mica/'],
            ['stats', '/stats/']
          ];
          const devices = {
            desktop: { viewport: { width: 1440, height: 900 } },
            mobile: { viewport: { width: 393, height: 852 }, isMobile: true, hasTouch: true }
          };
          const browser = await chromium.launch();
          const results = [];
          for (const [deviceName, settings] of Object.entries(devices)) {
            const context = await browser.newContext({ ...settings, deviceScaleFactor: 1, reducedMotion: 'reduce' });
            const page = await context.newPage();
            for (const [name, route] of pages) {
              const response = await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'networkidle', timeout: 60000 });
              if (!response?.ok()) throw new Error(`${route}: HTTP ${response?.status()}`);
              await page.evaluate(() => document.fonts?.ready);
              const metrics = await page.evaluate(() => ({
                title: document.title,
                bodyHeight: Math.round(document.body.getBoundingClientRect().height),
                viewportWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2,
                footerHeight: Math.round(document.querySelector('.site-footer')?.getBoundingClientRect().height ?? 0),
                relatedGridColumns: getComputedStyle(document.querySelector('.guide-related-records') ?? document.body).gridTemplateColumns,
                guideLayoutColumns: getComputedStyle(document.querySelector('.guide-article-layout') ?? document.body).gridTemplateColumns,
                revisionDateWidth: Math.round(document.querySelector('.guide-revision-table th:first-child')?.getBoundingClientRect().width ?? 0),
                historyHeaderWraps: [...document.querySelectorAll('.stats-section[aria-labelledby="stats-history-title"] thead th')].map((cell) => cell.getClientRects().length > 1 || cell.scrollHeight > cell.clientHeight + 1)
              }));
              await page.screenshot({ path: `artifacts/pass4/${deviceName}-${name}.png`, fullPage: true });
              results.push({ device: deviceName, route, metrics });
            }
            await context.close();
          }
          await browser.close();
          await writeFile('artifacts/pass4/metrics.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (results.some((result) => result.metrics.horizontalOverflow)) process.exitCode = 1;
          NODE

      - name: Upload focused audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-pre-v2-pass4-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/pass4/**
            /tmp/sog-pass4-server.log

      - name: Report run to audit issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sog-pre-v2-pass4-focused -->';
            const body = `${marker}\nFocused screenshot run: **${context.runId}**\nHead: \`${context.sha}\`\nResult: **${{ job.status }}**\nArtifact: \`sog-pre-v2-pass4-${context.runId}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 455,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 455,
                body
              });
            }
