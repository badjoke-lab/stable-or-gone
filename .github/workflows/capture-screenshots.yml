name: Capture all public page screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/validate-ui-color-system.mjs'
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/validate-ui-readability.mjs'
      - 'scripts/validate-exhaustive-screenshot-audit.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/validate-ui-color-system.mjs'
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/validate-ui-readability.mjs'
      - 'scripts/validate-exhaustive-screenshot-audit.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  capture-all-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-screenshot-server.log 2>&1 &
          echo $! > /tmp/sog-screenshot-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-screenshot-server.log
          exit 1

      - name: Capture every desktop route
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode exhaustive --base-url "$CAPTURE_BASE_URL"

      - name: Capture every mobile route
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode exhaustive --base-url "$CAPTURE_BASE_URL"

      - name: Audit computed desktop colors
        run: node scripts/audit-ui-color-system.mjs

      - name: Audit computed mobile colors
        run: node scripts/audit-ui-color-system.mjs --mobile

      - name: Audit desktop readability and hierarchy
        run: node scripts/audit-ui-readability.mjs

      - name: Audit mobile readability and hierarchy
        run: node scripts/audit-ui-readability.mjs --mobile

      - name: Validate exhaustive screenshot audit
        run: node scripts/validate-exhaustive-screenshot-audit.mjs

      - name: Validate exhaustive color system
        run: node scripts/validate-ui-color-system.mjs

      - name: Validate exhaustive readability and hierarchy
        run: node scripts/validate-ui-readability.mjs

      - name: Upload screenshot manifests and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-screenshot-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: |
            artifacts/screenshots/routes.json
            artifacts/screenshots/manifest.desktop.json
            artifacts/screenshots/manifest.mobile.json
            artifacts/screenshots/color-audit.desktop.json
            artifacts/screenshots/color-audit.mobile.json
            artifacts/screenshots/color-system-validation.json
            artifacts/screenshots/readability-audit.desktop.json
            artifacts/screenshots/readability-audit.mobile.json
            artifacts/screenshots/readability-validation.json
            artifacts/screenshots/exhaustive-ui-audit.json
            /tmp/sog-screenshot-server.log

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-desktop-screenshots-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: artifacts/screenshots/desktop/**

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-mobile-screenshots-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: artifacts/screenshots/mobile/**

      - name: Write capture summary
        if: always()
        run: |
          echo "## SOG exhaustive screenshot capture" >> "$GITHUB_STEP_SUMMARY"
          for DEVICE in desktop mobile; do
            MANIFEST="artifacts/screenshots/manifest.$DEVICE.json"
            if [ -f "$MANIFEST" ]; then
              DISCOVERED=$(node -e "const x=require('./$MANIFEST'); console.log(x.discovered_route_count)")
              CAPTURED=$(node -e "const x=require('./$MANIFEST'); console.log(x.captured_count)")
              FAILED=$(node -e "const x=require('./$MANIFEST'); console.log(x.failed_count)")
              echo "- $DEVICE: $DISCOVERED discovered / $CAPTURED captured / $FAILED failed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $DEVICE: manifest missing" >> "$GITHUB_STEP_SUMMARY"
            fi
            COLOR="artifacts/screenshots/color-audit.$DEVICE.json"
            if [ -f "$COLOR" ]; then
              ORDINARY=$(node -e "const x=require('./$COLOR'); console.log(x.colored_ordinary_text_count)")
              LEGACY=$(node -e "const x=require('./$COLOR'); console.log(x.legacy_palette_hit_count)")
              SHADOW=$(node -e "const x=require('./$COLOR'); console.log(x.text_shadow_count)")
              BORDERS=$(node -e "const x=require('./$COLOR'); console.log(x.nonsemantic_colored_border_count)")
              BACKGROUNDS=$(node -e "const x=require('./$COLOR'); console.log(x.nonsemantic_colored_background_count)")
              echo "- $DEVICE color findings: ordinary=$ORDINARY legacy=$LEGACY shadow=$SHADOW borders=$BORDERS backgrounds=$BACKGROUNDS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $DEVICE color audit: missing" >> "$GITHUB_STEP_SUMMARY"
            fi
            READABILITY="artifacts/screenshots/readability-audit.$DEVICE.json"
            if [ -f "$READABILITY" ]; then
              ROUTES_WITH_FINDINGS=$(node -e "const x=require('./$READABILITY'); console.log(x.routes_with_findings)")
              TOTAL_FINDINGS=$(node -e "const x=require('./$READABILITY'); console.log(Object.values(x.totals || {}).reduce((a,b)=>a+Number(b||0),0))")
              echo "- $DEVICE readability findings: routes=$ROUTES_WITH_FINDINGS total=$TOTAL_FINDINGS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $DEVICE readability audit: missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f artifacts/screenshots/exhaustive-ui-audit.json ]; then
            FINDINGS=$(node -e "const x=require('./artifacts/screenshots/exhaustive-ui-audit.json'); console.log(x.finding_count)")
            echo "- automated UI findings: $FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- automated UI findings: audit missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/screenshots/color-system-validation.json ]; then
            COLOR_FINDINGS=$(node -e "const x=require('./artifacts/screenshots/color-system-validation.json'); console.log(x.finding_count)")
            echo "- blocking color-system findings: $COLOR_FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- color-system validation: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/screenshots/readability-validation.json ]; then
            READABILITY_FINDINGS=$(node -e "const x=require('./artifacts/screenshots/readability-validation.json'); console.log(x.finding_count)")
            echo "- blocking readability findings: $READABILITY_FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- readability validation: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- manual screenshot inspection: required" >> "$GITHUB_STEP_SUMMARY"

      - name: Report run for manual artifact inspection
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (device) => {
              const file = `artifacts/screenshots/manifest.${device}.json`;
              if (!fs.existsSync(file)) return { device, manifest: 'missing' };
              const x = JSON.parse(fs.readFileSync(file, 'utf8'));
              return {
                device,
                discovered: x.discovered_route_count,
                selected: x.selected_route_count,
                captured: x.captured_count,
                failed: x.failed_count
              };
            };
            const desktop = read('desktop');
            const mobile = read('mobile');
            const auditFile = 'artifacts/screenshots/exhaustive-ui-audit.json';
            const audit = fs.existsSync(auditFile) ? JSON.parse(fs.readFileSync(auditFile, 'utf8')) : { finding_count: 'missing' };
            const colorFile = 'artifacts/screenshots/color-system-validation.json';
            const color = fs.existsSync(colorFile) ? JSON.parse(fs.readFileSync(colorFile, 'utf8')) : { finding_count: 'missing' };
            const readabilityFile = 'artifacts/screenshots/readability-validation.json';
            const readability = fs.existsSync(readabilityFile) ? JSON.parse(fs.readFileSync(readabilityFile, 'utf8')) : { finding_count: 'missing' };
            const marker = '<!-- sog-exhaustive-screenshot-latest -->';
            const body = `${marker}\n## Exhaustive screenshot run\n\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\`\n- Workflow result: **${{ job.status }}**\n- Desktop: \`${JSON.stringify(desktop)}\`\n- Mobile: \`${JSON.stringify(mobile)}\`\n- Automated UI findings: **${audit.finding_count}**\n- Blocking color-system findings: **${color.finding_count}**\n- Blocking readability findings: **${readability.finding_count}**\n- Manual artifact inspection: **required**\n- Artifacts: \`sog-screenshot-audit-${context.runId}\`, \`sog-desktop-screenshots-${context.runId}\`, \`sog-mobile-screenshots-${context.runId}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 281,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 281,
                body
              });
            }
