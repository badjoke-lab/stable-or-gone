name: Capture final representative pre-v2 screenshots

on:
  push:
    branches:
      - 'audit/pre-v2-restoration-pass-4'
    paths:
      - 'src/.pre-v2-pass4-focused-audit'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sog-pre-v2-final-representative
  cancel-in-progress: true

jobs:
  capture-final-representative:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-final-representative-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-final-representative-server.log
          exit 1

      - name: Capture representative desktop routes
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode representative --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"

      - name: Preserve desktop manifest
        run: cp artifacts/screenshots/manifest.desktop.json artifacts/final-manifest.desktop.json

      - name: Capture representative mobile routes
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode representative --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"

      - name: Preserve mobile manifest
        run: cp artifacts/screenshots/manifest.mobile.json artifacts/final-manifest.mobile.json

      - name: Upload representative desktop images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-final-desktop-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/screenshots/desktop/**

      - name: Upload representative mobile images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-final-mobile-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/screenshots/mobile/**

      - name: Upload final manifests and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-final-manifests-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/final-manifest.desktop.json
            artifacts/final-manifest.mobile.json
            artifacts/screenshots/routes.json
            /tmp/sog-final-representative-server.log

      - name: Report run to audit issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (device) => {
              const file = `artifacts/final-manifest.${device}.json`;
              if (!fs.existsSync(file)) return { device, manifest: 'missing' };
              const x = JSON.parse(fs.readFileSync(file, 'utf8'));
              return {
                device,
                discovered: x.discovered_route_count,
                selected: x.selected_route_count,
                captured: x.captured_count,
                failed: x.failed_count
              };
            };
            const marker = '<!-- sog-pre-v2-final-representative -->';
            const desktop = read('desktop');
            const mobile = read('mobile');
            const body = `${marker}\nFinal representative run: **${context.runId}**\nHead: \`${context.sha}\`\nResult: **${{ job.status }}**\nDesktop: \`${JSON.stringify(desktop)}\`\nMobile: \`${JSON.stringify(mobile)}\`\nArtifacts: \`sog-final-desktop-${context.runId}\`, \`sog-final-mobile-${context.runId}\`, \`sog-final-manifests-${context.runId}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 455,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 455,
                body
              });
            }
