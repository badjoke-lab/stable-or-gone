name: Capture all public page screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'config/public-routes.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/collect-public-routes.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'

permissions:
  contents: read
  issues: write

jobs:
  capture-all-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-screenshot-server.log 2>&1 &
          echo $! > /tmp/sog-screenshot-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sog-screenshot-server.log
          exit 1
      - name: Capture representative desktop routes
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode representative --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"
      - name: Preserve desktop manifest
        run: cp artifacts/screenshots/manifest.desktop.json artifacts/manifest.desktop.json
      - name: Capture representative mobile routes
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode representative --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"
      - name: Preserve mobile manifest
        run: cp artifacts/screenshots/manifest.mobile.json artifacts/manifest.mobile.json
      - name: Upload desktop audit images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-core-desktop-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/screenshots/desktop/**
      - name: Upload mobile audit images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-core-mobile-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/screenshots/mobile/**
      - name: Upload manifests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-core-manifests-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/manifest.desktop.json
            artifacts/manifest.mobile.json
            artifacts/screenshots/routes.json
            /tmp/sog-screenshot-server.log
      - name: Write capture summary
        if: always()
        run: |
          echo "## SOG representative screenshot capture" >> "$GITHUB_STEP_SUMMARY"
          for DEVICE in desktop mobile; do
            MANIFEST="artifacts/manifest.$DEVICE.json"
            if [ -f "$MANIFEST" ]; then
              DISCOVERED=$(node -e "const x=require('./$MANIFEST'); console.log(x.discovered_route_count)")
              CAPTURED=$(node -e "const x=require('./$MANIFEST'); console.log(x.captured_count)")
              FAILED=$(node -e "const x=require('./$MANIFEST'); console.log(x.failed_count)")
              echo "- $DEVICE: $DISCOVERED discovered / $CAPTURED representative captures / $FAILED failed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $DEVICE: manifest missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
