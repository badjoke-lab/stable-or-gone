name: Capture representative public page screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture scope
        required: true
        default: representative
        type: choice
        options:
          - representative
          - exhaustive
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'public/stablecoin-logos/**'
      - 'config/public-routes.json'
      - 'config/stablecoin-logo-decisions.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/capture-stablecoin-mark-mix.mjs'
      - 'scripts/capture-stablecoin-logo-catalog.mjs'
      - 'scripts/audit-stablecoin-logo-coverage.mjs'
      - 'scripts/audit-representative-layout-geometry.mjs'
      - 'scripts/collect-public-routes.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/validate-ui-color-system.mjs'
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/validate-ui-readability.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'public/stablecoin-logos/**'
      - 'config/public-routes.json'
      - 'config/stablecoin-logo-decisions.json'
      - 'scripts/capture-site-screenshots.mjs'
      - 'scripts/capture-stablecoin-mark-mix.mjs'
      - 'scripts/capture-stablecoin-logo-catalog.mjs'
      - 'scripts/audit-stablecoin-logo-coverage.mjs'
      - 'scripts/audit-representative-layout-geometry.mjs'
      - 'scripts/collect-public-routes.mjs'
      - 'scripts/audit-ui-color-system.mjs'
      - 'scripts/validate-ui-color-system.mjs'
      - 'scripts/audit-ui-readability.mjs'
      - 'scripts/validate-ui-readability.mjs'
      - '.github/workflows/capture-screenshots.yml'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-representative-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
      CAPTURE_MODE: ${{ inputs.mode || 'representative' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-screenshot-server.log 2>&1 &
          echo $! > /tmp/sog-screenshot-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-screenshot-server.log
          exit 1

      - name: Capture representative desktop routes
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode "$CAPTURE_MODE" --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"

      - name: Capture representative mobile routes
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode "$CAPTURE_MODE" --samples-per-family 3 --base-url "$CAPTURE_BASE_URL"

      - name: Audit canonical Stablecoin logo coverage
        run: node scripts/audit-stablecoin-logo-coverage.mjs

      - name: Capture all 117 Stablecoin marks
        run: node scripts/capture-stablecoin-logo-catalog.mjs

      - name: Capture and validate mixed Stablecoin marks
        run: node scripts/capture-stablecoin-mark-mix.mjs

      - name: Audit representative layout geometry
        run: node scripts/audit-representative-layout-geometry.mjs

      - name: Audit computed desktop colors
        run: node scripts/audit-ui-color-system.mjs

      - name: Audit computed mobile colors
        run: node scripts/audit-ui-color-system.mjs --mobile

      - name: Audit desktop readability and hierarchy
        run: node scripts/audit-ui-readability.mjs

      - name: Audit mobile readability and hierarchy
        run: node scripts/audit-ui-readability.mjs --mobile

      - name: Validate color system
        run: node scripts/validate-ui-color-system.mjs

      - name: Validate readability and hierarchy
        run: node scripts/validate-ui-readability.mjs

      - name: Upload representative screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-representative-screenshot-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: |
            artifacts/screenshots/routes.json
            artifacts/screenshots/manifest.desktop.json
            artifacts/screenshots/manifest.mobile.json
            artifacts/screenshots/stablecoin-mark-mix-audit.json
            artifacts/screenshots/layout-geometry-audit.json
            artifacts/stablecoin-logo-coverage.json
            artifacts/stablecoin-logo-catalog/stablecoin-logo-catalog.json
            artifacts/screenshots/color-audit.desktop.json
            artifacts/screenshots/color-audit.mobile.json
            artifacts/screenshots/color-system-validation.json
            artifacts/screenshots/readability-audit.desktop.json
            artifacts/screenshots/readability-audit.mobile.json
            artifacts/screenshots/readability-validation.json
            /tmp/sog-screenshot-server.log

      - name: Upload all-record Stablecoin mark catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-stablecoin-mark-catalog-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/stablecoin-logo-catalog/index.html
            artifacts/stablecoin-logo-catalog/stablecoin-logo-catalog.png
            artifacts/stablecoin-logo-catalog/stablecoin-logo-catalog.json

      - name: Upload representative desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-representative-desktop-screenshots-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: artifacts/screenshots/desktop/**

      - name: Upload representative mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-representative-mobile-screenshots-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: artifacts/screenshots/mobile/**

      - name: Write capture summary
        if: always()
        run: |
          echo "## SOG representative screenshot capture" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: $CAPTURE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail samples per family: 3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stablecoin mark decisions: 117 of 117" >> "$GITHUB_STEP_SUMMARY"
          echo "- All-record Stablecoin mark catalog: 117 cards" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mixed Stablecoin marks: desktop and mobile" >> "$GITHUB_STEP_SUMMARY"
          echo "- Layout geometry: every representative desktop/mobile route" >> "$GITHUB_STEP_SUMMARY"
          for DEVICE in desktop mobile; do
            MANIFEST="artifacts/screenshots/manifest.$DEVICE.json"
            if [ -f "$MANIFEST" ]; then
              DISCOVERED=$(node -e "const x=require('./$MANIFEST'); console.log(x.discovered_route_count)")
              SELECTED=$(node -e "const x=require('./$MANIFEST'); console.log(x.selected_route_count)")
              CAPTURED=$(node -e "const x=require('./$MANIFEST'); console.log(x.captured_count)")
              FAILED=$(node -e "const x=require('./$MANIFEST'); console.log(x.failed_count)")
              echo "- $DEVICE: $DISCOVERED discovered / $SELECTED selected / $CAPTURED captured / $FAILED failed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $DEVICE: manifest missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "- Manual inspection: representative screenshots and all-record mark catalog" >> "$GITHUB_STEP_SUMMARY"
