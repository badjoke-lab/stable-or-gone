name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate complete build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build > batch-m-build.log 2>&1
      - name: Capture build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: tail -n 140 batch-m-build.log > docs/batch-m-build-error.log
      - name: Clear temporary files
        run: |
          rm -f batch-m-build.log
          rm -f package-lock.json
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            rm -f docs/batch-m-build-error.log
          fi
      - name: Commit validation result
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Batch M build validation"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Fail on build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          cat docs/batch-m-build-error.log
          exit 1
