name: Registry stats

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate registry stats
        run: node scripts/generate-registry-stats.mjs
      - name: Upload generated stats
        uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: data/generated/registry-stats.json
      - name: Validate stats contract
        run: node scripts/validate-registry-stats.mjs
      - name: Verify committed stats are current
        run: git diff --exit-code -- data/generated/registry-stats.json
