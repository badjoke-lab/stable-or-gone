name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize IRON launch synchronization
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/iron-sync-data.mjs
          node scripts/iron-sync-docs.mjs
          cat > .github/workflows/registry-stats.yml <<'EOF'
          name: Registry stats

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Validate current output
                  run: node scripts/validate-registry-stats.mjs
                - name: Rebuild output
                  run: node scripts/generate-registry-stats.mjs
                - name: Validate rebuilt output
                  run: node scripts/validate-registry-stats.mjs
                - uses: actions/upload-artifact@v4
                  with:
                    name: registry-stats
                    path: data/generated/registry-stats.json
          EOF
          rm scripts/iron-sync-data.mjs scripts/iron-sync-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement IRON launch chronology"
          git push origin "HEAD:${HEAD_REF}"
      - name: Validate current output
        run: node scripts/validate-registry-stats.mjs
      - name: Rebuild output
        run: node scripts/generate-registry-stats.mjs
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: data/generated/registry-stats.json
