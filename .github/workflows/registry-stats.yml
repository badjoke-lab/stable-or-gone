name: Registry stats

on:
  pull_request:
  push:
    branches: [main, date-batch-o]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply temporary Batch O data updates
        if: github.ref == 'refs/heads/date-batch-o'
        run: |
          python scripts/tmp-batch-o-canonical.py
          python scripts/tmp-batch-o-index.py
      - name: Validate current output
        if: github.ref != 'refs/heads/date-batch-o'
        run: node scripts/validate-registry-stats.mjs
      - name: Rebuild output
        run: node scripts/generate-registry-stats.mjs
      - name: Regenerate integrity audit
        if: github.ref == 'refs/heads/date-batch-o'
        run: npm run audit:integrity
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: |
            data/stablecoins.json
            data/stablecoins-batch-h.json
            data/stablecoins-batch-j.json
            docs/migration/registry-v2-baseline.json
            data/generated/registry-stats.json
            data/generated/registry-integrity-audit.json
            docs/audits/registry-70-final-audit.md
