name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild output
        run: node scripts/generate-registry-stats.mjs
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - name: Commit regenerated output
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/registry-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Batch M registry stats"
            git push origin HEAD:${{ github.head_ref }}
          fi
