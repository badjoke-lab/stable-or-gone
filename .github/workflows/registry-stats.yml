name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild output
        run: |
          node scripts/generate-registry-stats-batch-o.mjs
          node scripts/build-value-state-stats.mjs
          node scripts/build-primary-display-relationship-stats.mjs
          node scripts/build-evidence-source-identity-stats.mjs
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: data/generated/registry-stats.json
