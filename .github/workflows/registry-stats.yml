name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Finalize Batch M
        run: node scripts/finalize-batch-m-bootstrap.mjs
      - name: Apply corrected reserve components
        run: |
          base64 -d data/reserve-components-v3-batch-m.fixed.b64 > data/reserve-components-v3-batch-m.json
          rm -f data/reserve-components-v3-batch-m.fixed.b64
          rm -f data/reserve-components-v3-batch-m.fixed.json
      - name: Restore manual publication state
        run: |
          cat >> docs/roadmap.md <<'EOF'

          ## Manual production publication state

          ```text
          Automatic production deployment: disabled
          Preview branch deployments: disabled
          Publication path: manual GitHub Actions workflow only
          Manual production publication activation — PASS
          Deployment workflow run: 27908380603
          ```
          EOF
      - name: Validate complete build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build > batch-m-build.log 2>&1
      - name: Capture build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: tail -n 120 batch-m-build.log > docs/batch-m-build-error.log
      - name: Clear temporary files
        run: |
          rm -f batch-m-build.log
          rm -f package-lock.json
          rm -f docs/batch-m-finalize-trigger.txt
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            rm -f docs/batch-m-build-error.log
          fi
      - name: Commit finalized Batch M
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Batch M registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Fail on build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          cat docs/batch-m-build-error.log
          exit 1
