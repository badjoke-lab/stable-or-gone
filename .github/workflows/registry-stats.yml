name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize MIM boundary synchronization
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: node scripts/finalize-mim-boundaries.mjs
      - name: Validate current output
        run: node scripts/validate-registry-stats.mjs
      - name: Rebuild output
        run: node scripts/generate-registry-stats.mjs
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: data/generated/registry-stats.json
