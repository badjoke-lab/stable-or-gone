name: Registry stats

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current output
        run: node scripts/validate-registry-stats.mjs
      - name: Rebuild output
        run: node scripts/generate-registry-stats-batch-o.mjs
      - name: Validate rebuilt output
        run: node scripts/validate-registry-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stats
          path: data/generated/registry-stats.json
