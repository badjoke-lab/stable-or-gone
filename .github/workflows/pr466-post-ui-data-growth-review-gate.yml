name: PR 466 Post-UI Data-Growth Review Gate
run-name: PR 466 review gate · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - pr466-post-ui-data-growth-review-gate
  pull_request:
    branches:
      - chore/post-ui-v3-agent-authority-reset
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr466-post-ui-data-growth-review-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr466-post-ui-data-growth-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'chore/post-ui-v3-agent-authority-reset' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate PR 466 review-gate decision
        run: node scripts/validate-post-ui-data-growth-review-gate-pr466.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Validate canonical and release contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity

      - name: Verify governance-only boundary
        run: git diff --exit-code "origin/${BASE_BRANCH}...HEAD" -- data/ src/ public/

      - name: Astro check and build
        run: |
          npm run check
          npm run build

      - name: Write review-gate summary
        if: always()
        run: |
          {
            echo '## PR #466 Post-UI Data-Growth Review Gate'
            echo
            echo '- Source canonical assets: 114'
            echo '- Authorized next PR: #467'
            echo '- Selected assets: PLNQ, GBPQ'
            echo '- Maximum new canonical assets: 2'
            echo '- Canonical changes in PR #466: 0'
            echo '- Public changes in PR #466: 0'
            echo '- Next boundary after PR #467: REVIEW GATE'
          } >> "$GITHUB_STEP_SUMMARY"
