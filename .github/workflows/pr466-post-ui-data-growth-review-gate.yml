name: Finalize PR503 launch-date review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-pr503-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/launch-date-boundary-review-batch-1-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-date-boundary-review-batch-1-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Generate reviewed files
        run: node scripts/apply-launch-date-boundary-review-pr503.mjs
      - name: Fix post-baseline canonical lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-launch-date-boundary-review-pr503.mjs')
          s = p.read_text()
          s = s.replace("const baseline = readJson('docs/migration/registry-v2-baseline.json');\n", "")
          s = s.replace("const stablecoins = baseline.data_groups.stablecoins.flatMap((file) => readJson(file));\nconst stablecoinById = new Map(stablecoins.map((row) => [row.id, row]));\n", "const canonicalRows = [];\nconst walkJson = (dir) => {\n  for (const entry of fs.readdirSync(path.join(root, dir), { withFileTypes: true })) {\n    const rel = path.join(dir, entry.name);\n    if (entry.isDirectory()) walkJson(rel);\n    else if (entry.isFile() && entry.name.endsWith('.json')) {\n      let parsed;\n      try { parsed = readJson(rel); } catch { continue; }\n      const visit = (value) => {\n        if (Array.isArray(value)) return value.forEach(visit);\n        if (!value || typeof value !== 'object') return;\n        if (typeof value.id === 'string' && Object.hasOwn(value, 'launch_date')) canonicalRows.push(value);\n        Object.values(value).forEach(visit);\n      };\n      visit(parsed);\n    }\n  }\n};\nwalkJson('data');\nconst stablecoinById = new Map(canonicalRows.map((row) => [row.id, row]));\n")
          p.write_text(s)
          PY
      - name: Validate reviewed result
        run: node scripts/validate-launch-date-boundary-review-pr503.mjs
      - name: Restore permanent workflow and create normalizable marker
        run: |
          git show origin/main:.github/workflows/pr466-post-ui-data-growth-review-gate.yml > .github/workflows/pr466-post-ui-data-growth-review-gate.yml
          mkdir -p .github
          printf 'temporary PR503 finalizer marker\n' > .github/pr503-finalizer-marker.txt
      - name: Commit reviewed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete six launch-date boundary reviews"
          git push origin HEAD:agent/launch-date-boundary-review-batch-1-implementation
