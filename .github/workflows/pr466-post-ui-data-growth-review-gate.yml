name: Finalize PR504 authority closeout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-pr504-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/post-pr503-authority-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-pr503-authority-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Generate authority closeout files
        run: node scripts/apply-post-pr503-authority-sync-pr504.mjs
      - name: Validate authority closeout
        run: node scripts/validate-post-pr503-authority-sync-pr504.mjs
      - name: Restore permanent workflow and create normalizable marker
        run: |
          git show origin/main:.github/workflows/pr466-post-ui-data-growth-review-gate.yml > .github/workflows/pr466-post-ui-data-growth-review-gate.yml
          printf 'temporary PR504 finalizer marker\n' > .github/pr504-finalizer-marker.txt
      - name: Commit authority closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close the post-PR503 authority checkpoint"
          git push origin HEAD:agent/post-pr503-authority-sync
