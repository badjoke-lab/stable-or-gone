name: Finalize PR507 authority closeout
run-name: Finalize PR507 authority · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - agent/post-pr506-authority-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr507-authority
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/post-pr506-authority-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/post-pr506-authority-sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Generate authority closeout
        run: node scripts/finalize-pr507-authority.mjs

      - name: Validate authority closeout
        run: node scripts/validate-post-pr506-authority-sync-pr507.mjs

      - name: Restore permanent workflow and remove finalizer
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr466-post-ui-data-growth-review-gate.yml
          rm scripts/finalize-pr507-authority.mjs
          rm -f .github/pr507-finalizer-trigger.txt

      - name: Commit authority closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close post-PR506 authority checkpoint'
          git push origin HEAD:agent/post-pr506-authority-sync
