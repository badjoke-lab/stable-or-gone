name: Finalize PR505 archive payload authority
run-name: Finalize PR505 authority · ${{ github.sha }}

on:
  push:
    branches:
      - agent/evidence-archive-payload-verification-batch-1-authority
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr505-authority
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/evidence-archive-payload-verification-batch-1-authority

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Generate authority files
        run: node scripts/finalize-pr505-authority.mjs

      - name: Validate authority
        run: node scripts/validate-evidence-archive-payload-verification-pr505.mjs

      - name: Restore permanent workflow and remove finalizer
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr466-post-ui-data-growth-review-gate.yml
          rm scripts/finalize-pr505-authority.mjs

      - name: Commit authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/roadmap.md docs/spec-governance.md \
            config/evidence-archive-payload-verification-batch-1.json \
            docs/quality/evidence-archive-payload-verification-batch-1-spec.md \
            docs/roadmap-amendments/2026-08-01-evidence-archive-payload-verification-batch-1.md \
            scripts/validate-evidence-archive-payload-verification-pr505.mjs \
            scripts/validate-active-workstream.mjs \
            .github/workflows/pr466-post-ui-data-growth-review-gate.yml \
            scripts/finalize-pr505-authority.mjs
          git commit -m 'Authorize archive payload verification batch 1'
          git push origin HEAD:agent/evidence-archive-payload-verification-batch-1-authority
