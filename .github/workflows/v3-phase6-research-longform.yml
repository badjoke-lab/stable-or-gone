name: V3 Phase 6 research and longform audit

on:
  push:
    branches:
      - 'ui/v3-cya-dark-redesign'
    paths:
      - 'src/styles/v3-cya-dark-research-longform.css'
      - '.github/workflows/v3-phase6-research-longform.yml'
      - 'src/.v3-phase6-audit-trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sog-v3-phase6-research-longform
  cancel-in-progress: true

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm clean-install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-v3-phase6-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sog-v3-phase6-server.log
          exit 1
      - name: Capture Phase 6 pages
        run: |
          mkdir -p artifacts/v3-phase6
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const base = 'http://127.0.0.1:4173';
          const routes = [
            ['timeline','/timeline/'],
            ['access-regulation','/access-regulation/'],
            ['guide','/guides/eu-stablecoin-access-after-mica/'],
            ['methodology','/methodology/'],
            ['glossary','/glossary/'],
            ['contact','/contact/']
          ];
          const devices = {
            desktop: { viewport: { width: 1440, height: 900 } },
            mobile: { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true }
          };
          const browser = await chromium.launch();
          const results = [];
          for (const [device, settings] of Object.entries(devices)) {
            const context = await browser.newContext({ ...settings, deviceScaleFactor: 1, reducedMotion: 'reduce' });
            const page = await context.newPage();
            for (const [name, route] of routes) {
              const response = await page.goto(`${base}${route}`, { waitUntil: 'networkidle', timeout: 60000 });
              if (!response?.ok()) throw new Error(`${route}: HTTP ${response?.status()}`);
              if (route === '/timeline/') await page.waitForSelector('[data-timeline-results]:not([hidden])', { timeout: 15000 });
              if (route === '/access-regulation/') await page.waitForSelector('[data-ar-results]:not([hidden])', { timeout: 15000 });
              await page.evaluate(() => document.fonts?.ready);
              const metrics = await page.evaluate(({ device, route }) => {
                const toc = document.querySelector('.guide-article-toc, .longform-toc');
                const firstSurface = document.querySelector('.timeline-boundary-grid p, .ar-boundary-grid p, .guide-article-content > section, .longform-content > section, .reference-section, .utility-section');
                return {
                  device,
                  route,
                  bodyHeight: Math.round(document.body.getBoundingClientRect().height),
                  viewportWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2,
                  background: getComputedStyle(document.body).backgroundColor,
                  surfaceRadius: firstSurface ? getComputedStyle(firstSurface).borderRadius : null,
                  tocPosition: toc ? getComputedStyle(toc).position : null,
                  timelineItems: document.querySelectorAll('.timeline-item').length,
                  accessCards: document.querySelectorAll('.ar-result-card').length
                };
              }, { device, route });
              await page.screenshot({ path: `artifacts/v3-phase6/${device}-${name}.png`, fullPage: true });
              results.push(metrics);
            }
            await context.close();
          }
          await browser.close();
          await writeFile('artifacts/v3-phase6/metrics.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          const failures = results.filter((item) => item.horizontalOverflow || item.background !== 'rgb(5, 6, 7)' || item.surfaceRadius === '8px' || item.surfaceRadius === '12px');
          if (failures.length) {
            console.error(JSON.stringify(failures, null, 2));
            process.exitCode = 1;
          }
          NODE
      - name: Upload Phase 6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-v3-phase6-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/v3-phase6/**
            /tmp/sog-v3-phase6-server.log
      - name: Report Phase 6 run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'artifacts/v3-phase6/metrics.json';
            const metrics = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : [];
            const marker = '<!-- sog-v3-phase6-specimen -->';
            const body = `${marker}\nV3 Phase 6 run: **${context.runId}**\nHead: \`${context.sha}\`\nResult: **${{ job.status }}**\nMetrics: \`${JSON.stringify(metrics)}\`\nArtifact: \`sog-v3-phase6-${context.runId}\``;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: 457, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 457, body });
