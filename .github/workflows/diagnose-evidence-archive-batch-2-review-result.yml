name: Diagnose Evidence Archive Batch 2 review result

on:
  push:
    branches:
      - agent/evidence-archive-payload-verification-batch-2-review-result
    paths:
      - .github/workflows/diagnose-evidence-archive-batch-2-review-result.yml
      - scripts/validate-evidence-archive-payload-verification-batch-2-review-result.mjs
      - data/editorial-research/evidence-archive-payload-verification-batch-2-review-2026-08-09.json

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run result validator and preserve output
        shell: bash
        run: |
          set +e
          node scripts/validate-evidence-archive-payload-verification-batch-2-review-result.mjs > validator-output.txt 2>&1
          code=$?
          cat validator-output.txt
          echo "$code" > validator-exit-code.txt
          exit 0
      - name: Upload validator diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: evidence-archive-batch-2-review-result-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            validator-output.txt
            validator-exit-code.txt
