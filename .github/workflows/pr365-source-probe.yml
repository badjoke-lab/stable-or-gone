name: PR 365 Source Probe

on:
  push:
    branches:
      - pr365-evidence-archive-maintenance-batch-2

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr365-evidence-archive-maintenance-batch-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-pr365-evidence-sources.mjs
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/migration/pr365-evidence-source-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Record PR 365 source probe"
          git push
