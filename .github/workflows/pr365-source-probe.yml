name: PR 365 Source Probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr365-evidence-archive-maintenance-batch-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe sources
        run: node scripts/probe-pr365-evidence-sources.mjs
      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: pr365-evidence-source-probe-${{ github.run_id }}
          path: docs/migration/pr365-evidence-source-probe.json
          if-no-files-found: error
