name: Remove forbidden UI important declaration

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/remove-ui-important.yml
  push:
    branches: [fix/full-representative-ui-remediation]
    paths:
      - .github/workflows/remove-ui-important.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-representative-ui-remediation
          fetch-depth: 0
      - name: Remove forbidden declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          before = '.guide-article-toc[hidden],.longform-toc[hidden]{display:none!important}'
          after = '.guide-article-toc[hidden],.longform-toc[hidden]{display:none}'
          if source.count(before) != 1:
              raise SystemExit(f'Expected one forbidden declaration, found {source.count(before)}')
          path.write_text(source.replace(before, after))
          PY
          git rm .github/workflows/remove-ui-important.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Remove forbidden important declaration"
          git push origin HEAD:fix/full-representative-ui-remediation
