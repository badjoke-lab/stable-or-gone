name: Resolve all Stablecoin logos

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/export-stablecoin-logo-research.mjs'
      - 'scripts/crawl-stablecoin-logo-candidates.mjs'
      - 'scripts/import-final-stablecoin-logo-decisions.mjs'
      - '.github/workflows/logo-resolution-research.yml'
      - 'data/**'
      - 'src/utils/stablecoinLogo.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-all-logo-decisions:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and image tooling
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Export complete Stablecoin research inventory
        run: node scripts/export-stablecoin-logo-research.mjs
      - name: Crawl attributable candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl-stablecoin-logo-candidates.mjs
      - name: Import final decisions and local assets
        run: node scripts/import-final-stablecoin-logo-decisions.mjs
      - name: Validate 116-record closure
        run: node scripts/audit-stablecoin-logo-coverage.mjs
      - name: Build site
        run: npm run build
      - name: Commit final logo closure
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/stablecoin-logos \
            src/utils/stablecoinLogo.ts \
            config/stablecoin-logo-decisions.json \
            scripts/audit-stablecoin-logo-coverage.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Resolve logo decisions for all Stablecoin records"
          git push origin "HEAD:$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-logo-finalization-${{ github.run_id }}
          path: |
            artifacts/stablecoin-logo-research.json
            artifacts/stablecoin-logo-candidates.json
            artifacts/stablecoin-logo-candidates/**
            artifacts/stablecoin-logo-coverage.json
          if-no-files-found: warn
          retention-days: 14
