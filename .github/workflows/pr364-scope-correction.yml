name: PR 364 Scope Correction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  correct:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore USDG reserve scope and validator contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profileFile='data/stablecoin-profiles-v2.json';
          const profiles=JSON.parse(fs.readFileSync(profileFile,'utf8'));
          const usdg=profiles.find((row)=>row.id==='sog_st_usdg');
          if(!usdg) throw new Error('USDG profile missing');
          usdg.reserve_profile={
            backing_types:['mixed'],
            summary:'Reserve disclosure entry points exist, while exact issuer-entity and period-level reporting remain under review.',
            disclosure_status:'available_or_source_review_needed',
            as_of_date:'2026-06-05',
            latest_report_id:null,
            confidence:'medium',
            evidence_ids:[]
          };
          fs.writeFileSync(profileFile,`${JSON.stringify(profiles,null,2)}\n`);

          const validatorFile='scripts/validate-tier-a-dossier-batch-4-pr364.mjs';
          let validator=fs.readFileSync(validatorFile,'utf8');
          validator=validator.replace(
            "equal(usdgProfile?.reserve_profile?.backing_types, ['cash','government_securities'], 'USDG backing types changed');",
            "equal(usdgProfile?.reserve_profile?.backing_types, ['mixed'], 'USDG reserve profile must remain outside the PR #364 change scope');"
          );
          if(!validator.includes("USDG reserve profile must remain outside the PR #364 change scope")) throw new Error('PR #364 reserve validator marker missing');
          fs.writeFileSync(validatorFile,validator);
          NODE

      - name: Rebuild affected statistics snapshot and handoff hashes
        run: node scripts/rebuild-pr364-stats-snapshot.mjs

      - name: Run corrected validators
        id: validate
        shell: bash
        run: |
          mkdir -p artifacts/pr364-scope-diagnostic
          : > artifacts/pr364-scope-diagnostic/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            log="artifacts/pr364-scope-diagnostic/${name}.log"
            if "$@" >"$log" 2>&1; then
              echo "${name}: success" >> artifacts/pr364-scope-diagnostic/summary.txt
            else
              echo "${name}: failure" >> artifacts/pr364-scope-diagnostic/summary.txt
              failed=1
            fi
          }
          run_check pr364 node scripts/validate-tier-a-dossier-batch-4-pr364.mjs
          run_check active-workstream npm run validate:active-workstream
          run_check non-ui node scripts/validate-non-ui-release-material.mjs
          run_check data npm run validate:data
          run_check profiles npm run validate:profiles
          run_check evidence-relations npm run validate:evidence-relations-v2
          run_check evidence-integrity node scripts/validate-registry-evidence-integrity-audit.mjs
          run_check reserve-redemption node scripts/audit-registry-reserve-redemption-backing.mjs
          run_check registry-stats-generate node scripts/generate-registry-stats-batch-o.mjs
          run_check registry-value-states node scripts/build-value-state-stats.mjs
          run_check registry-primary-display node scripts/build-primary-display-relationship-stats.mjs
          run_check registry-evidence-identity node scripts/build-evidence-source-identity-stats.mjs
          run_check registry-stats-validate node scripts/validate-registry-stats.mjs
          run_check v3 npm run validate:v3
          run_check deployments-v3 npm run validate:deployments-v3
          run_check income-v3 npm run validate:income-v3
          run_check parity npm run validate:parity
          run_check release npm run validate:release-integrity
          run_check build-stats node scripts/build-stats.mjs
          run_check validate-stats env SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
          run_check stats-history env SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Commit corrected scope and statistics
        if: steps.validate.outputs.failed == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/stablecoin-profiles-v2.json \
            config/primary-display-relationships.mjs \
            scripts/validate-tier-a-dossier-batch-4-pr364.mjs \
            scripts/validate-registry-evidence-integrity-audit.mjs \
            docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json \
            data/stats-history.json
          if git diff --cached --quiet; then
            echo 'PR #364 scope correction is already synchronized.'
            exit 0
          fi
          git commit -m 'Keep PR 364 within the authorized dossier scope'
          git pull --rebase origin pr364-tier-a-dossier-batch-4
          git push origin HEAD:pr364-tier-a-dossier-batch-4

      - name: Upload scope diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr364-scope-diagnostic-${{ github.run_id }}
          path: artifacts/pr364-scope-diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Publish correction status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-scope-correction -->';
            let handoff=null;
            try{handoff=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json','utf8'));}catch{}
            const dir='artifacts/pr364-scope-diagnostic';
            const summary=fs.existsSync(`${dir}/summary.txt`)?fs.readFileSync(`${dir}/summary.txt`,'utf8').trim():'not generated';
            const failures=[];
            if(fs.existsSync(dir)) for(const name of fs.readdirSync(dir).filter((name)=>name.endsWith('.log')).sort()) {
              const text=fs.readFileSync(`${dir}/${name}`,'utf8');
              if(text.match(/error|failed|invalid|mismatch|missing|must|expected/i)) failures.push(`### ${name}\n\n\`\`\`text\n${text.split('\n').slice(-30).join('\n').slice(-5000)}\n\`\`\``);
            }
            const body=`${marker}\n## PR #364 scope correction\n\n- Job status: **${{ job.status }}**\n- Failure flag: **${{ steps.validate.outputs.failed }}**\n- USDG reserve profile: **preserved from main**\n- USDG redemption improvement: **retained**\n- Primary display tie: **resolved explicitly**\n- Stats model SHA-256: \`${handoff?.stats_model_sha256??'not-generated'}\`\n- Stats snapshot SHA-256: \`${handoff?.stats_snapshot_sha256??'not-generated'}\`\n- Head: \`${context.sha}\`\n\n\`\`\`text\n${summary}\n\`\`\`\n\n${failures.join('\n\n')}`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Fail when corrected validation failed
        if: steps.validate.outputs.failed == '1'
        run: exit 1
