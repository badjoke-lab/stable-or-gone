name: PR 364 Scope Correction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  correct:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore USDG reserve scope and validator contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profileFile='data/stablecoin-profiles-v2.json';
          const profiles=JSON.parse(fs.readFileSync(profileFile,'utf8'));
          const usdg=profiles.find((row)=>row.id==='sog_st_usdg');
          if(!usdg) throw new Error('USDG profile missing');
          usdg.reserve_profile={
            backing_types:['mixed'],
            summary:'Reserve disclosure entry points exist, while exact issuer-entity and period-level reporting remain under review.',
            disclosure_status:'available_or_source_review_needed',
            as_of_date:'2026-06-05',
            latest_report_id:null,
            confidence:'medium',
            evidence_ids:[]
          };
          fs.writeFileSync(profileFile,`${JSON.stringify(profiles,null,2)}\n`);

          const validatorFile='scripts/validate-tier-a-dossier-batch-4-pr364.mjs';
          let validator=fs.readFileSync(validatorFile,'utf8');
          validator=validator.replace(
            "equal(usdgProfile?.reserve_profile?.backing_types, ['cash','government_securities'], 'USDG backing types changed');",
            "equal(usdgProfile?.reserve_profile?.backing_types, ['mixed'], 'USDG reserve profile must remain outside the PR #364 change scope');"
          );
          if(!validator.includes("USDG reserve profile must remain outside the PR #364 change scope")) throw new Error('PR #364 reserve validator marker missing');
          fs.writeFileSync(validatorFile,validator);
          NODE

      - name: Restore pre-PR364 checkpoint inputs
        run: |
          git checkout origin/main -- \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-v3-parity-baseline.json \
            docs/migration/registry-release-integrity-baseline.json \
            data/stats-history.json

      - name: Rebuild PR 364 forward checkpoints
        run: |
          git show 6ffbd2e4c67669aed32d15c54321adf721a55ed9:scripts/finalize-tier-a-dossier-batch-4-pr364.mjs > scripts/.pr364-finalize-temp.mjs
          node scripts/.pr364-finalize-temp.mjs
          rm scripts/.pr364-finalize-temp.mjs

      - name: Synchronize current release validators and provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const validatorFile='scripts/validate-non-ui-release-material.mjs';
          let validator=fs.readFileSync(validatorFile,'utf8');
          validator=validator
            .replaceAll('sog_release_integrity_pr360_112_assets_2026_07_14','sog_release_integrity_pr364_112_assets_2026_07_14')
            .replaceAll('sog_evidence_correction_batch_canonical_112_checkpoint_pr360_2026_07_14','sog_tier_a_dossier_batch_4_canonical_112_checkpoint_pr364_2026_07_14')
            .replaceAll('current release-integrity baseline must remain the PR #360 canonical baseline','current release-integrity baseline must remain the PR #364 canonical baseline')
            .replaceAll('current canonical checkpoint must remain the PR #360 correction checkpoint','current canonical checkpoint must remain the PR #364 dossier checkpoint')
            .replace('currentCheckpoint.evidence_quality?.archive_not_recorded_count === 170','currentCheckpoint.evidence_quality?.archive_not_recorded_count === 172')
            .replace('current canonical checkpoint must bind 170 no-archive rows','current canonical checkpoint must bind 172 no-archive rows')
            .replace("releaseBaseline.evidence_quality?.archive_index_count === correctionOutcome.archive_index_count_after", "releaseBaseline.evidence_quality?.archive_index_count === currentCheckpoint.evidence_quality?.archive_index_count")
            .replace("releaseBaseline.evidence_quality?.archive_not_recorded_count === correctionOutcome.archive_not_recorded_count_after", "releaseBaseline.evidence_quality?.archive_not_recorded_count === currentCheckpoint.evidence_quality?.archive_not_recorded_count")
            .replace('latestSnapshot?.totals?.evidence === 557','latestSnapshot?.totals?.evidence === 559')
            .replace('stats history latest snapshot must contain 557 Evidence records','stats history latest snapshot must contain 559 Evidence records');
          fs.writeFileSync(validatorFile,validator);

          const release=JSON.parse(fs.readFileSync('docs/migration/registry-release-integrity-baseline.json','utf8'));
          const provenanceFile='data/generated/build-provenance.json';
          const provenance=JSON.parse(fs.readFileSync(provenanceFile,'utf8'));
          provenance.canonical_record_counts={
            ...release.expected_v2_counts,
            legal_profiles:release.expected_v3_counts.legal_profiles,
            stable_asset_relationships:release.expected_v3_counts.stable_asset_relationships,
            reserve_components:release.expected_v3_counts.reserve_components,
            income_profiles:release.expected_v3_counts.income_profiles
          };
          provenance.route_counts=release.expected_route_counts;
          fs.writeFileSync(provenanceFile,`${JSON.stringify(provenance,null,2)}\n`);
          NODE

      - name: Validate corrected PR 364 state
        run: |
          node scripts/validate-tier-a-dossier-batch-4-pr364.mjs
          npm run validate:active-workstream
          node scripts/validate-non-ui-release-material.mjs
          npm run validate:data
          npm run validate:profiles
          npm run validate:evidence-relations-v2
          node scripts/validate-registry-evidence-integrity-audit.mjs
          node scripts/audit-registry-reserve-redemption-backing.mjs
          node scripts/generate-registry-stats-batch-o.mjs
          node scripts/build-value-state-stats.mjs
          node scripts/build-primary-display-relationship-stats.mjs
          node scripts/build-evidence-source-identity-stats.mjs
          node scripts/validate-registry-stats.mjs
          npm run validate:v3
          npm run validate:deployments-v3
          npm run validate:income-v3
          npm run validate:parity
          npm run validate:release-integrity
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
          SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Commit corrected scope and checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/stablecoin-profiles-v2.json \
            config/primary-display-relationships.mjs \
            scripts/validate-tier-a-dossier-batch-4-pr364.mjs \
            scripts/validate-registry-evidence-integrity-audit.mjs \
            scripts/validate-non-ui-release-material.mjs \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-v3-parity-baseline.json \
            docs/migration/registry-release-integrity-baseline.json \
            docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json \
            data/generated/build-provenance.json \
            data/stats-history.json
          if git diff --cached --quiet; then
            echo 'PR #364 scope correction is already synchronized.'
            exit 0
          fi
          git commit -m 'Keep PR 364 within the authorized dossier scope'
          git pull --rebase origin pr364-tier-a-dossier-batch-4
          git push origin HEAD:pr364-tier-a-dossier-batch-4

      - name: Publish correction status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr364-scope-correction -->';
            let handoff=null;
            try{handoff=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-4-pr364-reviewed-handoff.json','utf8'));}catch{}
            const body=`${marker}\n## PR #364 scope correction\n\n- Status: **${{ job.status }}**\n- USDG reserve profile: **preserved from main**\n- USDG redemption improvement: **retained**\n- Primary display tie: **resolved explicitly**\n- Stats model SHA-256: \`${handoff?.stats_model_sha256??'not-generated'}\`\n- Stats snapshot SHA-256: \`${handoff?.stats_snapshot_sha256??'not-generated'}\`\n- Head: \`${context.sha}\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((comment)=>comment.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
