name: AAA PR358 Final Authority Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'pr358-record-growth-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr358-record-growth-batch-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Synchronize final PR 358 authority
        run: node scripts/synchronize-pr358-final-authority.mjs
      - name: Commit final authority state
        run: |
          if git diff --quiet -- README.md AGENTS.md docs/spec-governance.md docs/roadmap.md; then
            echo 'Final PR #358 authority already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/spec-governance.md docs/roadmap.md
          git commit -m 'Synchronize PR 358 final authority at 112 assets'
          git push origin HEAD:pr358-record-growth-batch-1
