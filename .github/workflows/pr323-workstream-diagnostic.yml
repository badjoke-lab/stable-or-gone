name: PR323 workstream diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'pr323-lifecycle-regulatory-market-access-expansion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture active workstream validation
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/validate-active-workstream.mjs > artifacts/workstream.log 2>&1 || true
      - name: Upload workstream diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr323-workstream-diagnostic
          path: artifacts/workstream.log
          if-no-files-found: error
