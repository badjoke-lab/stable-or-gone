name: PR 346 Access regulation index

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr346-access-regulation-index'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Build deterministic access regulation index artifact
        run: node scripts/access-regulation/build-access-regulation-index-pr346.mjs artifacts/access-regulation-index-pr346.json

      - name: Validate access regulation index contract
        run: node scripts/validate-access-regulation-index-pr346.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify built endpoint parity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { isDeepStrictEqual } from 'node:util';
          const expected = JSON.parse(fs.readFileSync('artifacts/access-regulation-index-pr346.json', 'utf8'));
          const built = JSON.parse(fs.readFileSync('dist/data/access-regulation-index.json', 'utf8'));
          if (!isDeepStrictEqual(built, expected)) throw new Error('built access/regulation endpoint differs from deterministic generator artifact');
          if (built.asset_count !== 110) throw new Error(`asset_count must be 110, found ${built.asset_count}`);
          if (built.filters?.length !== 14) throw new Error(`filter axis count must be 14, found ${built.filters?.length}`);
          if (built.single_composite_score !== false) throw new Error('index must not emit composite score');
          if (built.risk_ranking !== false) throw new Error('index must not emit risk ranking');
          console.log('Built access/regulation endpoint matches deterministic artifact exactly.');
          NODE

      - name: Verify built manifest discovery and safety boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.public_files?.access_regulation_index !== '/data/access-regulation-index.json') throw new Error('manifest does not advertise access/regulation endpoint');
          if (manifest.access_regulation_index?.legal_regulatory_and_access_layers_separate !== true) throw new Error('manifest lost layer-separation boundary');
          if (manifest.access_regulation_index?.readiness_and_freshness_preserved !== true) throw new Error('manifest lost readiness/freshness preservation');
          if (manifest.access_regulation_index?.single_composite_score !== false) throw new Error('manifest must state no composite score');
          if (manifest.access_regulation_index?.risk_ranking !== false) throw new Error('manifest must state no risk ranking');
          if (manifest.access_regulation_index?.no_absence_inference !== true) throw new Error('manifest must state no absence inference');
          if (manifest.access_regulation_index?.excludes_internal_monitoring !== true) throw new Error('manifest must exclude internal monitoring');
          if (manifest.access_regulation_index?.excludes_editorial_research !== true) throw new Error('manifest must exclude editorial research');
          console.log('Built manifest access/regulation discovery and safety boundaries valid.');
          NODE

      - name: Upload access regulation index artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr346-access-regulation-index-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/access-regulation-index-pr346.json
            dist/data/access-regulation-index.json
            dist/data/manifest.json
