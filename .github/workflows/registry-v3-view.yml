name: Registry v3 deployment view (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Registry v3 deployment view
        run: node scripts/validate-registry-v3-chain-view.mjs
