name: Registry v3 view

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Registry v3 view
        run: node scripts/validate-registry-v3-chain-view-site.mjs
        # Canonical entry point: scripts/validate-registry-v3-chain-view.mjs
