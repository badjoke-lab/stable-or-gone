name: Finalize PR498

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/record-growth-batch-4-mnee'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-growth-batch-4-mnee
          fetch-depth: 0

      - name: Apply reviewed MNEE implementation
        shell: bash
        run: |
          set -euo pipefail
          wc -c .pr498-patch-00 .pr498-patch-01 .pr498-patch-02 .pr498-patch-03 .pr498-patch-04
          sha256sum .pr498-patch-00 .pr498-patch-01 .pr498-patch-02 .pr498-patch-03 .pr498-patch-04
          for file in .pr498-patch-00 .pr498-patch-01 .pr498-patch-02 .pr498-patch-03 .pr498-patch-04; do
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=[:space:]]' "$file"; then
              echo "Non-base64 character found in $file" >&2
              exit 1
            fi
          done
          cat .pr498-patch-00 .pr498-patch-01 .pr498-patch-02 .pr498-patch-03 .pr498-patch-04 \
            | tr -d '\r\n\t ' > /tmp/pr498.patch.gz.b64
          base64 --decode /tmp/pr498.patch.gz.b64 | gzip --decompress > /tmp/pr498.patch
          git apply --check /tmp/pr498.patch
          git apply /tmp/pr498.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and validate PR498
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-record-growth-batch-4-mnee-pr498.mjs
          npm run validate:record-growth-batch-4-mnee-pr498
          npm run validate:active-workstream
          npm run validate:data
          npm run validate:baseline
          npm run validate:parity
          npm run validate:release-integrity
          npm run validate:reproducible-build
          node scripts/validate-stats-history.mjs
          node scripts/validate-non-ui-release-material-current.mjs

      - name: Commit permanent implementation only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .pr498-patch-00 .pr498-patch-01 .pr498-patch-02 .pr498-patch-03 .pr498-patch-04
          rm -f .github/workflows/export-pr498-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add complete MNEE canonical record'
          git push origin HEAD:agent/record-growth-batch-4-mnee
