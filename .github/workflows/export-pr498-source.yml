name: Export PR498 source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/record-growth-batch-4-mnee'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-growth-batch-4-mnee
      - name: Prepare source archive
        run: |
          rm -rf node_modules dist .git
          tar -czf /tmp/stable-or-gone-pr498-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: stable-or-gone-pr498-source
          path: /tmp/stable-or-gone-pr498-source.tar.gz
          retention-days: 1
      - name: Inspect official MNEE SDK package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mnee-sdk
          cd /tmp/mnee-sdk
          npm pack @mnee/ts-sdk@1.2.0 --silent > /tmp/mnee-pack-name.txt
          package_file="$(cat /tmp/mnee-pack-name.txt)"
          tar -xzf "$package_file"
          grep -RniE 'token.?id|tokenId|inscription|origin|mainnet|MNEE|1sat|bsv21' package > /tmp/mnee-sdk-identifiers.txt || true
          tar -czf /tmp/mnee-sdk-package.tar.gz package
      - uses: actions/upload-artifact@v4
        with:
          name: mnee-sdk-identifier-review
          path: |
            /tmp/mnee-sdk-identifiers.txt
            /tmp/mnee-sdk-package.tar.gz
          retention-days: 1
