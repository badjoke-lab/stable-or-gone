name: Evidence Archive Payload Verification Batch 2 probe

on:
  pull_request:
    paths:
      - 'scripts/probe-evidence-archive-payload-verification-batch-2.mjs'
      - 'data/editorial-research/evidence-archive-payload-verification-batch-2-candidates-2026-08-09.json'
      - '.github/workflows/evidence-archive-payload-verification-batch-2-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe exact-source Wayback payloads
        run: node scripts/probe-evidence-archive-payload-verification-batch-2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-archive-payload-verification-batch-2-probe
          path: artifacts/evidence-archive-payload-verification-batch-2-probe/**
          if-no-files-found: warn
