name: Monitoring bounded scheduled read-only

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      group:
        description: Scheduled monitoring group
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: read

concurrency:
  group: sog-bounded-monitoring-${{ github.event_name }}-${{ github.event.schedule || inputs.group || 'manual' }}
  cancel-in-progress: false

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate scheduled monitoring contract
        run: node scripts/validate-bounded-scheduled-monitoring-pr324.mjs

      - name: Resolve scheduled group
        id: group
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            GROUP="${{ inputs.group }}"
          elif [[ "${{ github.event.schedule }}" == "17 3 * * *" ]]; then
            GROUP="daily"
          else
            GROUP="weekly"
          fi
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Run bounded review-only monitoring
        id: monitoring
        shell: bash
        run: |
          GROUP="${{ steps.group.outputs.group }}"
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GROUP}-${GITHUB_SHA::8}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          SOG_MONITORING_RUN_ID="$RUN_ID" \
          SOG_MONITORING_MODE="official-sources" \
          SOG_MONITORING_SCHEDULE_GROUP="$GROUP" \
          SOG_MONITORING_REVIEW_MATERIAL="true" \
          SOG_MONITORING_COMMIT="$GITHUB_SHA" \
          SOG_MONITORING_BRANCH="$GITHUB_REF_NAME" \
          npm run monitor:review

      - name: Upload private scheduled monitoring artifact
        uses: actions/upload-artifact@v4
        with:
          name: sog-scheduled-${{ steps.group.outputs.group }}-${{ steps.monitoring.outputs.run_id }}
          path: data-staging/monitoring/${{ steps.monitoring.outputs.run_id }}
          if-no-files-found: error
          retention-days: 30
