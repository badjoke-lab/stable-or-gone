name: Monitoring coverage recalculation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate historical and current monitoring coverage boundaries
        run: node scripts/validate-monitoring-coverage-recalculation-100-assets.mjs
      - name: Upload monitoring coverage checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-coverage-recalculation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            scripts/monitoring/baselines/monitoring-baseline-sync-100-assets.json
            scripts/monitoring/baselines/monitoring-reserve-redemption-expansion-100-assets.json
