name: PR 380 Evidence Archive Maintenance Batch 3

on:
  push:
    branches:
      - pr380-evidence-archive-maintenance-batch-3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe live and exact Wayback sources
        run: node scripts/probe-evidence-archive-maintenance-batch-3-pr380.mjs | tee /tmp/pr380-probe.txt
      - name: Commit internal review queue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/evidence-archive-maintenance-batch-3-pr380-review-queue.json
          if git diff --cached --quiet; then
            echo 'Review queue already current'
          else
            git commit -m 'Generate PR 380 archive review queue'
            git push origin HEAD:pr380-evidence-archive-maintenance-batch-3
          fi

  validate:
    if: github.event_name == 'pull_request' && github.head_ref == 'pr380-evidence-archive-maintenance-batch-3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require reviewed outputs before final validation
        run: |
          test -f docs/migration/evidence-archive-maintenance-batch-3-pr380-review-queue.json
          test -f docs/migration/evidence-archive-maintenance-outcomes-pr380.json
          test -f docs/migration/evidence-archive-maintenance-batch-3-pr380-reviewed-handoff.json
      - name: Validate active workstream and canonical contracts
        run: |
          npm run validate:active-workstream
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Astro check and build
        run: |
          npm run check
          npm run build
