name: Finalize Acala launch date

on:
  push:
    branches:
      - audit-launch-date-candidates
    paths:
      - .github/workflows/finalize-acala-launch-date.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-launch-date-candidates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Regenerate audit
        run: npm run audit:integrity
      - name: Remove temporary audit files
        run: |
          rm -f docs/audits/launch-date-event-candidates.json
          rm -f docs/audits/launch-date-event-candidates-placeholder.txt
          rm .github/workflows/finalize-acala-launch-date.yml
      - name: Commit final update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Regenerate audit after Acala launch date update"
          git push origin HEAD:audit-launch-date-candidates
