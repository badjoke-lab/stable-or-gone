name: PR 400 Canonical Release Diagnostic

on:
  push:
    branches:
      - pr400-evidence-archive-maintenance-batch-7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr400-canonical-release-diagnostic-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr400-evidence-archive-maintenance-batch-7'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate Evidence integrity audit
        run: node scripts/validate-registry-evidence-integrity-audit.mjs
      - name: Validate data
        run: npm run validate:data
      - name: Validate Evidence relations v2
        run: npm run validate:evidence-relations-v2
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate final invariants
        run: npm run validate:final
      - name: Validate registry v3
        run: npm run validate:v3
      - name: Validate deployments v3
        run: npm run validate:deployments-v3
      - name: Validate income v3
        run: npm run validate:income-v3
      - name: Validate parity
        run: npm run validate:parity
      - name: Validate release integrity
        run: npm run validate:release-integrity
      - name: Validate current non-UI release material
        run: node scripts/validate-non-ui-release-material-current.mjs
      - name: Commit diagnostic success marker
        run: |
          cat > docs/quality/evidence-archive-maintenance-batch-7-pr400-canonical-release-validation.json <<'JSON'
          {
            "schema_version": "1.0",
            "validation_id": "sog_pr400_canonical_release_validation_2026_07_16",
            "status": "all_canonical_release_checks_passed",
            "review_pr": 400,
            "archive_recorded": 430,
            "archive_not_recorded": 129,
            "evidence": 559,
            "evidence_relations": 559
          }
          JSON
          git add docs/quality/evidence-archive-maintenance-batch-7-pr400-canonical-release-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record PR 400 canonical release validation success'
          git pull --rebase origin pr400-evidence-archive-maintenance-batch-7
          git push origin HEAD:pr400-evidence-archive-maintenance-batch-7
