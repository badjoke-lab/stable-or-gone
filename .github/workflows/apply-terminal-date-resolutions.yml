name: Apply terminal-date resolutions

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'resolve-terminal-dates-usdm-usdn'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - name: Apply terminal-date resolutions
        run: node scripts/apply-terminal-date-resolutions.mjs
      - name: Install dependencies
        run: npm install
      - name: Regenerate integrity outputs
        run: npm run audit:integrity
      - name: Validate complete repository
        run: npm run build
      - name: Remove temporary automation
        run: |
          rm -f scripts/apply-terminal-date-resolutions.mjs
          rm -f .github/workflows/apply-terminal-date-resolutions.yml
      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Resolve Mountain USDM and USDN terminal dates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
