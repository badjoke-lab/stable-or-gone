name: Ledger Series Phase 9 Adapter

on:
  pull_request:
    paths:
      - "config/ledger-series-phase9-stage5-relationship-authority.json"
      - "src/lib/ledgerSeriesAdapter.ts"
      - "src/pages/data/series/**"
      - "scripts/validate-ledger-series-phase9-adapter.mjs"
      - ".github/workflows/ledger-series-phase9-adapter.yml"
      - "src/lib/stablecoinRecordData.ts"
      - "src/lib/machine-readable.ts"
      - "src/lib/data/**"
      - "data/**"
  push:
    branches:
      - main
    paths:
      - "config/ledger-series-phase9-stage5-relationship-authority.json"
      - "src/lib/ledgerSeriesAdapter.ts"
      - "src/pages/data/series/**"
      - "scripts/validate-ledger-series-phase9-adapter.mjs"
      - ".github/workflows/ledger-series-phase9-adapter.yml"
      - "src/lib/stablecoinRecordData.ts"
      - "src/lib/machine-readable.ts"
      - "src/lib/data/**"
      - "data/**"

permissions:
  contents: read

jobs:
  validate-series-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact candidate
        run: npm run build

      - name: Validate Ledger Series adapter
        run: node scripts/validate-ledger-series-phase9-adapter.mjs
