name: Refine terminal date audit queue

on:
  push:
    branches:
      - refine-terminal-date-queue
    paths:
      - .github/workflows/refine-terminal-date-queue.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-terminal-date-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Refine terminal-date queue
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit-registry-integrity.mjs')
          source = path.read_text()
          old = "const missingEnd = stablecoins.filter((row) => ['failed', 'discontinued', 'migrated', 'rebranded'].includes(row.status) && !row.discontinued_date);"
          new = """const terminalLifecycleStatuses = new Set(['collapsed', 'inactive', 'terminated', 'migrated', 'rebranded']);
          const missingEnd = stablecoins.filter((row) => {
            const lifecycle = classificationById.get(row.id)?.lifecycle_status;
            return terminalLifecycleStatuses.has(lifecycle) && !row.discontinued_date;
          });"""
          if old not in source:
              raise SystemExit('terminal date queue anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Regenerate integrity audit
        run: npm run audit:integrity
      - name: Remove one-off workflow
        run: rm .github/workflows/refine-terminal-date-queue.yml
      - name: Commit refined queue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine terminal date audit queue"
          git push origin HEAD:refine-terminal-date-queue
