name: JPYR production closeout

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - '.github/workflows/jpyr-production-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sog-jpyr-production-closeout
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify JPYR human and machine publication
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://www.stableorgone.com/stablecoin/jpyr/?publication_closeout='"${attempt}" 2>/dev/null || true)"
            json="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://www.stableorgone.com/data/stablecoin/jpyr.json?publication_closeout='"${attempt}" 2>/dev/null || true)"
            if grep -Fq 'JPYR' <<<"$html" \
              && grep -Fq 'Crypto Yield Archive — IZAKA-YA' <<<"$html" \
              && grep -Fq 'Wallet Lifecycle Registry — IZAKA-YA Wallet' <<<"$html" \
              && grep -Fq 'Historical Exchange Index — IZAKA-YA' <<<"$html" \
              && jq -e '.record.id == "sog_st_jpyr" or .stablecoin.id == "sog_st_jpyr" or .id == "sog_st_jpyr"' <<<"$json" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = 1

      - name: Close JPYR publication issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 599, body: `JPYR production closeout passed. Human page, machine record, and all three cross-registry links are live. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 599, state: 'closed', state_reason: 'completed'});
