name: Apply mobile registry density fix

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/apply-mobile-registry-density-fix.mjs'
      - '.github/workflows/apply-mobile-registry-density-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Apply bounded CSS migration
        run: node scripts/apply-mobile-registry-density-fix.mjs

      - name: Commit final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/public-ui.css scripts/apply-mobile-registry-density-fix.mjs .github/workflows/apply-mobile-registry-density-fix.yml
          git commit -m 'Fix mobile registry density and link decoration'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
