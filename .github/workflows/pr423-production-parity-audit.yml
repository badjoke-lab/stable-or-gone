name: PR 423 Production Parity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr423-production-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-parity:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr423-align-ui-v3-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare UI v3-compatible production checker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('scripts/check-production.mjs').read_text()
          replacements = {
              "assert(homeText.includes(`${counts.primary_records} stable assets`), 'home stable asset count mismatch');": "assert(homeText.includes(`Stablecoins ${counts.primary_records} canonical records`), 'home stablecoin total mismatch');",
              "assert(homeText.includes(`${breakdown.organizations} organizations`), 'home organization count mismatch');": "assert(homeText.includes(`Organizations ${breakdown.organizations} connected entities`), 'home organization total mismatch');",
              "assert(homeText.includes(`${counts.events} events`), 'home event count mismatch');": "assert(homeText.includes(`Events ${counts.events} material records`), 'home event total mismatch');",
              "assert(homeText.includes(`${breakdown.evidence_source_identities} Source identities`), 'home source identity count mismatch');": "assert(homeText.includes(`Source identities ${breakdown.evidence_source_identities} distinct sources`), 'home source identity total mismatch');",
              "assert(stablecoinsText.includes(`1–${initialStablecoinRangeEnd} of ${counts.primary_records} records`), 'stablecoin index initial range mismatch');": "assert(stablecoinsText.includes(`1–${initialStablecoinRangeEnd} of ${counts.primary_records} matching records`), 'stablecoin index initial range mismatch');",
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit(f'production checker compatibility target missing: {old}')
          Path('/tmp/check-production-ui-v3.mjs').write_text(source)
          PY
      - name: Check deployed production against approved main
        id: production_check
        continue-on-error: true
        env:
          SOG_EXPECTED_COMMIT: 8ee43d6cf2f46d76afe5270eaf4a512ede4f7204
          SOG_SMOKE_ATTEMPTS: 5
          SOG_SMOKE_DELAY_MS: 15000
        shell: bash
        run: |
          set -o pipefail
          node /tmp/check-production-ui-v3.mjs 2>&1 | tee /tmp/pr423-production-parity.log
          node scripts/check-production-provenance.mjs 2>&1 | tee -a /tmp/pr423-production-parity.log
          node scripts/check-production-output-parity.mjs 2>&1 | tee -a /tmp/pr423-production-parity.log
      - name: Prepare clean checker-fix branch
        if: steps.production_check.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/check-production-ui-v3.mjs /tmp/check-production.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git switch --detach origin/main
          git switch -C pr424-fix-ui-v3-production-checker
          cp /tmp/check-production.mjs scripts/check-production.mjs
          git add scripts/check-production.mjs
          if git diff --cached --quiet; then
            echo 'Main already contains the approved UI v3 production semantics.'
            exit 0
          fi
          git commit -m 'Align production checks with approved UI v3 semantics'
          git push --force-with-lease origin pr424-fix-ui-v3-production-checker
      - name: Upload production parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr423-production-parity-${{ github.run_id }}
          path: /tmp/pr423-production-parity.log
          if-no-files-found: error
          retention-days: 30
      - name: Publish audit result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.production_check.outcome }}
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr423-production-parity-status -->';
            let log='No production log was produced.';
            try { log=fs.readFileSync('/tmp/pr423-production-parity.log','utf8').slice(-12000); } catch {}
            const diagnostic=log.split('\n').filter((line)=>/failed:|Error:|does not match|mismatch|missing|expected/i.test(line)).slice(-12).join('\n') || 'No error line was emitted.';
            const body=`${marker}\n## Production parity audit\n\n- Result: **${process.env.CHECK_OUTCOME}**\n- Expected approved main: **\`8ee43d6cf2f46d76afe5270eaf4a512ede4f7204\`**\n- Base URL: **https://sog.badjoke-lab.com**\n- Head: \`${context.sha}\`\n\n\`\`\`text\n${diagnostic}\n\`\`\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Enforce production parity result
        if: steps.production_check.outcome != 'success'
        run: exit 1
