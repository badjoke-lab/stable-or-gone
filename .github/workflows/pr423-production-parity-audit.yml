name: PR 423 Production Parity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr423-production-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-parity:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr423-align-ui-v3-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check deployed production against current main
        id: production_check
        continue-on-error: true
        env:
          SOG_EXPECTED_COMMIT: 44ba7ef884b5f4ca621a2fdf41b133884132fc57
          SOG_SMOKE_ATTEMPTS: 10
          SOG_SMOKE_DELAY_MS: 15000
        shell: bash
        run: |
          set -o pipefail
          npm run check:production 2>&1 | tee /tmp/pr423-production-parity.log
      - name: Prepare clean authority closure branch
        if: steps.production_check.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp docs/migration/ui-v3-issue-281-closure-pr423.md /tmp/ui-v3-closure.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git switch --detach origin/main
          git switch -C pr425-align-ui-v3-authority
          python3 <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          replacements = {
              'Current mandatory authority: PR #421 UI v3 Rebuild G — full visual closure.': 'Current mandatory authority: UI v3 complete — PR #422 owner approval and completion record.',
              'Issue #281 UI v3 rebuild: reopened': 'Issue #281 UI v3 rebuild: complete',
              'PR #421 UI v3 Rebuild G — full visual closure: active': 'PR #421 UI v3 Rebuild G — full visual closure: complete',
              'Exit state: AWAITING OWNER REVIEW': 'Exit state: COMPLETE',
              'Owner-approved desktop templates: 0': 'Owner-approved desktop templates: 6 / 6',
              'Owner-approved mobile templates: 0': 'Owner-approved mobile templates: 6 / 6',
              'UI completion: false': 'UI completion: true',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'AGENTS completion target missing: {old}')
              text = text.replace(old, new)
          marker = 'PR #421 is the final non-production visual-closure phase.'
          if marker not in text:
              raise SystemExit('AGENTS stale closure paragraph missing')
          text = text[:text.index(marker)] + '''The owner explicitly approved all six required desktop and mobile UI v3 template families on 2026-07-18. PR #422 records the decision and the fourteen-state PR #421 visual evidence. Automated capture did not constitute approval.\n\nUI v3 has no active implementation workstream. Future material UI changes require a new independently authorized workstream. Production UI, routes, canonical data, public machine-readable outputs, and metadata contracts were unchanged by the approval closure.\n'''
          agents.write_text(text)

          roadmap = Path('docs/roadmap.md')
          text = roadmap.read_text()
          old = 'PR #422 owner approval record: active; complete on merge'
          if old not in text:
              raise SystemExit('roadmap PR #422 completion target missing')
          roadmap.write_text(text.replace(old, 'PR #422 owner approval record: complete'))
          PY
          cp /tmp/ui-v3-closure.md docs/migration/ui-v3-issue-281-closure-pr425.md
          git add AGENTS.md docs/roadmap.md docs/migration/ui-v3-issue-281-closure-pr425.md
          git commit -m 'Align active authority with completed UI v3 approval'
          git push --force-with-lease origin pr425-align-ui-v3-authority
      - name: Upload production parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr423-production-parity-${{ github.run_id }}
          path: /tmp/pr423-production-parity.log
          if-no-files-found: error
          retention-days: 30
      - name: Publish audit result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.production_check.outcome }}
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr423-production-parity-status -->';
            let log='No production log was produced.';
            try { log=fs.readFileSync('/tmp/pr423-production-parity.log','utf8').slice(-12000); } catch {}
            const diagnostic=log.split('\n').filter((line)=>/failed:|Error:|does not match|mismatch|missing|expected/i.test(line)).slice(-12).join('\n') || 'No error line was emitted.';
            const body=`${marker}\n## Production parity audit\n\n- Result: **${process.env.CHECK_OUTCOME}**\n- Expected current main: **\`44ba7ef884b5f4ca621a2fdf41b133884132fc57\`**\n- Base URL: **https://sog.badjoke-lab.com**\n- Head: \`${context.sha}\`\n\n\`\`\`text\n${diagnostic}\n\`\`\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Enforce production parity result
        if: steps.production_check.outcome != 'success'
        run: exit 1
