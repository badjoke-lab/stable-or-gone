name: Apply full representative UI remediation

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - scripts/apply-full-ui-remediation.mjs
      - .github/workflows/apply-full-ui-remediation.yml
  push:
    branches:
      - fix/full-representative-ui-remediation
    paths:
      - scripts/apply-full-ui-remediation.mjs
      - .github/workflows/apply-full-ui-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-representative-ui-remediation
          fetch-depth: 0
      - name: Correct bounded replacement anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-full-ui-remediation.mjs')
          source = path.read_text()
          source = source.replace(
              "source = replaceOnce(source, `    'unexpected_public_font', 'raw_public_enum'`",
              "source = replaceOnce(source, `  'unexpected_public_font', 'raw_public_enum'`",
          )
          source = source.replace(
              "source = replaceOnce(source, `    'unexpected_public_font',\\n  'raw_public_enum'`",
              "source = replaceOnce(source, `  'unexpected_public_font',\\n  'raw_public_enum'`",
          )
          path.write_text(source)
          PY
      - name: Apply bounded remediation
        run: node scripts/apply-full-ui-remediation.mjs
      - name: Commit remediated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix representative desktop and mobile UI regressions"
          git push origin HEAD:fix/full-representative-ui-remediation
