name: Apply PR 275 production smoke contract

on:
  push:
    branches:
      - fix-ui-v3-production-smoke-home-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ui-v3-production-smoke-home-contract
      - name: Apply exact contract updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          smoke = Path('scripts/check-production.mjs')
          text = smoke.read_text()
          old = "for (const heading of ['Redemption profile', 'Reserve and attestation history', 'Regulatory and official notices', 'Blockchain deployments', 'Open questions', 'Sources']) {"
          new = "for (const heading of ['Identity and current state', 'Organizations and control', 'How the asset works', 'Reserve and redemption', 'Deployments and legal context', 'History', 'Evidence', 'Known unknowns and coverage']) {"
          if old not in text:
              raise SystemExit('old stablecoin detail heading contract not found')
          smoke.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/ui-v3-production-closure.yml')
          text = workflow.read_text()
          marker = "      - 'scripts/validate-ui-v3-production-closure.mjs'\n"
          addition = marker + "      - 'scripts/check-production.mjs'\n"
          if "      - 'scripts/check-production.mjs'\n" not in text:
              if marker not in text:
                  raise SystemExit('closure workflow path insertion point not found')
              text = text.replace(marker, addition, 1)
          workflow.write_text(text)

          validator = Path('scripts/validate-ui-v3-production-closure.mjs')
          text = validator.read_text()
          marker = "const agents = read('AGENTS.md');\n"
          addition = marker + "const productionSmoke = read('scripts/check-production.mjs');\n"
          if "const productionSmoke = read('scripts/check-production.mjs');" not in text:
              if marker not in text:
                  raise SystemExit('closure validator import insertion point not found')
              text = text.replace(marker, addition, 1)
          marker = "  'retention-days: 90'\n"
          addition = "  'retention-days: 90',\n  \"'scripts/check-production.mjs'\"\n"
          if "\"'scripts/check-production.mjs'\"" not in text:
              if marker not in text:
                  raise SystemExit('closure workflow marker insertion point not found')
              text = text.replace(marker, addition, 1)
          marker = "]) check(report.includes(marker), `closure report marker missing: ${marker}`);\n\n"
          contract = """\nfor (const marker of [\n  '${counts.primary_records} stable assets',\n  '${breakdown.organizations} organizations',\n  '${counts.events} events',\n  '${breakdown.evidence_source_identities} Source identities',\n  'Identity and current state',\n  'Organizations and control',\n  'How the asset works',\n  'Reserve and redemption',\n  'Deployments and legal context',\n  'Known unknowns and coverage'\n]) check(productionSmoke.includes(marker), `production smoke v3 marker missing: ${marker}`);\nfor (const marker of ['Stablecoins ${counts.primary_records}', 'Sources ${counts.evidence}', 'Redemption profile', 'Blockchain deployments']) {\n  check(!productionSmoke.includes(marker), `superseded production smoke marker remains: ${marker}`);\n}\n\n"""
          if 'production smoke v3 marker missing' not in text:
              if marker not in text:
                  raise SystemExit('closure validator contract insertion point not found')
              text = text.replace(marker, marker + contract, 1)
          validator.write_text(text)
          PY
      - name: Commit contract updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-production.mjs scripts/validate-ui-v3-production-closure.mjs .github/workflows/ui-v3-production-closure.yml
          git commit -m "Complete Editorial Ledger production smoke contract"
          git push origin HEAD:fix-ui-v3-production-smoke-home-contract
