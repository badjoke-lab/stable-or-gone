name: PR 421 UI v3 Full Visual Closure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr421-ui-v3-full-visual-closure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr421-ui-v3-full-visual-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate PR 421 closure authority and lineage
        run: node scripts/validate-ui-v3-full-visual-closure-pr421.mjs && npm run validate:active-workstream
      - name: Verify non-production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only origin/main...HEAD -- src/ public/ data/)"
          unexpected_config="$(git diff --name-only origin/main...HEAD -- config/ | grep -v '^config/ui-v3-full-visual-closure-pr421.json$' || true)"
          test -z "$unexpected_config" || { echo "Unauthorized config changes:"; echo "$unexpected_config"; exit 1; }
          git diff --exit-code origin/main...HEAD -- \
            config/site-architecture.mjs \
            docs/migration/ui-v3-visual-approval-register.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-release-integrity-baseline.json
      - name: Validate canonical data and Evidence
        run: npm run validate:data && npm run validate:evidence-relations-v2
      - name: Validate compatibility, final state, and release integrity
        run: npm run validate:compat && npm run validate:final && npm run validate:release-integrity && npm run validate:reproducible-build
      - name: Astro check and build
        run: npm run check && npm run build && npm run verify:public
      - name: Publish validation diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr421-validation-diagnostics -->';
            const body=`${marker}\n## PR #421 Validation Diagnostics\n\nThe full visual closure authority, lineage, protected-boundary, canonical, build, or release validation failed. Review the workflow job log before changing any production surface.`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

  visual-closure:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr421-ui-v3-full-visual-closure'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local static server
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/pr421-server.log 2>&1 &
          echo $! > /tmp/pr421-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr421-server.log
          exit 1
      - name: Capture the fourteen owner-review states
        env:
          SOG_SCREENSHOT_BASE_URL: http://127.0.0.1:4321
        run: node scripts/capture-full-visual-closure-pr421.mjs
      - name: Build final contact sheet and owner-review worksheet
        run: node scripts/build-full-visual-closure-review-pr421.mjs
      - name: Verify closure outputs remain non-approving
        run: |
          for file in manifest.json contact-sheet.html contact-sheet.json owner-review.html owner-review.json; do
            test -f "artifacts/pr421-full-visual-closure/$file"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='artifacts/pr421-full-visual-closure';
          const manifest=JSON.parse(fs.readFileSync(`${root}/manifest.json`,'utf8'));
          const review=JSON.parse(fs.readFileSync(`${root}/owner-review.json`,'utf8'));
          if(manifest.failure_count!==0 || manifest.capture_count!==14)throw new Error('final fourteen-state closure failed');
          if(manifest.horizontal_overflow_failure_count!==0)throw new Error('horizontal overflow detected');
          if(manifest.owner_approval!==false || manifest.accepted_desktop!==0 || manifest.accepted_mobile!==0)throw new Error('manifest records automatic approval');
          if(review.status!=='awaiting_owner_review' || review.automated_capture_counts_as_approval!==false || review.ui_completion!==false)throw new Error('owner-review worksheet bypasses owner decision');
          if(review.templates.some((group)=>group.states.some((state)=>state.owner_status!=='pending' || state.owner_decision!=='')))throw new Error('generated owner decision is not pending');
          NODE
      - name: Upload final visual closure package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr421-full-visual-closure-${{ github.run_id }}
          path: |
            artifacts/pr421-full-visual-closure/
            /tmp/pr421-server.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/pr421-server.pid; then kill "$(cat /tmp/pr421-server.pid)" || true; fi

  report:
    if: always()
    needs: [validate, visual-closure]
    runs-on: ubuntu-latest
    steps:
      - name: Publish PR 421 closure status
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr421-full-visual-closure-status -->';
            const validate='${{ needs.validate.result }}';
            const visual='${{ needs.visual-closure.result }}';
            const passed=validate==='success' && visual==='success';
            const body=`${marker}\n## PR #421 Full Visual Closure\n\n- Automated closure gates: **${passed ? 'success' : 'failure'}**\n- Authority, lineage, build, and protected-boundary validation: **${validate}**\n- Required fourteen-state visual closure: **${visual}**\n- Visual closure run ID: **${context.runId}**\n- Production UI changes: **0**\n- Routes changed: **0**\n- Canonical changes: **0**\n- Public projection changes: **0**\n- Owner approvals accepted: **0**\n- Automated capture counts as approval: **false**\n- UI completion: **false**\n- Exit state: **${passed ? 'AWAITING OWNER REVIEW' : 'FAILED'}**\n- Head: \`${context.sha}\``;
            const issueNumber=context.issue?.number || 421;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
