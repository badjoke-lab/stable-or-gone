name: Temporary force instant Compare navigation

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-force-instant-compare-navigation.yml'
      - 'scripts/tmp-force-instant-compare-navigation.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Apply instant Compare navigation
        run: node scripts/tmp-force-instant-compare-navigation.mjs
      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/tmp-force-instant-compare-navigation.yml
          rm -f scripts/tmp-force-instant-compare-navigation.mjs
      - name: Commit instant navigation fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Force instant Compare navigation"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
