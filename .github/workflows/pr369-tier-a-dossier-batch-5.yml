name: PR 369 Tier A Dossier Batch 5

on:
  push:
    branches:
      - pr369-tier-a-dossier-batch-5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr369-tier-a-dossier-batch-5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic PR 369 review outputs
        run: |
          node scripts/build-tier-a-dossier-batch-5-pr369.mjs
          node scripts/build-tier-a-dossier-batch-5-pr369.mjs --check
      - name: Validate reviewed selection and outcomes
        id: review_validation
        run: |
          set +e
          node scripts/validate-tier-a-dossier-batch-5-pr369.mjs > pr369-validation.log 2>&1
          status=$?
          cat pr369-validation.log
          if [ "$status" -eq 0 ]; then
            npm run validate:active-workstream >> pr369-validation.log 2>&1
            status=$?
            cat pr369-validation.log
          fi
          exit "$status"
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify no-change internal-review boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/tier-a-batch-5-pr369-review-outcomes.json
          test ! -e public/data/tier-a-batch-5-pr369-reviewed-handoff.json
          test ! -e dist/data/tier-a-batch-5-pr369-review-outcomes.json
          test ! -e dist/data/tier-a-batch-5-pr369-reviewed-handoff.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/tier-a-batch-5-pr369-review-outcomes.json \
            docs/migration/tier-a-batch-5-pr369-reviewed-handoff.json
          if git diff --cached --quiet; then
            echo 'Generated outputs already committed'
          else
            git commit -m 'Generate PR 369 reviewed batch outcomes'
            git push origin HEAD:pr369-tier-a-dossier-batch-5
          fi
      - name: Publish PR 369 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr369-tier-a-dossier-batch-5-status -->';
            const fs=require('fs');
            let outcomes=null,handoff=null,diagnostics='';
            try{outcomes=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-5-pr369-review-outcomes.json','utf8'));}catch{}
            try{handoff=JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-5-pr369-reviewed-handoff.json','utf8'));}catch{}
            try{diagnostics=fs.readFileSync('pr369-validation.log','utf8').trim().split('\n').slice(-20).join('\n');}catch{}
            const diagnosticBlock=diagnostics?`\n\n<details><summary>Validation diagnostics</summary>\n\n\`\`\`text\n${diagnostics}\n\`\`\`\n</details>`:'';
            const body=`${marker}
            ## PR #369 Tier A Dossier Deepening Batch 5

            - Workflow: **${{ job.status }}**
            - Selected assets: **${outcomes?.result_counts?.selected_assets??'n/a'}**
            - Canonical improvements: **${outcomes?.result_counts?.canonical_improvement_assets??'n/a'}**
            - Reviewed no-safe-change: **${outcomes?.result_counts?.reviewed_no_safe_change_assets??'n/a'}**
            - Prior-completed duplicate changes rejected: **${outcomes?.result_counts?.prior_completed_no_duplicate_change_assets??'n/a'}**
            - Assets / Evidence / deployments / Market Access preserved: **${handoff?.canonical_checkpoint?.assets??'n/a'} / ${handoff?.canonical_checkpoint?.evidence??'n/a'} / ${handoff?.canonical_checkpoint?.deployments??'n/a'} / ${handoff?.canonical_checkpoint?.market_access_records??'n/a'}**
            - Next state: **${handoff?.next_state??'n/a'}**
            - Head: \`${context.sha}\`${diagnosticBlock}
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
