name: Apply single UI index contract

on:
  push:
    branches:
      - agent/full-ui-contract-remediation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-ui-contract-remediation
          fetch-depth: 0

      - name: Apply index contract
        run: node scripts/apply-single-ui-index-contract.mjs

      - name: Commit bounded migration
        shell: bash
        run: |
          if git diff --quiet -- src scripts/validate-ui-v3-cleanup.mjs; then
            echo 'Index contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/validate-ui-v3-cleanup.mjs
          git commit -m 'Move registry indexes into the single UI authority'
          git push origin HEAD:agent/full-ui-contract-remediation
