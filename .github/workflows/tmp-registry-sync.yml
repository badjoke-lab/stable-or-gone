name: Temporary registry synchronization

on:
  push:
    branches:
      - resolve-savings-dai-launch

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resolve-savings-dai-launch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/tmp-sync-savings-dai-launch.mjs
      - run: npm run build
      - name: Commit synchronized files
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data docs
          git commit -m "Synchronize registry outputs"
          git push origin HEAD:resolve-savings-dai-launch
