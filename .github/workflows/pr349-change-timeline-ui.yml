name: PR 349 Change Timeline UI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr349-change-timeline-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate Change Timeline UI source contract
        run: node scripts/validate-change-timeline-ui-pr349.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-change-timeline-ui.log 2>&1 &
          echo $! > /tmp/sog-change-timeline-ui.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/timeline/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-change-timeline-ui.log
          exit 1

      - name: Audit Timeline desktop and mobile interactions
        run: node scripts/audit-change-timeline-ui-pr349.mjs

      - name: Verify built Timeline and projection contracts
        shell: bash
        run: |
          test -f dist/timeline/index.html
          test -f dist/data/change-timeline.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const projection = JSON.parse(fs.readFileSync('dist/data/change-timeline.json', 'utf8'));
          if (projection.item_count !== projection.items?.length) throw new Error('timeline item_count mismatch');
          if (projection.item_count <= 0) throw new Error('timeline must contain items');
          if (projection.projection_rules?.date_semantics_preserved !== true) throw new Error('timeline must preserve date semantics');
          if (projection.projection_rules?.single_generic_timestamp !== false) throw new Error('timeline must reject generic timestamp collapse');
          if (projection.projection_rules?.review_dates_are_change_items !== false) throw new Error('review dates must remain excluded');
          if (projection.projection_rules?.freshness_dates_are_change_items !== false) throw new Error('freshness dates must remain excluded');
          const html = fs.readFileSync('dist/timeline/index.html', 'utf8');
          if (!html.includes('data-timeline-page')) throw new Error('built Timeline page marker missing');
          if (!html.includes('Review dates excluded')) throw new Error('built Timeline review-date boundary notice missing');
          console.log(`Built Timeline UI and projection contract valid: ${projection.item_count} items.`);
          NODE

      - name: Verify manifest and sitemap discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.change_timeline_projection?.ui !== '/timeline/') throw new Error('manifest does not advertise Timeline UI');
          if (!manifest.main_routes?.includes('/timeline/')) throw new Error('manifest main routes do not include Timeline UI');
          if (manifest.public_files?.change_timeline !== '/data/change-timeline.json') throw new Error('manifest lost timeline projection endpoint');
          if (manifest.change_timeline_projection?.date_semantics_preserved !== true) throw new Error('manifest lost date semantics boundary');
          if (manifest.change_timeline_projection?.review_dates_excluded !== true) throw new Error('manifest lost review-date exclusion');
          if (manifest.change_timeline_projection?.freshness_dates_excluded !== true) throw new Error('manifest lost freshness-date exclusion');
          const sitemap = fs.readFileSync('dist/sitemap-index.xml', 'utf8');
          if (!sitemap.includes('https://sog.badjoke-lab.com/timeline/')) throw new Error('sitemap does not include Timeline UI');
          console.log('Built manifest and sitemap Timeline discovery valid.');
          NODE

      - name: Upload Timeline UI audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr349-change-timeline-ui-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/change-timeline-ui/audit.json
            artifacts/change-timeline-ui/desktop-source-filter.png
            artifacts/change-timeline-ui/mobile-asset-filter.png
