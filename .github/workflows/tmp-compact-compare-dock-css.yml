name: Temporary compact Compare dock CSS

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-compact-compare-dock-css.yml'
      - 'scripts/tmp-compact-compare-dock-css.mjs'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Compact CSS line count
        run: node scripts/tmp-compact-compare-dock-css.mjs
      - name: Remove temporary helpers
        run: |
          rm -f scripts/tmp-compact-compare-dock-css.mjs
          rm -f .github/workflows/tmp-compact-compare-dock-css.yml
      - name: Commit compacted CSS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep Compare dock within stylesheet line budget"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
