name: Evidence deduplication

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect evidence source identity groups
        run: node scripts/collect-evidence-deduplication.mjs
      - name: Validate evidence deduplication audit
        run: node scripts/validate-evidence-deduplication.mjs
      - name: Validate evidence identity public surfaces
        run: node scripts/validate-evidence-deduplication-public-surfaces.mjs
      - name: Validate evidence identity mobile protection
        run: node scripts/validate-evidence-mobile.mjs
      - name: Upload evidence deduplication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-deduplication-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/evidence-deduplication-audit.json
            data/generated/evidence-deduplication-validation.json
