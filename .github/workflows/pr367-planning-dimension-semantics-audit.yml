name: PR 367 Planning Dimension Semantics Audit

on:
  push:
    branches:
      - pr367-planning-dimension-semantics-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr367-planning-dimension-semantics-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deterministic semantics audit
        run: |
          node scripts/build-planning-dimension-semantics-audit-pr367.mjs --check
          node scripts/validate-planning-dimension-semantics-audit-pr367.mjs
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify internal-planning-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/planning-dimension-semantics-v2.json
          test ! -e public/data/planning-dimension-semantics-audit-pr367.json
          test ! -e dist/data/planning-dimension-semantics-v2.json
          test ! -e dist/data/planning-dimension-semantics-audit-pr367.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Publish PR 367 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr367-planning-dimension-semantics-audit-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/planning-dimension-semantics-audit-pr367.json','utf8'));}catch{}
            const body=`${marker}
            ## PR #367 Planning Dimension Semantics Audit

            - Workflow: **${{ job.status }}**
            - Canonical assets preserved: **${report?.source_checkpoint?.assets??'n/a'}**
            - Dimensions reviewed: **${report?.approved_contract?.dimensions??'n/a'}**
            - Dimension classes: **${JSON.stringify(report?.approved_contract?.dimension_classes??{})}**
            - Queue roles: **${JSON.stringify(report?.approved_contract?.default_queue_roles??{})}**
            - Historical v1 rewritten: **${report?.historical_v1_boundary?.rewritten??'n/a'}**
            - Next work item: **PR #${report?.next_work_item?.pr??'n/a'} ${report?.next_work_item?.work_item??''}**
            - Head: \`${context.sha}\`
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
