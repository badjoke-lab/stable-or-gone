name: Public consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/collect-event-taxonomy-migration.mjs
      - run: node scripts/collect-organization-taxonomy-migration.mjs
      - run: node scripts/collect-evidence-taxonomy-migration.mjs
      - run: node scripts/collect-deployment-taxonomy-migration.mjs
      - run: node scripts/collect-value-state-migration.mjs
      - run: node scripts/collect-primary-display-relationships.mjs
      - name: Build public site
        shell: bash
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee build-site.log
      - name: Verify public consistency
        shell: bash
        run: |
          set -o pipefail
          npm run verify:consistency 2>&1 | tee public-consistency.log
      - name: Verify per-stablecoin record JSON
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-stablecoin-record-json.mjs 2>&1 | tee stablecoin-record-json.log
      - name: Verify Phase 3 lifecycle filters
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-stablecoin-lifecycle-filters.mjs 2>&1 | tee stablecoin-lifecycle-filters.log
      - name: Upload public output diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-public-output-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build-site.log
            public-consistency.log
            stablecoin-record-json.log
            stablecoin-lifecycle-filters.log
            data/generated/primary-display-relationship-audit.json
            data/generated/primary-display-relationship-validation.json
            data/generated/value-state-migration.json
            data/generated/value-state-validation.json
            data/generated/deployment-taxonomy-migration.json
            data/generated/deployment-taxonomy-validation.json
            data/generated/evidence-taxonomy-migration.json
            data/generated/organization-taxonomy-migration.json
            data/generated/organization-taxonomy-validation.json
            data/generated/event-taxonomy-migration.json
            data/generated/event-taxonomy-validation.json
            data/generated/backing-stabilization-migration.json
            data/generated/backing-stabilization-validation.json
            data/generated/reference-target-migration.json
            data/generated/reference-target-validation.json
            data/generated/lifecycle-issuance-migration.json
            data/generated/lifecycle-issuance-validation.json
            data/generated/public-taxonomy-values.json
            data/generated/public-taxonomy-registry.json
            data/generated/public-taxonomy-validation.json
            data/generated/build-provenance.json
            dist/version.json
            dist/data/manifest.json
            dist/data/output-parity.json
