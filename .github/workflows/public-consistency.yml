name: Public consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:site
      - run: npm run verify:consistency
      - name: Upload provenance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-build-provenance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/generated/build-provenance.json
            dist/version.json
            dist/data/manifest.json
