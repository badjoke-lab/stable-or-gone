name: Fix domain migration residuals

on:
  push:
    branches:
      - agent/official-domain-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sog-domain-residual-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/official-domain-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-domain-migration
          fetch-depth: 0

      - name: Replace active legacy-origin references
        shell: python
        run: |
          from pathlib import Path

          old = 'https://' + '.'.join(['sog', 'badjoke-lab', 'com'])
          new = 'https://www.stableorgone.com'
          files = [
              'scripts/capture-site-screenshots.mjs',
              'scripts/check-production-audited-checkpoint.mjs',
              'scripts/collect-public-routes.mjs',
              'scripts/validate-stats-foundation-pr327.mjs',
              'scripts/validate-ui-v3-production-closure.mjs',
              'scripts/verify-full-output-parity.mjs',
              'scripts/verify-public-consistency.mjs',
              'scripts/write-ui-v3-production-closure-report.mjs',
          ]
          for name in files:
              path = Path(name)
              text = path.read_text()
              path.write_text(text.replace(old, new))

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate official origin
        run: npm run validate:public-origin

      - name: Validate changed script syntax
        run: |
          node --check scripts/capture-site-screenshots.mjs
          node --check scripts/check-production-audited-checkpoint.mjs
          node --check scripts/collect-public-routes.mjs
          node --check scripts/validate-stats-foundation-pr327.mjs
          node --check scripts/validate-ui-v3-production-closure.mjs
          node --check scripts/verify-full-output-parity.mjs
          node --check scripts/verify-public-consistency.mjs
          node --check scripts/write-ui-v3-production-closure-report.mjs

      - name: Build and verify public output
        shell: bash
        run: |
          npm run build:site
          npm run verify:deployment
          npm run verify:public

      - name: Commit residual migration fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts; then
            echo "No residual changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/capture-site-screenshots.mjs \
            scripts/check-production-audited-checkpoint.mjs \
            scripts/collect-public-routes.mjs \
            scripts/validate-stats-foundation-pr327.mjs \
            scripts/validate-ui-v3-production-closure.mjs \
            scripts/verify-full-output-parity.mjs \
            scripts/verify-public-consistency.mjs \
            scripts/write-ui-v3-production-closure-report.mjs
          git commit -m "Migrate remaining production tools to official domain"
          git push origin HEAD:agent/official-domain-migration
