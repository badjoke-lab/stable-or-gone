name: Finalize PR512 terminal date review

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/terminal-date-boundary-review-batch-2-implementation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate terminal date batch 2 review
        run: python scripts/finalize-terminal-date-boundary-review-batch-2-pr512.py

      - name: Validate active review
        run: node scripts/validate-active-workstream.mjs

      - name: Commit finalized review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalized changes to commit"
            exit 0
          fi
          git commit -m "Review BAC and DSD terminal date boundaries"
          git push origin HEAD:agent/terminal-date-boundary-review-batch-2-implementation
