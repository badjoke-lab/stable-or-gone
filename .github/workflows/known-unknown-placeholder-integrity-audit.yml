name: Known-unknown and placeholder integrity audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run known-unknown and placeholder integrity audit
        run: node scripts/validate-registry-known-unknown-placeholder-integrity-audit.mjs
      - name: Upload known-unknown placeholder integrity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-unknown-placeholder-integrity-audit-${{ github.run_id }}
          if-no-files-found: error
          path: data/generated/registry-known-unknown-placeholder-integrity-audit.json
