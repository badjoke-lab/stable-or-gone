name: Apply PR 482 final mobile fix

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/apply-pr482-final-mobile-fix.mjs'
      - '.github/workflows/apply-pr482-final-mobile-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Apply final mobile value-size fix
        run: node scripts/apply-pr482-final-mobile-fix.mjs

      - name: Commit final mobile value-size fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/public-ui.css scripts/apply-pr482-final-mobile-fix.mjs .github/workflows/apply-pr482-final-mobile-fix.yml
          git commit -m 'Raise compact mobile values to readable size'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
