name: Batch L Sync

on:
  push:
    branches:
      - batch-l-current-stable-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-l-current-stable-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/prepare-batch-l-pre.mjs
      - run: node scripts/generate-registry-stats.mjs
      - run: npm run audit:integrity
      - run: node scripts/prepare-batch-l-post.mjs
      - run: npm run build
      - name: Commit synchronized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data scripts
          if git diff --cached --quiet; then
            echo "No synchronization changes"
          else
            git commit -m "Synchronize Batch L manifests and generated outputs"
            git push origin HEAD:batch-l-current-stable-assets
          fi
