name: Apply msUSD emergency record

on:
  push:
    branches:
      - add-mainstreet-msusd-impaired-incident

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply emergency record transformation
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/apply-msusd-emergency-record.mjs
          node /tmp/apply-msusd-emergency-record.mjs
      - name: Install dependencies
        run: npm install
      - name: Regenerate integrity outputs
        run: npm run audit:integrity
      - name: Validate full repository
        run: npm run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-msusd-emergency.yml
      - name: Commit transformed repository
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add MainStreet msUSD impaired incident"
          git push
