name: PR 364 One-Shot Cleanup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr364-one-shot-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Remove temporary PR 364 files
        run: |
          rm -f scripts/rebuild-pr364-stats-snapshot.mjs
          rm -f .github/workflows/pr364-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/rebuild-pr364-stats-snapshot.mjs .github/workflows/pr364-cleanup.yml
          if git diff --cached --quiet; then
            echo 'Temporary PR #364 files already removed.'
            exit 0
          fi
          git commit -m 'Remove temporary PR 364 cleanup files'
          git reset --hard HEAD
          git clean -fd
          git fetch origin pr364-tier-a-dossier-batch-4
          git rebase origin/pr364-tier-a-dossier-batch-4
          git push origin HEAD:pr364-tier-a-dossier-batch-4
