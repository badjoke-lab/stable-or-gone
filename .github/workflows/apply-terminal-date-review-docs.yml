name: Apply terminal-date review documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-terminal-date-review-docs
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-historical-terminal-dates
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply roadmap updates
        run: node scripts/apply-terminal-date-review-docs.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run full repository build
        run: npm run build
      - name: Remove one-time machinery
        run: |
          rm scripts/apply-terminal-date-review-docs.mjs
          rm .github/workflows/apply-terminal-date-review-docs.yml
      - name: Commit finalized review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit historical terminal dates"
          git push origin HEAD:audit-historical-terminal-dates
