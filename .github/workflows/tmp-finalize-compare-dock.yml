name: Temporary finalize fixed Compare dock

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-finalize-compare-dock.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Normalize fixed dock implementation and audit
        run: |
          python3 <<'PY'
          from pathlib import Path

          script_path = Path('src/scripts/stablecoin-index.ts')
          script = script_path.read_text()
          script = script.replace("  const compareDockActions = root.querySelector<HTMLElement>('.comparison-dock-actions');\n", '')
          old = """    if (compareDock) {
      if (count === 0) {
        compareDock.classList.remove('stats-v4-jump', 'masthead-row');
        compareDock.hidden = true;
      } else {
        compareDock.hidden = false;
        compareDock.classList.add('stats-v4-jump', 'masthead-row');
      }
    }
    compareDockActions?.classList.toggle('masthead-actions', count > 0);
"""
          new = """    if (compareDock) compareDock.hidden = count === 0;
"""
          if old not in script:
              raise SystemExit('expected dynamic sticky block not found')
          script_path.write_text(script.replace(old, new))

          validator_path = Path('scripts/validate-stablecoin-compare-discovery-navigation-remediation.mjs')
          validator = validator_path.read_text()
          validator = validator.replace(
              "for (const marker of ['renderComparisonNavigation', \"classList.add('stats-v4-jump', 'masthead-row')\", \"classList.remove('stats-v4-jump', 'masthead-row')\", 'selectedComparisons.size < 2', 'comparePanel.scrollIntoView', 'compareAddButton?.addEventListener', 'selectedComparisons.size >= 4', 'writeUrl'])",
              "for (const marker of ['renderComparisonNavigation', 'selectedComparisons.size < 2', 'comparePanel.scrollIntoView', 'compareAddButton?.addEventListener', 'selectedComparisons.size >= 4', 'writeUrl'])"
          )
          validator = validator.replace(
              "check(css.includes('/* Stablecoin comparison matrix remediation */'), 'existing comparison stylesheet contract missing');",
              "check(css.includes('/* Stablecoin comparison matrix remediation */'), 'existing comparison stylesheet contract missing');\ncheck(css.includes('/* Stablecoin comparison discovery navigation remediation */'), 'Compare discovery stylesheet marker missing');\ncheck(css.includes('.comparison-dock{position:fixed'), 'Compare dock must be fixed while selection exists');\ncheck(css.includes('.comparison-dock[hidden]{display:none}'), 'Compare dock hidden-state CSS missing');"
          )
          validator = validator.replace("stylesheet_mode: 'existing_single_public_ui_stylesheet'", "stylesheet_mode: 'existing_single_public_ui_stylesheet_with_bounded_fixed_dock'")
          validator_path.write_text(validator)

          audit_path = Path('scripts/audit-stablecoin-compare-navigation.mjs')
          audit = audit_path.read_text()
          audit = audit.replace("      stickyClass: dock?.classList.contains('stats-v4-jump'),\n      layoutClass: dock?.classList.contains('masthead-row'),\n", "      position: dock instanceof HTMLElement ? getComputedStyle(dock).position : '',\n")
          audit = audit.replace("one.dockHidden === false && one.stickyClass && one.layoutClass && one.viewDisabled === true", "one.dockHidden === false && one.position === 'fixed' && one.viewDisabled === true")
          audit = audit.replace("return { top: r.top, bottom: r.bottom, hidden: dock.hasAttribute('hidden'), viewport: window.innerHeight };", "return { top: r.top, bottom: r.bottom, hidden: dock.hasAttribute('hidden'), viewport: window.innerHeight, position: getComputedStyle(dock).position };")
          audit = audit.replace("!sticky.hidden && sticky.top >= 0 && sticky.top < 180 && sticky.bottom <= sticky.viewport", "!sticky.hidden && sticky.position === 'fixed' && sticky.top >= 0 && sticky.bottom <= sticky.viewport")
          audit = audit.replace("return { top: r.top, bottom: r.bottom, hidden: dock.hasAttribute('hidden'), width: r.width, viewportWidth: window.innerWidth };", "return { top: r.top, bottom: r.bottom, hidden: dock.hasAttribute('hidden'), width: r.width, viewportWidth: window.innerWidth, position: getComputedStyle(dock).position };")
          audit = audit.replace("!one.hidden && one.top >= 0 && one.top < 170 && one.bottom <= 844 && one.width <= one.viewportWidth", "!one.hidden && one.position === 'fixed' && one.top >= 0 && one.bottom <= 844 && one.width <= one.viewportWidth")
          audit_path.write_text(audit)
          PY
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-apply-compare-dock-css.yml
          rm -f .github/workflows/tmp-finalize-compare-dock.yml
      - name: Commit finalized integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scripts/stablecoin-index.ts scripts/validate-stablecoin-compare-discovery-navigation-remediation.mjs scripts/audit-stablecoin-compare-navigation.mjs .github/workflows src/styles/public-ui.css
          git commit -m "Finalize persistent Compare dock behavior"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
