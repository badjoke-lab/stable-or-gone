name: Temporary finalize fixed Compare dock

on:
  push:
    branches:
      - agent/stablecoin-compare-discovery-navigation-remediation
    paths:
      - '.github/workflows/tmp-finalize-compare-dock.yml'
      - 'scripts/tmp-finalize-compare-dock.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-discovery-navigation-remediation
          fetch-depth: 0
      - name: Apply fixed dock finalization
        run: node scripts/tmp-finalize-compare-dock.mjs
      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/tmp-apply-compare-dock-css.yml
          rm -f .github/workflows/tmp-finalize-compare-dock.yml
          rm -f scripts/tmp-finalize-compare-dock.mjs
      - name: Commit finalized integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize persistent Compare dock behavior"
          git push origin HEAD:agent/stablecoin-compare-discovery-navigation-remediation
