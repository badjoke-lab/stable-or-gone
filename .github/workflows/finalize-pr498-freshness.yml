name: Finalize PR498 freshness checkpoint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/record-growth-batch-4-mnee'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-growth-batch-4-mnee
          fetch-depth: 0

      - name: Apply freshness checkpoint fix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          contract_path = Path('data/quality/facet-freshness-contract-v1.json')
          contract = json.loads(contract_path.read_text())
          contract['as_of_date'] = '2026-07-31'
          contract['output_contract']['asset_count'] = 117
          contract['output_contract']['dimension_count'] = 19
          contract['output_contract']['cell_count'] = 2223
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          builder_path = Path('scripts/build-record-growth-batch-4-mnee-pr498.mjs')
          builder = builder_path.read_text()
          builder_anchor = """const expectedV3 = {
            legal_profiles: 117, stable_asset_relationships: 5, reserve_components: 151,
            income_profiles: 117, deployment_view: 184
          };
          """
          builder_block = builder_anchor + """
          const freshnessContract = read('data/quality/facet-freshness-contract-v1.json');
          write('data/quality/facet-freshness-contract-v1.json', {
            ...freshnessContract,
            as_of_date: '2026-07-31',
            output_contract: {
              ...freshnessContract.output_contract,
              asset_count: 117,
              dimension_count: 19,
              cell_count: 2223
            }
          });
          """
          if "const freshnessContract = read('data/quality/facet-freshness-contract-v1.json');" not in builder:
              if builder_anchor not in builder:
                  raise SystemExit('builder insertion anchor missing')
              builder = builder.replace(builder_anchor, builder_block, 1)
          builder_path.write_text(builder)

          validator_path = Path('scripts/validate-record-growth-batch-4-mnee-pr498.mjs')
          validator = validator_path.read_text()
          declaration_anchor = "const migrationAudit = read('docs/migration/registry-v3-migration-audit.json');\n"
          declaration = declaration_anchor + "const freshnessContract = read('data/quality/facet-freshness-contract-v1.json');\n"
          if "const freshnessContract = read('data/quality/facet-freshness-contract-v1.json');" not in validator:
              if declaration_anchor not in validator:
                  raise SystemExit('validator declaration anchor missing')
              validator = validator.replace(declaration_anchor, declaration, 1)
          check_anchor = "check(release.expected_public_record_counts.primary_records === 117 && release.expected_route_counts.total_detail === 417, 'release baseline mismatch');\n"
          check_block = check_anchor + "check(freshnessContract.as_of_date === '2026-07-31', 'facet freshness as-of date mismatch');\ncheck(freshnessContract.output_contract?.asset_count === 117 && freshnessContract.output_contract?.dimension_count === 19 && freshnessContract.output_contract?.cell_count === 2223, 'facet freshness output contract mismatch');\n"
          if "facet freshness output contract mismatch" not in validator:
              if check_anchor not in validator:
                  raise SystemExit('validator check anchor missing')
              validator = validator.replace(check_anchor, check_block, 1)
          validator_path.write_text(validator)
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and validate
        run: |
          set -euo pipefail
          node scripts/build-record-growth-batch-4-mnee-pr498.mjs
          npm run validate:record-growth-batch-4-mnee-pr498
          npm run validate:active-workstream
          npm run build:site

      - name: Commit permanent freshness fix only
        run: |
          set -euo pipefail
          rm -f .pr498-freshness.patch
          rm -f .github/workflows/finalize-pr498-freshness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance PR498 facet freshness checkpoint'
          git push origin HEAD:agent/record-growth-batch-4-mnee
