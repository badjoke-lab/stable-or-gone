name: Recover Falcon USDf launch date

on:
  push:
    branches:
      - recover-falcon-usdf-launch-date

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: recover-falcon-usdf-launch-date
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply reviewed launch-date recovery
        run: node scripts/recover-usdf-launch-date.mjs

      - name: Regenerate deterministic outputs
        run: |
          node scripts/generate-registry-stats.mjs
          node scripts/audit-registry-integrity.mjs

      - name: Validate synchronized quality state
        run: |
          npm run validate:launch-queue
          npm run validate:baseline
          npm run validate:v3-baseline
          npm run validate:data
          npm run validate:events-v2
          npm run validate:evidence-relations-v2
          npm run validate:integrity

      - name: Commit reviewed data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Recover Falcon USDf launch date"
          git push origin HEAD:recover-falcon-usdf-launch-date
