name: PR 364 Evidence Loader Sync Cleanup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr364-evidence-loader-sync-cleanup
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr364-tier-a-dossier-batch-4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr364-tier-a-dossier-batch-4
          fetch-depth: 0

      - name: Synchronize dedicated workflow boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/workflows/pr364-tier-a-dossier-batch-4.yml';
          let text=fs.readFileSync(file,'utf8');
          const before=`      - name: Verify prohibited canonical and public families are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- \\
            data/stablecoins*.json \\
            data/market-access-records-v1.json \\
            data/deployments*.json \\
            data/reserve-reports*.json \\
            data/reserve-components*.json \\
            data/income-profiles*.json \\
            src/
          echo 'PR #364 adds no asset, Market Access record, deployment, reserve report/component, income profile, or public application source.'`;
          const after=`      - name: Verify prohibited canonical and public families are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- \\
            data/stablecoins*.json \\
            data/market-access-records-v1.json \\
            data/deployments*.json \\
            data/reserve-reports*.json \\
            data/reserve-components*.json \\
            data/income-profiles*.json \\
            src/ \\
            ':(exclude)src/lib/data/post351Evidence.ts'
          test "$(git diff --name-only origin/main...HEAD -- src/)" = 'src/lib/data/post351Evidence.ts'
          grep -q "evidence-pr364-tier-a-batch-4.json" src/lib/data/post351Evidence.ts
          echo 'PR #364 adds no asset, Market Access record, deployment, reserve report/component, income profile, route, or UI surface; only the reviewed Evidence loader is synchronized.'`;
          if(!text.includes(before)) throw new Error('Dedicated workflow boundary block not found');
          text=text.replace(before,after);
          fs.writeFileSync(file,text);
          NODE

      - name: Remove temporary loader workflows
        run: |
          rm -f .github/workflows/pr364-public-evidence-loader-diagnostic.yml
          rm -f .github/workflows/pr364-loader-sync-cleanup.yml

      - name: Verify permanent loader sync
        run: |
          grep -q "evidencePr364Data" src/lib/data/post351Evidence.ts
          grep -q "exclude)src/lib/data/post351Evidence.ts" .github/workflows/pr364-tier-a-dossier-batch-4.yml
          test ! -e .github/workflows/pr364-public-evidence-loader-diagnostic.yml
          test ! -e .github/workflows/pr364-loader-sync-cleanup.yml

      - name: Commit loader synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/data/post351Evidence.ts \
            .github/workflows/pr364-tier-a-dossier-batch-4.yml \
            .github/workflows/pr364-public-evidence-loader-diagnostic.yml \
            .github/workflows/pr364-loader-sync-cleanup.yml
          if git diff --cached --quiet; then
            echo 'PR #364 Evidence loader synchronization already complete.'
            exit 0
          fi
          git commit -m 'Synchronize PR 364 Evidence with the public registry loader'
          git reset --hard HEAD
          git clean -fd
          git fetch origin pr364-tier-a-dossier-batch-4
          git rebase origin/pr364-tier-a-dossier-batch-4
          git push origin HEAD:pr364-tier-a-dossier-batch-4
