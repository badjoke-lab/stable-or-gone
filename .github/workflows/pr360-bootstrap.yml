name: PR 360 Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'pr360-evidence-correction-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 360 branch
        uses: actions/checkout@v4
        with:
          ref: pr360-evidence-correction-batch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build deterministic correction queue
        run: node scripts/build-evidence-correction-queue-pr360.mjs

      - name: Synchronize repository authority
        run: node scripts/activate-pr360-authority.mjs

      - name: Validate bootstrapped workstream
        run: npm run validate:active-workstream

      - name: Commit PR 360 bootstrap
        run: |
          if git diff --quiet; then
            echo 'PR #360 bootstrap already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/spec-governance.md docs/roadmap.md docs/migration/evidence-correction-queue-pr360.json
          git commit -m 'Bootstrap PR 360 evidence correction workstream'
          git push origin HEAD:pr360-evidence-correction-batch
