name: Repair PR517 statistics history

on:
  push:
    branches:
      - agent/post-pr518-production-closeout
    paths:
      - .github/workflows/repair-pr517-stats-history.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate reviewed PR517 history
        run: node scripts/build-record-growth-batch-5-bison-eub-usb-pr517-controlled-stats.mjs

      - name: Validate regenerated history
        run: node scripts/validate-stats-history.mjs

      - name: Commit exact history output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats-history.json
          if git diff --cached --quiet; then
            echo "No history repair required."
            exit 0
          fi
          git commit -m "Restore PR517 immutable statistics checkpoint"
          git push origin HEAD:${{ github.ref_name }}
