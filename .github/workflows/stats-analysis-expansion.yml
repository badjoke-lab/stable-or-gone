name: Statistics analysis expansion

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate deterministic statistics
        run: node scripts/validate-stats.mjs
      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs
      - name: Validate statistics foundation
        run: node scripts/validate-stats-foundation-pr327.mjs
      - name: Validate statistics analysis source contract
        run: node scripts/validate-stats-analysis-pr328.mjs
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build:site
      - name: Validate statistics analysis built outputs
        run: SOG_STATS_ANALYSIS_DIST=dist node scripts/validate-stats-analysis-pr328.mjs
      - name: Upload statistics analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-analysis-expansion-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/stats/index.html
            dist/data/stats.json
            dist/data/stats-history.json
