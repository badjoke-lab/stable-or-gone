name: Apply sUSD 2026 update

on:
  push:
    branches:
      - record-susd-depeg-sip423
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-susd-depeg-sip423
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical update
        run: node scripts/apply-susd-2026-update.mjs
      - name: Normalize v3 protected surfaces
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const v3File='docs/migration/registry-v3-baseline.json'; const v3=JSON.parse(fs.readFileSync(v3File,'utf8')); delete v3.expected_counts.classification_extensions; delete v3.expected_counts.evidence_relations; fs.writeFileSync(v3File, JSON.stringify(v3,null,2)+'\n'); const base=JSON.parse(fs.readFileSync('docs/migration/registry-v2-baseline.json','utf8')); const viewFile='docs/migration/registry-v3-view-67.json'; const view=JSON.parse(fs.readFileSync(viewFile,'utf8')); view.minimum_count=base.minimum_counts.deployments; fs.writeFileSync(viewFile, JSON.stringify(view,null,2)+'\n');"
      - name: Regenerate derived files
        run: |
          node scripts/generate-registry-stats.mjs
          node scripts/audit-registry-integrity.mjs
      - name: Validate v2 baseline
        run: npm run validate:baseline
      - name: Validate v3 baseline
        run: npm run validate:v3-baseline
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate classification
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate event details
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate deployments
        run: npm run validate:deployments-v3
      - name: Validate final registry
        run: npm run validate:final
      - name: Validate integrity
        run: npm run validate:integrity
      - name: Commit canonical result
        run: |
          rm scripts/apply-susd-2026-update.mjs
          rm .github/workflows/apply-susd-2026-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record sUSD severe depeg and SIP-423 proposal"
          git push origin HEAD:record-susd-depeg-sip423
