name: Apply stablecoin compare CSS patch

on:
  push:
    branches:
      - agent/stablecoin-compare-matrix-remediation
    paths:
      - scripts/apply-stablecoin-compare-css.mjs
      - .github/workflows/apply-stablecoin-compare-css.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stablecoin-compare-matrix-remediation
      - name: Apply bounded comparison styles
        run: node scripts/apply-stablecoin-compare-css.mjs
      - name: Commit stylesheet patch when needed
        run: |
          if git diff --quiet -- src/styles/public-ui.css; then
            echo "No stylesheet change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Style stablecoin comparison matrix"
          git push origin HEAD:agent/stablecoin-compare-matrix-remediation
