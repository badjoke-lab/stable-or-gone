name: PR 370 Post-PR 369 Review Gate

on:
  push:
    branches:
      - pr370-post-pr369-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr370-post-pr369-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic review gate
        run: |
          node scripts/build-post-pr369-review-gate-pr370.mjs
          node scripts/build-post-pr369-review-gate-pr370.mjs --check
      - name: Validate review gate authority
        run: |
          node scripts/validate-post-pr369-review-gate-pr370.mjs
          npm run validate:active-workstream
      - name: Validate existing canonical contracts
        run: |
          npm run validate:data
          npm run validate:compat
          npm run validate:final
          npm run validate:release-integrity
      - name: Verify documentation-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- data/ src/ public/
          test ! -e public/data/post-pr369-review-gate-pr370.json
          test ! -e dist/data/post-pr369-review-gate-pr370.json
      - name: Astro check and build
        run: |
          npm run check
          npm run build
      - name: Commit generated review report
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/post-pr369-review-gate-pr370.json
          if git diff --cached --quiet; then
            echo 'Review report already committed'
          else
            git commit -m 'Generate PR 370 review gate report'
            git push origin HEAD:pr370-post-pr369-review-gate
          fi
      - name: Publish PR 370 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr370-post-pr369-review-gate-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/post-pr369-review-gate-pr370.json','utf8'));}catch{}
            const sequence=(report?.approved_next_sequence??[]).map((row)=>`PR #${row.pr} ${row.work_item}`).join(' → ');
            const body=`${marker}
            ## PR #370 Post-PR #369 Review Gate

            - Workflow: **${{ job.status }}**
            - Canonical assets preserved: **${report?.source_checkpoint?.assets??'n/a'}**
            - PR #368 queue / prior-reviewed: **${report?.evaluation?.queue_quality?.candidate_count??'n/a'} / ${report?.evaluation?.queue_quality?.prior_reviewed_candidate_count??'n/a'}**
            - PR #369 change yield: **${report?.evaluation?.batch_5_yield?.change_yield_percent??'n/a'}%**
            - Planning input coverage issue confirmed: **${report?.evaluation?.planning_input_coverage?.canonical_builder_default_profile_override_files_empty === true && report?.evaluation?.planning_input_coverage?.v2_builder_calls_canonical_builder_without_options === true}**
            - Approved sequence: **${sequence||'n/a'}**
            - Next sequence ends at review gate: **${report?.review_gate_after_sequence??'n/a'}**
            - Head: \`${context.sha}\`
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
