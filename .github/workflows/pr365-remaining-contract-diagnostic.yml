name: PR 365 Remaining Contract Diagnostic

on:
  push:
    branches: [pr365-evidence-archive-maintenance-batch-2]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Synchronize and record results
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sync=(file,pairs)=>{
            let text=fs.readFileSync(file,'utf8');
            for(const [from,to] of pairs){
              if(text.includes(from))text=text.replace(from,to);
              else if(!text.includes(to))throw new Error(`${file}: missing both old and new marker: ${from}`);
            }
            fs.writeFileSync(file,text);
          };
          sync('scripts/validate-non-ui-release-material.mjs',[
            ['sog_release_integrity_pr364_112_assets_2026_07_14','sog_release_integrity_pr365_112_assets_2026_07_14'],
            ['sog_tier_a_dossier_batch_4_canonical_112_checkpoint_pr364_2026_07_14','sog_evidence_archive_maintenance_batch_2_canonical_112_checkpoint_pr365_2026_07_14'],
            ['must remain the PR #364 canonical baseline','must remain the PR #365 canonical baseline'],
            ['must remain the PR #364 dossier checkpoint','must remain the PR #365 Evidence maintenance checkpoint'],
            ['=== 387, \'current canonical checkpoint','=== 390, \'current canonical checkpoint'],
            ['must bind 387 archive indexes','must bind 390 archive indexes'],
            ['=== 172, \'current canonical checkpoint','=== 169, \'current canonical checkpoint'],
            ['must bind 172 no-archive rows','must bind 169 no-archive rows'],
            ['=== 387, \'stats history latest snapshot','=== 390, \'stats history latest snapshot'],
            ["'557 evidence records'","'559 Evidence records'"],
            ["active_workstream: 'pr364_tier_a_dossier_batch_4'","active_workstream: 'review_gate'"],
            ["next_workstream: 'pr365_evidence_archive_maintenance_batch_2'","next_workstream: 'none_pre_authorized'"]
          ]);
          sync('.github/workflows/pr365-evidence-archive-maintenance-batch-2.yml',[
            ["':!data/issuers-batch-pr364-tier-a-batch-4.json'","':!data/issuers-batch-pr364-tier-a-batch-4.json' ':!data/issuers-batch-pr358-record-growth-1.json'"],
            ['2 PR #364 legal-issuer projections restored','4 PR #358/#364 compatibility projections restored']
          ]);
          NODE
          set +e
          out=docs/migration/pr365-remaining-contract-diagnostic.txt
          : > "$out"
          run_check() {
            label="$1"
            command="$2"
            tmp=$(mktemp)
            bash -lc "$command" > "$tmp" 2>&1
            code=$?
            printf '\n## %s\nexit_code=%s\n' "$label" "$code" >> "$out"
            tail -n 80 "$tmp" >> "$out"
            rm -f "$tmp"
          }
          run_check compatibility 'npm run validate:compat'
          run_check classification 'npm run validate:classification'
          run_check profiles 'npm run validate:profiles'
          run_check events 'npm run validate:events-v2'
          run_check migration 'npm run validate:migration-v3'
          run_check reproducibility 'npm run validate:reproducible-build'
          run_check audited_checkpoint 'node scripts/validate-audited-100-checkpoint.mjs'
          run_check non_ui_release 'node scripts/validate-non-ui-release-material.mjs'
          run_check ui_cleanup 'npm run validate:ui-v3-cleanup'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-non-ui-release-material.mjs .github/workflows/pr365-evidence-archive-maintenance-batch-2.yml "$out"
          git commit -m 'Synchronize and verify PR365 current checkpoint'
          git push
