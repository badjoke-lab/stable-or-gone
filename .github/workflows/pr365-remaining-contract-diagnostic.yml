name: PR 365 Remaining Contract Diagnostic

on:
  push:
    branches: [pr365-evidence-archive-maintenance-batch-2]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record results
        shell: bash
        run: |
          set +e
          out=docs/migration/pr365-remaining-contract-diagnostic.txt
          : > "$out"
          run_check() {
            label="$1"
            command="$2"
            tmp=$(mktemp)
            bash -lc "$command" > "$tmp" 2>&1
            code=$?
            printf '\n## %s\nexit_code=%s\n' "$label" "$code" >> "$out"
            tail -n 80 "$tmp" >> "$out"
            rm -f "$tmp"
          }
          run_check compatibility 'npm run validate:compat'
          run_check classification 'npm run validate:classification'
          run_check profiles 'npm run validate:profiles'
          run_check events 'npm run validate:events-v2'
          run_check migration 'npm run validate:migration-v3'
          run_check reproducibility 'npm run validate:reproducible-build'
          run_check audited_checkpoint 'node scripts/validate-audited-100-checkpoint.mjs'
          run_check non_ui_release 'node scripts/validate-non-ui-release-material.mjs'
          run_check ui_cleanup 'npm run validate:ui-v3-cleanup'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m 'Record PR365 remaining contract diagnostics'
          git push
