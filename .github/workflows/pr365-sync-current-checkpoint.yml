name: PR 365 Sync Current Checkpoint

on:
  push:
    branches: [pr365-evidence-archive-maintenance-batch-2]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize validators
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const replace=(file,pairs)=>{
            let text=fs.readFileSync(file,'utf8');
            for(const [from,to] of pairs){
              if(!text.includes(from))throw new Error(`${file}: missing ${from}`);
              text=text.replace(from,to);
            }
            fs.writeFileSync(file,text);
          };
          replace('scripts/validate-non-ui-release-material.mjs',[
            ["sog_release_integrity_pr364_112_assets_2026_07_14","sog_release_integrity_pr365_112_assets_2026_07_14"],
            ["sog_tier_a_dossier_batch_4_canonical_112_checkpoint_pr364_2026_07_14","sog_evidence_archive_maintenance_batch_2_canonical_112_checkpoint_pr365_2026_07_14"],
            ["must remain the PR #364 canonical baseline","must remain the PR #365 canonical baseline"],
            ["must remain the PR #364 dossier checkpoint","must remain the PR #365 Evidence maintenance checkpoint"],
            ["must bind 387 archive indexes","must bind 390 archive indexes"],
            ["=== 387, 'current canonical checkpoint","=== 390, 'current canonical checkpoint"],
            ["must bind 172 no-archive rows","must bind 169 no-archive rows"],
            ["=== 172, 'current canonical checkpoint","=== 169, 'current canonical checkpoint"],
            ["=== 387, 'stats history latest snapshot","=== 390, 'stats history latest snapshot"],
            ["'557 evidence records'","'559 Evidence records'"],
            ["active_workstream: 'pr364_tier_a_dossier_batch_4'","active_workstream: 'review_gate'"],
            ["next_workstream: 'pr365_evidence_archive_maintenance_batch_2'","next_workstream: 'none_pre_authorized'"]
          ]);
          replace('.github/workflows/pr365-evidence-archive-maintenance-batch-2.yml',[
            ["':!data/issuers-batch-pr364-tier-a-batch-4.json'","':!data/issuers-batch-pr364-tier-a-batch-4.json' ':!data/issuers-batch-pr358-record-growth-1.json'"],
            ["2 PR #364 legal-issuer projections restored","4 PR #358/#364 compatibility projections restored"]
          ]);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-non-ui-release-material.mjs .github/workflows/pr365-evidence-archive-maintenance-batch-2.yml
          git commit -m 'Synchronize PR365 current checkpoint validators'
          git push
