name: PR 415 UI v3 Stablecoin Dossier

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr415-ui-v3-stablecoin-dossier-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr415-ui-v3-stablecoin-dossier'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate PR 415 bounded implementation
        run: node scripts/validate-ui-v3-stablecoin-dossier-pr415-v2.mjs && npm run validate:active-workstream
      - name: Validate existing dossier contracts
        run: npm run validate:ui-v3-stablecoin-detail && npm run prepare:stablecoin-dossier-hierarchy
      - name: Verify authorized dossier files only
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only origin/main...HEAD -- src/ | grep -Ev '^(src/pages/stablecoin/\[slug\]\.astro|src/components/Stablecoin[A-Za-z0-9-]*\.astro|src/styles/stablecoin-dossier[A-Za-z0-9.-]*\.css)$' || true)"
          test -z "$unexpected" || { echo "Unauthorized src changes:"; echo "$unexpected"; exit 1; }
          test -z "$(git diff --name-only origin/main...HEAD -- public/ data/)"
          git diff --exit-code origin/main...HEAD -- \
            config/site-architecture.mjs \
            docs/migration/ui-v3-visual-approval-register.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-release-integrity-baseline.json
      - name: Validate canonical data and Evidence
        run: npm run validate:data && npm run validate:evidence-relations-v2
      - name: Validate responsive and compatibility contracts
        run: npm run prepare:responsive-accessibility-contract && npm run validate:compat && npm run validate:final
      - name: Validate release and reproducible build
        run: npm run validate:release-integrity && npm run validate:reproducible-build
      - name: Astro check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/pr415-astro-check.log
      - name: Build site
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/pr415-build.log
      - name: Verify public layer
        run: npm run verify:public
      - name: Verify built dossier markers
        run: |
          for slug in usdc ust busd; do
            test -f "dist/stablecoin/${slug}/index.html"
            grep -q 'data-dossier-version="pr415"' "dist/stablecoin/${slug}/index.html"
            grep -q 'Current meaning of this record' "dist/stablecoin/${slug}/index.html"
            grep -q 'What this record has not resolved' "dist/stablecoin/${slug}/index.html"
            grep -q 'Sources and supported claims' "dist/stablecoin/${slug}/index.html"
          done
      - name: Publish validation diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr415-validation-diagnostics -->';
            let diagnostics='';
            for(const file of ['/tmp/pr415-astro-check.log','/tmp/pr415-build.log']){
              try{diagnostics+=`\n## ${file}\n${fs.readFileSync(file,'utf8')}`;}catch{}
            }
            const body=`${marker}
            ## PR #415 Validation Diagnostics

            \`\`\`text
            ${diagnostics.slice(-30000)}
            \`\`\``;
            const issueNumber=context.issue.number;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});

  visual-audit:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr415-ui-v3-stablecoin-dossier'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static site
        run: npm run build
      - name: Start local static server
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/pr415-server.log 2>&1 &
          echo $! > /tmp/pr415-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/stablecoin/usdc/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr415-server.log
          exit 1
      - name: Capture required dossier states
        env:
          SOG_SCREENSHOT_BASE_URL: http://127.0.0.1:4321
        run: node scripts/capture-stablecoin-dossier-pr415.mjs
      - name: Build dossier contact sheet
        run: node scripts/build-stablecoin-dossier-contact-sheet-pr415.mjs
      - name: Verify mandatory visual states
        run: |
          test -f artifacts/pr415-stablecoin-dossier/manifest.json
          test -f artifacts/pr415-stablecoin-dossier/contact-sheet.html
          test -f artifacts/pr415-stablecoin-dossier/contact-sheet.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('artifacts/pr415-stablecoin-dossier/manifest.json','utf8'));
          const contact=JSON.parse(fs.readFileSync('artifacts/pr415-stablecoin-dossier/contact-sheet.json','utf8'));
          if(manifest.failure_count!==0 || manifest.capture_count!==6)throw new Error('required dossier visual state matrix failed');
          if(manifest.horizontal_overflow_failure_count!==0)throw new Error('horizontal overflow detected');
          if(manifest.owner_approval!==false || contact.owner_approval!==false)throw new Error('automated artifact may not record owner approval');
          NODE
      - name: Upload mandatory PR 415 visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr415-stablecoin-dossier-visual-review-${{ github.run_id }}
          path: |
            artifacts/pr415-stablecoin-dossier/
            /tmp/pr415-server.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/pr415-server.pid; then kill "$(cat /tmp/pr415-server.pid)" || true; fi

  report:
    if: always()
    needs: [validate, visual-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Publish PR 415 status
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr415-stablecoin-dossier-status -->';
            const validate='${{ needs.validate.result }}';
            const visual='${{ needs.visual-audit.result }}';
            const overall=validate==='success' && visual==='success' ? 'success' : 'failure';
            const issueNumber=context.issue?.number || 415;
            const body=`${marker}
            ## PR #415 Stablecoin Dossier

            - Overall: **${overall}**
            - Contract and build validation: **${validate}**
            - Required six-state desktop/mobile visual audit: **${visual}**
            - Visual review run ID: **${context.runId}**
            - Authorized route family: **\`/stablecoin/[slug]/\`**
            - Representative records: **USDC / UST / BUSD**
            - Canonical changes: **0**
            - Owner approvals changed: **0**
            - Automated capture counts as approval: **false**
            - Next authority: **REVIEW GATE**
            - Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
