name: PR 409 UI v3 Rebuild Design Contract

on:
  push:
    branches:
      - pr409-ui-v3-rebuild-design-contract
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr409-ui-v3-rebuild-design-contract
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr409-ui-v3-rebuild-design-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate UI v3 design contract
        run: |
          set -o pipefail
          { node scripts/validate-ui-v3-rebuild-design-contract-pr409.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr409-all.txt
      - name: Verify specification-only boundary
        run: |
          set -o pipefail
          {
            test -z "$(git diff --name-only origin/main...HEAD -- src/ public/ data/ scripts/monitoring/)"
            git diff --exit-code origin/main...HEAD -- \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
          } 2>&1 | tee -a /tmp/pr409-all.txt
      - name: Validate repository contracts
        run: |
          set -o pipefail
          {
            npm run validate:data
            npm run validate:evidence-relations-v2
            npm run validate:compat
            npm run validate:final
            npm run validate:release-integrity
            npm run validate:reproducible-build
          } 2>&1 | tee -a /tmp/pr409-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr409-all.txt
      - name: Assert visual closure remains blocked
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const contract=JSON.parse(fs.readFileSync('config/ui-v3-rebuild-design-contract-pr409.json','utf8'));
          const approvals=JSON.parse(fs.readFileSync('docs/migration/ui-v3-visual-approval-register.json','utf8'));
          if(contract.visual_failure_gates.visual_audit_may_be_skipped!==false)throw new Error('visual audit may not be skipped');
          if(contract.visual_failure_gates.skipped_visual_audit_result!=='hard_failure')throw new Error('skipped visual audit must fail');
          if(contract.phase_sequence.slice(1).some((row)=>row.status!=='blocked_review_gate'))throw new Error('later UI phase was pre-authorized');
          if(approvals.current_counts.accepted_desktop!==0||approvals.current_counts.accepted_mobile!==0)throw new Error('PR #409 must not record visual approval');
          NODE
