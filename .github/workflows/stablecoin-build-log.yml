name: Stablecoin build log

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect PR 226 deployment inventory
        run: node scripts/collect-pr226.mjs > pr226-deployments.txt
      - name: Run build
        shell: bash
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee stablecoin-build.log
      - name: Verify public consistency
        shell: bash
        run: |
          set -o pipefail
          npm run verify:consistency 2>&1 | tee stablecoin-consistency.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-build-log-${{ github.run_id }}
          path: |
            stablecoin-build.log
            stablecoin-consistency.log
            pr226-deployments.txt
          if-no-files-found: error
