name: Batch E Bootstrap Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Batch E branch
        uses: actions/checkout@v4
        with:
          ref: record-growth-batch-e
          fetch-depth: 0

      - name: Upload bootstrap source
        uses: actions/upload-artifact@v4
        with:
          name: batch-e-bootstrap-source
          path: scripts/apply-batch-e-bootstrap.mjs
          if-no-files-found: error
