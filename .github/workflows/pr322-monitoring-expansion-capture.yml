name: PR322 monitoring expansion capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'pr322-reserve-redemption-source-expansion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate current monitoring expansion observation
        env:
          SOG_MONITORING_SYNC_OUTPUT: artifacts/monitoring-reserve-redemption-expansion-current.json
        run: node scripts/generate-monitoring-baseline-sync-100-assets.mjs
      - name: Upload current monitoring expansion observation
        uses: actions/upload-artifact@v4
        with:
          name: pr322-monitoring-expansion-observation
          path: artifacts/monitoring-reserve-redemption-expansion-current.json
          if-no-files-found: error
