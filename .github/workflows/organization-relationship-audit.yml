name: Organization and relationship audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 100-record organization and relationship audit
        run: node scripts/audit-registry-organization-relationships.mjs
      - name: Upload organization relationship audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-relationship-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/registry-organization-relationship-audit.json
            docs/audits/registry-100-organization-relationship-audit.md
