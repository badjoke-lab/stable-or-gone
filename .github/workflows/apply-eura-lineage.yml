name: Apply EURA lineage update

on:
  push:
    branches: [category-c-eura-lineage]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: category-c-eura-lineage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-eura-lineage.mjs
      - run: node scripts/generate-registry-stats.mjs
      - run: node scripts/audit-registry-integrity.mjs
      - run: npm run validate:launch-queue
      - run: npm run build
      - run: rm scripts/apply-eura-lineage.mjs .github/workflows/apply-eura-lineage.yml
      - uses: EndBug/add-and-commit@v9
        with:
          message: Resolve EURA launch lineage
          add: -A
          push: true
