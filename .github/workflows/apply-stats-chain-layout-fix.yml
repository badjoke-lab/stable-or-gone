name: Apply Statistics chain and panel fix

on:
  push:
    branches: [fix/stats-panel-flow-and-chain-dedup]
    paths:
      - docs/stats-chain-layout-trigger.md
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - docs/stats-chain-layout-trigger.md
      - .github/workflows/apply-stats-chain-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stats-panel-flow-and-chain-dedup
          fetch-depth: 0
      - name: Fix panel flow and canonicalize deployment chains
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('src/styles/public-ui.css')
          css = css_path.read_text()
          old = '.stats-v4-panel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stats-v4-panel{'
          new = '.stats-v4-panel-grid{columns:3;column-gap:14px}.stats-v4-panel-grid>.stats-v4-panel{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid}.stats-v4-panel{'
          if old not in css:
              raise SystemExit('desktop panel-grid rule not found')
          css = css.replace(old, new, 1)
          old = '.stats-v4-panel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}'
          if old not in css:
              raise SystemExit('tablet panel-grid rule not found')
          css = css.replace(old, '.stats-v4-panel-grid{columns:2}', 1)
          old = '.stats-v4-panel-grid,.stats-v4-split,.stats-v4-quality-grid{grid-template-columns:1fr}'
          if old not in css:
              raise SystemExit('mobile panel-grid rule not found')
          css = css.replace(old, '.stats-v4-panel-grid{columns:1}.stats-v4-split,.stats-v4-quality-grid{grid-template-columns:1fr}', 1)
          css_path.write_text(css)

          model_path = Path('scripts/stats/build-stats-model.mjs')
          model = model_path.read_text()
          replacement = r'''const DEPLOYMENT_CHAIN_ALIASES = new Map([
  ['arbitrum', 'Arbitrum One'],
  ['arbitrum one', 'Arbitrum One'],
  ['bnb chain', 'BNB Chain'],
  ['bnb smart chain', 'BNB Chain'],
  ['gnosis', 'Gnosis Chain'],
  ['gnosis chain', 'Gnosis Chain'],
  ['hyperevm', 'HyperEVM'],
  ['near', 'NEAR'],
  ['tron', 'TRON'],
  ['xdc network', 'XDC Network'],
  ['xrp ledger', 'XRP Ledger']
]);

const NON_CHAIN_DEPLOYMENT_CONTEXTS = new Set([
  '',
  'multi chain',
  'multi chain or bridge context',
  'multi chain or protocol context',
  'not known',
  'not recorded',
  'source review needed',
  'unclear',
  'unknown'
]);

function deploymentChainIdentity(value) {
  const cleaned = String(value ?? '').trim().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
  const key = cleaned.toLowerCase();
  if (NON_CHAIN_DEPLOYMENT_CONTEXTS.has(key)) return null;
  return { key, label: DEPLOYMENT_CHAIN_ALIASES.get(key) ?? cleaned };
}

function deploymentStats(deployments) {
  const chains = new Map();
  const unresolvedAssetIds = new Set();
  let unresolvedDeploymentCount = 0;
  for (const deployment of deployments) {
    const identity = deploymentChainIdentity(deployment.chain);
    if (!identity) {
      unresolvedDeploymentCount += 1;
      if (deployment.stablecoin_id) unresolvedAssetIds.add(deployment.stablecoin_id);
      continue;
    }
    const row = chains.get(identity.key) ?? { label: identity.label, deployment_count: 0, asset_ids: new Set() };
    row.deployment_count += 1;
    if (deployment.stablecoin_id) row.asset_ids.add(deployment.stablecoin_id);
    chains.set(identity.key, row);
  }
  const byChain = Object.fromEntries([...chains.values()]
    .sort((a, b) => a.label.localeCompare(b.label))
    .map((row) => [row.label, { asset_count: row.asset_ids.size, deployment_count: row.deployment_count }]));
  return {
    total_deployments: deployments.length,
    assets_with_deployments: new Set(deployments.map((row) => row.stablecoin_id).filter(Boolean)).size,
    by_chain: byChain,
    unresolved_chain_contexts: {
      asset_count: unresolvedAssetIds.size,
      deployment_count: unresolvedDeploymentCount
    },
    canonicality: dist(deployments.map((row) => row.canonicality ?? 'unknown')),
    deployment_type: dist(deployments.map((row) => row.deployment_type ?? 'unknown')),
    verification_status: dist(deployments.map((row) => row.verification_status ?? 'unknown')),
    control_capability_knowledge: {
      freeze_capability_known: deployments.filter((row) => row.freeze_capability !== undefined && row.freeze_capability !== null && row.freeze_capability !== 'unknown').length,
      blacklist_capability_known: deployments.filter((row) => row.blacklist_capability !== undefined && row.blacklist_capability !== null && row.blacklist_capability !== 'unknown').length,
      control_capability_unknown: deployments.filter((row) => ['unknown', null, undefined].includes(row.control_capability)).length
    }
  };
}

function organizationStats'''
          pattern = re.compile(r'function deploymentStats\(deployments\) \{.*?\n\}\n\nfunction organizationStats', re.S)
          if not pattern.search(model):
              raise SystemExit('deploymentStats block not found')
          model = pattern.sub(replacement, model, count=1)
          model_path.write_text(model)

          validation_path = Path('scripts/validate-stats.mjs')
          validation = validation_path.read_text()
          marker = "check(first.deployments.assets_with_deployments === first.data_quality.coverage.deployment.count, 'deployment coverage mismatch');\n"
          addition = marker + """const deploymentChainLabels = Object.keys(first.deployments.by_chain ?? {});\nconst normalizedDeploymentChainLabels = deploymentChainLabels.map((value) => value.trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\\s+/g, ' '));\ncheck(new Set(normalizedDeploymentChainLabels).size === normalizedDeploymentChainLabels.length, 'deployment chain statistics must not contain case, spacing, or alias duplicates');\nfor (const value of ['multi chain', 'multi chain or bridge context', 'multi chain or protocol context', 'source review needed', 'unknown']) check(!normalizedDeploymentChainLabels.includes(value), `non-chain deployment context leaked into by_chain: ${value}`);\nconst attributedDeploymentCount = Object.values(first.deployments.by_chain ?? {}).reduce((sum, row) => sum + Number(row.deployment_count ?? 0), 0);\nconst unresolvedDeploymentCount = Number(first.deployments.unresolved_chain_contexts?.deployment_count ?? 0);\ncheck(attributedDeploymentCount + unresolvedDeploymentCount === first.deployments.total_deployments, 'attributed and unresolved deployment counts must reconcile to total deployments');\n"""
          if marker not in validation:
              raise SystemExit('deployment validation marker not found')
          validation = validation.replace(marker, addition, 1)
          validation_path.write_text(validation)
          PY
          git rm .github/workflows/apply-stats-chain-layout-fix.yml docs/stats-chain-layout-trigger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css scripts/stats/build-stats-model.mjs scripts/validate-stats.mjs
          git commit -m "Fix Statistics panel flow and deployment chain duplicates"
          git push origin HEAD:fix/stats-panel-flow-and-chain-dedup
