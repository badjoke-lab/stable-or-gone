name: Reserve redemption backing audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 100-record reserve redemption backing audit
        run: node scripts/audit-registry-reserve-redemption-backing.mjs
      - name: Upload reserve redemption backing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reserve-redemption-backing-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/registry-reserve-redemption-backing-audit.json
            docs/audits/registry-100-reserve-redemption-backing-audit.md
