name: PR 355 Tier A Dossier Batch 2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr355-tier-a-dossier-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Tier A batch selection contract
        run: node scripts/validate-tier-a-dossier-batch-2-selection-pr355.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Verify immutable prior outputs
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/migration/record-depth-baseline-pr353-summary.json \
            docs/migration/tier-a-candidate-queue-pr353.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const handoff = JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-1-pr354-reviewed-handoff.json', 'utf8'));
          if (handoff.source_merge_commit !== 'd8a10676aec2f190bc32923fdc547ef359feb5c8') throw new Error('PR #354 handoff merge commit changed');
          if (handoff.canonical_counts?.assets !== 110) throw new Error('PR #354 handoff asset count changed');
          if (handoff.canonical_counts?.evidence !== 547) throw new Error('PR #354 handoff evidence count changed');
          if (handoff.market_access_record_count !== 0) throw new Error('PR #354 handoff Market Access count changed');
          console.log('Historical PR #353 snapshots and reviewed PR #354 handoff preserved.');
          NODE

      - name: Build deterministic dossier impact report
        shell: bash
        run: |
          mkdir -p artifacts/pr355
          set -o pipefail
          node scripts/growth/build-tier-a-batch-2-impact-pr355.mjs artifacts/pr355/tier-a-batch-2-impact-pr355.json \
            2>&1 | tee artifacts/pr355/build-impact.log

      - name: Validate dossier impact and evidence contracts
        run: node scripts/validate-tier-a-dossier-batch-2-impact-pr355.mjs

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate stablecoin profiles
        run: npm run validate:profiles

      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity contract
        run: npm run validate:release-integrity

      - name: Validate PR 355 canonical boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('config/tier-a-dossier-batch-2-pr355.json', 'utf8'));
          const checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json', 'utf8'));
          const marketAccess = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8'));
          if (config.selected_assets.length !== 5) throw new Error('PR #355 must remain a five-asset batch');
          if (checkpoint.asset_count !== 110 || checkpoint.expected_counts.evidence !== 549) throw new Error('PR #355 canonical checkpoint mismatch');
          if (marketAccess.length !== 0) throw new Error('PR #355 must not add Market Access Records');
          if (config.new_canonical_assets_allowed !== false) throw new Error('new canonical asset creation must remain forbidden');
          if (config.new_public_surface_allowed !== false) throw new Error('new public surface must remain forbidden');
          if (config.asset_rank !== false || config.single_composite_score !== false) throw new Error('score/rank boundary changed');
          console.log('PR #355 canonical/public boundaries preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify no planning endpoint leakage
        run: |
          test -f dist/data/manifest.json
          test ! -e dist/data/record-depth-baseline.json
          test ! -e dist/data/tier-a-batch-1-handoff.json
          test ! -e dist/data/tier-a-batch-2-impact.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.public_files?.record_depth_baseline) throw new Error('Record Depth planning data leaked into public manifest');
          if (manifest.public_files?.tier_a_dossier_handoff) throw new Error('Tier A handoff leaked into public manifest');
          if (manifest.public_files?.tier_a_dossier_impact) throw new Error('Tier A impact report leaked into public manifest');
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #355 public product boundary unchanged.');
          NODE

      - name: Upload PR 355 impact artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr355-tier-a-batch-2-impact-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/pr355/
