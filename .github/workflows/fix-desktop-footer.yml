name: Fix desktop footer navigation layout

on:
  push:
    branches: [fix/full-representative-ui-remediation]
    paths: [.github/workflows/fix-desktop-footer.yml]
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/fix-desktop-footer.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-representative-ui-remediation
          fetch-depth: 0
      - name: Stack desktop footer links by group
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          replacements = [
              (
                  '.footer-navigation-group { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px 12px; }',
                  '.footer-navigation-group { min-width: 180px; flex: 1 1 180px; display: grid; align-content: start; gap: 3px; }'
              ),
              (
                  '.footer-navigation-group > strong { padding: 0; margin: 0 3px 0 0; border: 0; color: var(--ui-text); font: 700 13px/1.4 var(--ui-mono); letter-spacing: .07em; text-transform: uppercase; }',
                  '.footer-navigation-group > summary { min-height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0; border: 0; color: var(--ui-text); font: 700 15px/1.4 var(--ui-sans); letter-spacing: .03em; text-transform: uppercase; list-style: none; cursor: pointer; } .footer-navigation-group > summary::-webkit-details-marker { display: none; } .footer-navigation-group > summary::after { content: "−"; } .footer-navigation-group:not([open]) > summary::after { content: "+"; } .footer-navigation-group nav { display: grid; align-content: start; gap: 0; }'
              )
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {before[:80]}')
              source = source.replace(before, after)
          path.write_text(source)
          PY
          git rm .github/workflows/fix-desktop-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Stack desktop footer navigation links"
          git pull --rebase origin fix/full-representative-ui-remediation
          git push origin HEAD:fix/full-representative-ui-remediation
