name: Apply launch dates batch L

on:
  push:
    branches:
      - launch-dates-batch-l
    paths:
      - .github/workflows/apply-launch-dates-batch-l.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-dates-batch-l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Apply canonical, event, detail, and evidence updates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          def write_pretty(path, rows):
              Path(path).write_text(json.dumps(rows, indent=2, ensure_ascii=False) + '\n')

          def write_compact_rows(path, rows):
              body = ',\n'.join('  ' + json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in rows)
              Path(path).write_text('[\n' + body + '\n]\n')

          stablecoins = read('data/stablecoins-extra.json')
          by_id = {row['id']: row for row in stablecoins}
          by_id['sog_st_rlusd']['launch_date'] = '2024-12-17'
          by_id['sog_st_rlusd']['notes'] = 'Deepened in PR-028A and launch-date Batch L. The launch date is based on Ripple’s official global exchange availability announcement. Exact period-level attestation entries, customer redemption requirements, and final deployment identifiers remain source-review areas.'
          by_id['sog_st_eurc']['launch_date'] = '2022-06-30'
          by_id['sog_st_eurc']['notes'] = 'PR-026 seed record, deepened in launch-date Batch L. The launch date follows Circle’s official Euro Coin availability announcement; EURC, Euro Coin, and EUROC are treated as one continuous asset identity.'
          write_compact_rows('data/stablecoins-extra.json', stablecoins)

          events = read('data/events-pr038.json')
          events_by_id = {row['id']: row for row in events}
          rlusd = events_by_id['sog_ev_rlusd_lifecycle_context']
          rlusd.update({
              'event_type': 'launch',
              'event_date': '2024-12-17',
              'title': 'Ripple USD launches globally',
              'description': 'Ripple made RLUSD available on global exchanges beginning December 17, 2024. SOG records this as the product launch date while keeping issuer, reserve-attestation, legal-terms, and deployment context as separate layers.',
              'failure_mechanism': 'product_launch',
              'confidence': 'high',
              'source_count': 4,
              'notes': 'Official Ripple launch announcement added in launch-date Batch L; the legacy event ID is retained for reference stability.'
          })
          eurc = events_by_id['sog_ev_eurc_lifecycle_context']
          eurc.update({
              'event_type': 'launch',
              'event_date': '2022-06-30',
              'title': 'Euro Coin launches on Ethereum',
              'description': 'Circle launched its euro-backed stablecoin on Ethereum on June 30, 2022 under the Euro Coin / EUROC name. SOG treats the later EURC name and symbol as the same continuous asset identity.',
              'failure_mechanism': 'product_launch',
              'confidence': 'high',
              'source_count': 3,
              'notes': 'Official Circle launch announcement added in launch-date Batch L; the legacy event ID is retained for reference stability.'
          })
          write_pretty('data/events-pr038.json', events)

          details = read('data/event-details-v2.json')
          details_by_id = {row['id']: row for row in details}
          details_by_id['sog_ev_rlusd_lifecycle_context']['evidence_ids'] = [
              'sog_src_rlusd_launch_2024',
              'sog_src_rlusd_ripple_page',
              'sog_src_rlusd_transparency_reports',
              'sog_src_rlusd_user_terms'
          ]
          details_by_id['sog_ev_rlusd_lifecycle_context']['launch_detail'] = {
              'summary': 'RLUSD global product launch and exchange availability beginning December 17, 2024.',
              'status': 'active'
          }
          details_by_id['sog_ev_eurc_lifecycle_context']['evidence_ids'] = [
              'sog_src_eurc_launch_2022',
              'sog_src_eurc_circle_page',
              'sog_src_eurc_transparency'
          ]
          details_by_id['sog_ev_eurc_lifecycle_context']['launch_detail'] = {
              'summary': 'Euro Coin / EUROC launch on Ethereum on June 30, 2022, continuing under the EURC name.',
              'status': 'active'
          }
          write_compact_rows('data/event-details-v2.json', details)

          evidence = read('data/evidence-extra.json')
          evidence_ids = {row['id'] for row in evidence}
          additions = [
              {
                  'id': 'sog_src_rlusd_launch_2024',
                  'stablecoin_id': 'sog_st_rlusd',
                  'event_id': 'sog_ev_rlusd_lifecycle_context',
                  'source_type': 'official_launch_announcement',
                  'title': 'Ripple USD launches globally',
                  'url': 'https://ripple.com/ripple-press/raising-the-standard-for-stablecoins-ripple-usd-launches-globally/',
                  'publisher': 'Ripple',
                  'claim_scope': 'RLUSD global launch and exchange availability beginning December 17, 2024',
                  'reliability': 'primary',
                  'notes': 'Ripple announced on December 16, 2024 that RLUSD would become available on global exchanges starting December 17, 2024.'
              },
              {
                  'id': 'sog_src_eurc_launch_2022',
                  'stablecoin_id': 'sog_st_eurc',
                  'event_id': 'sog_ev_eurc_lifecycle_context',
                  'source_type': 'official_launch_announcement',
                  'title': 'Circle announces fully reserved euro-backed stablecoin Euro Coin',
                  'url': 'https://www.circle.com/pressroom/circle-announces-a-fully-reserved-euro-backed-stablecoin-euro-coin-euroc',
                  'publisher': 'Circle',
                  'claim_scope': 'Euro Coin / EUROC official availability and Ethereum launch on June 30, 2022',
                  'reliability': 'primary',
                  'notes': 'Circle announced that Euro Coin would be available and officially launch on Ethereum on June 30, 2022; SOG treats later EURC branding as the same asset identity.'
              }
          ]
          evidence.extend(row for row in additions if row['id'] not in evidence_ids)
          write_compact_rows('data/evidence-extra.json', evidence)

          Path('docs/audits/rlusd-eurc-launch-date-review.md').write_text('''# RLUSD and EURC launch-date review

- RLUSD: `2024-12-17`, based on Ripple’s official announcement that global exchange availability would begin on that date.
- EURC / Euro Coin / EUROC: `2022-06-30`, based on Circle’s official announcement of availability and Ethereum launch on that date.

The EURC date represents the continuous Circle euro-stablecoin identity; the later EURC name and symbol do not create a separate canonical asset.
''')
          PY
      - name: Regenerate integrity audit
        run: npm run audit:integrity
      - name: Remove one-off workflow
        run: rm .github/workflows/apply-launch-dates-batch-l.yml
      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add official RLUSD and EURC launch dates"
          git push origin HEAD:launch-dates-batch-l
