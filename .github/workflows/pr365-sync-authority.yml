name: PR 365 Sync Authority

on:
  push:
    branches:
      - pr365-evidence-archive-maintenance-batch-2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr365-evidence-archive-maintenance-batch-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize authority documents
        run: node scripts/sync-pr365-authority.mjs
      - name: Commit authority synchronization
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add AGENTS.md docs/roadmap.md
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize authority after PR 365"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin pr365-evidence-archive-maintenance-batch-2
          git push origin HEAD:pr365-evidence-archive-maintenance-batch-2
