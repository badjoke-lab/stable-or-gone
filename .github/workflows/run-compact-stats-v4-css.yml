name: Run compact Statistics v4 CSS

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [docs/statistics-redesign-review.md]

permissions:
  contents: write

jobs:
  compact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rebuild-stats-information-architecture
          fetch-depth: 0
      - name: Apply compact Statistics CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helper = Path('.github/workflows/compact-stats-v4-css.yml').read_text()
          match = re.search(r"compact = r'''(.*?)'''", helper, re.S)
          if not match:
              raise SystemExit('Compact CSS block not found')

          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          marker = '/* Statistics v4 information architecture */'
          if marker not in source:
              raise SystemExit('Statistics v4 marker not found')

          prefix = source.split(marker, 1)[0].rstrip()
          obsolete = (
              '.stats-methodology-notice', '.stats-section {', '.stats-analysis-grid--three',
              '.stats-bar-list,', '.stats-bar-row,', '.stats-bar-row__label,',
              '.stats-bar-row__label span,', '.stats-bar-meter {', '.stats-bar-meter::-webkit-meter-bar',
              '.stats-bar-meter::-webkit-meter-optimum-value', '.stats-bar-meter::-moz-meter-bar',
              '.stats-mobile-disclosure {', '.stats-mobile-disclosure > summary',
              '.stats-mobile-disclosure__content', '.stats-disclosure{'
          )
          prefix_lines = [line for line in prefix.splitlines() if not line.lstrip().startswith(obsolete)]
          path.write_text('\n'.join(prefix_lines).rstrip() + '\n\n' + match.group(1).strip() + '\n')
          PY
          git rm .github/workflows/compact-stats-v4-css.yml .github/workflows/run-compact-stats-v4-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Replace obsolete Statistics CSS with compact v4 rules"
          git pull --rebase origin fix/rebuild-stats-information-architecture
          git push origin HEAD:fix/rebuild-stats-information-architecture
