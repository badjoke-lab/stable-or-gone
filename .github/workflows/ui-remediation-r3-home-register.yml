name: UI remediation R3 Home Register

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-remediation-r3-home-register-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/ui-v3-r3-home-register'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate R3 authority and containment
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ui-v3-remediation-authority.md
          test -f src/styles/ui-remediation-r3.css
          test -f scripts/audit-ui-remediation-r3.mjs
          grep -q "ui-remediation-r3.css" src/pages/index.astro
          grep -q "ui-remediation-r3.css" src/pages/stablecoins/index.astro
          grep -q "stablecoin-filter-panel" src/pages/stablecoins/index.astro
          test -z "$(git diff --name-only origin/main...HEAD -- data/ public/data/ config/site-architecture.mjs docs/migration/current-canonical-checkpoint.json docs/migration/current-stats-history-checkpoint.json docs/migration/registry-release-integrity-baseline.json)"
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate final contract
        run: npm run validate:final
      - name: Astro check
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify public layer
        run: npm run verify:public

  visual-audit:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/ui-v3-r3-home-register'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/ui-r3-server.log 2>&1 &
          echo $! > /tmp/ui-r3-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null && curl --fail --silent http://127.0.0.1:4321/stablecoins/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-r3-server.log
          exit 1
      - name: Capture and audit R3 states
        env:
          SOG_SCREENSHOT_BASE_URL: http://127.0.0.1:4321
        run: node scripts/audit-ui-remediation-r3.mjs
      - name: Upload mandatory R3 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-remediation-r3-home-register-${{ github.run_id }}
          path: |
            artifacts/ui-remediation-r3/
            /tmp/ui-r3-server.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/ui-r3-server.pid; then kill "$(cat /tmp/ui-r3-server.pid)" || true; fi

  report:
    if: always() && github.event_name == 'pull_request'
    needs: [validate, visual-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Publish R3 status
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- ui-remediation-r3-home-register -->';
            const bodyStart='<!-- ui-remediation-r3-run-status:start -->';
            const bodyEnd='<!-- ui-remediation-r3-run-status:end -->';
            const validate='${{ needs.validate.result }}';
            const visual='${{ needs.visual-audit.result }}';
            const passed=validate==='success' && visual==='success';
            const status=`## Latest R3 workflow\n\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\`\n- Validation: **${validate}**\n- 20-capture visual audit: **${visual}**\n- Overall: **${passed ? 'pass' : 'failure'}**`;
            const body=`${marker}\n## UI remediation R3 — Home and Register\n\n- Authority: \`docs/ui-v3-remediation-authority.md\`\n- Validation: **${validate}**\n- 20-capture visual audit: **${visual}**\n- States: Home / Register default / filtered / empty\n- Viewports: 1440 / 1280 / 768 / 390 / 320\n- Overall: **${passed ? 'pass' : 'failure'}**\n- Run ID: **${context.runId}**\n- Head: \`${context.sha}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            const pr=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:context.issue.number});
            const original=pr.data.body || '';
            const block=`${bodyStart}\n${status}\n${bodyEnd}`;
            const expression=new RegExp(`${bodyStart}[\\s\\S]*?${bodyEnd}`,'m');
            const next=expression.test(original) ? original.replace(expression,block) : `${original.trim()}\n\n${block}\n`;
            await github.rest.pulls.update({owner:context.repo.owner,repo:context.repo.repo,pull_number:context.issue.number,body:next});
