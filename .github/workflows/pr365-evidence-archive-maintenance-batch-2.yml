name: PR 365 Evidence Archive Maintenance Batch 2

on:
  push:
    branches:
      - pr365-evidence-archive-maintenance-batch-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr365-evidence-archive-maintenance-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate PR 365 reviewed scope
        run: |
          node scripts/build-evidence-archive-maintenance-queue-pr365.mjs --check
          node scripts/validate-evidence-archive-maintenance-batch-2-pr365.mjs
          npm run validate:active-workstream
      - name: Validate canonical Evidence
        run: |
          node scripts/validate-registry-evidence-integrity-audit.mjs
          npm run validate:data
          npm run validate:evidence-relations-v2
      - name: Validate registry and release integrity
        run: |
          npm run validate:v3
          npm run validate:deployments-v3
          npm run validate:income-v3
          npm run validate:parity
          npm run validate:release-integrity
      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs
          SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs
      - name: Verify PR 365 boundaries
        run: |
          git diff --exit-code origin/main...HEAD -- data/ ':!data/evidence-batch-b.json' ':!data/evidence-batch-c.json' ':!data/stats-history.json'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queue=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-queue-pr365.json','utf8'));
          const outcomes=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-outcomes-pr365.json','utf8'));
          const handoff=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-batch-2-pr365-reviewed-handoff.json','utf8'));
          if(queue.selected_count!==10||outcomes.changed_count!==3||outcomes.reviewed_no_safe_change_count!==7)throw new Error('PR #365 reviewed decision boundary changed');
          if(handoff.evidence_quality.archive_recorded!==390||handoff.evidence_quality.archive_not_recorded!==169)throw new Error('PR #365 archive boundary changed');
          if(handoff.next_work_item?.decision!=='review_gate_required')throw new Error('PR #365 must end at a review gate');
          NODE
      - name: Astro check and build
        run: |
          npm run check
          npm run build
          npm run verify:public
      - name: Verify internal review files remain non-public
        run: |
          test ! -e dist/data/evidence-archive-maintenance-queue-pr365.json
          test ! -e dist/data/evidence-archive-maintenance-outcomes-pr365.json
          test ! -e dist/data/evidence-archive-maintenance-batch-2-pr365-reviewed-handoff.json
      - name: Publish PR 365 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const marker='<!-- pr365-evidence-archive-maintenance-status -->';
            let handoff=null;
            try{handoff=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-batch-2-pr365-reviewed-handoff.json','utf8'));}catch{}
            const body=`${marker}\n## PR #365 Evidence and Archive Maintenance Batch 2\n\n- Workflow: **${{ job.status }}**\n- Reviewed: **${handoff?.evidence_quality?.selected??0}**\n- Dated archives added: **${handoff?.evidence_quality?.changed??0}**\n- Reviewed no-safe-change: **${handoff?.evidence_quality?.reviewed_no_safe_change??0}**\n- Archive recorded / not recorded: **${handoff?.evidence_quality?.archive_recorded??'n/a'} / ${handoff?.evidence_quality?.archive_not_recorded??'n/a'}**\n- Evidence identities / relations: **${handoff?.canonical_counts?.evidence??'n/a'} / ${handoff?.canonical_counts?.evidence_relations??'n/a'}**\n- Stats model: \`${handoff?.stats_model_sha256??'n/a'}\`\n- Stats snapshot: \`${handoff?.stats_snapshot_sha256??'n/a'}\`\n- Next authority: **review gate required**\n- Head: \`${context.sha}\`\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
