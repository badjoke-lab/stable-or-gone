name: AAA PR360 Stats Snapshot

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  snapshot:
    if: github.head_ref == 'pr360-evidence-correction-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr360-evidence-correction-batch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic PR 360 snapshot
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-pr360-stats-snapshot.mjs 2>&1 | tee pr360-stats-apply.log
      - name: Commit reviewed history snapshot
        run: |
          if git diff --quiet -- data/stats-history.json; then
            echo 'PR #360 snapshot already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats-history.json
          git commit -m 'Append PR 360 reviewed statistics snapshot'
          git push origin HEAD:pr360-evidence-correction-batch
      - name: Validate immutable history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs
      - name: Publish snapshot status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr360-stats-snapshot -->';
            let snapshot = null;
            let log = '';
            try { snapshot = JSON.parse(fs.readFileSync('data/stats-history.json','utf8')).snapshots.at(-1); } catch {}
            try { log = fs.readFileSync('pr360-stats-apply.log','utf8'); } catch {}
            const archiveCount = snapshot?.data_quality?.coverage?.archive_evidence?.count;
            const noArchiveCount = Number.isInteger(snapshot?.totals?.evidence) && Number.isInteger(archiveCount) ? snapshot.totals.evidence - archiveCount : null;
            const body = `${marker}
            ## PR #360 deterministic stats snapshot

            - Workflow status: **${{ job.status }}**
            - Checkpoint: \`${snapshot?.checkpoint_id ?? 'not-generated'}\`
            - Canonical checkpoint: \`${snapshot?.canonical_checkpoint_id ?? 'not-generated'}\`
            - Assets: **${snapshot?.totals?.assets ?? 'not-generated'}**
            - Evidence: **${snapshot?.totals?.evidence ?? 'not-generated'}**
            - Archive indexes: **${archiveCount ?? 'not-generated'}**
            - Archive not recorded: **${noArchiveCount ?? 'not-generated'}**
            - Stats model SHA-256: \`${snapshot?.stats_model_sha256 ?? 'not-generated'}\`
            - Snapshot SHA-256: \`${snapshot?.snapshot_sha256 ?? 'not-generated'}\`

            \`\`\`text
            ${log.split('\n').slice(-30).join('\n') || '(no log)'}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing = comments.find((comment)=>comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr360-stats-snapshot-${{ github.run_id }}
          if-no-files-found: warn
          path: pr360-stats-apply.log
