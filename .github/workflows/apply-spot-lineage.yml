name: Apply SPOT lineage update

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spot-lineage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/spot-step1.mjs
      - run: node scripts/spot-step2.mjs
      - run: node scripts/spot-step3.mjs
      - run: node scripts/spot-step4.mjs
      - run: node scripts/generate-registry-stats.mjs
      - run: node scripts/audit-registry-integrity.mjs
      - name: Validate deployment policy
        run: npm run validate:deployment-policy
      - name: Validate baseline
        run: npm run validate:baseline
      - name: Validate launch queue
        run: npm run validate:launch-queue
      - name: Validate terminal queue
        run: npm run validate:terminal-queue
      - name: Validate candidates
        run: npm run validate:candidates
      - name: Validate data
        run: npm run validate:data
      - name: Validate compatibility
        run: npm run validate:compat
      - name: Validate classifications
        run: npm run validate:classification
      - name: Validate profiles
        run: npm run validate:profiles
      - name: Validate events
        run: npm run validate:events-v2
      - name: Validate evidence relations
        run: npm run validate:evidence-relations-v2
      - name: Validate deployments
        run: npm run validate:deployments-v3
      - name: Validate Registry v3
        run: npm run validate:v3
      - name: Validate final state
        run: npm run validate:final
      - name: Validate finalization
        run: npm run validate:finalization
      - name: Astro check
        run: npm run check
      - name: Build and verify
        run: npm run build:site && npm run verify:deployment && npm run verify:public
      - name: Remove one-time machinery
        run: rm scripts/spot-step*.mjs .github/workflows/apply-spot-lineage.yml
      - name: Commit canonical result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Resolve SPOT launch and protocol versions"
          git push origin HEAD:spot-lineage
