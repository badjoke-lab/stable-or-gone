name: PR 339 Japan stablecoin access guide

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr339-japan-stablecoin-access-guide'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate guides
        run: npm run validate:guides
      - name: Validate site architecture
        run: npm run validate:site-architecture
      - name: Validate Japan access publication contract
        run: node scripts/validate-japan-stablecoin-access-guide-pr339.mjs
      - name: Verify no canonical registry data changed
        shell: bash
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          if printf '%s\n' "$changed" | grep -E '^data/(stablecoins|events|evidence|stablecoin-classification-v2|stablecoin-profiles-v2|event-details-v2|evidence-relations-v2|deployments|legal-profiles|stats-history)'; then
            echo 'PR #339 must not modify canonical registry or statistics-history files.'
            exit 1
          fi
      - name: Astro check
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify built guide route
        run: test -f dist/guides/japan-stablecoin-access-usdc-rlusd-jpysc/index.html
