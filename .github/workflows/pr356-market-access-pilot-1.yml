name: PR 356 Market Access Pilot 1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr356-market-access-pilot-1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build bounded Market Access candidate review
        run: node scripts/build-market-access-pilot-1-review-pr356.mjs artifacts/pr356/market-access-pilot-1-review.json

      - name: Validate Market Access Pilot 1
        run: node scripts/validate-market-access-pilot-1-pr356.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Verify bounded pilot boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('config/market-access-pilot-1-pr356.json', 'utf8'));
          const records = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8'));
          const handoff = JSON.parse(fs.readFileSync('docs/migration/tier-a-batch-2-pr355-reviewed-handoff.json', 'utf8'));
          if (handoff.source_merge_commit !== 'b192c4c920e3a3626d006dd8b80f44e806f40da9') throw new Error('PR #355 handoff merge commit mismatch');
          if (config.maximum_canonical_records !== 4) throw new Error('Pilot maximum must remain four records');
          if (records.length > 4) throw new Error(`Pilot exceeds four records: ${records.length}`);
          if (config.boundaries?.new_canonical_assets_allowed !== false) throw new Error('New canonical assets must remain forbidden');
          if (config.boundaries?.new_public_surface_allowed !== false) throw new Error('New public surface must remain forbidden');
          if (config.boundaries?.universal_japan_availability_claim_allowed !== false) throw new Error('Universal Japan availability claim must remain forbidden');
          console.log(`PR #356 bounded pilot boundary valid at stage ${config.status}; canonical rows=${records.length}.`);
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify internal review is not public
        run: |
          test ! -e dist/data/market-access-pilot-1-review.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          if (manifest.public_files?.market_access_pilot_review) throw new Error('Internal pilot review leaked into public manifest');
          if (manifest.data_safety?.canonical_only !== true) throw new Error('Canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('Candidate publication boundary changed');
          console.log('Internal PR #356 review remains outside public output.');
          NODE

      - name: Upload Market Access candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr356-market-access-pilot-1-review-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/pr356/
