name: Apply stablecoin logo styles

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/apply-stablecoin-logo-styles.mjs'
      - '.github/workflows/apply-stablecoin-logo-styles.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Apply stablecoin logo styles
        run: node scripts/apply-stablecoin-logo-styles.mjs

      - name: Commit final stablecoin logo styles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/public-ui.css scripts/apply-stablecoin-logo-styles.mjs .github/workflows/apply-stablecoin-logo-styles.yml
          git commit -m 'Style local stablecoin logo assets'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
