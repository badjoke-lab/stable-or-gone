name: Evidence Archive Batch 2 implementation

on:
  push:
    branches:
      - agent/evidence-archive-batch2-implementation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-archive-batch2-implementation-pr552
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/evidence-archive-batch2-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact reviewed archive additions
        run: node scripts/build-evidence-archive-batch2-implementation-pr552.mjs
      - name: Commit deterministic implementation outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/evidence.json \
            data/evidence-batch-a.json \
            data/stats-history.json \
            docs/migration/current-canonical-checkpoint.json \
            docs/migration/current-stats-history-checkpoint.json \
            docs/migration/registry-release-integrity-baseline.json \
            docs/migration/evidence-archive-payload-verification-batch-2-implementation-pr552.json
          if git diff --cached --quiet; then
            echo 'Implementation outputs already committed'
            exit 0
          fi
          git commit -m 'Apply exact Evidence Archive Batch 2 archive additions'
          git pull --rebase origin agent/evidence-archive-batch2-implementation
          git push origin HEAD:agent/evidence-archive-batch2-implementation
