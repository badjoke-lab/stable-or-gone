name: PR 523 stats history repair

on:
  push:
    branches:
      - agent/pr523-jpysc-market-access-implementation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr523-jpysc-market-access-implementation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Append deterministic PR523 stats snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { generateCurrentHistorySnapshot } from './scripts/stats/build-history-snapshot.mjs';

          const path = 'data/stats-history.json';
          const history = JSON.parse(fs.readFileSync(path, 'utf8'));
          const snapshot = generateCurrentHistorySnapshot({ root: process.cwd() });
          const existing = history.snapshots.find((row) => row.checkpoint_id === snapshot.checkpoint_id);

          if (existing) {
            if (JSON.stringify(existing) !== JSON.stringify(snapshot)) {
              throw new Error(`Existing snapshot differs from deterministic current snapshot: ${snapshot.checkpoint_id}`);
            }
            console.log(`Snapshot already present: ${snapshot.checkpoint_id}`);
          } else {
            const previous = history.snapshots.at(-1);
            if (snapshot.source_checkpoint_id !== previous?.checkpoint_id) {
              throw new Error(`Unexpected source checkpoint: ${snapshot.source_checkpoint_id} != ${previous?.checkpoint_id}`);
            }
            history.snapshots.push(snapshot);
            fs.writeFileSync(path, `${JSON.stringify(history, null, 2)}\n`);
            console.log(`Appended ${snapshot.checkpoint_id}`);
          }
          NODE

      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs

      - name: Commit repair
        run: |
          if git diff --quiet -- data/stats-history.json; then
            echo "No stats history change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats-history.json
          git commit -m "Append PR523 statistics history checkpoint"
          git push origin HEAD:agent/pr523-jpysc-market-access-implementation
