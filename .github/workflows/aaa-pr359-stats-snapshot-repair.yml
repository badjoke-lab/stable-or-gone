name: AAA PR359 Stats Snapshot Repair

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    if: github.head_ref == 'pr359-market-access-pilot-2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr359-market-access-pilot-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair deterministic PR 359 snapshot
        run: node scripts/repair-pr359-stats-snapshot.mjs > pr359-snapshot-repair.json
      - name: Commit repaired snapshot
        run: |
          if git diff --quiet -- data/stats-history.json; then
            echo 'PR #359 snapshot already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats-history.json
          git commit -m 'Normalize PR 359 reviewed statistics snapshot'
          git push origin HEAD:pr359-market-access-pilot-2
      - name: Validate immutable history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs
      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr359-stats-repair -->';
            let snapshot = null;
            try {
              const history = JSON.parse(fs.readFileSync('data/stats-history.json', 'utf8'));
              snapshot = history.snapshots.at(-1);
            } catch {}
            const body = `${marker}
            ## PR #359 statistics history repair

            - Workflow status: **${{ job.status }}**
            - Checkpoint: \`${snapshot?.checkpoint_id ?? 'not-generated'}\`
            - Kind: \`${snapshot?.checkpoint_kind ?? 'not-generated'}\`
            - Market Access records: **${snapshot?.totals?.market_access_records ?? 'not-generated'}**
            - Stats model SHA-256: \`${snapshot?.stats_model_sha256 ?? 'not-generated'}\`
            - Snapshot SHA-256: \`${snapshot?.snapshot_sha256 ?? 'not-generated'}\`
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
