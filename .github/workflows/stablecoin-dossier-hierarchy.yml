name: Stablecoin dossier hierarchy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect stablecoin dossier field matrix
        run: node scripts/collect-stablecoin-dossier-hierarchy.mjs
      - name: Validate stablecoin dossier hierarchy
        run: node scripts/validate-stablecoin-dossier-hierarchy.mjs
      - name: Upload dossier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-dossier-hierarchy-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/stablecoin-dossier-hierarchy.json
            data/generated/stablecoin-dossier-hierarchy-validation.json
