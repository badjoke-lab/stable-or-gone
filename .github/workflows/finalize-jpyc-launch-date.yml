name: Finalize JPYC launch date

on:
  push:
    branches:
      - add-jpyc-launch-date
    paths:
      - .github/workflows/finalize-jpyc-launch-date.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-jpyc-launch-date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Regenerate integrity audit
        run: npm run audit:integrity
      - name: Remove one-off workflow
        run: rm .github/workflows/finalize-jpyc-launch-date.yml
      - name: Commit generated audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Regenerate audit after JPYC launch date update"
          git push origin HEAD:add-jpyc-launch-date
