name: Finalize fiat income roadmap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resolve-fiat-backed-income-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply roadmap update
        run: node scripts/apply-fiat-income-roadmap.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate income profiles
        run: npm run validate:income-v3
      - name: Regenerate registry stats
        run: node scripts/generate-registry-stats.mjs
      - name: Validate regenerated registry stats
        run: node scripts/validate-registry-stats.mjs
      - name: Run full repository build
        run: npm run build
      - name: Remove one-time machinery
        run: |
          rm scripts/apply-fiat-income-roadmap.mjs
          rm .github/workflows/apply-fiat-income-roadmap.yml
      - name: Commit finalized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve fiat-backed income profiles"
          git push origin HEAD:resolve-fiat-backed-income-profiles
