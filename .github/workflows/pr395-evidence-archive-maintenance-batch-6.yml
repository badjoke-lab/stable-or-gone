name: PR 395 Evidence Archive Maintenance Batch 6

on:
  push:
    branches:
      - pr395-evidence-archive-maintenance-batch-6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr395-evidence-archive-maintenance-batch-6'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe selected live URLs and exact Wayback CDX
        if: github.event_name == 'push' || !hashFiles('docs/migration/evidence-archive-maintenance-batch-6-pr395-review-queue.json')
        run: |
          set -o pipefail
          node scripts/probe-evidence-archive-maintenance-batch-6-pr395.mjs 2>&1 | tee -a /tmp/pr395-all.txt
      - name: Commit probe review queue
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/evidence-archive-maintenance-batch-6-pr395-review-queue.json
          if git diff --cached --quiet; then
            echo 'PR #395 probe output already committed'
          else
            git commit -m 'Probe PR 395 Queue v5 Evidence sources'
            git pull --rebase origin pr395-evidence-archive-maintenance-batch-6
            git push origin HEAD:pr395-evidence-archive-maintenance-batch-6
          fi
      - name: Validate probe-only authority
        run: |
          set -o pipefail
          { node scripts/validate-evidence-archive-maintenance-batch-6-pr395-probe.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr395-all.txt
      - name: Verify canonical/public unchanged
        run: |
          set -o pipefail
          {
            git diff --exit-code origin/main...HEAD -- data/ src/ public/
            git diff --exit-code origin/main...HEAD -- \
              docs/migration/post-pr393-review-gate-pr394.json \
              docs/migration/evidence-archive-maintenance-queue-v5-pr393.json \
              docs/migration/evidence-archive-maintenance-queue-v5-pr393-delta.json \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
            test ! -e public/data/evidence-archive-maintenance-batch-6-pr395-review-queue.json
            test ! -e src/pages/evidence-archive-maintenance-batch-6-pr395.astro
          } 2>&1 | tee -a /tmp/pr395-all.txt
      - name: Validate canonical and release contracts
        run: |
          set -o pipefail
          { npm run validate:data; npm run validate:compat; npm run validate:final; npm run validate:release-integrity; node scripts/validate-non-ui-release-material-current.mjs; } 2>&1 | tee -a /tmp/pr395-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr395-all.txt
      - name: Publish PR 395 probe status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr395-evidence-archive-maintenance-probe-status -->';
            const fs=require('fs');
            let probe=null;
            try{probe=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-batch-6-pr395-review-queue.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr395-all.txt','utf8').trim();}catch{}
            const rows=probe?.rows||[];
            const body=`${marker}
            ## PR #395 Evidence and Archive Maintenance Batch 6 Probe

            - Phase: **probe only**
            - Workflow: **${{ job.status }}**
            - Selected: **${probe?.selected_count??'n/a'}**
            - Live OK: **${rows.filter((row)=>row.live_probe?.ok).length}**
            - Exact CDX with capture: **${rows.filter((row)=>(row.exact_cdx_probe?.capture_count??0)>0).length}**
            - Canonical writes: **disabled**
            - Head: \`${context.sha}\`

            <details><summary>Probe summary</summary>

            \`\`\`text
            ${rows.map((row)=>`${row.evidence_id} | live=${row.live_probe?.status??'error'} | redirected=${row.live_probe?.redirected??'n/a'} | captures=${row.exact_cdx_probe?.capture_count??0} | final=${row.live_probe?.final_url??'n/a'}`).join('\n')}
            \`\`\`
            </details>

            <details><summary>Validation diagnostics (tail)</summary>

            \`\`\`text
            ${diagnostics.slice(-12000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
