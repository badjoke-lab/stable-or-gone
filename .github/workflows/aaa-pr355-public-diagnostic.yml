name: AAA PR355 Public Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'pr355-tier-a-dossier-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Write exact public breakdown differences
        run: |
          mkdir -p artifacts/pr355-public-diagnostic
          node scripts/diagnose-public-record-breakdown-pr355.mjs dist \
            > artifacts/pr355-public-diagnostic/differences.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr355-public-diagnostic-${{ github.run_id }}
          path: artifacts/pr355-public-diagnostic/
          if-no-files-found: error
