name: PR 396 Post-PR 395 Review Gate

on:
  push:
    branches:
      - pr396-post-pr395-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr396-post-pr395-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic review gate
        run: |
          set -o pipefail
          { node scripts/build-post-pr395-review-gate-pr396.mjs; node scripts/build-post-pr395-review-gate-pr396.mjs --check; } 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Commit generated review report
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/post-pr395-review-gate-pr396.json
          if git diff --cached --quiet; then
            echo 'PR #396 review report already committed'
          else
            git commit -m 'Generate PR 396 post-PR 395 review gate report'
            git pull --rebase origin pr396-post-pr395-review-gate
            git push origin HEAD:pr396-post-pr395-review-gate
          fi
      - name: Validate review gate authority
        run: |
          set -o pipefail
          { node scripts/validate-post-pr395-review-gate-pr396.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Validate canonical and release contracts
        run: |
          set -o pipefail
          { npm run validate:data; npm run validate:compat; npm run validate:final; npm run validate:release-integrity; node scripts/validate-non-ui-release-material-current.mjs; } 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Verify internal-review-only boundary
        run: |
          set -o pipefail
          {
            git diff --exit-code origin/main...HEAD -- data/ src/ public/
            git diff --exit-code origin/main...HEAD -- \
              docs/migration/evidence-archive-maintenance-outcomes-pr395.json \
              docs/migration/evidence-archive-maintenance-batch-6-pr395-reviewed-handoff.json \
              config/evidence-archive-review-history-v4-pr392.json \
              docs/migration/evidence-archive-review-history-manifest-v4-pr392.json \
              docs/migration/evidence-archive-review-history-audit-v4-pr392.json \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
            test ! -e public/data/post-pr395-review-gate-pr396.json
            test ! -e src/pages/post-pr395-review-gate-pr396.astro
          } 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Verify generated output is committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr396-all.txt
      - name: Publish PR 396 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr396-post-pr395-review-gate-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/post-pr395-review-gate-pr396.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr396-all.txt','utf8').trim();}catch{}
            const sequence=report?.approved_next_sequence?.map((row)=>`PR #${row.pr} ${row.work_item}`).join(' → ')||'n/a';
            const v5=report?.expected_history_v5||{};
            const body=`${marker}
            ## PR #396 Post-PR #395 Review Gate

            - Workflow: **${{ job.status }}**
            - Archive recorded / not recorded: **${report?.source_checkpoint?.archive_recorded??'n/a'} / ${report?.source_checkpoint?.archive_not_recorded??'n/a'}**
            - PR #395 reviewed / changed: **${report?.completed_pr395?.selected??'n/a'} / ${report?.completed_pr395?.changed??'n/a'}**
            - PR #395 archives / replacements / no-safe: **${report?.completed_pr395?.dated_archives_added??'n/a'} / ${report?.completed_pr395?.reviewed_source_replacements??'n/a'} / ${report?.completed_pr395?.reviewed_no_safe_change??'n/a'}**
            - History v5 sources / events / identities: **${v5.sources??'n/a'} / ${v5.events??'n/a'} / ${v5.identities??'n/a'}**
            - History v5 archive / invalid / no-safe / replacement: **${v5.effective_archive_present??'n/a'} / ${v5.effective_invalid_removed??'n/a'} / ${v5.effective_no_safe_change??'n/a'} / ${v5.effective_source_replacement??'n/a'}**
            - Suppressed / reactivated eligible: **${v5.reviewed_suppressed??'n/a'} / ${v5.reviewed_reactivated_eligible??'n/a'}**
            - Approved sequence: **${sequence}**
            - Review gate after sequence: **${report?.review_gate_after_sequence??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics (tail)</summary>

            \`\`\`text
            ${diagnostics.slice(-14000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
