name: PR 523 stats refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/pr523-jpysc-market-access-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate PR523 history snapshot
        run: |
          mkdir -p artifacts/pr523
          node scripts/stats/build-history-snapshot.mjs > artifacts/pr523/current-history-snapshot.json
      - name: Publish generated snapshot
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr523-generated-stats-snapshot -->';
            const snapshot = fs.readFileSync('artifacts/pr523/current-history-snapshot.json', 'utf8').trim();
            const body = `${marker}\n## PR #523 generated stats snapshot\n\n\`\`\`json\n${snapshot}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr523-current-history-snapshot-${{ github.run_id }}
          path: artifacts/pr523/current-history-snapshot.json
