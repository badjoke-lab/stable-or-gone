name: Widen static registry cards

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/widen-static-registry-cards.yml]
  push:
    branches: [fix/full-representative-ui-remediation]
    paths: [.github/workflows/widen-static-registry-cards.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-representative-ui-remediation
          fetch-depth: 0
      - name: Widen desktop cards and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          before = 'grid-template-columns:repeat(auto-fit,minmax(320px,1fr))'
          after = 'grid-template-columns:repeat(auto-fit,minmax(460px,1fr))'
          if source.count(before) != 1:
              raise SystemExit(f'Expected one static grid rule, found {source.count(before)}')
          path.write_text(source.replace(before, after))
          PY
          git rm .github/workflows/widen-static-registry-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Widen paginated registry cards"
          git pull --rebase origin fix/full-representative-ui-remediation
          git push origin HEAD:fix/full-representative-ui-remediation
