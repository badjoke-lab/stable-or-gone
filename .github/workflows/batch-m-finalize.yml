name: Batch M Finalize

on:
  push:
    branches:
      - promote-batch-m-stable-assets

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip batch-m-finalizer]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote-batch-m-stable-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/finalize-batch-m-bootstrap.mjs
      - run: npm run build
      - name: Commit finalized Batch M
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Batch M registry [skip batch-m-finalizer]"
          git push origin HEAD:promote-batch-m-stable-assets
