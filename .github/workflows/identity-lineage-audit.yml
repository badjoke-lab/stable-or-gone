name: Identity and lineage audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 100-record identity and lineage audit
        run: node scripts/audit-registry-identity-lineage.mjs
      - name: Upload identity and lineage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-lineage-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/registry-identity-lineage-audit.json
            docs/audits/registry-100-identity-lineage-audit.md
