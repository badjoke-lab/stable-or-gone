name: PR500 extend stats history taxonomy

on:
  push:
    branches:
      - agent/mnee-evidence-archive-maintenance
    paths:
      - .github/workflows/pr500-extend-stats-history-taxonomy.yml
      - scripts/extend-stats-history-maintenance-taxonomy.mjs

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mnee-evidence-archive-maintenance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Extend maintenance checkpoint taxonomy
        run: node scripts/extend-stats-history-maintenance-taxonomy.mjs

      - name: Validate immutable statistics history
        run: node scripts/validate-stats-history.mjs

      - name: Commit validator and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No taxonomy changes required."
            exit 0
          fi
          git commit -m "Extend stats history for maintenance checkpoints"
          git push origin HEAD:agent/mnee-evidence-archive-maintenance
