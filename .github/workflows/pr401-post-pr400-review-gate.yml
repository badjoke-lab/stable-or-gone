name: PR 401 Post-PR 400 Review Gate

on:
  push:
    branches:
      - pr401-post-pr400-review-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr401-post-pr400-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic review gate
        run: |
          set -o pipefail
          { node scripts/build-post-pr400-review-gate-pr401.mjs; node scripts/build-post-pr400-review-gate-pr401.mjs --check; } 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Commit generated review report
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration/post-pr400-review-gate-pr401.json
          if git diff --cached --quiet; then
            echo 'PR #401 review report already committed'
          else
            git commit -m 'Generate PR 401 post-PR 400 review gate report'
            git pull --rebase origin pr401-post-pr400-review-gate
            git push origin HEAD:pr401-post-pr400-review-gate
          fi
      - name: Validate review gate authority
        run: |
          set -o pipefail
          { node scripts/validate-post-pr400-review-gate-pr401.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Validate canonical and release contracts
        run: |
          set -o pipefail
          { npm run validate:data; npm run validate:compat; npm run validate:final; npm run validate:release-integrity; node scripts/validate-non-ui-release-material-current.mjs; } 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Verify internal-review-only boundary
        run: |
          set -o pipefail
          {
            git diff --exit-code origin/main...HEAD -- data/ src/ public/
            git diff --exit-code origin/main...HEAD -- \
              docs/migration/evidence-archive-maintenance-outcomes-pr400.json \
              docs/migration/evidence-archive-maintenance-batch-7-pr400-reviewed-handoff.json \
              config/evidence-archive-review-history-v5-pr397.json \
              docs/migration/evidence-archive-review-history-manifest-v5-pr397.json \
              docs/migration/evidence-archive-review-history-audit-v5-pr397.json \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
            test ! -e public/data/post-pr400-review-gate-pr401.json
            test ! -e src/pages/post-pr400-review-gate-pr401.astro
          } 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Verify generated output is deterministic
        if: github.event_name == 'pull_request'
        run: node scripts/build-post-pr400-review-gate-pr401.mjs --check 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr401-all.txt
      - name: Publish PR 401 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr401-post-pr400-review-gate-status -->';
            const fs=require('fs');
            let report=null;
            try{report=JSON.parse(fs.readFileSync('docs/migration/post-pr400-review-gate-pr401.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr401-all.txt','utf8').trim();}catch{}
            const sequence=report?.approved_next_sequence?.map((row)=>`PR #${row.pr} ${row.work_item}`).join(' → ')||'n/a';
            const projection=report?.expected_history_v6||{};
            const body=`${marker}
            ## PR #401 Post-PR #400 Review Gate

            - Workflow: **${{ job.status }}**
            - Archive recorded / not recorded: **${report?.source_checkpoint?.archive_recorded??'n/a'} / ${report?.source_checkpoint?.archive_not_recorded??'n/a'}**
            - PR #400 selected / changed: **${report?.completed_pr400?.selected??'n/a'} / ${report?.completed_pr400?.changed??'n/a'}**
            - History v6 sources / events / identities: **${projection.sources??'n/a'} / ${projection.events??'n/a'} / ${projection.identities??'n/a'}**
            - Archive present / invalid / no-safe / replacement: **${projection.effective_archive_present??'n/a'} / ${projection.effective_invalid_removed??'n/a'} / ${projection.effective_no_safe_change??'n/a'} / ${projection.effective_source_replacement??'n/a'}**
            - Unresolved / suppressed / reactivated: **${projection.reviewed_unresolved_total??'n/a'} / ${projection.reviewed_suppressed??'n/a'} / ${projection.reviewed_reactivated_eligible??'n/a'}**
            - Approved sequence: **${sequence}**
            - Review gate after sequence: **${report?.review_gate_after_sequence??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics (tail)</summary>

            \`\`\`text
            ${diagnostics.slice(-16000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
