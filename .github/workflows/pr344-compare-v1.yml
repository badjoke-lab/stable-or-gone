name: PR 344 Compare v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr344-compare-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate Compare v1 source contract
        run: node scripts/validate-compare-v1-pr344.mjs

      - name: Validate active workstream
        run: npm run validate:active-workstream

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-compare-v1-server.log 2>&1 &
          echo $! > /tmp/sog-compare-v1-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/compare/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-compare-v1-server.log
          exit 1

      - name: Audit Compare v1 desktop and mobile interactions
        run: node scripts/audit-compare-v1-pr344.mjs

      - name: Verify built Compare and projection routes
        shell: bash
        run: |
          test -f dist/compare/index.html
          test -f dist/data/comparison.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const projection = JSON.parse(fs.readFileSync('dist/data/comparison.json', 'utf8'));
          if (projection.asset_count !== 110 || projection.dimension_count !== 19 || projection.cell_count !== 2090) throw new Error('comparison projection contract mismatch');
          if (projection.single_composite_score !== false) throw new Error('comparison projection must not emit a composite score');
          const html = fs.readFileSync('dist/compare/index.html', 'utf8');
          if (!html.includes('data-compare-page')) throw new Error('built Compare page contract marker missing');
          if (!html.includes('data-max-assets="4"')) throw new Error('built Compare page max asset boundary missing');
          console.log('Built Compare page and projection route contracts valid.');
          NODE

      - name: Upload Compare v1 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr344-compare-v1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/compare-v1/audit.json
            artifacts/compare-v1/desktop.png
            artifacts/compare-v1/mobile.png
