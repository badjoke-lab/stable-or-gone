name: Advance PR 272 workstream

on:
  push:
    branches:
      - ui-v3-accessibility-performance-legacy-cleanup

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v3-accessibility-performance-legacy-cleanup
      - run: node scripts/advance-pr272-workstream.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap.md docs/ui-redesign/implementation-plan.md AGENTS.md scripts/validate-current-workstream.mjs
          git commit -m "Advance UI workstream to production verification"
          git push origin HEAD:ui-v3-accessibility-performance-legacy-cleanup
