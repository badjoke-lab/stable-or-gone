name: Responsive accessibility contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect responsive and accessibility baseline
        run: node scripts/collect-responsive-accessibility-audit.mjs
      - name: Validate responsive and accessibility contract
        run: node scripts/validate-responsive-accessibility-contract.mjs
      - name: Upload responsive accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-accessibility-contract-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/responsive-accessibility-audit.json
            data/generated/responsive-accessibility-validation.json
