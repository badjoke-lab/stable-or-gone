name: Meaningful change history contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect current and target change history
        run: node scripts/collect-change-history-audit.mjs
      - name: Validate meaningful change history contract
        run: node scripts/validate-change-history-contract.mjs
      - name: Upload change history diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-history-contract-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/change-history-audit.json
            data/generated/change-history-validation.json
