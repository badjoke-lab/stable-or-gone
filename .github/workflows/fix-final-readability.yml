name: Fix final disclosure readability floors

on:
  push:
    branches: [fix/full-representative-ui-remediation]
    paths: [.github/workflows/fix-final-readability.yml]
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/fix-final-readability.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-representative-ui-remediation
          fetch-depth: 0
      - name: Apply audited disclosure floors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/public-ui.css')
          source = path.read_text()
          replacements = [
              (
                  '.stats-disclosure>summary span{color:var(--ui-muted);font:700 13px/1.4 var(--ui-mono);letter-spacing:.04em;text-transform:uppercase}',
                  '.stats-disclosure>summary span{color:var(--ui-muted);font:700 13px/1.4 var(--ui-sans);letter-spacing:.04em;text-transform:uppercase}'
              ),
              (
                  '.footer-navigation-group > summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; font: 700 13px/1.4 var(--ui-mono); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }',
                  '.footer-navigation-group > summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; font: 700 15px/1.4 var(--ui-sans); letter-spacing: .03em; text-transform: uppercase; cursor: pointer; }'
              ),
              (
                  '.footer-navigation-group a { width: fit-content; min-height: 36px; font-size: 15px; }',
                  '.footer-navigation-group a { width: fit-content; min-height: 40px; font-size: 15px; }'
              )
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {before[:80]}')
              source = source.replace(before, after)
          path.write_text(source)
          PY
          git rm .github/workflows/fix-final-readability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/public-ui.css
          git commit -m "Meet disclosure readability and target floors"
          git pull --rebase origin fix/full-representative-ui-remediation
          git push origin HEAD:fix/full-representative-ui-remediation
