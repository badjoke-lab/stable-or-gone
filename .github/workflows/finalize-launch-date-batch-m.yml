name: Finalize launch date batch M

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'launch-date-batch-m'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-date-batch-m
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: python scripts/tmp-finalize-xsgd.py
      - run: node scripts/generate-registry-stats.mjs
      - run: npm run audit:integrity
      - name: Commit final batch
        run: |
          rm -f scripts/tmp-finalize-xsgd.py
          rm -f .github/workflows/finalize-launch-date-batch-m.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add official XSGD launch date evidence"
          git push origin HEAD:launch-date-batch-m
