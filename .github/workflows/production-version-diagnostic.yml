name: Production version diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-version-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOG_BASE_URL: https://sog.badjoke-lab.com
      SOG_EXPECTED_COMMIT: 8f5235f75bfa15c42ab833dcac948b59f6571ffd
      SOG_SMOKE_ATTEMPTS: '1'
      SOG_SMOKE_DELAY_MS: '0'
      SOG_PARITY_CONCURRENCY: '12'
      SOG_OWNER_APPROVAL_REF: project owner instruction to proceed with the fixed PR 261-273 sequence
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: 8f5235f75bfa15c42ab833dcac948b59f6571ffd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch production provenance
        run: |
          mkdir -p artifacts
          node <<'NODE'
          import fs from 'node:fs';
          const base = 'https://sog.badjoke-lab.com';
          const read = async (pathname) => {
            const response = await fetch(`${base}${pathname}`, {
              headers: { accept: 'application/json', 'cache-control': 'no-cache', 'user-agent': 'sog-production-diagnostic/3.0' }
            });
            return { pathname, status: response.status, headers: Object.fromEntries(response.headers), body: await response.text() };
          };
          const [versionResponse, manifestResponse] = await Promise.all([read('/version.json'), read('/data/manifest.json')]);
          const parse = (value) => { try { return JSON.parse(value); } catch { return null; } };
          const version = parse(versionResponse.body);
          const manifest = parse(manifestResponse.body);
          const result = {
            fetched_at: new Date().toISOString(),
            base_url: base,
            version_response: { ...versionResponse, body: version },
            manifest_response: { ...manifestResponse, body: manifest },
            production_commit: version?.build?.commit ?? null,
            production_branch: version?.build?.branch ?? null,
            canonical_data_hash: version?.build?.canonical_data_hash ?? null,
            record_counts: version?.data?.record_counts ?? null,
            build_provenance_equal: JSON.stringify(version?.build ?? null) === JSON.stringify(manifest?.build ?? null)
          };
          fs.writeFileSync('artifacts/production-version-diagnostic.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify({ production_commit: result.production_commit, production_branch: result.production_branch, build_provenance_equal: result.build_provenance_equal }, null, 2));
          NODE

      - name: Verify production smoke
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-production.mjs 2>&1 | tee artifacts/check-production.log

      - name: Verify production provenance
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-production-provenance.mjs 2>&1 | tee artifacts/check-production-provenance.log

      - name: Verify exact production output parity
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-production-output-parity.mjs 2>&1 | tee artifacts/check-production-output-parity.log

      - name: Capture production desktop representatives
        run: node scripts/capture-site-screenshots.mjs --device desktop --mode representative --base-url "$SOG_BASE_URL"

      - name: Capture production mobile representatives
        run: node scripts/capture-site-screenshots.mjs --device mobile --mode representative --base-url "$SOG_BASE_URL"

      - name: Audit production representatives
        run: node scripts/audit-representative-visuals.mjs

      - name: Write production closure report
        run: node scripts/write-ui-v3-production-closure-report.mjs

      - name: Upload production closure diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-v3-closure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifacts/production-version-diagnostic.json
            artifacts/check-production.log
            artifacts/check-production-provenance.log
            artifacts/check-production-output-parity.log
            artifacts/ui-v3-production-closure.json
            artifacts/ui-v3-production-closure.md
            artifacts/screenshots/**
            artifacts/screenshots-desktop.zip
            artifacts/screenshots-mobile.zip
