name: Organization index and detail implementation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate organization index and detail
        run: node scripts/validate-organization-index-detail-implementation.mjs
      - name: Validate index interaction contract
        run: npm run prepare:index-interaction-contract
      - name: Validate responsive transformation state
        run: npm run prepare:responsive-accessibility-contract
      - name: Upload organization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-index-detail-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/organization-index-detail-implementation-validation.json
            data/generated/index-interaction-audit.json
            data/generated/index-interaction-validation.json
            data/generated/responsive-accessibility-audit.json
            data/generated/responsive-accessibility-validation.json
