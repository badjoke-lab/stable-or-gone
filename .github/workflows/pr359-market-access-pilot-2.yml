name: PR 359 Market Access Pilot 2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'pr359-market-access-pilot-2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Market Access Pilot 2
        run: node scripts/validate-market-access-pilot-2-pr359.mjs

      - name: Validate active workstream authority
        run: npm run validate:active-workstream

      - name: Verify reviewed PR 358 handoff
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const handoff = JSON.parse(fs.readFileSync('docs/migration/record-growth-batch-1-pr358-reviewed-handoff.json', 'utf8'));
          if (handoff.source_merge_commit !== '47868d6a13f8f85f62034f81a7c31d528bc3a1ba') throw new Error('PR #358 merge commit mismatch');
          if (handoff.canonical_counts?.assets !== 112) throw new Error('PR #358 asset count mismatch');
          if (handoff.canonical_counts?.evidence !== 557) throw new Error('PR #358 Evidence count mismatch');
          if (handoff.canonical_counts?.market_access_records !== 4) throw new Error('PR #358 Market Access count mismatch');
          if (handoff.next_work_item !== 'PR #359 Market Access Pilot 2') throw new Error('PR #358 next work item mismatch');
          console.log('Reviewed PR #358 handoff valid.');
          NODE

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate classifications
        run: npm run validate:classifications

      - name: Validate profiles
        run: npm run validate:profiles

      - name: Validate Evidence relations
        run: npm run validate:evidence-relations-v2

      - name: Validate Registry v3 foundation
        run: npm run validate:v3

      - name: Validate Registry v3 income profiles
        run: npm run validate:income-profiles

      - name: Validate Registry v2 v3 parity
        run: npm run validate:parity

      - name: Validate release integrity
        run: npm run validate:release-integrity

      - name: Validate deterministic statistics
        run: |
          node scripts/build-stats.mjs
          SOG_STATS_VALIDATE_OUTPUT=artifacts/stats-current.json node scripts/validate-stats.mjs

      - name: Validate immutable statistics history
        run: SOG_STATS_HISTORY_BASE_REF=origin/main node scripts/validate-stats-history.mjs

      - name: Verify PR 359 boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('config/market-access-pilot-2-pr359.json', 'utf8'));
          const checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json', 'utf8'));
          const records = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8'));
          const rlusd = records.filter((row) => row.asset_id === 'sog_st_rlusd');
          const jpysc = records.filter((row) => row.asset_id === 'sog_st_jpysc');
          if (checkpoint.asset_count !== 112) throw new Error('PR #359 must preserve 112 assets');
          if (checkpoint.expected_counts?.evidence !== 557) throw new Error('PR #359 must preserve 557 Evidence identities');
          if (checkpoint.expected_counts?.deployments !== 174) throw new Error('PR #359 must preserve 174 deployments');
          if (records.length !== 8 || checkpoint.expected_counts?.market_access_records !== 8) throw new Error('PR #359 must contain exactly eight Market Access records');
          if (rlusd.length !== 4) throw new Error('PR #359 must contain exactly four RLUSD Market Access records');
          if (jpysc.length !== 0) throw new Error('JPYSC must remain outside Pilot 2');
          for (const boundary of ['new_canonical_assets_allowed','new_evidence_identities_allowed','new_public_surface_allowed','comparison_readiness_change_allowed','facet_freshness_semantics_change_allowed','monitoring_promotion_allowed','editorial_research_direct_promotion_allowed','universal_japan_availability_claim_allowed','issuer_mint_or_redemption_claim_allowed','asset_rank','single_composite_score']) {
            if (config.boundaries?.[boundary] !== false) throw new Error(`Boundary changed: ${boundary}`);
          }
          console.log('PR #359 canonical and public-surface boundaries preserved.');
          NODE

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify public layer
        run: npm run verify:public

      - name: Verify internal planning remains non-public
        run: |
          test ! -e dist/data/market-access-pilot-2-pr359.json
          test ! -e dist/data/pr358-reviewed-handoff.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          for (const key of ['market_access_pilot_2_pr359','pr358_reviewed_handoff']) {
            if (manifest.public_files?.[key]) throw new Error(`Internal PR #359 material leaked into public manifest: ${key}`);
          }
          if (manifest.data_safety?.canonical_only !== true) throw new Error('canonical-only boundary changed');
          if (manifest.data_safety?.includes_unreviewed_candidates !== false) throw new Error('candidate publication boundary changed');
          console.log('PR #359 internal planning remains outside public output.');
          NODE

      - name: Publish PR 359 summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr359-market-access-status -->';
            let records = [];
            let checkpoint = null;
            let stats = null;
            try { records = JSON.parse(fs.readFileSync('data/market-access-records-v1.json', 'utf8')); } catch {}
            try { checkpoint = JSON.parse(fs.readFileSync('docs/migration/current-canonical-checkpoint.json', 'utf8')); } catch {}
            try { stats = JSON.parse(fs.readFileSync('artifacts/stats-current.json', 'utf8')); } catch {}
            const rlusd = records.filter((row) => row.asset_id === 'sog_st_rlusd');
            const body = `${marker}
            ## PR #359 Market Access Pilot 2 status

            - Workflow status: **${{ job.status }}**
            - Asset: \`RLUSD\`
            - Jurisdiction/platform: \`Japan / SBI VC Trade / VCTRADE\`
            - RLUSD records: **${rlusd.length}**
            - Total Market Access records: **${records.length}**
            - Canonical assets: **${checkpoint?.asset_count ?? 'not-generated'}**
            - Canonical Evidence: **${checkpoint?.expected_counts?.evidence ?? 'not-generated'}**
            - Deployments: **${checkpoint?.expected_counts?.deployments ?? 'not-generated'}**
            - New Evidence identities: **0**
            - Stats model SHA-256: \`${stats?.stats_model_sha256 ?? 'not-generated'}\`
            - Head: \`${context.sha}\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }

      - name: Upload PR 359 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr359-market-access-pilot-2-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/stats-current.json
