name: Batch K finalization diagnostics

on:
  push:
    branches: [batch-k-historical-failures]
    paths:
      - .github/workflows/batch-k-finalization-diagnostics.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-k-historical-failures
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          mkdir -p diagnostics
          node scripts/validate-batch-finalization.mjs > diagnostics/finalization.log 2>&1 || true
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/finalization.log
          git commit -m "Capture Batch K finalization diagnostics"
          git push origin HEAD:batch-k-historical-failures
