name: Site architecture audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect route and navigation inventory
        run: node scripts/collect-site-architecture-audit.mjs
      - name: Validate approved architecture map
        run: node scripts/validate-site-architecture.mjs
      - name: Validate ownership and compatibility boundaries
        run: node scripts/validate-site-architecture-ownership.mjs
      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-architecture-audit-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/site-architecture-audit.json
            data/generated/site-architecture-validation.json
            data/generated/site-architecture-ownership-validation.json
