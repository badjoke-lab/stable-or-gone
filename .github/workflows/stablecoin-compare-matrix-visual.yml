name: Stablecoin compare matrix visual acceptance

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/spec-governance.md'
      - 'docs/roadmap.md'
      - 'docs/deployment-policy.md'
      - 'docs/roadmap-amendments/2026-08-12-compare-phase-c-review-result.md'
      - 'docs/quality/compare-phase-c-review-result-spec.md'
      - 'config/compare-phase-c-implementation-result.json'
      - 'src/pages/stablecoins/index.astro'
      - 'src/components/StablecoinComparisonSource.astro'
      - 'src/scripts/stablecoin-index.ts'
      - 'src/scripts/stablecoin-comparison-phase-c.ts'
      - 'src/styles/public-ui.css'
      - 'scripts/audit-stablecoin-compare-matrix-visual.mjs'
      - 'scripts/audit-stablecoin-compare-zero-state.mjs'
      - 'scripts/audit-stablecoin-compare-navigation.mjs'
      - 'scripts/audit-stablecoin-comparison-phase-c.mjs'
      - 'scripts/validate-stablecoin-compare-lifecycle.mjs'
      - 'scripts/validate-stablecoin-compare-discovery-navigation-authority.mjs'
      - 'scripts/validate-stablecoin-compare-discovery-navigation-remediation.mjs'
      - 'scripts/validate-compare-logo-maintenance-authority.mjs'
      - 'scripts/validate-compare-logo-fallback-reaudit-result.mjs'
      - 'scripts/validate-compare-phase-c-result.mjs'
      - 'scripts/validate-active-workstream.mjs'
      - '.github/workflows/stablecoin-compare-matrix-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-matrix-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Compare discovery implementation
        run: node scripts/validate-stablecoin-compare-discovery-navigation-remediation.mjs
      - name: Validate Phase C result boundary
        run: node scripts/validate-compare-phase-c-result.mjs
      - name: Build exact PR head
        run: npm run build
      - name: Validate Phase 3 Compare lifecycle projection
        run: node scripts/validate-stablecoin-compare-lifecycle.mjs
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-compare-server.log 2>&1 &
          echo $! > /tmp/sog-compare-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/stablecoins/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-compare-server.log
          exit 1
      - name: Audit 2-4 record comparison states
        run: node scripts/audit-stablecoin-compare-matrix-visual.mjs
      - name: Audit zero-selection hidden state
        run: node scripts/audit-stablecoin-compare-zero-state.mjs
      - name: Audit discovery, sticky navigation, and replacement
        run: node scripts/audit-stablecoin-compare-navigation.mjs
      - name: Audit Phase C matching-row feedback and Stablecoin marks
        run: node scripts/audit-stablecoin-comparison-phase-c.mjs
      - name: Upload comparison visual acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-compare-matrix-visual-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/stablecoin-compare-matrix/**
            artifacts/stablecoin-compare-navigation/**
            artifacts/screenshots/compare-phase-c/**
            /tmp/sog-compare-server.log
