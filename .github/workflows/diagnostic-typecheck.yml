name: Diagnostic typecheck

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture Astro check output
        run: |
          set +e
          npm run check > astro-check.log 2>&1
          code=$?
          cat astro-check.log
          echo "$code" > astro-check.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostic
          path: |
            astro-check.log
            astro-check.exit
