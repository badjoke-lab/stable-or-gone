name: Compare Phase C browser audit

on:
  pull_request:
    paths:
      - 'src/components/StablecoinComparisonSource.astro'
      - 'src/pages/stablecoins/index.astro'
      - 'src/scripts/stablecoin-comparison-phase-c.ts'
      - 'scripts/audit-stablecoin-comparison-phase-c.mjs'
      - '.github/workflows/compare-phase-c-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/StablecoinComparisonSource.astro'
      - 'src/pages/stablecoins/index.astro'
      - 'src/scripts/stablecoin-comparison-phase-c.ts'
      - 'scripts/audit-stablecoin-comparison-phase-c.mjs'
      - '.github/workflows/compare-phase-c-audit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPTURE_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sog-compare-phase-c-server.log 2>&1 &
          echo $! > /tmp/sog-compare-phase-c-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "$CAPTURE_BASE_URL/stablecoins/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sog-compare-phase-c-server.log
          exit 1

      - name: Audit matching-row feedback and Stablecoin marks
        run: node scripts/audit-stablecoin-comparison-phase-c.mjs

      - name: Upload Compare Phase C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sog-compare-phase-c-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/screenshots/compare-phase-c/compare-phase-c-audit.json
            artifacts/screenshots/compare-phase-c/compare-desktop-direct-fallback.png
            artifacts/screenshots/compare-phase-c/compare-mobile-direct-fallback.png
            /tmp/sog-compare-phase-c-server.log
