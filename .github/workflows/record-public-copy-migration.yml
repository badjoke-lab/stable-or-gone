name: Record public-copy migration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect record public-copy audit
        run: node scripts/collect-record-public-copy-audit.mjs
      - name: Validate 92-record migration matrix
        run: node scripts/validate-record-public-copy-audit.mjs
      - name: Upload record migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-public-copy-migration-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/record-public-copy-audit.json
            data/generated/record-public-copy-preservation.json
            data/generated/record-public-copy-validation.json
