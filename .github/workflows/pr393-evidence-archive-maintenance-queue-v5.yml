name: PR 393 Evidence Archive Maintenance Queue v5 Refresh

on:
  push:
    branches:
      - pr393-evidence-archive-maintenance-queue-v5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr393-evidence-archive-maintenance-queue-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic Queue v5 outputs
        run: |
          set -o pipefail
          { node scripts/build-evidence-archive-maintenance-queue-v5-pr393.mjs; node scripts/build-evidence-archive-maintenance-queue-v5-pr393.mjs --check; } 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Commit generated Queue v5 outputs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/migration/evidence-archive-maintenance-queue-v5-pr393.json \
            docs/migration/evidence-archive-maintenance-queue-v5-pr393-delta.json
          if git diff --cached --quiet; then
            echo 'PR #393 Queue v5 outputs already committed'
          else
            git commit -m 'Generate PR 393 Evidence archive maintenance Queue v5 outputs'
            git pull --rebase origin pr393-evidence-archive-maintenance-queue-v5
            git push origin HEAD:pr393-evidence-archive-maintenance-queue-v5
          fi
      - name: Validate Queue v5 contract
        run: |
          set -o pipefail
          { node scripts/validate-evidence-archive-maintenance-queue-v5-pr393.mjs; npm run validate:active-workstream; } 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Validate canonical and release contracts
        run: |
          set -o pipefail
          { npm run validate:data; npm run validate:compat; npm run validate:final; npm run validate:release-integrity; node scripts/validate-non-ui-release-material-current.mjs; } 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Verify internal-queue-only boundary
        run: |
          set -o pipefail
          {
            git diff --exit-code origin/main...HEAD -- data/ src/ public/
            git diff --exit-code origin/main...HEAD -- \
              config/evidence-archive-review-history-v4-pr392.json \
              docs/migration/evidence-archive-review-history-manifest-v4-pr392.json \
              docs/migration/evidence-archive-review-history-audit-v4-pr392.json \
              docs/migration/post-pr390-review-gate-pr391.json \
              docs/migration/evidence-archive-maintenance-queue-v4-pr388.json \
              docs/migration/evidence-archive-maintenance-queue-v4-pr388-delta.json \
              docs/migration/current-canonical-checkpoint.json \
              docs/migration/current-stats-history-checkpoint.json \
              docs/migration/registry-release-integrity-baseline.json
            test ! -e public/data/evidence-archive-maintenance-queue-v5-pr393.json
            test ! -e public/data/evidence-archive-maintenance-queue-v5-pr393-delta.json
            test ! -e src/pages/evidence-archive-maintenance-queue-v5.astro
          } 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Verify generated outputs are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Astro check and build
        run: |
          set -o pipefail
          { npm run check; npm run build; npm run verify:public; } 2>&1 | tee -a /tmp/pr393-all.txt
      - name: Publish PR 393 status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- pr393-evidence-archive-maintenance-queue-v5-status -->';
            const fs=require('fs');
            let queue=null;
            let delta=null;
            try{queue=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-queue-v5-pr393.json','utf8'));}catch{}
            try{delta=JSON.parse(fs.readFileSync('docs/migration/evidence-archive-maintenance-queue-v5-pr393-delta.json','utf8'));}catch{}
            let diagnostics='';
            try{diagnostics=fs.readFileSync('/tmp/pr393-all.txt','utf8').trim();}catch{}
            const selected=queue?.selected_candidates?.map((row)=>row.evidence_id).join(', ')||'n/a';
            const body=`${marker}
            ## PR #393 Evidence Archive Maintenance Queue v5

            - Workflow: **${{ job.status }}**
            - Canonical Evidence: **${queue?.canonical_evidence_count??'n/a'}**
            - Archive recorded / not recorded: **${queue?.archive_index_count??'n/a'} / ${queue?.archive_not_recorded_count??'n/a'}**
            - Reviewed suppressed / reactivated eligible: **${queue?.reviewed_unresolved_suppressed_count??'n/a'} / ${queue?.reactivated_reviewed_identity_count??'n/a'}**
            - Eligible pool / selected: **${queue?.eligible_pool_count??'n/a'} / ${queue?.selected_count??'n/a'}**
            - Selected reviewed-reactivated: **${queue?.selected_reactivated_reviewed_identity_count??'n/a'}**
            - Added / removed / retained versus Queue v4: **${delta?.added_evidence_ids?.length??'n/a'} / ${delta?.removed_evidence_ids?.length??'n/a'} / ${delta?.retained_evidence_ids?.length??'n/a'}**
            - Selected IDs: \`${selected}\`
            - Next work item: **${queue?.next_work_item??'n/a'}**
            - Head: \`${context.sha}\`

            <details><summary>Validation diagnostics (tail)</summary>

            \`\`\`text
            ${diagnostics.slice(-16000)}
            \`\`\`
            </details>
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
