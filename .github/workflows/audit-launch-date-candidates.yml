name: Audit launch-date candidates

on:
  push:
    branches:
      - audit-launch-date-candidates
    paths:
      - .github/workflows/audit-launch-date-candidates.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-launch-date-candidates
      - name: Generate candidate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          baseline = json.loads((root / 'docs/migration/registry-v2-baseline.json').read_text())

          def load_group(name):
              rows = []
              for file_name in baseline['data_groups'][name]:
                  rows.extend(json.loads((root / file_name).read_text()))
              return rows

          stablecoins = load_group('stablecoins')
          events = load_group('events')
          missing = {row['id']: row for row in stablecoins if not row.get('launch_date')}
          candidates = []
          for event in events:
              event_type = str(event.get('event_type') or '').lower()
              if 'launch' not in event_type or not event.get('event_date'):
                  continue
              stablecoin_id = event.get('stablecoin_id')
              if stablecoin_id not in missing:
                  continue
              candidates.append({
                  'stablecoin_id': stablecoin_id,
                  'stablecoin_name': missing[stablecoin_id].get('name'),
                  'event_id': event.get('id'),
                  'event_type': event.get('event_type'),
                  'event_date': event.get('event_date'),
                  'confidence': event.get('confidence'),
                  'source_count': event.get('source_count'),
                  'title': event.get('title'),
                  'notes': event.get('notes')
              })

          rank = {'high': 0, 'medium': 1, 'low': 2, None: 3}
          candidates.sort(key=lambda row: (rank.get(row.get('confidence'), 3), row['stablecoin_id'], row['event_date']))
          report = {
              'missing_launch_date_total': len(missing),
              'dated_launch_event_candidate_total': len(candidates),
              'high_confidence_total': sum(1 for row in candidates if row.get('confidence') == 'high'),
              'medium_confidence_total': sum(1 for row in candidates if row.get('confidence') == 'medium'),
              'low_confidence_total': sum(1 for row in candidates if row.get('confidence') == 'low'),
              'candidates': candidates
          }
          (root / 'docs/audits/launch-date-event-candidates.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/audit-launch-date-candidates.yml
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f docs/audits/launch-date-event-candidates.json
          git commit -m "Generate launch date event candidates"
          git push origin HEAD:audit-launch-date-candidates
