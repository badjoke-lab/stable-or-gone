name: Global shell completion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate completed shell
        run: node scripts/validate-global-shell-completion.mjs
      - name: Rebuild responsive audit
        run: npm run prepare:responsive-accessibility-contract
      - name: Upload shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-shell-completion-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/generated/global-shell-completion-validation.json
            data/generated/responsive-accessibility-audit.json
            data/generated/responsive-accessibility-validation.json
