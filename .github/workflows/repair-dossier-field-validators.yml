name: One-time dossier field validator repair

on:
  push:
    branches: [ui/stablecoin-dossier-pr27]
    paths:
      - .github/workflows/repair-dossier-field-validators.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stablecoin-dossier-pr27
      - name: Accept table and definition-list fields
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'scripts/validate-reference-target-normalization.mjs': (
              "for (const heading of ['Reference target', 'Reference kind', 'Comparison category', 'Reference methodology']) check(detailSource.includes(`<th>${heading}</th>`), `detail heading is missing: ${heading}`);",
              "for (const heading of ['Reference target', 'Reference kind', 'Comparison category', 'Reference methodology']) check(detailSource.includes(`<th>${heading}</th>`) || detailSource.includes(`<dt>${heading}</dt>`), `detail heading is missing: ${heading}`);"
            ),
            'scripts/validate-backing-stabilization-normalization.mjs': (
              "for (const heading of ['Public backing model', 'Canonical backing types', 'Reserve component categories', 'Primary stabilization mechanism', 'Recorded model description']) check(detailSource.includes(`<th>${heading}</th>`), `detail heading is missing: ${heading}`);",
              "for (const heading of ['Public backing model', 'Canonical backing types', 'Reserve component categories', 'Primary stabilization mechanism', 'Recorded model description']) check(detailSource.includes(`<th>${heading}</th>`) || detailSource.includes(`<dt>${heading}</dt>`), `detail heading is missing: ${heading}`);"
            )
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected validator line not found: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-dossier-field-validators.yml
          git add scripts/validate-reference-target-normalization.mjs scripts/validate-backing-stabilization-normalization.mjs
          git commit -m 'Recognize dossier definition-list fields'
          git push origin HEAD:ui/stablecoin-dossier-pr27
