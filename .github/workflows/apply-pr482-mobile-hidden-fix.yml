name: Apply PR 482 mobile hidden fix

on:
  push:
    branches:
      - agent/fix-mobile-registry-density-and-link-underlines
    paths:
      - 'scripts/apply-pr482-mobile-hidden-fix.mjs'
      - '.github/workflows/apply-pr482-mobile-hidden-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-registry-density-and-link-underlines
          fetch-depth: 0

      - name: Restore hidden mobile records
        run: node scripts/apply-pr482-mobile-hidden-fix.mjs

      - name: Commit mobile pagination visibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/public-ui.css scripts/apply-pr482-mobile-hidden-fix.mjs .github/workflows/apply-pr482-mobile-hidden-fix.yml
          git commit -m 'Preserve hidden mobile pagination records'
          git push origin HEAD:agent/fix-mobile-registry-density-and-link-underlines
