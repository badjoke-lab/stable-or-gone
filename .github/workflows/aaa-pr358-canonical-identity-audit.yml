name: AAA PR358 Canonical Identity Audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'pr358-record-growth-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr358-record-growth-batch-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-pr358-canonical-identity-audit.mjs
      - name: Commit identity audit
        run: |
          if git diff --quiet -- docs/migration/pr358-canonical-identity-audit.json; then
            echo 'Identity audit already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migration/pr358-canonical-identity-audit.json
          git commit -m 'Generate PR 358 canonical identity audit'
          git push origin HEAD:pr358-record-growth-batch-1
