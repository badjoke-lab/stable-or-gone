name: UI remediation R4 Dossier

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/ui-v3-r4-dossier-clean]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ui-remediation-r4-dossier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/ui-v3-r4-dossier-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate contracts and build
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ui-v3-remediation-authority.md
          test -f src/styles/ui-remediation-r4.css
          test -f scripts/audit-ui-remediation-r4.mjs
          grep -q "ui-remediation-r4.css" src/components/StablecoinDetailView.astro
          grep -q 'data-dossier-version="r4"' src/components/StablecoinDetailView.astro
          grep -q 'stablecoin-dossier-facts-r4' src/components/StablecoinDossierHeader.astro
          grep -q 'slice(0, 10)' src/components/StablecoinContextSections.astro
          test -z "$(git diff --name-only origin/main...HEAD -- data/ public/data/ config/site-architecture.mjs docs/migration/current-canonical-checkpoint.json docs/migration/current-stats-history-checkpoint.json docs/migration/registry-release-integrity-baseline.json)"
          npm run validate:ui-v3-stablecoin-detail
          npm run prepare:stablecoin-dossier-hierarchy
          npm run validate:data
          npm run validate:evidence-relations-v2
          npm run validate:compat
          npm run validate:final
          npm run check
          npm run build
          npm run verify:public
      - name: Install Chromium
        if: steps.validation.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/ui-r4-server.log 2>&1 &
          echo $! > /tmp/ui-r4-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4321/stablecoin/usdc/ > /dev/null && curl --fail --silent http://127.0.0.1:4321/stablecoin/ust/ > /dev/null && curl --fail --silent http://127.0.0.1:4321/stablecoin/busd/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-r4-server.log
          exit 1
      - name: Capture and audit R4 dossier states
        id: visual
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          SOG_SCREENSHOT_BASE_URL: http://127.0.0.1:4321
        run: node scripts/audit-ui-remediation-r4.mjs
      - name: Upload mandatory R4 visual evidence
        if: always() && steps.validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-remediation-r4-dossier-${{ github.run_id }}
          path: |
            artifacts/ui-remediation-r4/
            /tmp/ui-r4-server.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/ui-r4-server.pid; then kill "$(cat /tmp/ui-r4-server.pid)" || true; fi
      - name: Publish R4 status
        if: always()
        uses: actions/github-script@v7
        env:
          R4_PR_NUMBER: ${{ github.event.pull_request.number || 439 }}
          R4_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          R4_VALIDATION: ${{ steps.validation.outcome }}
          R4_VISUAL: ${{ steps.visual.outcome }}
        with:
          script: |
            const issueNumber=Number(process.env.R4_PR_NUMBER);
            const marker='<!-- ui-remediation-r4-dossier -->';
            const bodyStart='<!-- ui-remediation-r4-run-status:start -->';
            const bodyEnd='<!-- ui-remediation-r4-run-status:end -->';
            const validate=process.env.R4_VALIDATION || 'skipped';
            const visual=process.env.R4_VISUAL || 'skipped';
            const passed=validate==='success' && visual==='success';
            const status=`## Latest R4 workflow\n\n- Run ID: **${context.runId}**\n- Head: \`${process.env.R4_HEAD_SHA}\`\n- Validation: **${validate}**\n- 15-capture dossier audit: **${visual}**\n- Overall: **${passed ? 'pass' : 'failure'}**`;
            const body=`${marker}\n## UI remediation R4 — Stablecoin Dossier\n\n- Authority: \`docs/ui-v3-remediation-authority.md\`\n- Validation: **${validate}**\n- 15-capture visual audit: **${visual}**\n- Routes: USDC / UST / BUSD\n- Viewports: 1440 / 1280 / 768 / 390 / 320\n- Overall: **${passed ? 'pass' : 'failure'}**\n- Run ID: **${context.runId}**\n- Head: \`${process.env.R4_HEAD_SHA}\``;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const existing=comments.find((row)=>row.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
            const pr=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:issueNumber});
            const original=pr.data.body || '';
            const block=`${bodyStart}\n${status}\n${bodyEnd}`;
            const expression=new RegExp(`${bodyStart}[\\s\\S]*?${bodyEnd}`,'m');
            const next=expression.test(original) ? original.replace(expression,block) : `${original.trim()}\n\n${block}\n`;
            await github.rest.pulls.update({owner:context.repo.owner,repo:context.repo.repo,pull_number:issueNumber,body:next});
      - name: Enforce R4 result
        if: always()
        shell: bash
        run: |
          test '${{ steps.validation.outcome }}' = success
          test '${{ steps.visual.outcome }}' = success
