name: Append JPYR stats history checkpoint

on:
  push:
    branches:
      - agent/jpyr-material-concerns
    paths:
      - .github/workflows/append-jpyr-stats-history.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jpyr-material-concerns
      - name: Append reviewed checkpoint and remove helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/stats-history.json';
          const history = JSON.parse(fs.readFileSync(path, 'utf8'));
          const snapshot = {
            checkpoint_id: 'sog_stats_jpyr_canonical_120_2026_08_23',
            checkpoint_kind: 'canonical_growth_checkpoint',
            source_checkpoint_id: 'sog_stats_pr593_mnee_june_2026_attestation_boundary_2026_08_22',
            canonical_checkpoint_id: 'sog_jpyr_canonical_120_2026_08_23',
            recorded_at: '2026-08-23',
            asset_count: 120,
            registry_version: 'pr598-jpyr-material-concerns',
            input_digest_sha256: '025db813ef8dad95985d45cd792ec18e4bc48a393e1377fe926124e5f152ebbc',
            stats_model_sha256: '2d18bebca0fb7c8067b479b554ba3e13da400da27514813535a40c1b78a98b47',
            totals: {assets:120,organizations:110,relationships:132,events:195,evidence:589,reserve_reports:127,known_unknowns:357,regulatory_notes:9,deployments:187,market_access_records:12,legal_profiles:120,stable_asset_relationships:5,reserve_components:154,income_profiles:120},
            lifecycle: {
              groups: {constrained:16,failed:6,historical_non_failure:8,operating:87,other:3},
              statuses: {active:87,collapsed:6,inactive:2,migrated:2,rebranded:1,restricted:13,terminated:3,unknown:3,winding_down:3},
              transitions: {migrations:2,rebrands:1,orderly_wind_downs:3,terminations:3,inactive_unresolved:2,collapses:6}
            },
            data_quality: {
              coverage: {
                classification:{count:120,denominator:120,percentage:100},
                reserve_redemption_profile:{count:120,denominator:120,percentage:100},
                legal_profile:{count:120,denominator:120,percentage:100},
                deployment:{count:120,denominator:120,percentage:100},
                stable_asset_relationship:{count:8,denominator:120,percentage:6.67},
                reserve_component:{count:120,denominator:120,percentage:100},
                archive_evidence:{count:475,denominator:589,percentage:80.65}
              },
              evidence_per_asset:{average:4.85,median:4,distribution:{'1':3,'2_4':58,'5_plus':59}},
              known_unknowns:{total:357,high_or_critical_count:141,assets_with_high_or_critical:75},
              verification_recency:{'0_30_days':6,'31_90_days':114},
              typed_event_details:{count:195,denominator:195,percentage:100}
            },
            snapshot_sha256: 'ec529b7844024243d61c2c4b4b57b0d9bd29d4035dd4b9a499933df484178428'
          };
          if (!Array.isArray(history.snapshots)) throw new Error('stats history snapshots missing');
          if (!history.snapshots.some(x => x.checkpoint_id === snapshot.checkpoint_id)) history.snapshots.push(snapshot);
          fs.writeFileSync(path, JSON.stringify(history, null, 2) + '\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/append-jpyr-stats-history.yml
          git add data/stats-history.json
          git commit -m "Append JPYR immutable statistics checkpoint"
          git push origin HEAD:agent/jpyr-material-concerns
